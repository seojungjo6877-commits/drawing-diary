<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff">

<title>그림일기</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  background: #eeeeee;
  color: #111111;
  font-family: -apple-system, BlinkMacSystemFont, "Noto Sans KR", sans-serif;
}

.app {
  max-width: 700px;
  min-height: 100vh;
  margin: auto;
  background: white;
  padding-bottom: 80px;
}

header {
  height: 60px;
  border-bottom: 1px solid #ddd;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  position: sticky;
  top: 0;
  background: white;
  z-index: 10;
}

.logo {
  font-size: 20px;
  font-weight: 900;
}

.date {
  font-size: 12px;
  color: #777;
}

main {
  padding: 14px;
}

.box {
  border: 1px solid #ddd;
  border-radius: 14px;
  padding: 14px;
  margin-bottom: 12px;
}

input,
textarea {
  width: 100%;
  border: 0;
  outline: none;
  font-family: inherit;
}

.title {
  font-size: 22px;
  font-weight: 900;
  margin-bottom: 10px;
}

.diary {
  min-height: 130px;
  font-size: 16px;
  line-height: 1.7;
  resize: none;
}

button {
  border: 0;
  border-radius: 10px;
  padding: 10px 13px;
  background: #eeeeee;
  color: #111;
  font-weight: 800;
}

.black {
  background: #111;
  color: white;
}

.character-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
  font-weight: 900;
}

.characters {
  display: flex;
  gap: 8px;
  overflow-x: auto;
}

.character {
  width: 75px;
  flex-shrink: 0;
  text-align: center;
}

.character img {
  width: 68px;
  height: 68px;
  object-fit: contain;
  border: 1px solid #ddd;
  border-radius: 10px;
}

.character-name {
  font-size: 10px;
  margin-top: 4px;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.scene {
  height: 55vh;
  min-height: 380px;
  border: 1px solid #bbb;
  border-radius: 14px;
  position: relative;
  overflow: hidden;
  background: white;
}

.empty {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #aaa;
  font-size: 13px;
  text-align: center;
  pointer-events: none;
}

.actor {
  position: absolute;
  width: 110px;
  height: 110px;
  object-fit: contain;
  touch-action: none;
  user-select: none;
}

.tools {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  margin-top: 10px;
}

.tools button {
  white-space: nowrap;
}

.bottom {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: min(700px, 100%);
  background: #ffffffee;
  border-top: 1px solid #ddd;
  padding: 8px 14px;
  display: flex;
  gap: 8px;
  z-index: 20;
}

.bottom button {
  flex: 1;
  padding: 12px;
}

/* 사진 추가 창 */

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: #0008;
  z-index: 100;
  align-items: flex-end;
}

.modal.show {
  display: flex;
}

.sheet {
  width: min(700px, 100%);
  background: white;
  border-radius: 20px 20px 0 0;
  padding: 20px 16px 30px;
}

.sheet-title {
  display: flex;
  justify-content: space-between;
  font-weight: 900;
  margin-bottom: 15px;
}

.photo-button {
  display: block;
  border: 2px dashed #bbb;
  border-radius: 14px;
  padding: 28px;
  text-align: center;
  font-weight: 800;
  margin-bottom: 10px;
}

.photo-button input {
  display: none;
}

.name {
  border: 1px solid #ccc;
  border-radius: 10px;
  padding: 12px;
  margin-bottom: 10px;
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="logo">그림일기</div>
  <div class="date" id="date"></div>
</header>

<main>

<!-- 일기 -->

<div class="box">

<input
  id="title"
  class="title"
  placeholder="오늘의 제목"
>

<textarea
  id="diary"
  class="diary"
  placeholder="오늘은 어떤 하루였나요?"
></textarea>

</div>


<!-- 캐릭터 -->

<div class="box">

<div class="character-title">

<span>캐릭터</span>

<button
  class="black"
  id="addCharacter"
>
＋ 사진 추가
</button>

</div>

<div
  class="characters"
  id="characters"
></div>

</div>


<!-- 장면 -->

<div class="scene" id="scene">

<div
  class="empty"
  id="empty"
>
사진을 추가해서<br>
캐릭터를 만들어보세요.
</div>

</div>


<!-- 움직임 -->

<div class="tools">

<button onclick="action('walk')">
걷기
</button>

<button onclick="action('jump')">
점프
</button>

<button onclick="action('wiggle')">
흔들기
</button>

<button onclick="action('sleep')">
졸기
</button>

<button onclick="stopAction()">
멈춤
</button>

<button onclick="deleteCharacter()">
삭제
</button>

</div>

</main>


<div class="bottom">

<button onclick="clearScene()">
장면 비우기
</button>

<button
  class="black"
  onclick="saveDiary()"
>
일기 저장
</button>

</div>

</div>


<!-- 사진 추가 창 -->

<div
  class="modal"
  id="modal"
>

<div class="sheet">

<div class="sheet-title">

<span>사진 추가</span>

<button onclick="closeModal()">
×
</button>

</div>


<label class="photo-button">

📷<br><br>
사진 선택

<input
  id="photo"
  type="file"
  accept="image/*"
>

</label>


<input
  id="characterName"
  class="name"
  placeholder="캐릭터 이름"
>


<div style="display:flex;gap:8px">

<button
  style="flex:1"
  onclick="closeModal()"
>
취소
</button>

<button
  class="black"
  style="flex:1"
  onclick="createCharacter()"
>
캐릭터 추가
</button>

</div>

</div>

</div>


<script>

const dateElement =
document.getElementById("date");

dateElement.textContent =
new Date().toLocaleDateString(
  "ko-KR",
  {
    year: "numeric",
    month: "long",
    day: "numeric"
  }
);


/* --------------------
   변수
-------------------- */

let characters = [];

let selectedActor = null;

let selectedFile = null;


/* --------------------
   사진 추가 창
-------------------- */

document
.getElementById("addCharacter")
.onclick = function() {

  document
  .getElementById("modal")
  .classList.add("show");

};


function closeModal() {

  document
  .getElementById("modal")
  .classList.remove("show");

  document
  .getElementById("photo")
  .value = "";

  selectedFile = null;

}


/* --------------------
   사진 선택
-------------------- */

document
.getElementById("photo")
.onchange = function(event) {

  if (event.target.files.length > 0) {

    selectedFile =
    event.target.files[0];

  }

};


/* --------------------
   캐릭터 만들기
-------------------- */

function createCharacter() {

  if (!selectedFile) {

    alert("사진을 먼저 선택해주세요.");

    return;

  }


  const imageURL =
  URL.createObjectURL(selectedFile);


  const name =
  document
  .getElementById("characterName")
  .value
  .trim()
  || "캐릭터";


  const character = {

    id: Date.now(),

    name: name,

    image: imageURL

  };


  characters.push(character);


  addCharacterToList(character);


  /* 바로 장면에도 등장 */

  addActor(character);


  closeModal();

}


/* --------------------
   캐릭터 목록
-------------------- */

function addCharacterToList(character) {

  const box =
  document.getElementById("characters");


  const item =
  document.createElement("div");

  item.className =
  "character";


  const image =
  document.createElement("img");

  image.src =
  character.image;


  image.onclick =
  function() {

    addActor(character);

  };


  const name =
  document.createElement("div");

  name.className =
  "character-name";

  name.textContent =
  character.name;


  item.appendChild(image);

  item.appendChild(name);

  box.appendChild(item);

}


/* --------------------
   장면에 캐릭터 추가
-------------------- */

function addActor(character) {

  const scene =
  document.getElementById("scene");


  const actor =
  document.createElement("img");


  actor.className =
  "actor";


  actor.src =
  character.image;


  actor.style.left =
  "calc(50% - 55px)";


  actor.style.top =
  "calc(50% - 55px)";


  scene.appendChild(actor);


  selectedActor =
  actor;


  document
  .getElementById("empty")
  .style.display =
  "none";


  makeDraggable(actor);

}


/* --------------------
   캐릭터 드래그
-------------------- */

function makeDraggable(actor) {

  let dragging = false;

  let offsetX = 0;

  let offsetY = 0;


  actor.addEventListener(
    "pointerdown",
    function(event) {

      dragging = true;

      actor.setPointerCapture(
        event.pointerId
      );


      const rect =
      actor.getBoundingClientRect();


      offsetX =
      event.clientX -
      rect.left;


      offsetY =
      event.clientY -
      rect.top;


      selectedActor =
      actor;

    }
  );


  actor.addEventListener(
    "pointermove",
    function(event) {

      if (!dragging) return;


      const scene =
      document
      .getElementById("scene")
      .getBoundingClientRect();


      let x =
      event.clientX -
      scene.left -
      offsetX;


      let y =
      event.clientY -
      scene.top -
      offsetY;


      x =
      Math.max(
        0,
        Math.min(
          scene.width - actor.offsetWidth,
          x
        )
      );


      y =
      Math.max(
        0,
        Math.min(
          scene.height - actor.offsetHeight,
          y
        )
      );


      actor.style.left =
      x + "px";


      actor.style.top =
      y + "px";

    }
  );


  actor.addEventListener(
    "pointerup",
    function() {

      dragging = false;

    }
  );

}


/* --------------------
   움직임
-------------------- */

function action(type) {

  if (!selectedActor) {

    alert("캐릭터를 먼저 눌러주세요.");

    return;

  }


  selectedActor.classList.remove(
    "walk",
    "jump",
    "wiggle",
    "sleep"
  );


  if (type === "walk") {

    selectedActor.animate(
      [
        {
          transform:
          "translateY(0)"
        },
        {
          transform:
          "translateY(-8px)"
        },
        {
          transform:
          "translateY(0)"
        }
      ],
      {
        duration: 600,
        iterations: Infinity
      }
    );

  }


  if (type === "jump") {

    selectedActor.animate(
      [
        {
          transform:
          "translateY(0)"
        },
        {
          transform:
          "translateY(-35px)"
        },
        {
          transform:
          "translateY(0)"
        }
      ],
      {
        duration: 500
      }
    );

  }


  if (type === "wiggle") {

    selectedActor.animate(
      [
        {
          transform:
          "rotate(-8deg)"
        },
        {
          transform:
          "rotate(8deg)"
        },
        {
          transform:
          "rotate(0)"
        }
      ],
      {
        duration: 500
      }
    );

  }


  if (type === "sleep") {

    selectedActor.animate(
      [
        {
          transform:
          "translateY(0)"
        },
        {
          transform:
          "translateY(5px)"
        },
        {
          transform:
          "translateY(0)"
        }
      ],
      {
        duration: 1800,
        iterations: Infinity
      }
    );

  }

}


/* --------------------
   움직임 정지
-------------------- */

function stopAction() {

  if (!selectedActor) return;

  selectedActor.getAnimations()
  .forEach(
    animation =>
    animation.cancel()
  );

  selectedActor.style.transform =
  "none";

}


/* --------------------
   캐릭터 삭제
-------------------- */

function deleteCharacter() {

  if (!selectedActor) {

    alert("캐릭터를 먼저 눌러주세요.");

    return;

  }


  selectedActor.remove();

  selectedActor = null;


  checkEmpty();

}


/* --------------------
   장면 비우기
-------------------- */

function clearScene() {

  const actors =
  document.querySelectorAll(
    ".actor"
  );


  actors.forEach(
    actor =>
    actor.remove()
  );


  selectedActor = null;


  checkEmpty();

}


function checkEmpty() {

  const actors =
  document.querySelectorAll(
    ".actor"
  );


  document
  .getElementById("empty")
  .style.display =
  actors.length
  ? "none"
  : "flex";

}


/* --------------------
   일기 저장
-------------------- */

function saveDiary() {

  const title =
  document
  .getElementById("title")
  .value;


  const diary =
  document
  .getElementById("diary")
  .value;


  localStorage.setItem(
    "diary-title",
    title
  );


  localStorage.setItem(
    "diary-body",
    diary
  );


  alert("일기를 저장했어요!");

}

</script>

</body>
</html>
