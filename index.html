<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>그림일기</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:#fff;
  color:#111;
  font-family:-apple-system,BlinkMacSystemFont,
  "Apple SD Gothic Neo","Noto Sans KR",sans-serif;
}

header{
  padding:18px 16px 10px;
}

.date{
  font-size:13px;
  color:#777;
}

.container{
  padding:0 16px 35px;
}

input[type="text"]{
  width:100%;
  border:1px solid #ddd;
  border-radius:12px;
  padding:12px;
  font-size:16px;
  outline:none;
  background:#fff;
}

textarea{
  width:100%;
  min-height:180px;
  margin-top:10px;
  border:1px solid #ddd;
  border-radius:12px;
  padding:14px;
  font-size:16px;
  line-height:1.6;
  outline:none;
  resize:vertical;
  background:#fff;
}


/* =========================
   스테이지
========================= */

.stage{
  position:relative;
  width:100%;
  height:380px;
  margin:15px 0;
  border:1px solid #ddd;
  border-radius:18px;
  overflow:hidden;
  background:#fafafa;
  background-position:center;
  background-size:cover;
  background-repeat:no-repeat;
  touch-action:none;
  overscroll-behavior:none;
}

.actor{
  position:absolute;
  width:90px;
  height:90px;
  object-fit:contain;
  user-select:none;
  -webkit-user-select:none;
  -webkit-touch-callout:none;
  touch-action:none;
  cursor:grab;
  z-index:30;
}

.actor.dragging{
  cursor:grabbing;
}

.actor.selected{
  outline:2px dashed #777;
  outline-offset:4px;
  border-radius:12px;
}

.actor.sleeping{
  opacity:.65;
}


/* =========================
   악세사리
========================= */

.accessory{
  position:absolute;
  width:55px;
  height:55px;
  object-fit:contain;
  user-select:none;
  -webkit-user-select:none;
  -webkit-touch-callout:none;
  touch-action:none;
  cursor:grab;
  z-index:40;
  transform-origin:center center;
}

.accessory.dragging{
  cursor:grabbing;
}

.accessory.locked{
  cursor:default;
}

.accessory.selected{
  outline:2px dashed #777;
  outline-offset:3px;
  border-radius:8px;
}


/* =========================
   가구
========================= */

.furniture{
  position:absolute;
  width:90px;
  height:90px;
  object-fit:contain;
  user-select:none;
  -webkit-user-select:none;
  -webkit-touch-callout:none;
  touch-action:none;
  cursor:grab;
  z-index:20;
}

.furniture.dragging{
  cursor:grabbing;
}

.furniture.locked{
  cursor:default;
}

.furniture.selected{
  outline:2px dashed #777;
  outline-offset:4px;
  border-radius:10px;
}


/* =========================
   상태
========================= */

.status{
  position:absolute;
  left:50%;
  bottom:8px;
  transform:translateX(-50%);
  font-size:12px;
  color:#777;
  pointer-events:none;
  white-space:nowrap;
  z-index:100;
}


/* =========================
   기본 UI
========================= */

.add-area{
  margin:12px 0 18px;
}

.photo-button,
.background-file-label{
  display:block;
  width:100%;
  padding:12px 16px;
  border:1px solid #ddd;
  border-radius:12px;
  background:#fff;
  color:#111;
  font-size:15px;
  text-align:center;
  cursor:pointer;
}

#photo,
#backgroundFile,
#accessoryFile,
#furnitureFile{
  display:none;
}

.background-area{
  margin-bottom:18px;
}

.background-select{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:12px;
  background:#fff;
  color:#111;
  font-size:15px;
  outline:none;
}

.background-file-label{
  margin-top:10px;
}


/* =========================
   컨트롤
========================= */

.control-box,
.accessory-box,
.furniture-box{
  margin-top:10px;
  padding:10px;
  border:1px solid #ddd;
  border-radius:12px;
  background:#fafafa;
}

.control-box{
  display:none;
}

.control-box.show{
  display:block;
}

.accessory-control,
.furniture-control{
  display:none;
}

.accessory-control.show,
.furniture-control.show{
  display:block;
}

.control-title,
.accessory-title,
.furniture-title{
  font-size:13px;
  color:#666;
  margin-bottom:8px;
}

.size-control{
  margin-top:12px;
}

.size-label{
  font-size:13px;
  color:#666;
  margin-bottom:5px;
}

input[type=range]{
  width:100%;
  margin:0;
  accent-color:#777;
  touch-action:auto;
}

.accessory-grid,
.furniture-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
}

.accessory-choice,
.furniture-choice{
  border:1px solid #ddd;
  border-radius:10px;
  background:#fff;
  padding:8px 4px;
  font-size:24px;
  line-height:1.2;
  cursor:pointer;
  margin:0;
}

.accessory-choice span,
.furniture-choice span{
  display:block;
  font-size:11px;
  margin-top:3px;
  color:#666;
}

.accessory-upload,
.furniture-upload{
  display:block;
  width:100%;
  margin-top:8px;
  padding:10px;
  border:1px solid #ddd;
  border-radius:10px;
  background:#fff;
  text-align:center;
  font-size:13px;
  cursor:pointer;
}

.rotation-control{
  margin-top:12px;
}

.help{
  margin-top:8px;
  text-align:center;
  font-size:12px;
  color:#888;
}

button{
  width:100%;
  border:1px solid #ddd;
  background:#fff;
  color:#111;
  border-radius:12px;
  padding:13px 16px;
  font-size:15px;
  margin-top:10px;
}

button:disabled{
  opacity:.5;
}
</style>
</head>

<body>

<header>
  <div class="date" id="date"></div>
</header>

<div class="container">

<input
  type="text"
  id="title"
  placeholder="오늘의 제목"
>

<textarea
  id="diary"
  placeholder="오늘의 일기를 써보세요."
></textarea>


<!-- =========================
     배경
========================= -->

<div class="background-area">

<select id="backgroundSelect" class="background-select">
  <option value="plain">기본 배경</option>
  <option value="sky">파란 하늘</option>
  <option value="night">밤하늘</option>
  <option value="grass">초원</option>
  <option value="pink">분홍색</option>
  <option value="yellow">노란색</option>
</select>

<label
  class="background-file-label"
  for="backgroundFile"
>
＋ 배경 사진 추가
</label>

<input
  id="backgroundFile"
  type="file"
  accept="image/*"
>

</div>


<!-- =========================
     스테이지
========================= -->

<div class="stage" id="stage">

  <div class="status" id="status">
    캐릭터를 추가해보세요
  </div>

</div>


<!-- =========================
     캐릭터 추가
========================= -->

<div class="add-area">

<label
  class="photo-button"
  for="photo"
>
＋ 캐릭터 추가
</label>

<input
  id="photo"
  type="file"
  accept="image/*"
>

</div>


<!-- =========================
     캐릭터 컨트롤
========================= -->

<div class="control-box" id="controlBox">

<div class="control-title">
선택한 캐릭터
</div>

<button id="pauseButton">
⏸ 이 캐릭터 멈추기
</button>

<button id="resumeButton">
▶ 다시 움직이기
</button>

<button id="bringActorFrontButton">
⬆️ 앞으로 보내기
</button>

<button id="sendActorBackButton">
⬇️ 뒤로 보내기
</button>

<button id="deleteActorButton">
🗑 이 캐릭터 삭제
</button>

<div class="size-control">

<div class="size-label">
캐릭터 크기
</div>

<input
  type="range"
  id="sizeSlider"
  min="50"
  max="200"
  value="100"
>

</div>


<!-- =========================
     악세사리 창
========================= -->

<div class="accessory-box">

<div class="accessory-title">
악세사리
</div>

<div class="accessory-grid">

<button
  class="accessory-choice"
  data-emoji="🎩"
>
🎩
<span>모자</span>
</button>

<button
  class="accessory-choice"
  data-emoji="👑"
>
👑
<span>왕관</span>
</button>

<button
  class="accessory-choice"
  data-emoji="🎀"
>
🎀
<span>리본</span>
</button>

<button
  class="accessory-choice"
  data-emoji="☁️"
>
☁️
<span>구름</span>
</button>

<button
  class="accessory-choice"
  data-emoji="🤍"
>
🤍
<span>하트</span>
</button>

<button
  class="accessory-choice"
  data-emoji="✨"
>
✨
<span>별</span>
</button>

</div>


<label
  class="accessory-upload"
  for="accessoryFile"
>
＋ 악세사리 사진 추가
</label>

<input
  id="accessoryFile"
  type="file"
  accept="image/*"
>


<!--
  악세사리를 선택했을 때만
  이 창이 나타남
-->

<div
  class="accessory-control"
  id="accessoryControl"
>

<div class="size-label">
선택한 악세사리 크기
</div>

<input
  type="range"
  id="accessorySizeSlider"
  min="20"
  max="200"
  value="100"
>


<div class="rotation-control">

<div class="size-label">
선택한 악세사리 각도
</div>

<input
  type="range"
  id="accessoryRotationSlider"
  min="-180"
  max="180"
  value="0"
>

</div>


<button id="lockAccessoryButton">
🔒 악세사리 고정
</button>

<button id="deleteAccessoryButton">
🗑 악세사리 삭제
</button>

</div>

</div>

</div>


<!-- =========================
     가구
========================= -->

<div class="furniture-box">

<div class="furniture-title">
가구
</div>

<div class="furniture-grid">

<button
  class="furniture-choice"
  data-emoji="🪑"
>
🪑
<span>의자</span>
</button>

<button
  class="furniture-choice"
  data-emoji="🛋️"
>
🛋️
<span>소파</span>
</button>

<button
  class="furniture-choice"
  data-emoji="🛏️"
>
🛏️
<span>침대</span>
</button>

<button
  class="furniture-choice"
  data-emoji="🪴"
>
🪴
<span>화분</span>
</button>

<button
  class="furniture-choice"
  data-emoji="🗄️"
>
🗄️
<span>서랍장</span>
</button>

<button
  class="furniture-choice"
  data-emoji="🪟"
>
🪟
<span>창문</span>
</button>

</div>


<label
  class="furniture-upload"
  for="furnitureFile"
>
＋ 가구 사진 추가
</label>

<input
  id="furnitureFile"
  type="file"
  accept="image/*"
>


<div
  class="furniture-control"
  id="furnitureControl"
>

<div class="size-label">
선택한 가구 크기
</div>

<input
  type="range"
  id="furnitureSizeSlider"
  min="30"
  max="250"
  value="100"
>

<button id="lockFurnitureButton">
🔒 가구 고정
</button>

<button id="deleteFurnitureButton">
🗑 가구 삭제
</button>

</div>

</div>


<div class="help">
캐릭터, 악세사리, 가구를 손가락으로 끌어서 원하는 곳에 놓을 수 있어요.
</div>


<button id="save">
저장
</button>

<button id="clearAll">
전체 삭제
</button>

</div>


<script>

/* =========================
   요소
========================= */

const dateElement=
document.getElementById("date");

const titleInput=
document.getElementById("title");

const diaryInput=
document.getElementById("diary");

const stage=
document.getElementById("stage");

const status=
document.getElementById("status");

const photoInput=
document.getElementById("photo");

const backgroundSelect=
document.getElementById("backgroundSelect");

const backgroundFile=
document.getElementById("backgroundFile");

const controlBox=
document.getElementById("controlBox");

const pauseButton=
document.getElementById("pauseButton");

const resumeButton=
document.getElementById("resumeButton");

const bringActorFrontButton=
document.getElementById("bringActorFrontButton");

const sendActorBackButton=
document.getElementById("sendActorBackButton");

const deleteActorButton=
document.getElementById("deleteActorButton");

const sizeSlider=
document.getElementById("sizeSlider");

const accessoryFile=
document.getElementById("accessoryFile");

const accessoryControl=
document.getElementById("accessoryControl");

const accessorySizeSlider=
document.getElementById("accessorySizeSlider");

const accessoryRotationSlider=
document.getElementById("accessoryRotationSlider");

const lockAccessoryButton=
document.getElementById("lockAccessoryButton");

const deleteAccessoryButton=
document.getElementById("deleteAccessoryButton");

const furnitureFile=
document.getElementById("furnitureFile");

const furnitureControl=
document.getElementById("furnitureControl");

const furnitureSizeSlider=
document.getElementById("furnitureSizeSlider");

const lockFurnitureButton=
document.getElementById("lockFurnitureButton");

const deleteFurnitureButton=
document.getElementById("deleteFurnitureButton");

const saveButton=
document.getElementById("save");

const clearAllButton=
document.getElementById("clearAll");


/* =========================
   데이터
========================= */

const actors=[];
const accessories=[];
const furnitures=[];

let selectedActor=null;
let selectedAccessory=null;
let selectedFurniture=null;


/* =========================
   날짜
========================= */

const now=new Date();

dateElement.textContent=
now.getFullYear()+"년 "+
(now.getMonth()+1)+"월 "+
now.getDate()+"일";


/* =========================
   일기
========================= */

titleInput.value=
localStorage.getItem("diary-title")||"";

diaryInput.value=
localStorage.getItem("diary-text")||"";

titleInput.addEventListener("input",()=>{
  localStorage.setItem(
    "diary-title",
    titleInput.value
  );
});

diaryInput.addEventListener("input",()=>{
  localStorage.setItem(
    "diary-text",
    diaryInput.value
  );
});


/* =========================
   배경
========================= */

let currentBackground={
  type:"plain",
  src:null
};

function applyBackground(type){

  currentBackground={
    type:type,
    src:null
  };

  stage.style.backgroundImage="";

  if(type==="plain"){
    stage.style.background="#fafafa";
  }

  else if(type==="sky"){
    stage.style.background=
      "linear-gradient(#bde8ff,#fff)";
  }

  else if(type==="night"){
    stage.style.background=
      "linear-gradient(#101528,#343b5c)";
  }

  else if(type==="grass"){
    stage.style.background=
      "linear-gradient(#dff5d8 0%,#c9ebc1 65%,#a9d79e 65%,#a9d79e 100%)";
  }

  else if(type==="pink"){
    stage.style.background="#ffe8ef";
  }

  else if(type==="yellow"){
    stage.style.background="#fff4b8";
  }
}

backgroundSelect.addEventListener(
  "change",
  e=>{
    applyBackground(e.target.value);
  }
);

backgroundFile.addEventListener(
  "change",
  e=>{

    const file=e.target.files[0];

    if(!file)return;

    const reader=new FileReader();

    reader.onload=ev=>{

      currentBackground={
        type:"image",
        src:ev.target.result
      };

      stage.style.background="none";

      stage.style.backgroundImage=
        `url("${ev.target.result}")`;

      stage.style.backgroundSize="cover";
      stage.style.backgroundPosition="center";
      stage.style.backgroundRepeat="no-repeat";
    };

    reader.readAsDataURL(file);

    backgroundFile.value="";
  }
);

applyBackground("plain");


/* =========================
   선택 해제
========================= */

function clearSelections(){

  if(selectedActor){
    selectedActor.element
      .classList.remove("selected");
  }

  if(selectedAccessory){
    selectedAccessory.element
      .classList.remove("selected");
  }

  if(selectedFurniture){
    selectedFurniture.element
      .classList.remove("selected");
  }

  selectedActor=null;
  selectedAccessory=null;
  selectedFurniture=null;

  controlBox.classList.remove("show");
  accessoryControl.classList.remove("show");
  furnitureControl.classList.remove("show");
}


/* =========================
   상태
========================= */

function updateStatus(){

  if(selectedAccessory){

    status.textContent=
      selectedAccessory.locked
      ? "선택한 악세사리가 고정되어 있어요"
      : "선택한 악세사리를 조절할 수 있어요";

    return;
  }

  if(selectedFurniture){

    status.textContent=
      selectedFurniture.locked
      ? "선택한 가구가 고정되어 있어요"
      : "선택한 가구 · 끌어서 이동할 수 있어요";

    return;
  }

  if(selectedActor){

    status.textContent=
      selectedActor.paused
      ? "선택한 캐릭터가 멈춰 있어요"
      : "선택한 캐릭터 · 끌어서 이동할 수 있어요";

    return;
  }

  status.textContent=
    actors.length===0
    ? "캐릭터를 추가해보세요"
    : "캐릭터들이 자유롭게 움직이고 있어요";
}


/* =========================
   캐릭터 선택
========================= */

function selectActor(actor){

  clearSelections();

  selectedActor=actor;

  actor.element.classList.add("selected");

  controlBox.classList.add("show");

  sizeSlider.value=
    String(actor.size);

  updateStatus();
}


/* =========================
   악세사리 선택
========================= */

/*
  중요:
  악세사리는 다시 눌러도 선택 해제되지 않음.
  고정 버튼을 눌러야 선택 해제됨.
*/

function selectAccessory(a){

  clearSelections();

  selectedAccessory=a;

  a.element.classList.add("selected");

  accessoryControl.classList.add("show");

  accessorySizeSlider.value=
    String(a.size);

  accessoryRotationSlider.value=
    String(a.rotation);

  updateAccessoryLockButton();

  updateStatus();
}


/* =========================
   가구 선택
========================= */

function selectFurniture(f){

  clearSelections();

  selectedFurniture=f;

  f.element.classList.add("selected");

  furnitureControl.classList.add("show");

  furnitureSizeSlider.value=
    String(f.size);

  updateFurnitureLockButton();

  updateStatus();
}


/* =========================
   이모지 SVG
========================= */

function emojiSVG(emoji){

  return "data:image/svg+xml;charset=utf-8,"+
    encodeURIComponent(
`<svg xmlns="http://www.w3.org/2000/svg"
width="300"
height="300">
<text x="150"
y="190"
font-size="170"
text-anchor="middle">${emoji}</text>
</svg>`
    );
}


/* =========================
   캐릭터 성격
========================= */

function createPersonality(){

  const types=[
    {
      speed:.6,
      runSpeed:1.5,
      sleepChance:.3,
      runChance:.15
    },
    {
      speed:.9,
      runSpeed:2.2,
      sleepChance:.1,
      runChance:.45
    },
    {
      speed:.5,
      runSpeed:1.2,
      sleepChance:.55,
      runChance:.05
    },
    {
      speed:1,
      runSpeed:2.5,
      sleepChance:.15,
      runChance:.4
    }
  ];

  return types[
    Math.floor(Math.random()*types.length)
  ];
}


/* =========================
   캐릭터 추가
========================= */

photoInput.addEventListener(
  "change",
  e=>{

    const file=e.target.files[0];

    if(!file)return;

    const reader=new FileReader();

    reader.onload=ev=>{

      const img=document.createElement("img");

      img.className="actor";
      img.src=ev.target.result;

      const p=createPersonality();

      const actor={

        element:img,

        x:30,
        y:30,

        targetX:30,
        targetY:30,

        size:100,

        speed:p.speed,
        runSpeed:p.runSpeed,

        sleepChance:p.sleepChance,
        runChance:p.runChance,

        paused:false,
        dragging:false,

        state:"walking",

        nextAction:
          Date.now()+1000,

        originalImage:null
      };

      const original=
        new Image();

      original.onload=()=>{
        actor.originalImage=original;
      };

      original.src=
        ev.target.result;

      actor.x=
        20+
        Math.random()*
        Math.max(
          1,
          stage.clientWidth-130
        );

      actor.y=
        20+
        Math.random()*
        Math.max(
          1,
          stage.clientHeight-130
        );

      actor.targetX=actor.x;
      actor.targetY=actor.y;

      img.style.left=
        actor.x+"px";

      img.style.top=
        actor.y+"px";

      actors.push(actor);

      stage.appendChild(img);

      enableActorDrag(actor);

      selectActor(actor);

      updateStatus();
    };

    reader.readAsDataURL(file);

    photoInput.value="";
  }
);


/* =========================

/* =========================
   자동 움직임
========================= */

function chooseNewAction(a){

  if(
    a.paused||
    a.dragging
  )return;

  const r=Math.random();

  if(
    r<a.sleepChance
  ){

    a.state="sleeping";

    a.element.classList.add(
      "sleeping"
    );

    a.nextAction=
      Date.now()+
      2000+
      Math.random()*3000;

    return;
  }

  a.state=
    r<a.sleepChance+a.runChance
    ? "running"
    : "walking";

  a.element.classList.remove(
    "sleeping"
  );

  const maxX=
    Math.max(
      0,
      stage.clientWidth-
      a.element.offsetWidth
    );

  const maxY=
    Math.max(
      0,
      stage.clientHeight-
      a.element.offsetHeight
    );

  a.targetX=
    Math.random()*maxX;

  a.targetY=
    Math.random()*maxY;

  a.nextAction=
    Date.now()+
    2000+
    Math.random()*3000;
}


function animate(){

  const now=Date.now();

  for(const a of actors){

    if(
      a.paused||
      a.dragging
    )continue;

    if(now>=a.nextAction){
      chooseNewAction(a);
    }

    if(
      a.state==="sleeping"
    )continue;

    const dx=
      a.targetX-a.x;

    const dy=
      a.targetY-a.y;

    const distance=
      Math.hypot(dx,dy);

    if(distance<1)continue;

    const speed=
      a.state==="running"
      ? a.runSpeed
      : a.speed;

    const step=
      Math.min(
        speed,
        distance
      );

    a.x+=
      dx/distance*step;

    a.y+=
      dy/distance*step;

    a.element.style.left=
      a.x+"px";

    a.element.style.top=
      a.y+"px";

    updateAttachedAccessories(a);
  }

  requestAnimationFrame(
    animate
  );
}

      x-owner.x,

      y-owner.y,

    };

    original.src=src;
  }


  accessories.push(a);

  stage.appendChild(img);

  applyAccessoryTransform(a);

  enableAccessoryDrag(a);

  selectAccessory(a);
}

/* =========================
   악세사리 드래그
========================= */

/*
  핵심:
  - 처음 누르면 선택
  - 선택된 상태에서 다시 눌러도 선택 유지
  - 고정되어 있으면 이동 안 됨
  - 고정 해제하면 다시 이동 가능
*/

function enableAccessoryDrag(a){

  const el=a.element;

  let active=false;

  let moved=false;

  let startPointerX=0;
  let startPointerY=0;

  let startX=0;
  let startY=0;


  el.addEventListener(
    "pointerdown",
    e=>{

      e.preventDefault();
      e.stopPropagation();

      active=true;
      moved=false;

      /*
        어떤 악세사리를 누르든
        무조건 선택 상태로 만든다.
      */

      if(
        selectedAccessory!==a
      ){
        selectAccessory(a);
      }

      /*
        고정된 악세사리는
        선택만 되고 이동하지 않음.
      */

      if(a.locked){

        a.dragging=false;

        return;
      }

      startPointerX=
        e.clientX;

      startPointerY=
        e.clientY;

      startX=a.x;
      startY=a.y;

      a.dragging=false;

      try{
        el.setPointerCapture(
          e.pointerId
        );
      }catch(_){}
    }
  );


  el.addEventListener(
    "pointermove",
    e=>{

      if(
        !active||
        a.locked
      )return;

      const dx=
        e.clientX-startPointerX;

      const dy=
        e.clientY-startPointerY;

      if(
        !moved&&
        Math.hypot(dx,dy)<5
      ){
        return;
      }

      moved=true;

      a.dragging=true;

      el.classList.add(
        "dragging"
      );

      e.preventDefault();
      e.stopPropagation();

      const maxX=
        Math.max(
          0,
          stage.clientWidth-
          el.offsetWidth
        );

      const maxY=
        Math.max(
          0,
          stage.clientHeight-
          el.offsetHeight
        );

      a.x=
        Math.max(
          0,
          Math.min(
            startX+dx,
            maxX
          )
        );

      a.y=
        Math.max(
          0,
          Math.min(
            startY+dy,
            maxY
          )
        );

      a.relativeX=
        a.x-a.owner.x;

      a.relativeY=
        a.y-a.owner.y;

      el.style.left=
        a.x+"px";

      el.style.top=
        a.y+"px";
    }
  );


  el.addEventListener(
    "pointerup",
    e=>{

      if(!active)return;

      active=false;

      a.dragging=false;

      el.classList.remove(
        "dragging"
      );

      /*
        여기서는 선택 해제를 하지 않는다.
        선택 해제는 고정 버튼으로만 한다.
      */

      try{
        el.releasePointerCapture(
          e.pointerId
        );
      }catch(_){}
    }
  );


  el.addEventListener(
    "pointercancel",
    e=>{

      active=false;

      a.dragging=false;

      el.classList.remove(
        "dragging"
      );

      try{
        el.releasePointerCapture(
          e.pointerId
        );
      }catch(_){}
    }
  );
}

      );

        String(a.size);

      accessoryRotationSlider.value=
        String(a.rotation);

      updateAccessoryLockButton();
      updateStatus();

      return;

    /*
      고정
    */

    a.locked=true;

    a.dragging=false;

    a.element.classList.remove(
      "dragging"
    );

    /*
      고정하는 순간
      선택 해제
    */

========================= */

function updateAttachedAccessories(
  actor
){

  for(
    const a of accessories
  ){

    if(
      a.owner===actor &&
      !a.dragging
    ){

      a.x=
        actor.x+
        a.relativeX;

      a.y=
        actor.y+
        a.relativeY;

      a.element.style.left=
        a.x+"px";

      a.element.style.top=
        a.y+"px";
    }
  }
}

  "click",
  ()=>{

    if(!selectedActor)return;

    selectedActor.element.style.zIndex=
      15;
  }
);


/* =========================
   캐릭터 삭제
========================= */

deleteActorButton.addEventListener(
  "click",
  ()=>{

    if(!selectedActor)return;

    const actor=
      selectedActor;

    /*
      해당 캐릭터의 악세사리만 삭제
    */

    for(
      let i=accessories.length-1;
      i>=0;
      i--
    ){

      if(
        accessories[i].owner===
        actor
      ){

        accessories[i]
          .element
          .remove();

        accessories.splice(
          i,
          1
        );
      }
    }

    actor.element.remove();

    const index=
      actors.indexOf(actor);

    if(index!==-1){

      actors.splice(
        index,
        1
      );
    }

    clearSelections();

    updateStatus();
  }
);


/* =========================
   이미지 로드
========================= */

function loadImage(src){

  return new Promise(
    (resolve,reject)=>{

      const img=
        new Image();

      img.onload=()=>{
        resolve(img);
      };

      img.onerror=reject;

      img.src=src;
    }
  );
}


async function getOriginalImage(item){

  if(item.originalImage){
    return item.originalImage;
  }

  return await loadImage(
    item.element.src
  );
}


/* =========================
   텍스트 줄바꿈
========================= */

function wrapText(
  ctx,
  text,
  maxWidth
){

  const lines=[];

  for(
    const paragraph of
    String(text).split("\n")
  ){

    if(paragraph===""){

      lines.push("");

      continue;
    }

    let line="";

    for(
      const char of paragraph
    ){

      const test=
        line+char;

      if(
        ctx.measureText(test)
        .width>maxWidth &&
        line
      ){

        lines.push(line);

        line=char;

      }else{

        line=test;
      }
    }

    lines.push(line);
  }

  return lines;
}


/* =========================
   저장
========================= */

saveButton.addEventListener(
  "click",
  async()=>{

    saveButton.disabled=true;

    try{

      const S=3;

      const W=900;

      const stageW=760;
      const stageH=650;

      const margin=70;

      const temp=
        document.createElement(
          "canvas"
        );

      const tempCtx=
        temp.getContext("2d");

      tempCtx.font=
        "32px sans-serif";

      const lines=
        wrapText(
          tempCtx,
          diaryInput.value||
          "오늘의 일기를 써보세요.",
          W-margin*2
        );

      const diaryH=
        Math.max(
          170,
          lines.length*52+90
        );

      const H=
        150+
        155+
        diaryH+
        stageH+
        120;

      const canvas=
        document.createElement(
          "canvas"
        );

      canvas.width=W*S;
      canvas.height=H*S;

      const ctx=
        canvas.getContext("2d");

      ctx.scale(S,S);

      ctx.imageSmoothingEnabled=true;

      ctx.imageSmoothingQuality=
        "high";

      ctx.fillStyle="#fff";

      ctx.fillRect(
        0,
        0,
        W,
        H
      );


      /* 제목 */

      ctx.textAlign="center";
      ctx.textBaseline="middle";

      ctx.fillStyle="#111";

      ctx.font=
        "bold 52px sans-serif";

      ctx.fillText(
        "오늘의 일기",
        W/2,
        65
      );

      ctx.font=
        "25px sans-serif";

      ctx.fillStyle="#777";

      ctx.fillText(
        dateElement.textContent,
        W/2,
        115
      );


      let y=150;


      /* 제목 */

      ctx.textAlign="left";

      ctx.fillStyle="#fafafa";

      ctx.strokeStyle="#ddd";

      ctx.lineWidth=2;

      ctx.beginPath();

      ctx.roundRect(
        margin,
        y,
        W-margin*2,
        130,
        20
      );

      ctx.fill();
      ctx.stroke();

      ctx.fillStyle="#777";

      ctx.font=
        "20px sans-serif";

      ctx.fillText(
        "제목",
        margin+30,
        y+30
      );

      ctx.fillStyle="#111";

      ctx.font=
        "bold 44px sans-serif";

      ctx.fillText(
        titleInput.value||
        "오늘의 제목",
        margin+30,
        y+82
      );

      y+=155;


      /* 일기 */

      ctx.fillStyle="#fff";

      ctx.beginPath();

      ctx.roundRect(
        margin,
        y,
        W-margin*2,
        diaryH,
        20
      );

      ctx.fill();
      ctx.stroke();

      ctx.fillStyle="#777";

      ctx.font=
        "20px sans-serif";

      ctx.fillText(
        "일기 내용",
        margin+30,
        y+32
      );

      ctx.fillStyle="#111";

      ctx.font=
        "32px sans-serif";

      let textY=
        y+80;

      for(
        const line of lines
      ){

        ctx.fillText(
          line,
          margin+30,
          textY
        );

        textY+=52;
      }

      y+=
        diaryH+25;


      /* 스테이지 */

      const sx=
        (W-stageW)/2;

      const sy=y;

      ctx.save();

      ctx.beginPath();

      ctx.roundRect(
        sx,
        sy,
        stageW,
        stageH,
        24
      );

      ctx.clip();


      /* 배경 */

      if(
        currentBackground.type===
        "image" &&
        currentBackground.src
      ){

        const bg=
          await loadImage(
            currentBackground.src
          );

        const ratio=
          bg.naturalWidth/
          bg.naturalHeight;

        const targetRatio=
          stageW/stageH;

        let dw,dh;

        if(ratio>targetRatio){

          dh=stageH;
          dw=dh*ratio;

        }else{

          dw=stageW;
          dh=dw/ratio;
        }

        ctx.drawImage(
          bg,
          sx+(stageW-dw)/2,
          sy+(stageH-dh)/2,
          dw,
          dh
        );

      }else{

        if(
          currentBackground.type===
          "sky"
        ){

          const g=
            ctx.createLinearGradient(
              0,
              sy,
              0,
              sy+stageH
            );

          g.addColorStop(
            0,
            "#bde8ff"
          );

          g.addColorStop(
            1,
            "#fff"
          );

          ctx.fillStyle=g;

        }

        else if(
          currentBackground.type===
          "night"
        ){

          const g=
            ctx.createLinearGradient(
              0,
              sy,
              0,
              sy+stageH
            );

          g.addColorStop(
            0,
            "#101528"
          );

          g.addColorStop(
            1,
            "#343b5c"
          );

          ctx.fillStyle=g;

        }

        else if(
          currentBackground.type===
          "grass"
        ){

          const g=
            ctx.createLinearGradient(
              0,
              sy,
              0,
              sy+stageH
            );

          g.addColorStop(
            0,
            "#dff5d8"
          );

          g.addColorStop(
            .65,
            "#c9ebc1"
          );

          g.addColorStop(
            .65,
            "#a9d79e"
          );

          g.addColorStop(
            1,
            "#a9d79e"
          );

          ctx.fillStyle=g;

        }

        else if(
          currentBackground.type===
          "pink"
        ){

          ctx.fillStyle=
            "#ffe8ef";

        }

        else if(
          currentBackground.type===
          "yellow"
        ){

          ctx.fillStyle=
            "#fff4b8";

        }

        else{

          ctx.fillStyle=
            "#fafafa";
        }

        ctx.fillRect(
          sx,
          sy,
          stageW,
          stageH
        );
      }


      const scaleX=
        stageW/stage.clientWidth;

      const scaleY=
        stageH/stage.clientHeight;


      /* 가구 */

      for(
        const f of furnitures
      ){

        try{

          const img=
            await getOriginalImage(f);

          const w=
            f.element.offsetWidth;

          const h=
            f.element.offsetHeight;

          const iw=
            img.naturalWidth||
            img.width;

          const ih=
            img.naturalHeight||
            img.height;

          const fit=
            Math.min(
              w/iw,
              h/ih
            );

          const dw=iw*fit;
          const dh=ih*fit;

          ctx.drawImage(
            img,
            sx+
            f.x*scaleX+
            (w-dw)/2*scaleX,
            sy+
            f.y*scaleY+
            (h-dh)/2*scaleY,
            dw*scaleX,
            dh*scaleY
          );

        }catch(_){}
      }


      /* 캐릭터 */

      for(
        const actor of actors
      ){

        try{

          const img=
            await getOriginalImage(
              actor
            );

          const w=
            actor.element.offsetWidth;

          const h=
            actor.element.offsetHeight;

          const iw=
            img.naturalWidth||
            img.width;

          const ih=
            img.naturalHeight||
            img.height;

          const fit=
            Math.min(
              w/iw,
              h/ih
            );

          const dw=iw*fit;
          const dh=ih*fit;

          ctx.drawImage(
            img,
            sx+
            actor.x*scaleX+
            (w-dw)/2*scaleX,
            sy+
            actor.y*scaleY+
            (h-dh)/2*scaleY,
            dw*scaleX,
            dh*scaleY
          );

        }catch(_){}
      }


      /* 악세사리 */

      for(
        const a of accessories
      ){

        try{

          const img=
            await getOriginalImage(a);

          const w=
            a.element.offsetWidth;

          const h=
            a.element.offsetHeight;

          const iw=
            img.naturalWidth||
            img.width;

          const ih=
            img.naturalHeight||
            img.height;

          const fit=
            Math.min(
              w/iw,
              h/ih
            );

          const dw=iw*fit;
          const dh=ih*fit;

          const px=
            sx+
            a.x*scaleX+
            (w-dw)/2*scaleX;

          const py=
            sy+
            a.y*scaleY+
            (h-dh)/2*scaleY;

          const cx=
            px+
            dw*scaleX/2;

          const cy=
            py+
            dh*scaleY/2;

          ctx.save();

          ctx.translate(
            cx,
            cy
          );

          ctx.rotate(
            a.rotation*
            Math.PI/180
          );

          ctx.drawImage(
            img,
            -dw*scaleX/2,
            -dh*scaleY/2,
            dw*scaleX,
            dh*scaleY
          );

          ctx.restore();

        }catch(_){}
      }

      ctx.restore();


      /* 테두리 */

      ctx.beginPath();

      ctx.roundRect(
        sx,
        sy,
        stageW,
        stageH,
        24
      );

      ctx.strokeStyle="#ddd";

      ctx.lineWidth=2;

      ctx.stroke();


      /* 이미지 저장 */

      const blob=
        await new Promise(
          resolve=>
            canvas.toBlob(
              resolve,
              "image/png"
            )
        );

      const file=
        new File(
          [blob],
          "그림일기.png",
          {
            type:"image/png"
          }
        );


      if(
        navigator.share&&
        navigator.canShare&&
        navigator.canShare({
          files:[file]
        })
      ){

        try{

          await navigator.share({
            files:[file],
            title:"그림일기"
          });

          return;

        }catch(e){

          if(
            e.name===
            "AbortError"
          ){
            return;
          }
        }
      }


      const url=
        URL.createObjectURL(
          blob
        );

      const link=
        document.createElement(
          "a"
        );

      link.href=url;

      link.download=
        "그림일기.png";

      document.body.appendChild(
        link
      );

      link.click();

      link.remove();

      setTimeout(
        ()=>{
          URL.revokeObjectURL(
            url
          );
        },
        1000
      );

    }catch(error){

      console.error(error);

      alert(
        "저장 중 문제가 생겼어요."
      );

    }finally{

      saveButton.disabled=false;
    }
  }
);


/* =========================
   전체 삭제
========================= */

clearAllButton.addEventListener(
  "click",
  ()=>{

    titleInput.value="";
    diaryInput.value="";

    localStorage.removeItem(
      "diary-title"
    );

    localStorage.removeItem(
      "diary-text"
    );


    for(
      const a of actors
    ){
      a.element.remove();
    }

    for(
      const a of accessories
    ){
      a.element.remove();
    }

    for(
      const f of furnitures
    ){
      f.element.remove();
    }


    actors.length=0;
    accessories.length=0;
    furnitures.length=0;


    clearSelections();

    updateStatus();
  }
);


/* 시작 */

updateStatus();

requestAnimationFrame(
  animate
);

</script>
