<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>그림일기</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:#f5f5f5;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  color:#333;
}

button,input,textarea{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

.app{
  width:min(100%,900px);
  margin:0 auto;
  padding:14px;
}

.diary{
  background:white;
  border-radius:20px;
  padding:14px;
  box-shadow:0 3px 15px rgba(0,0,0,.08);
}

input[type="text"]{
  width:100%;
  border:0;
  outline:0;
  font-size:24px;
  font-weight:700;
  text-align:center;
  background:transparent;
  margin-bottom:10px;
}

textarea{
  width:100%;
  min-height:90px;
  resize:vertical;
  border:0;
  outline:0;
  background:rgba(255,255,255,.75);
  border-radius:12px;
  padding:12px;
  font-size:16px;
  line-height:1.6;
}

.title-wrap,
.diary-wrap{
  position:relative;
}

.color-row{
  display:flex;
  justify-content:center;
  gap:6px;
  margin-bottom:10px;
  flex-wrap:wrap;
}

.color-btn{
  width:25px;
  height:25px;
  border-radius:50%;
  border:2px solid white;
  box-shadow:0 0 0 1px #ccc;
}

.custom-color{
  width:30px;
  height:30px;
  padding:0;
  border:0;
  background:none;
}

.stage{
  position:relative;
  width:100%;
  height:500px;
  margin-top:12px;
  border-radius:18px;
  overflow:hidden;

  /* 기본값 */
  background:#fffdfd;
  background-image:none;
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
}

.object{
  position:absolute;
  user-select:none;
  touch-action:none;
}

.actor{
  z-index:30;
  display:flex;
  align-items:center;
  justify-content:center;
}

.actor img{
  width:100%;
  height:100%;
  object-fit:contain;
  pointer-events:none;
}

.actor.selected{
  outline:2px dashed #777;
  outline-offset:4px;
  border-radius:12px;
}

.accessory{
  z-index:40;
  touch-action:none;
  user-select:none;
}

.accessory img{
  width:100%;
  height:100%;
  object-fit:contain;
  pointer-events:none;
}

.accessory.selected{
  outline:2px dashed #777;
  outline-offset:3px;
  border-radius:10px;
}

.furniture{
  z-index:20;
  touch-action:none;
  user-select:none;
}

.furniture img{
  width:100%;
  height:100%;
  object-fit:contain;
  pointer-events:none;
}

.furniture.selected{
  outline:2px dashed #777;
  outline-offset:3px;
  border-radius:10px;
}

.gift-on-stage{
  z-index:35;
  pointer-events:auto;
  cursor:pointer;
  touch-action:none;
  user-select:none;
}

.gift-on-stage img{
  width:100%;
  height:100%;
  object-fit:contain;
  pointer-events:none;
}

.gift-on-stage.selected{
  outline:2px dashed #777;
  outline-offset:3px;
  border-radius:10px;
}

.feature-buttons{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:7px;
  margin-top:12px;
}

.feature-button{
  background:#f2f2f2;
  border-radius:12px;
  padding:11px 4px;
  font-size:13px;
  font-weight:700;
}

.feature-button:active{
  transform:scale(.97);
}

.feature-panel{
  margin-top:10px;
  padding:12px;
  background:#f7f7f7;
  border-radius:16px;
}

.hidden{
  display:none!important;
}

.panel-title{
  font-size:16px;
  font-weight:800;
  margin-bottom:10px;
}

.items{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.item-btn{
  min-width:72px;
  min-height:62px;
  padding:8px;
  background:white;
  border:1px solid #ddd;
  border-radius:12px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
}

.item-btn span:first-child{
  font-size:25px;
}

.item-btn span:last-child{
  font-size:11px;
}

.file-label{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:10px 14px;
  background:white;
  border:1px solid #ddd;
  border-radius:11px;
  font-weight:700;
  font-size:13px;
  margin-bottom:10px;
}

input[type="file"]{
  display:none;
}

.control-box{
  margin-top:10px;
  padding:12px;
  background:white;
  border:1px solid #ddd;
  border-radius:13px;
}

.control-title{
  font-weight:800;
  margin-bottom:8px;
}

.control-row{
  display:flex;
  align-items:center;
  gap:8px;
  margin:8px 0;
}

.control-row label{
  width:60px;
  font-size:13px;
  font-weight:700;
}

.control-row input[type="range"]{
  flex:1;
}

.control-value{
  width:45px;
  text-align:right;
  font-size:12px;
  color:#777;
}

.control-actions{
  display:flex;
  gap:7px;
  margin-top:10px;
}

.small-btn{
  flex:1;
  padding:9px;
  border-radius:10px;
  background:#eee;
  font-size:12px;
  font-weight:700;
}

.status{
  font-size:12px;
  color:#777;
  margin:5px 0 10px;
}

.inventory{
  margin-top:10px;
}

.inventory-title{
  font-size:13px;
  font-weight:800;
  margin-bottom:7px;
}

.inventory-list{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
}

.inventory-item{
  background:white;
  border:1px solid #ddd;
  border-radius:10px;
  padding:8px 10px;
  font-size:12px;
}

.petting-box{
  margin-top:10px;
  padding:10px;
  border-radius:13px;
  background:#fff;
}

.petting-stage{
  position:relative;
  height:150px;
  overflow:hidden;
  border-radius:12px;
  background:#fafafa;
  display:flex;
  align-items:center;
  justify-content:center;
}

.petting-actor{
  width:100px;
  height:100px;
  transition:transform .15s;
}

.petting-actor.petted{
  animation:petShake .45s ease-in-out;
}

@keyframes petShake{
  0%{transform:rotate(0deg) translateX(0)}
  25%{transform:rotate(-7deg) translateX(-4px)}
  50%{transform:rotate(7deg) translateX(4px)}
  75%{transform:rotate(-5deg) translateX(-3px)}
  100%{transform:rotate(0deg) translateX(0)}
}

.bottom-buttons{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.bottom-buttons button{
  flex:1;
  padding:13px;
  border-radius:13px;
  background:#eee;
  font-weight:800;
}

.bg-items{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}

.bg-btn{
  min-height:55px;
  border-radius:12px;
  border:1px solid #ddd;
  background:white;
  font-size:12px;
  font-weight:700;
}

.bg-btn:active{
  transform:scale(.97);
}

@media(max-width:600px){
  .stage{
    height:430px;
  }

  .feature-button{
    font-size:11px;
    padding:10px 2px;
  }

  .bg-items{
    grid-template-columns:repeat(4,1fr);
  }
}
</style>
</head>

<body>

<div class="app">
<div class="diary">

  <div class="title-wrap">
    <div class="color-row">
      <button class="color-btn" style="background:#333" data-title-color="#333"></button>
      <button class="color-btn" style="background:#e57373" data-title-color="#e57373"></button>
      <button class="color-btn" style="background:#64b5f6" data-title-color="#64b5f6"></button>
      <button class="color-btn" style="background:#81c784" data-title-color="#81c784"></button>
      <button class="color-btn" style="background:#ba68c8" data-title-color="#ba68c8"></button>
      <input class="custom-color" type="color" id="titleCustomColor" value="#333333">
    </div>

    <input id="titleInput" type="text" placeholder="오늘의 제목">
  </div>

  <div class="diary-wrap">
    <div class="color-row">
      <button class="color-btn" style="background:#333" data-diary-color="#333"></button>
      <button class="color-btn" style="background:#e57373" data-diary-color="#e57373"></button>
      <button class="color-btn" style="background:#64b5f6" data-diary-color="#64b5f6"></button>
      <button class="color-btn" style="background:#81c784" data-diary-color="#81c784"></button>
      <button class="color-btn" style="background:#ba68c8" data-diary-color="#ba68c8"></button>
      <input class="custom-color" type="color" id="diaryCustomColor" value="#333333">
    </div>

    <textarea id="diaryInput" placeholder="오늘 있었던 일을 적어보세요."></textarea>
  </div>

  <div class="stage" id="stage"></div>

  <div class="feature-buttons">
    <button class="feature-button" data-panel="characterPanel">👤 캐릭터</button>
    <button class="feature-button" data-panel="giftPanel">🎁 선물</button>
    <button class="feature-button" data-panel="accessoryPanel">🎀 악세서리</button>
    <button class="feature-button" data-panel="furniturePanel">🪑 가구</button>
    <button class="feature-button" data-panel="backgroundPanel">🌈 배경</button>
  </div>

  <!-- 캐릭터 -->
  <div class="feature-panel hidden" id="characterPanel">
    <div class="panel-title">👤 캐릭터</div>

    <label class="file-label">
      ＋ 캐릭터 추가
      <input type="file" id="characterFile" accept="image/*">
    </label>

    <div class="status" id="characterStatus">캐릭터를 추가해주세요.</div>

    <div class="control-box hidden" id="characterControl">
      <div class="control-title">👤 선택한 캐릭터</div>

      <div class="control-row">
        <label>크기</label>
        <input type="range" id="characterSize" min="50" max="260" value="120">
        <span class="control-value" id="characterSizeValue">120</span>
      </div>

      <div class="control-actions">
        <button class="small-btn" id="petButton">🐾 쓰다듬기</button>
        <button class="small-btn" id="deleteCharacter">삭제</button>
      </div>
    </div>

    <div class="petting-box hidden" id="pettingBox">
      <div class="petting-stage" id="pettingStage">
        <div class="petting-actor" id="pettingActor"></div>
      </div>
      <div class="status" id="pettingStatus">캐릭터를 쓰다듬어보세요.</div>
    </div>
  </div>

  <!-- 선물 -->
  <div class="feature-panel hidden" id="giftPanel">
    <div class="panel-title">🎁 선물</div>

    <div class="items">
      <button class="item-btn gift-basic" data-gift="🎁" data-name="선물상자">
        <span>🎁</span><span>선물상자</span>
      </button>
      <button class="item-btn gift-basic" data-gift="🍪" data-name="쿠키">
        <span>🍪</span><span>쿠키</span>
      </button>
      <button class="item-btn gift-basic" data-gift="🌷" data-name="꽃">
        <span>🌷</span><span>꽃</span>
      </button>
      <button class="item-btn gift-basic" data-gift="🧸" data-name="인형">
        <span>🧸</span><span>인형</span>
      </button>
      <button class="item-btn gift-basic" data-gift="⭐" data-name="별">
        <span>⭐</span><span>별</span>
      </button>
      <button class="item-btn gift-basic" data-gift="🍎" data-name="사과">
        <span>🍎</span><span>사과</span>
      </button>
    </div>

    <br>

    <label class="file-label">
      ＋ 선물 추가
      <input type="file" id="giftFile" accept="image/*">
    </label>

    <div class="inventory">
      <div class="inventory-title">보유한 선물</div>
      <div class="inventory-list" id="inventoryList"></div>
    </div>

    <div class="control-box hidden" id="giftControl">
      <div class="control-title">🎁 선택한 선물</div>

      <div class="control-row">
        <label>크기</label>
        <input type="range" id="giftSize" min="25" max="180" value="52">
        <span class="control-value" id="giftSizeValue">52</span>
      </div>

      <div class="control-row">
        <label>각도</label>
        <input type="range" id="giftRotation" min="-180" max="180" value="0">
        <span class="control-value" id="giftRotationValue">0°</span>
      </div>
    </div>
  </div>

  <!-- 악세서리 -->
  <div class="feature-panel hidden" id="accessoryPanel">
    <div class="panel-title">🎀 악세서리</div>

    <div class="items">
      <button class="item-btn accessory-basic" data-emoji="🎩">
        <span>🎩</span><span>모자</span>
      </button>
      <button class="item-btn accessory-basic" data-emoji="👑">
        <span>👑</span><span>왕관</span>
      </button>
      <button class="item-btn accessory-basic" data-emoji="🎀">
        <span>🎀</span><span>리본</span>
      </button>
      <button class="item-btn accessory-basic" data-emoji="☁️">
        <span>☁️</span><span>구름</span>
      </button>
      <button class="item-btn accessory-basic" data-emoji="🤍">
        <span>🤍</span><span>하트</span>
      </button>
      <button class="item-btn accessory-basic" data-emoji="✨">
        <span>✨</span><span>별</span>
      </button>
    </div>

    <br>

    <label class="file-label">
      ＋ 악세서리 추가
      <input type="file" id="accessoryFile" accept="image/*">
    </label>

    <div class="control-box hidden" id="accessoryControl">
      <div class="control-title">🎀 선택한 악세서리</div>

      <div class="control-row">
        <label>크기</label>
        <input type="range" id="accessorySize" min="25" max="180" value="70">
        <span class="control-value" id="accessorySizeValue">70</span>
      </div>

      <div class="control-row">
        <label>각도</label>
        <input type="range" id="accessoryRotation" min="-180" max="180" value="0">
        <span class="control-value" id="accessoryRotationValue">0°</span>
      </div>

      <div class="control-actions">
        <button class="small-btn" id="accessoryLock">🔒 악세서리 고정</button>
        <button class="small-btn" id="accessoryDelete">삭제</button>
      </div>
    </div>
  </div>

  <!-- 가구 -->
  <div class="feature-panel hidden" id="furniturePanel">
    <div class="panel-title">🪑 가구</div>

    <div class="items">
      <button class="item-btn furniture-basic" data-emoji="🪑">
        <span>🪑</span><span>의자</span>
      </button>
      <button class="item-btn furniture-basic" data-emoji="🛋️">
        <span>🛋️</span><span>소파</span>
      </button>
      <button class="item-btn furniture-basic" data-emoji="🛏️">
        <span>🛏️</span><span>침대</span>
      </button>
      <button class="item-btn furniture-basic" data-emoji="🪴">
        <span>🪴</span><span>화분</span>
      </button>
      <button class="item-btn furniture-basic" data-emoji="🗄️">
        <span>🗄️</span><span>서랍장</span>
      </button>
      <button class="item-btn furniture-basic" data-emoji="🪟">
        <span>🪟</span><span>창문</span>
      </button>
    </div>

    <br>

    <label class="file-label">
      ＋ 가구 추가
      <input type="file" id="furnitureFile" accept="image/*">
    </label>

    <div class="control-box hidden" id="furnitureControl">
      <div class="control-title">🪑 선택한 가구</div>

      <div class="control-row">
        <label>크기</label>
        <input type="range" id="furnitureSize" min="30" max="300" value="100">
        <span class="control-value" id="furnitureSizeValue">100</span>
      </div>

      <div class="control-row">
        <label>각도</label>
        <input type="range" id="furnitureRotation" min="-180" max="180" value="0">
        <span class="control-value" id="furnitureRotationValue">0°</span>
      </div>

      <div class="control-actions">
        <button class="small-btn" id="furnitureLock">🔒 가구 고정</button>
        <button class="small-btn" id="furnitureDelete">삭제</button>
      </div>
    </div>
  </div>

  <!-- 배경 -->
  <div class="feature-panel hidden" id="backgroundPanel">
    <div class="panel-title">🌈 배경</div>

    <div class="bg-items">
      <button class="bg-btn" data-bg="plain">기본</button>
      <button class="bg-btn" data-bg="pink">분홍</button>
      <button class="bg-btn" data-bg="yellow">노랑</button>
      <button class="bg-btn" data-bg="blue">파랑</button>
      <button class="bg-btn" data-bg="green">초록</button>
      <button class="bg-btn" data-bg="purple">보라</button>
      <button class="bg-btn" data-bg="peach">복숭아</button>
      <button class="bg-btn" data-bg="night">밤</button>
    </div>

    <br>

    <label class="file-label">
      ＋ 사진 배경
      <input type="file" id="customBg" accept="image/*">
    </label>
  </div>

  <div class="bottom-buttons">
    <button id="saveButton">저장</button>
    <button id="clearButton">전체 삭제</button>
  </div>

</div>
</div>

<script>
const stage = document.getElementById("stage");

const titleInput = document.getElementById("titleInput");
const diaryInput = document.getElementById("diaryInput");

const characterFile = document.getElementById("characterFile");
const accessoryFile = document.getElementById("accessoryFile");
const furnitureFile = document.getElementById("furnitureFile");
const giftFile = document.getElementById("giftFile");
const customBg = document.getElementById("customBg");

const characterStatus = document.getElementById("characterStatus");
const characterControl = document.getElementById("characterControl");
const characterSize = document.getElementById("characterSize");
const characterSizeValue = document.getElementById("characterSizeValue");
const deleteCharacter = document.getElementById("deleteCharacter");

const petButton = document.getElementById("petButton");
const pettingBox = document.getElementById("pettingBox");
const pettingStage = document.getElementById("pettingStage");
const pettingStatus = document.getElementById("pettingStatus");
const pettingActor = document.getElementById("pettingActor");

const inventoryList = document.getElementById("inventoryList");

const accessoryControl = document.getElementById("accessoryControl");
const accessorySize = document.getElementById("accessorySize");
const accessorySizeValue = document.getElementById("accessorySizeValue");
const accessoryRotation = document.getElementById("accessoryRotation");
const accessoryRotationValue = document.getElementById("accessoryRotationValue");
const accessoryLock = document.getElementById("accessoryLock");
const accessoryDelete = document.getElementById("accessoryDelete");

const furnitureControl = document.getElementById("furnitureControl");
const furnitureSize = document.getElementById("furnitureSize");
const furnitureSizeValue = document.getElementById("furnitureSizeValue");
const furnitureRotation = document.getElementById("furnitureRotation");
const furnitureRotationValue = document.getElementById("furnitureRotationValue");
const furnitureLock = document.getElementById("furnitureLock");
const furnitureDelete = document.getElementById("furnitureDelete");

const giftControl = document.getElementById("giftControl");
const giftSize = document.getElementById("giftSize");
const giftSizeValue = document.getElementById("giftSizeValue");
const giftRotation = document.getElementById("giftRotation");
const giftRotationValue = document.getElementById("giftRotationValue");

let actors = [];
let accessories = [];
let furniture = [];
let gifts = [];

let selectedActor = null;
let selectedAccessory = null;
let selectedFurniture = null;
let selectedGift = null;

let actorId = 1;
let accessoryId = 1;
let furnitureId = 1;
let giftId = 1;

let currentBackground = "plain";
let customBackgroundImage = null;


/* =========================================================
   배경
   ========================================================= */

const backgrounds = {
  plain: "#fffdfd",

  pink: "linear-gradient(135deg, #ffe4ec 0%, #ffd1df 100%)",

  yellow: "linear-gradient(135deg, #fff7b2 0%, #ffe978 100%)",

  blue: "linear-gradient(135deg, #dff4ff 0%, #a9dcff 100%)",

  green: "linear-gradient(135deg, #e4f8df 0%, #bfe8b6 100%)",

  purple: "linear-gradient(135deg, #eee0ff 0%, #d6baff 100%)",

  peach: "linear-gradient(135deg, #ffe8d2 0%, #ffc9a8 100%)",

  night: "linear-gradient(135deg, #20243d 0%, #414a78 100%)"
};


/*
  ★ 배경 적용 핵심 수정 ★

  기본 배경:
  - backgroundImage를 사용하지 않음
  - background에 색상/그라데이션을 직접 적용

  사진 배경:
  - background에 기본색을 넣고
  - backgroundImage에 사진만 적용
*/
function applyBackground(){

  /* 사진 배경이 있다면 */
  if(customBackgroundImage){

    stage.style.background = "#fffdfd";

    stage.style.backgroundImage =
      `url("${customBackgroundImage}")`;

    stage.style.backgroundSize = "cover";
    stage.style.backgroundPosition = "center";
    stage.style.backgroundRepeat = "no-repeat";

    return;
  }

  /* 기본 배경/프리셋 */
  stage.style.backgroundImage = "none";

  stage.style.backgroundSize = "cover";
  stage.style.backgroundPosition = "center";
  stage.style.backgroundRepeat = "no-repeat";

  stage.style.background = backgrounds[currentBackground];
}

applyBackground();


document.querySelectorAll(".bg-btn").forEach(btn=>{

  btn.addEventListener("click",()=>{

    const bg = btn.dataset.bg;

    if(!backgrounds[bg]) return;

        return false;
      }

  gifts =
    gifts.filter(g=>{

/* =========================================================
   캐릭터 자동 이동
   ========================================================= */

let animationStarted = false;

function animateActors(){

  if(animationStarted) return;

  animationStarted = true;

  function loop(){

    actors.forEach(actor=>{

      if(!actor.moving) return;

      actor.x += actor.vx;
      actor.y += actor.vy;

      const maxX =
        Math.max(0,stage.clientWidth - actor.size);

      const maxY =
        Math.max(0,stage.clientHeight - actor.size);

      if(actor.x <= 0 || actor.x >= maxX){
        actor.vx *= -1;
        actor.x = Math.max(0,Math.min(actor.x,maxX));
      }

      if(actor.y <= 0 || actor.y >= maxY){
        actor.vy *= -1;
        actor.y = Math.max(0,Math.min(actor.y,maxY));
      }

      updateActorPosition(actor);

      updateAttachedAccessories(actor);

      updateHeldGifts(actor);
    });

    requestAnimationFrame(loop);
  }

  requestAnimationFrame(loop);
}

function showGift(gift,duration){

  const owner =
    actors.find(a=>a.id === gift.ownerId);

  if(!owner) return;

  if(gift.element)
    gift.element.remove();

  const el =
    document.createElement("div");

  el.className =
    "object gift-on-stage";

  el.style.width =
    gift.size + "px";

  el.style.height =
    gift.size + "px";

  const img =
    document.createElement("img");

  img.src = gift.src;

  el.appendChild(img);

  gift.element = el;

  gift.onStage = true;

  stage.appendChild(el);

  updateGiftPosition(gift);

  /*
    선물을 눌러도 캐릭터 선택은 유지.
    선물 자체만 선택.
  */
  el.addEventListener(
    "pointerdown",
    e=>{

      e.preventDefault();
      e.stopPropagation();

      selectGift(gift);
    }
  );

  renderInventory();

  if(duration){

    const currentElement = el;

    setTimeout(()=>{

      if(
        gift.element === currentElement &&
        gift.onStage
      ){

        gift.element.remove();

        gift.element = null;

        gift.onStage = false;

        if(selectedGift === gift){

          selectedGift = null;

          giftControl.classList.add("hidden");
        }

        renderInventory();
      }

    },duration);
  }
}


function updateGiftPosition(gift){

  const owner =
    actors.find(a=>a.id === gift.ownerId);

  if(!owner || !gift.element)
    return;

  const x =
    owner.x +
    owner.size * gift.ratioX;

  const y =
    owner.y +
    owner.size * gift.ratioY;

  gift.x = x;
  gift.y = y;

  gift.element.style.left =
    x + "px";

  gift.element.style.top =
    y + "px";

  gift.element.style.width =
    gift.size + "px";

  gift.element.style.height =
    gift.size + "px";

  gift.element.style.transform =
    `rotate(${gift.rotation}deg)`;
}

  gifts.forEach(gift=>{

    if(!gift.onStage)

    updateGiftPosition(gift);

});


giftRotation.addEventListener("input",()=>{

  if(!selectedGift) return;

  selectedGift.rotation =
    Number(giftRotation.value);

  giftRotationValue.textContent =
    selectedGift.rotation + "°";

  updateGiftPosition(selectedGift);
});


function renderInventory(){

  inventoryList.innerHTML = "";

  gifts.forEach(gift=>{

    const btn =
      document.createElement("button");

    btn.className =
      "inventory-item";

    btn.textContent =
      gift.name +
      (
        gift.onStage
          ? " · 숨기기"
          : " · 보여주기"
      );

    btn.addEventListener("click",()=>{

      if(gift.onStage){

        gift.element?.remove();

        gift.element = null;

        gift.onStage = false;

        if(selectedGift === gift){

          selectedGift = null;

          giftControl.classList.add("hidden");
        }

        renderInventory();

      }else{

        showGift(gift);
      }

    });

    inventoryList.appendChild(btn);
  });
}


/* =========================================================
   저장용 이미지
   ========================================================= */

function loadImage(src){

  return new Promise((resolve,reject)=>{

    const img = new Image();

    img.onload = ()=>resolve(img);

    img.onerror = reject;

    img.src = src;
  });
}


function drawContain(
  ctx,
  img,
  x,
  y,
  w,
  h
){

  const ratio =
    Math.min(
      w / img.width,
      h / img.height
    );

  const dw =
    img.width * ratio;

  const dh =
    img.height * ratio;

  ctx.drawImage(
    img,
    x + (w-dw)/2,
    y + (h-dh)/2,
    dw,
    dh
  );
}


function drawRotatedContain(
  ctx,
  img,
  x,
  y,
  w,
  h,
  rotation
){

  ctx.save();

  ctx.translate(
    x + w/2,
    y + h/2
  );

  ctx.rotate(
    rotation * Math.PI / 180
  );

  drawContain(
    ctx,
    img,
    -w/2,
    -h/2,
    w,
    h
  );

  ctx.restore();
}


/* =========================================================
   저장
   ========================================================= */

document.getElementById("saveButton")
.addEventListener("click",async()=>{

  const scale = 3;

  const width =
    stage.clientWidth;

  const height =
    stage.clientHeight;

  const canvas =
    document.createElement("canvas");

  canvas.width =
    width * scale;

  canvas.height =
    height * scale;

  const ctx =
    canvas.getContext("2d");

  ctx.scale(scale,scale);

  /* 배경 */

  if(customBackgroundImage){

    try{

      const bg =
        await loadImage(customBackgroundImage);

      ctx.drawImage(
        bg,
        0,
        0,
        width,
        height
      );

    }catch{

      ctx.fillStyle =
        "#fffdfd";

      ctx.fillRect(
        0,
        0,
        width,
        height
      );
    }

  }else{

    /*
      저장할 때도 프리셋 배경을 직접 그려서
      화면과 저장 결과가 동일하게 나오게 함.
    */

    if(currentBackground === "plain"){

      ctx.fillStyle =
        "#fffdfd";

      ctx.fillRect(
        0,
        0,
        width,
        height
      );

    }else{

      const gradients = {

        pink:["#ffe4ec","#ffd1df"],
        yellow:["#fff7b2","#ffe978"],
        blue:["#dff4ff","#a9dcff"],
        green:["#e4f8df","#bfe8b6"],
        purple:["#eee0ff","#d6baff"],
        peach:["#ffe8d2","#ffc9a8"],
        night:["#20243d","#414a78"]
      };

      const colors =
        gradients[currentBackground];

      if(colors){

        const gradient =
          ctx.createLinearGradient(
            0,
            0,
            width,
            height
          );

        gradient.addColorStop(
          0,
          colors[0]
        );

        gradient.addColorStop(
          1,
          colors[1]
        );

        ctx.fillStyle =
          gradient;

        ctx.fillRect(
          0,
          0,
          width,
          height
        );

      }else{

        ctx.fillStyle =
          "#fffdfd";

        ctx.fillRect(
          0,
          0,
          width,
          height
        );
      }
    }
  }


  /* 가구 */

  for(const item of furniture){

    try{

      const img =
        await loadImage(item.src);

      drawRotatedContain(
        ctx,
        img,
        item.x,
        item.y,
        item.size,
        item.size,
        item.rotation
      );

    }catch{}
  }


  /* 캐릭터 */

  for(const actor of actors){

    try{

      const img =
        await loadImage(actor.src);

      drawContain(
        ctx,
        img,
        actor.x,
        actor.y,
        actor.size,
        actor.size
      );

    }catch{}
  }


  /* 악세서리 */

  for(const accessory of accessories){

    const owner =
      actors.find(
        a=>a.id === accessory.ownerId
      );

    if(!owner)
      continue;

    try{

      const img =
        await loadImage(accessory.src);

      const x =
        accessory.locked
          ? accessory.x
          : owner.x +
            owner.size *
            accessory.ratioX;

      const y =
        accessory.locked
          ? accessory.y
          : owner.y +
            owner.size *
            accessory.ratioY;

      drawRotatedContain(
        ctx,
        img,
        x,
        y,
        accessory.size,
        accessory.size,
        accessory.rotation
      );

    }catch{}
  }


  /* 선물 */

  for(const gift of gifts){

    if(!gift.onStage)
      continue;

    const owner =
      actors.find(
        a=>a.id === gift.ownerId
      );

    if(!owner)
      continue;

    try{

      const img =
        await loadImage(gift.src);

      const x =
        owner.x +
        owner.size *
        gift.ratioX;

      const y =
        owner.y +
        owner.size *
        gift.ratioY;

      drawRotatedContain(
        ctx,
        img,
        x,
        y,
        gift.size,
        gift.size,
        gift.rotation
      );

    }catch{}
  }


  /* 제목/일기 */

  const result =
    document.createElement("canvas");

  result.width =
    (width + 28) * scale;

  result.height =
    (height + 150) * scale;

  const rctx =
    result.getContext("2d");

  rctx.scale(scale,scale);

  rctx.fillStyle =
    "#ffffff";

  rctx.fillRect(
    0,
    0,
    width + 28,
    height + 150
  );

  rctx.fillStyle =
    titleInput.style.color ||
    "#333";

  rctx.font =
    "bold 24px sans-serif";

  rctx.textAlign =
    "center";

  rctx.fillText(
    titleInput.value || "오늘의 제목",
    (width + 28)/2,
    30
  );

  rctx.drawImage(
    canvas,
    14,
    48,
    width,
    height
  );

  rctx.fillStyle =
    diaryInput.style.color ||
    "#333";

  rctx.font =
    "16px sans-serif";

  rctx.textAlign =
    "left";

  const text =
    diaryInput.value || "";

  const lines =
    text.split("\n");

  let ty =
    height + 75;

  lines.forEach(line=>{

    rctx.fillText(
      line,
      14,
      ty
    );

    ty += 25;
  });


  const link =
    document.createElement("a");

  link.download =
    "그림일기.png";

  link.href =
    result.toDataURL("image/png");

  link.click();

});


/* =========================================================
   전체 삭제
   ========================================================= */

document.getElementById("clearButton")
.addEventListener("click",()=>{

  if(!confirm("전체 삭제할까요?"))
    return;

  actors.forEach(a=>
    a.element?.remove()
  );

  accessories.forEach(a=>
    a.element?.remove()
  );

  furniture.forEach(f=>
    f.element?.remove()
  );

  gifts.forEach(g=>
    g.element?.remove()
  );

  actors = [];
  accessories = [];
  furniture = [];
  gifts = [];

  selectedActor = null;
  selectedAccessory = null;
  selectedFurniture = null;
  selectedGift = null;

  titleInput.value = "";
  diaryInput.value = "";

  characterStatus.textContent =
    "캐릭터를 추가해주세요.";

  inventoryList.innerHTML = "";

  characterControl.classList.add("hidden");
  pettingBox.classList.add("hidden");
  accessoryControl.classList.add("hidden");
  furnitureControl.classList.add("hidden");
  giftControl.classList.add("hidden");

  currentBackground = "plain";

  customBackgroundImage = null;

  customBg.value = "";

  applyBackground();

  document.querySelectorAll(".feature-panel")
    .forEach(panel=>{
      panel.classList.add("hidden");
    });
});


/* 초기 렌더링 */
renderInventory();

</script>
