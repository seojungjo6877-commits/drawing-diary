<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>그림일기</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:#f3f3f3;
  color:#222;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",
  "Noto Sans KR",sans-serif;
}

button,input,textarea{
  font:inherit;
}

.app{
  width:100%;
  max-width:900px;
  margin:auto;
  padding:14px;
}

h1{
  margin:3px 0 14px;
  text-align:center;
  font-size:22px;
}

.section{
  background:white;
  border:1px solid #ddd;
  border-radius:14px;
  padding:12px;
  margin-bottom:10px;
}

.section-title{
  font-weight:700;
  margin-bottom:9px;
}

input[type="text"],
textarea{
  width:100%;
  border:1px solid #ddd;
  border-radius:9px;
  padding:10px;
  outline:none;
  background:#fff;
}

textarea{
  min-height:130px;
  resize:vertical;
}

textarea:focus,
input[type="text"]:focus{
  border-color:#aaa;
}

button{
  border:1px solid #ddd;
  background:#fff;
  border-radius:9px;
  padding:9px 10px;
  cursor:pointer;
}

button:active{
  transform:scale(.97);
}

button.active{
  background:#222;
  color:white;
  border-color:#222;
}

.file-label{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:9px 11px;
  border:1px solid #ddd;
  border-radius:9px;
  background:#fff;
  cursor:pointer;
}

.file-label input{
  display:none;
}

.bg-buttons{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
}

#stage{
  position:relative;
  width:100%;
  height:430px;
  overflow:hidden;
  border:1px solid #ddd;
  border-radius:13px;
  background:#fafafa;
  touch-action:none;
}

#stage.sky{
  background:linear-gradient(#bde8ff,#fff);
}

#stage.night{
  background:linear-gradient(#101528,#343b5c);
}

#stage.grass{
  background:linear-gradient(
    #dff5d8 0%,
    #c9ebc1 65%,
    #a9d79e 65%,
    #a9d79e 100%
  );
}

#stage.pink{
  background:#ffe8ef;
}

#stage.yellow{
  background:#fff4b8;
}

.actor{
  position:absolute;
  width:90px;
  height:90px;
  object-fit:contain;
  user-select:none;
  -webkit-user-drag:none;
  touch-action:none;
  cursor:grab;
  z-index:30;
}

.actor:active{
  cursor:grabbing;
}

.accessory{
  position:absolute;
  width:45px;
  height:45px;
  object-fit:contain;
  user-select:none;
  -webkit-user-drag:none;
  touch-action:none;
  z-index:40;
}

.furniture{
  position:absolute;
  width:100px;
  height:100px;
  object-fit:contain;
  user-select:none;
  -webkit-user-drag:none;
  touch-action:none;
  z-index:20;
}

.gift-on-stage{
  position:absolute;
  width:50px;
  height:50px;
  object-fit:contain;
  user-select:none;
  -webkit-user-drag:none;
  touch-action:none;
  z-index:35;
  pointer-events:none;
}

.control-box{
  display:none;
}

.control-box.show{
  display:block;
}

.control-title{
  font-weight:700;
  margin-bottom:9px;
}

.row{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:8px;
}

.row label{
  white-space:nowrap;
  font-size:14px;
}

.range{
  flex:1;
}

.small-value{
  min-width:42px;
  text-align:right;
  font-size:13px;
  color:#666;
}

.delete-btn{
  width:100%;
  margin-top:9px;
}

.danger{
  color:#c00;
}

.tools-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
}

.tool{
  min-height:48px;
}

#accessoryControls,
#furnitureControls{
  display:none;
  margin-top:10px;
  padding-top:10px;
  border-top:1px solid #eee;
}

#accessoryControls.show,
#furnitureControls.show{
  display:block;
}

.notice{
  font-size:12px;
  color:#777;
  margin-top:7px;
  line-height:1.45;
}

#status{
  margin-top:8px;
  font-size:13px;
  color:#666;
  min-height:18px;
}

/* 쓰다듬기 */

#petButton{
  width:100%;
  margin-top:10px;
}

.petting-box{
  display:none;
  margin-top:10px;
  border-top:1px solid #eee;
  padding-top:10px;
}

.petting-box.show{
  display:block;
}

.petting-title{
  font-weight:700;
  margin-bottom:7px;
}

.petting-stage{
  position:relative;
  width:100%;
  height:300px;
  overflow:hidden;
  border:1px solid #ddd;
  border-radius:12px;
  background:#fafafa;
  touch-action:none;
}

.petting-actor{
  position:absolute;
  object-fit:contain;
  user-select:none;
  -webkit-user-drag:none;
  pointer-events:none;
  transition:transform .12s ease;
  transform-origin:center center;
}

.petting-actor.petted{
  transform:scale(1.07);
}

.petting-accessory{
  position:absolute;
  object-fit:contain;
  pointer-events:none;
  user-select:none;
  -webkit-user-drag:none;
}

.petting-status{
  position:absolute;
  left:0;
  right:0;
  bottom:8px;
  text-align:center;
  font-size:13px;
  color:#777;
  z-index:100;
  pointer-events:none;
}

.pet-heart{
  position:absolute;
  font-size:22px;
  pointer-events:none;
  animation:heartUp .65s ease-out forwards;
  z-index:200;
}

@keyframes heartUp{
  from{
    opacity:1;
    transform:translateY(0) scale(.8);
  }
  to{
    opacity:0;
    transform:translateY(-45px) scale(1.2);
  }
}

/* 선물 */

.gift-box{
  margin-top:10px;
  padding-top:10px;
  border-top:1px solid #eee;
}

.gift-title{
  font-weight:700;
  margin-bottom:8px;
}

.gift-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
}

.gift-choice{
  min-height:58px;
  font-size:14px;
}

.gift-photo-label{
  width:100%;
  margin-top:7px;
}

.inventory-box{
  margin-top:10px;
  padding-top:10px;
  border-top:1px solid #eee;
}

.inventory-title{
  font-weight:700;
  margin-bottom:7px;
}

.inventory-list{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
}

.inventory-item{
  position:relative;
  aspect-ratio:1;
  padding:5px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.inventory-item img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.inventory-item.held{
  border:2px solid #222;
}

.inventory-empty{
  grid-column:1/-1;
  padding:13px;
  text-align:center;
  color:#999;
  font-size:13px;
  border:1px dashed #ddd;
  border-radius:8px;
}

/* 선물 조작 */

#giftControls{
  display:none;
  margin-top:10px;
  padding-top:10px;
  border-top:1px solid #eee;
}

#giftControls.show{
  display:block;
}

.gift-selected-name{
  font-size:13px;
  margin-bottom:5px;
}

.save-area{
  margin-top:10px;
}

#saveBtn{
  width:100%;
  background:#222;
  color:white;
  border-color:#222;
  font-weight:700;
  padding:12px;
}

#clearAll{
  width:100%;
  margin-top:8px;
}

@media(max-width:500px){
  #stage{
    height:360px;
  }

  .petting-stage{
    height:280px;
  }
}
</style>
</head>

<body>

<div class="app">

<h1>그림일기</h1>

<div class="section">
  <div class="section-title">일기</div>

  <input
    id="diaryTitle"
    type="text"
    placeholder="오늘의 제목"
  >

  <textarea
    id="diaryText"
    placeholder="오늘 있었던 일을 적어보세요."
  ></textarea>
</div>

<div class="section">
  <div class="section-title">배경</div>

  <div class="bg-buttons">
    <button data-bg="plain">기본 배경</button>
    <button data-bg="sky">파란 하늘</button>
    <button data-bg="night">밤하늘</button>
    <button data-bg="grass">초원</button>
    <button data-bg="pink">분홍색</button>
    <button data-bg="yellow">노란색</button>
  </div>

  <label class="file-label" style="width:100%;margin-top:7px;">
    사진으로 배경 만들기
    <input id="bgFile" type="file" accept="image/*">
  </label>
</div>

<div class="section">
  <div class="section-title">캐릭터</div>

  <label class="file-label" style="width:100%;">
    ＋ 캐릭터 추가
    <input id="characterFile" type="file" accept="image/*">
  </label>

  <div class="notice">
    캐릭터를 터치하면 선택됩니다. 선택된 캐릭터를 다시 터치하면 선택이 해제됩니다.
  </div>
</div>

<div id="stage"></div>

<div class="section">

  <div id="controlBox" class="control-box">

    <div class="control-title">
      선택한 캐릭터
    </div>

    <div class="row">
      <label>크기</label>
      <input
        id="characterSize"
        class="range"
        type="range"
        min="40"
        max="220"
        value="90"
      >
      <span id="characterSizeValue" class="small-value">90</span>
    </div>

    <button id="petButton">🖐 쓰다듬기</button>

    <div id="pettingBox" class="petting-box">
      <div class="petting-title">쓰다듬기</div>

      <div id="pettingStage" class="petting-stage">
        <div id="pettingStatus" class="petting-status">
          캐릭터를 쓰다듬어보세요.
        </div>
      </div>
    </div>

    <!-- 선물 -->
    <div class="gift-box">

      <div class="gift-title">🎁 선물</div>

      <div class="gift-grid">

        <button
          class="gift-choice"
          data-gift-name="선물상자"
          data-gift-emoji="🎁"
        >🎁<br>선물상자</button>

        <button
          class="gift-choice"
          data-gift-name="쿠키"
          data-gift-emoji="🍪"
        >🍪<br>쿠키</button>

        <button
          class="gift-choice"
          data-gift-name="꽃"
          data-gift-emoji="🌷"
        >🌷<br>꽃</button>

        <button
          class="gift-choice"
          data-gift-name="인형"
          data-gift-emoji="🧸"
        >🧸<br>인형</button>

        <button
          class="gift-choice"
          data-gift-name="사과"
          data-gift-emoji="🍎"
        >🍎<br>사과</button>

        <button
          class="gift-choice"
          data-gift-name="별"
          data-gift-emoji="⭐"
        >⭐<br>별</button>

      </div>

      <label class="file-label gift-photo-label">
        📷 사진으로 선물 만들기
        <input
          id="giftFile"
          type="file"
          accept="image/*"
        >
      </label>

      <div class="inventory-box">

        <div class="inventory-title">
          🎒 소지품
        </div>

        <div id="inventoryList" class="inventory-list">
          <div class="inventory-empty">
            아직 선물이 없어요
          </div>
        </div>

        <div class="notice">
          소지품을 누르면 캐릭터가 다시 들 수 있어요.
        </div>

      </div>

      <!-- 선택된 선물의 위치/크기/각도 -->
      <div id="giftControls">

        <div id="giftSelectedName" class="gift-selected-name">
          선택한 선물
        </div>

        <div class="row">
          <label>가로 위치</label>
          <input
            id="giftX"
            class="range"
            type="range"
            min="-150"
            max="150"
            value="0"
          >
          <span id="giftXValue" class="small-value">0</span>
        </div>

        <div class="row">
          <label>세로 위치</label>
          <input
            id="giftY"
            class="range"
            type="range"
            min="-150"
            max="150"
            value="0"
          >
          <span id="giftYValue" class="small-value">0</span>
        </div>

        <div class="row">
          <label>크기</label>
          <input
            id="giftSize"
            class="range"
            type="range"
            min="20"
            max="150"
            value="50"
          >
          <span id="giftSizeValue" class="small-value">50</span>
        </div>

        <div class="row">
          <label>각도</label>
          <input
            id="giftAngle"
            class="range"
            type="range"
            min="-180"
            max="180"
            value="0"
          >
          <span id="giftAngleValue" class="small-value">0°</span>
        </div>

        <button id="giftDelete" class="delete-btn danger">
          이 선물 삭제
        </button>

      </div>

    </div>

    <button id="deleteCharacter" class="delete-btn danger">
      이 캐릭터 삭제
    </button>

    <div id="status"></div>

  </div>

</div>

<div class="section">

  <div class="section-title">악세사리</div>

  <div class="tools-grid">

    <button class="accessory-add" data-emoji="🎩">🎩 모자</button>
    <button class="accessory-add" data-emoji="👑">👑 왕관</button>
    <button class="accessory-add" data-emoji="🎀">🎀 리본</button>
    <button class="accessory-add" data-emoji="☁️">☁️ 구름</button>
    <button class="accessory-add" data-emoji="🤍">🤍 하트</button>
    <button class="accessory-add" data-emoji="✨">✨ 별</button>

  </div>

  <label class="file-label" style="width:100%;margin-top:7px;">
    ＋ 사진으로 악세사리 만들기
    <input id="accessoryFile" type="file" accept="image/*">
  </label>

  <div id="accessoryControls">

    <div class="row">
      <label>크기</label>
      <input
        id="accessorySize"
        class="range"
        type="range"
        min="15"
        max="150"
        value="45"
      >
      <span id="accessorySizeValue" class="small-value">45</span>
    </div>

    <div class="row">
      <label>각도</label>
      <input
        id="accessoryAngle"
        class="range"
        type="range"
        min="-180"
        max="180"
        value="0"
      >
      <span id="accessoryAngleValue" class="small-value">0°</span>
    </div>

    <button id="accessoryLock" style="width:100%;margin-top:8px;">
      🔒 악세사리 고정
    </button>

    <button id="accessoryDelete" class="delete-btn danger">
      이 악세사리 삭제
    </button>

  </div>

</div>

<div class="section">

  <div class="section-title">가구</div>

  <div class="tools-grid">

    <button class="furniture-add" data-emoji="🪑">🪑 의자</button>
    <button class="furniture-add" data-emoji="🛋️">🛋️ 소파</button>
    <button class="furniture-add" data-emoji="🛏️">🛏️ 침대</button>
    <button class="furniture-add" data-emoji="🪴">🪴 화분</button>
    <button class="furniture-add" data-emoji="🗄️">🗄️ 서랍장</button>
    <button class="furniture-add" data-emoji="🪟">🪟 창문</button>

  </div>

  <label class="file-label" style="width:100%;margin-top:7px;">
    ＋ 사진으로 가구 만들기
    <input id="furnitureFile" type="file" accept="image/*">
  </label>

  <div id="furnitureControls">

    <div class="row">
      <label>크기</label>
      <input
        id="furnitureSize"
        class="range"
        type="range"
        min="30"
        max="250"
        value="100"
      >
      <span id="furnitureSizeValue" class="small-value">100</span>
    </div>

    <button id="furnitureLock" style="width:100%;margin-top:8px;">
      🔒 가구 고정
    </button>

    <button id="furnitureDelete" class="delete-btn danger">
      이 가구 삭제
    </button>

  </div>

</div>

<div class="save-area">
  <button id="saveBtn">저장</button>
  <button id="clearAll" class="danger">전체 삭제</button>
</div>

</div>

<script>
/* =========================
   기본 데이터
========================= */

const stage = document.getElementById("stage");

let actors = [];
let accessories = [];
let furniture = [];

let selectedActor = null;
let selectedAccessory = null;
let selectedFurniture = null;
let selectedGift = null;

let backgroundType = "plain";
let customBackground = null;

let actorId = 1;
let accessoryId = 1;
let furnitureId = 1;
let giftId = 1;


/* =========================
   DOM
========================= */

const controlBox = document.getElementById("controlBox");
const statusEl = document.getElementById("status");

const characterSize = document.getElementById("characterSize");
const characterSizeValue = document.getElementById("characterSizeValue");

const accessoryControls = document.getElementById("accessoryControls");
const accessorySize = document.getElementById("accessorySize");
const accessorySizeValue = document.getElementById("accessorySizeValue");
const accessoryAngle = document.getElementById("accessoryAngle");
const accessoryAngleValue = document.getElementById("accessoryAngleValue");

const furnitureControls = document.getElementById("furnitureControls");
const furnitureSize = document.getElementById("furnitureSize");
const furnitureSizeValue = document.getElementById("furnitureSizeValue");

const petButton = document.getElementById("petButton");
const pettingBox = document.getElementById("pettingBox");
const pettingStage = document.getElementById("pettingStage");
const pettingStatus = document.getElementById("pettingStatus");

const inventoryList = document.getElementById("inventoryList");

const giftControls = document.getElementById("giftControls");
const giftSelectedName = document.getElementById("giftSelectedName");
const giftX = document.getElementById("giftX");
const giftY = document.getElementById("giftY");
const giftSize = document.getElementById("giftSize");
const giftAngle = document.getElementById("giftAngle");

const giftXValue = document.getElementById("giftXValue");
const giftYValue = document.getElementById("giftYValue");
const giftSizeValue = document.getElementById("giftSizeValue");
const giftAngleValue = document.getElementById("giftAngleValue");


/* =========================
   이모지 이미지
========================= */

function emojiSVG(emoji){
  return "data:image/svg+xml;charset=utf-8," +
    encodeURIComponent(`
      <svg xmlns="http://www.w3.org/2000/svg"
           width="200"
           height="200"
           viewBox="0 0 200 200">
        <rect width="200" height="200" fill="transparent"/>
        <text
          x="100"
          y="105"
          text-anchor="middle"
          dominant-baseline="middle"
          font-size="145">
          ${emoji}
        </text>
      </svg>
    `);
}


/* =========================
   이미지 로딩
========================= */

function loadImage(src){
  return new Promise((resolve,reject)=>{
    const img = new Image();

    img.onload = ()=>resolve(img);
    img.onerror = reject;

    img.src = src;
  });
}


/* =========================
   선택 해제
========================= */

function clearSelections(){

  selectedActor = null;
  selectedAccessory = null;
  selectedFurniture = null;
  selectedGift = null;

  controlBox.classList.remove("show");

  accessoryControls.classList.remove("show");
  furnitureControls.classList.remove("show");
  giftControls.classList.remove("show");

  pettingBox.classList.remove("show");
  petButton.textContent = "🖐 쓰다듬기";

  pettingStage.querySelectorAll(
    ".petting-actor,.petting-accessory"
  ).forEach(el=>el.remove());

  renderInventory(null);

  document.querySelectorAll(".actor").forEach(el=>{
    el.style.outline = "";
  });

  document.querySelectorAll(".accessory").forEach(el=>{
    el.style.outline = "";
  });

  document.querySelectorAll(".furniture").forEach(el=>{
    el.style.outline = "";
  });

  document.querySelectorAll(".gift-on-stage").forEach(el=>{
    el.style.outline = "";
  });

}


/* =========================
   캐릭터 선택
========================= */

function selectActor(actor){

  selectedActor = actor;
  selectedAccessory = null;
  selectedFurniture = null;
  selectedGift = null;

  controlBox.classList.add("show");

  accessoryControls.classList.remove("show");
  furnitureControls.classList.remove("show");
  giftControls.classList.remove("show");

  pettingBox.classList.remove("show");
  petButton.textContent = "🖐 쓰다듬기";

  characterSize.value = actor.size;
  characterSizeValue.textContent = actor.size;

  renderInventory(actor);

  document.querySelectorAll(".actor").forEach(el=>{
    el.style.outline = "";
  });

  actor.element.style.outline = "2px solid #222";

  statusEl.textContent =
    actor.name + "을(를) 선택했어요.";

}


/* =========================
   캐릭터 생성
========================= */

function addCharacter(src, originalFile=null){

  const actor = {
    id:actorId++,
    name:"캐릭터 " + actors.length + 1,

    src:src,
    originalFile:originalFile,

    x:20 + Math.random()*80,
    y:100 + Math.random()*80,

    size:90,

    vx:(Math.random()>.5?1:-1) *
       (0.25 + Math.random()*.45),

    vy:(Math.random()>.5?1:-1) *
       (0.12 + Math.random()*.25),

    mode:["walk","walk","idle","sleep"][
      Math.floor(Math.random()*4)
    ],

    inventory:[],

    petCount:0,

    element:null
  };

  const img = document.createElement("img");

  img.className = "actor";
  img.src = src;
  img.draggable = false;

  actor.element = img;

  setActorSize(actor,90);

  stage.appendChild(img);

  actors.push(actor);

  setupActorDrag(actor);

  selectActor(actor);

  updateActorPosition(actor);
}


/* =========================
   캐릭터 크기
========================= */

function setActorSize(actor,size){

  actor.size = Number(size);

  actor.element.style.width = actor.size + "px";
  actor.element.style.height = actor.size + "px";

  characterSizeValue.textContent = actor.size;

  updateAttachedAccessories(actor);
  updateActorGifts(actor);

  if(selectedActor === actor && pettingBox.classList.contains("show")){
    renderPettingView(actor);
  }
}


/* =========================
   캐릭터 드래그
========================= */

function setupActorDrag(actor){

  const el = actor.element;

  let pointerId = null;
  let startX = 0;
  let startY = 0;

  let originalX = 0;
  let originalY = 0;

  let dragging = false;
  let wasSelected = false;

  el.addEventListener("pointerdown",e=>{

    if(pointerId !== null) return;

    pointerId = e.pointerId;

    startX = e.clientX;
    startY = e.clientY;

    originalX = actor.x;
    originalY = actor.y;

    dragging = false;
    wasSelected = selectedActor === actor;

    el.setPointerCapture(pointerId);

    if(!wasSelected){
      selectActor(actor);
    }

    e.preventDefault();
  });

  el.addEventListener("pointermove",e=>{

    if(pointerId !== e.pointerId) return;

    const dx = e.clientX - startX;
    const dy = e.clientY - startY;

    if(Math.abs(dx) > 5 || Math.abs(dy) > 5){
      dragging = true;
    }

    if(dragging){

      if(selectedActor !== actor){
        selectActor(actor);
      }

      actor.x = originalX + dx;
      actor.y = originalY + dy;

      updateActorPosition(actor);
    }

    e.preventDefault();
  });

  el.addEventListener("pointerup",e=>{

    if(pointerId !== e.pointerId) return;

    if(!dragging && wasSelected && selectedActor === actor){
      clearSelections();
    }

    pointerId = null;

    e.preventDefault();
  });

  el.addEventListener("pointercancel",()=>{
    pointerId = null;
  });
}


/* =========================
   캐릭터 위치
========================= */

function updateActorPosition(actor){

  actor.element.style.left = actor.x + "px";
  actor.element.style.top = actor.y + "px";

  updateAttachedAccessories(actor);
  updateActorGifts(actor);
}


/* =========================
   자동 움직임
========================= */

let lastTime = performance.now();

function animate(now){

  const dt = Math.min(
    40,
    now-lastTime
  );

  lastTime = now;

  const stageW = stage.clientWidth;
  const stageH = stage.clientHeight;

  actors.forEach(actor=>{

    if(actor.dragging) return;

    const w = actor.element.offsetWidth;
    const h = actor.element.offsetHeight;

    actor.x += actor.vx * dt * 0.06;
    actor.y += actor.vy * dt * 0.035;

    if(actor.x < 0){
      actor.x = 0;
      actor.vx = Math.abs(actor.vx);
    }

    if(actor.x + w > stageW){
      actor.x = Math.max(0,stageW-w);
      actor.vx = -Math.abs(actor.vx);
    }

    if(actor.y < 20){
      actor.y = 20;
      actor.vy = Math.abs(actor.vy);
    }

    if(actor.y + h > stageH){
      actor.y = Math.max(20,stageH-h);
      actor.vy = -Math.abs(actor.vy);
    }

    updateActorPosition(actor);
  });

  requestAnimationFrame(animate);
}

requestAnimationFrame(animate);

function addAccessory(src,emoji=""){

  if(!selectedActor){
    alert("먼저 캐릭터를 선택해주세요.");
    return;
  }

  const actor = selectedActor;

  const a = {
    id:accessoryId++,
    owner:actor,

    src:src,
    emoji:emoji,

    relativeX:actor.size * .25,
    relativeY:-20,

    size:45,
    angle:0,

    locked:false,

    element:null
  };

  const img = document.createElement("img");

  img.className = "accessory";
  img.src = src;
  img.draggable = false;

  a.element = img;

  stage.appendChild(img);

  accessories.push(a);

  setupAccessoryDrag(a);
  updateAccessoryPosition(a);

  selectAccessory(a);
}


function selectAccessory(a){

  selectedAccessory = a;
  selectedFurniture = null;
  selectedGift = null;

  accessoryControls.classList.add("show");
  furnitureControls.classList.remove("show");
  giftControls.classList.remove("show");

  document.querySelectorAll(".accessory").forEach(el=>{
    el.style.outline = "";
  });

  a.element.style.outline = "2px solid #222";

  accessorySize.value = a.size;
  accessorySizeValue.textContent = a.size;

  accessoryAngle.value = a.angle;
  accessoryAngleValue.textContent = a.angle + "°";

  document.getElementById("accessoryLock").textContent =
    a.locked
      ? "🔓 악세사리 고정 해제"
      : "🔒 악세사리 고정";

}


function updateAccessoryPosition(a){

  const actor = a.owner;

  if(!actor || !actor.element) return;

  a.element.style.width = a.size + "px";
  a.element.style.height = a.size + "px";

  a.element.style.left =
    actor.x + a.relativeX + "px";

  a.element.style.top =
    actor.y + a.relativeY + "px";

  a.element.style.transform =
    `rotate(${a.angle}deg)`;
}


function updateAttachedAccessories(actor){

  accessories.forEach(a=>{

    if(a.owner === actor){
      updateAccessoryPosition(a);
    }

  });
}


function setupAccessoryDrag(a){

  const el = a.element;

  let pointerId = null;
  let startX = 0;
  let startY = 0;
  let startRX = 0;
  let startRY = 0;

  el.addEventListener("pointerdown",e=>{

    pointerId = e.pointerId;

    startX = e.clientX;
    startY = e.clientY;

    startRX = a.relativeX;
    startRY = a.relativeY;

    el.setPointerCapture(pointerId);

    selectAccessory(a);

    e.preventDefault();
  });

  el.addEventListener("pointermove",e=>{

    if(pointerId !== e.pointerId) return;

    if(a.locked) return;

    const dx = e.clientX-startX;
    const dy = e.clientY-startY;

    a.relativeX = startRX+dx;
    a.relativeY = startRY+dy;

    updateAccessoryPosition(a);

    if(selectedActor === a.owner &&
       pettingBox.classList.contains("show")){
      renderPettingView(a.owner);
    }

    e.preventDefault();
  });

  el.addEventListener("pointerup",e=>{
    pointerId=null;
    e.preventDefault();
  });

  el.addEventListener("pointercancel",()=>{
    pointerId=null;
  });
}

  const el = f.element;

  let pointerId=null;
  let startX=0;
  let startY=0;
  let originalX=0;
  let originalY=0;

  el.addEventListener("pointerdown",e=>{

    pointerId=e.pointerId;

    startX=e.clientX;
    startY=e.clientY;

    originalX=f.x;
    originalY=f.y;

    el.setPointerCapture(pointerId);

    selectFurniture(f);

    e.preventDefault();
  });

  el.addEventListener("pointermove",e=>{

    if(pointerId!==e.pointerId) return;
    if(f.locked) return;

    f.x=originalX+(e.clientX-startX);
    f.y=originalY+(e.clientY-startY);

    updateFurniturePosition(f);

    e.preventDefault();
  });

  el.addEventListener("pointerup",()=>{
    pointerId=null;
  });

  el.addEventListener("pointercancel",()=>{
    pointerId=null;
  });
}


/* =========================
   선물
========================= */

/*
  선물의 핵심 구조

  gift.owner
  → 어느 캐릭터의 선물인지

  gift.relativeX
  gift.relativeY
  → 캐릭터 기준 위치

  gift.size
  → 선물 크기

  gift.angle
  → 선물 각도

  따라서 캐릭터가 움직여도
  선물은 그 캐릭터를 따라감.
*/

function addGift(src, name, emoji="", originalFile=null){

  if(!selectedActor){
    alert("먼저 선물을 받을 캐릭터를 선택해주세요.");
    return;
  }

  const actor = selectedActor;

  const gift = {

    id:giftId++,

    owner:actor,

    name:name,
    emoji:emoji,

    src:src,
    originalFile:originalFile,

    /*
      처음 생성되는 위치
      캐릭터 오른쪽 아래쪽
    */
    relativeX:actor.size * .65,
    relativeY:actor.size * .50,

    size:50,
    angle:0,

    onStage:false,
    held:false,

    element:null,
    timer:null
  };

  actor.inventory.push(gift);

  renderInventory(actor);

  /*
    선물을 받은 직후에는 8초 동안
    캐릭터가 들고 있도록 표시
  */
  showGift(gift,8000);

  statusEl.textContent =
    actor.name + "에게 " + name + "을(를) 줬어요! 🎁";
}


/* =========================
   선물 표시
========================= */

function showGift(gift,duration=null){

  if(!gift.owner) return;

  removeGiftElement(gift);

  const img=document.createElement("img");

  img.className="gift-on-stage";
  img.src=gift.src;
  img.draggable=false;

  gift.element=img;
  gift.onStage=true;
  gift.held=true;

  stage.appendChild(img);

  updateGiftPosition(gift);

  if(gift.timer){
    clearTimeout(gift.timer);
    gift.timer=null;
  }

  if(duration !== null){

    gift.timer=setTimeout(()=>{

      removeGiftElement(gift);

      gift.onStage=false;
      gift.held=false;

    },duration);
  }
}


/* =========================
   선물 위치
========================= */

function updateGiftPosition(gift){

  if(!gift.element || !gift.owner) return;

  const actor=gift.owner;

  gift.element.style.width=
    gift.size+"px";

  gift.element.style.height=
    gift.size+"px";

  gift.element.style.left=
    actor.x + gift.relativeX + "px";

  gift.element.style.top=
    actor.y + gift.relativeY + "px";

  gift.element.style.transform=
    `rotate(${gift.angle}deg)`;
}


function updateActorGifts(actor){

  actor.inventory.forEach(gift=>{

    if(gift.onStage){
      updateGiftPosition(gift);
    }

  });
}


function removeGiftElement(gift){

  if(gift.element){

    gift.element.remove();
    gift.element=null;

  }

}


/* =========================
   선물 선택
========================= */

function selectGift(gift){

  selectedGift=gift;

  selectedAccessory=null;
  selectedFurniture=null;

  accessoryControls.classList.remove("show");
  furnitureControls.classList.remove("show");
  giftControls.classList.add("show");

  document.querySelectorAll(".gift-on-stage").forEach(el=>{
    el.style.outline="";
  });

  if(gift.element){
    gift.element.style.outline="2px solid #222";
  }

  giftSelectedName.textContent=
    "🎁 "+gift.name;

  giftX.value=Math.round(gift.relativeX);
  giftY.value=Math.round(gift.relativeY);
  giftSize.value=gift.size;
  giftAngle.value=gift.angle;

  updateGiftControlLabels();
}


/* =========================
   소지품
========================= */

function renderInventory(actor){

  inventoryList.innerHTML="";

  if(!actor || actor.inventory.length===0){

    inventoryList.innerHTML=`
      <div class="inventory-empty">
        아직 선물이 없어요
      </div>
    `;

    return;
  }

  actor.inventory.forEach(gift=>{

    const button=document.createElement("button");

    button.className=
      "inventory-item" +
      (gift.onStage ? " held" : "");

    button.title=gift.name;

    const img=document.createElement("img");

    img.src=gift.src;
    img.alt=gift.name;

    button.appendChild(img);

    button.addEventListener("click",e=>{

      e.stopPropagation();

      /*
        소지품을 다시 누르면
        캐릭터가 선물을 들거나 내려놓음
      */

      if(gift.onStage){

        removeGiftElement(gift);

        gift.onStage=false;
        gift.held=false;

        if(gift.timer){
          clearTimeout(gift.timer);
          gift.timer=null;
        }

      }else{

        /*
          기존 위치/크기/각도를 그대로 사용
          자동으로 새 설정을 만들지 않음
        */
        showGift(gift,null);
      }

      selectGift(gift);
      renderInventory(actor);

    });

    inventoryList.appendChild(button);
  });
}

  const gift=selectedGift;

  if(gift.timer){
    clearTimeout(gift.timer);

  removeGiftElement(gift);

    actor.inventory.splice(index,1);

  giftControls.classList.remove("show");

  renderInventory(actor);
});

/* =========================
   쓰다듬기 화면
========================= */

function renderPettingView(actor){

  if(!actor) return;

  pettingStage
    .querySelectorAll(
      ".petting-actor,.petting-accessory"
    )
    .forEach(el=>el.remove());

  const stageW=pettingStage.clientWidth;
  const stageH=pettingStage.clientHeight;

  const sourceImg=new Image();

  sourceImg.onload=()=>{

    /*
      원본 비율을 유지하면서
      쓰다듬기 창을 최대한 꽉 채움
    */

    const iw=sourceImg.naturalWidth || 1;
    const ih=sourceImg.naturalHeight || 1;

    const maxW=stageW*.84;
    const maxH=stageH*.80;

    let w=maxW;
    let h=w*(ih/iw);

    if(h>maxH){
      h=maxH;
      w=h*(iw/ih);
    }

    const left=(stageW-w)/2;
    const top=(stageH-h)/2-5;

    const big=document.createElement("img");

    big.className="petting-actor";
    big.src=actor.src;
    big.draggable=false;

    big.style.width=w+"px";
    big.style.height=h+"px";
    big.style.left=left+"px";
    big.style.top=top+"px";

    pettingStage.appendChild(big);

    /*
      실제 악세사리도 그대로 복사해서 표시
    */

    const scale=w/actor.size;

    accessories
      .filter(a=>a.owner===actor)
      .forEach(a=>{

        const acc=document.createElement("img");

        acc.className="petting-accessory";
        acc.src=a.src;
        acc.draggable=false;

        acc.style.width=
          (a.size*scale)+"px";

        acc.style.height=
          (a.size*scale)+"px";

        acc.style.left=
          (left+a.relativeX*scale)+"px";

        acc.style.top=
          (top+a.relativeY*scale)+"px";

        acc.style.transform=
          `rotate(${a.angle}deg)`;

        pettingStage.appendChild(acc);
      });

  };

  sourceImg.src=actor.src;
}


/* =========================
   쓰다듬기 터치
========================= */

pettingStage.addEventListener(
  "pointerdown",
  e=>{

    if(!selectedActor) return;

    const actorImg=
      pettingStage.querySelector(".petting-actor");

    if(!actorImg) return;

    selectedActor.petCount++;

    actorImg.classList.add("petted");

    pettingStatus.textContent=
      "쓰담쓰담… 💕";

    const heart=document.createElement("span");

    heart.className="pet-heart";
    heart.textContent=
      Math.random()>.5 ? "♡" : "♥";

    const rect=
      pettingStage.getBoundingClientRect();

    heart.style.left=
      (e.clientX-rect.left-10)+"px";

    heart.style.top=
      (e.clientY-rect.top-15)+"px";

    pettingStage.appendChild(heart);

    setTimeout(()=>{
      actorImg.classList.remove("petted");
    },130);

    setTimeout(()=>{
      heart.remove();
    },700);

    clearTimeout(window.petStatusTimer);

    window.petStatusTimer=
      setTimeout(()=>{

        pettingStatus.textContent=
          "캐릭터를 쓰다듬어보세요.";

      },600);

    e.preventDefault();
  }
);

document.getElementById("deleteCharacter")
.addEventListener("click",()=>{

  /*
    악세사리 삭제
  */

  accessories
    .filter(a=>a.owner===actor)
    .forEach(a=>a.element.remove());

    accessories.filter(a=>a.owner!==actor);

    선물 삭제
  */

    if(gift.timer){
      clearTimeout(gift.timer);
    }

  */

  actor.element.remove();

  actors=
    actors.filter(a=>a!==actor);

  clearSelections();

});

/* =========================
   저장용 원본 이미지
========================= */

async function getOriginalImage(obj){

  /*
    파일 원본이 있는 경우
    해당 data URL 자체를 사용.
  */

  if(obj.src){
    try{
      return await loadImage(obj.src);
    }catch(e){}
  }

  return null;
}


/* =========================
   저장용 배경
========================= */

function drawBackground(ctx,w,h){

  if(customBackground){

    return loadImage(customBackground)
      .then(img=>{

        ctx.drawImage(img,0,0,w,h);

      });

  }

  if(backgroundType==="plain"){

    ctx.fillStyle="#fafafa";
    ctx.fillRect(0,0,w,h);

    return Promise.resolve();
  }

  if(backgroundType==="sky"){

    const g=ctx.createLinearGradient(
      0,0,0,h
    );

    g.addColorStop(0,"#bde8ff");
    g.addColorStop(1,"#fff");

    ctx.fillStyle=g;
    ctx.fillRect(0,0,w,h);

    return Promise.resolve();
  }

  if(backgroundType==="night"){

    const g=ctx.createLinearGradient(
      0,0,0,h
    );

    g.addColorStop(0,"#101528");
    g.addColorStop(1,"#343b5c");

    ctx.fillStyle=g;
    ctx.fillRect(0,0,w,h);

    return Promise.resolve();
  }

  if(backgroundType==="grass"){

    const g=ctx.createLinearGradient(
      0,0,0,h
    );

    g.addColorStop(0,"#dff5d8");
    g.addColorStop(.65,"#c9ebc1");
    g.addColorStop(.65,"#a9d79e");
    g.addColorStop(1,"#a9d79e");

    ctx.fillStyle=g;
    ctx.fillRect(0,0,w,h);

    return Promise.resolve();
  }

  if(backgroundType==="pink"){

    ctx.fillStyle="#ffe8ef";
    ctx.fillRect(0,0,w,h);

    return Promise.resolve();
  }

  if(backgroundType==="yellow"){

    ctx.fillStyle="#fff4b8";
    ctx.fillRect(0,0,w,h);

    return Promise.resolve();
  }

  return Promise.resolve();
}


/* =========================
   저장
========================= */

document.getElementById("saveBtn")
.addEventListener("click",async()=>{

  const scale=3;

  const stageW=stage.clientWidth;
  const stageH=stage.clientHeight;

  const canvasW=900;
  const diaryAreaH=330;
  const canvasH=
    diaryAreaH + stageH;

  const canvas=document.createElement("canvas");

  canvas.width=canvasW*scale;
  canvas.height=canvasH*scale;

  const ctx=canvas.getContext("2d");

  ctx.imageSmoothingEnabled=true;
  ctx.imageSmoothingQuality="high";

  ctx.scale(scale,scale);

  /*
    위쪽 일기 영역
  */

  ctx.fillStyle="#fff";
  ctx.fillRect(0,0,canvasW,diaryAreaH);

  ctx.fillStyle="#222";
  ctx.textAlign="center";
  ctx.font="bold 27px sans-serif";

  ctx.fillText(
    "오늘의 일기",
    canvasW/2,
    48
  );

  const title=
    document.getElementById("diaryTitle").value;

  const diary=
    document.getElementById("diaryText").value;

  ctx.textAlign="left";

  ctx.font="bold 24px sans-serif";

  ctx.fillText(
    title || "",
    45,
    95
  );

  ctx.font="20px sans-serif";

  drawWrappedText(
    ctx,
    diary || "",
    45,
    140,
    canvasW-90,
    30
  );

  /*
    무대 시작 위치
  */

  const sx=0;
  const sy=diaryAreaH;

  /*
    배경
  */

  ctx.save();

  ctx.translate(sx,sy);

  await drawBackground(
    ctx,
    stageW,
    stageH
  );

  ctx.restore();

  /*
    무대 클리핑
  */

  ctx.save();

  ctx.beginPath();
  ctx.rect(
    sx,
    sy,
    stageW,
    stageH
  );
  ctx.clip();


  /*
    가구
  */

  for(const f of furniture){

    const img=
      await getOriginalImage(f);

    if(!img) continue;

    const w=f.element.offsetWidth;
    const h=f.element.offsetHeight;

    ctx.drawImage(
      img,
      sx+f.x,
      sy+f.y,
      w,
      h
    );
  }


  /*
    캐릭터

    ★ 화면에서는 90×90 박스지만
    저장할 때는 원본 비율을 유지함.
    특히 세로로 긴 사진도 찌그러지지 않음.
  */

  for(const actor of actors){

    const img=
      await getOriginalImage(actor);

    if(!img) continue;

    const boxW=
      actor.element.offsetWidth;

    const boxH=
      actor.element.offsetHeight;

    const iw=
      img.naturalWidth || img.width || 1;

    const ih=
      img.naturalHeight || img.height || 1;

    const drawW=boxW;
    const drawH=
      drawW*(ih/iw);

    const px=
      sx+actor.x;

    const py=
      sy+
      actor.y+
      (boxH-drawH)/2;

    ctx.drawImage(
      img,
      px,
      py,
      drawW,
      drawH
    );
  }


  /*
    선물

    캐릭터보다 위에 표시.
    각 선물의 위치/크기/각도를 그대로 사용.
  */

  for(const actor of actors){

    for(const gift of actor.inventory){

      if(!gift.onStage || !gift.element)
        continue;

      const img=
        await getOriginalImage(gift);

      if(!img) continue;

      const x=
        actor.x+gift.relativeX;

      const y=
        actor.y+gift.relativeY;

      const w=
        gift.element.offsetWidth;

      const h=
        gift.element.offsetHeight;

      ctx.save();

      ctx.translate(
        x+w/2,
        y+h/2
      );

      ctx.rotate(
        gift.angle*Math.PI/180
      );

      ctx.drawImage(
        img,
        -w/2,
        -h/2,
        w,
        h
      );

      ctx.restore();
    }
  }


  /*
    악세사리
  */

  for(const a of accessories){

    const img=
      await getOriginalImage(a);

    if(!img) continue;

    const w=a.size;
    const h=a.size;

    const x=
      a.owner.x+a.relativeX;

    const y=
      a.owner.y+a.relativeY;

    ctx.save();

    ctx.translate(
      x+w/2,
      y+h/2
    );

    ctx.rotate(
      a.angle*Math.PI/180
    );

    ctx.drawImage(
      img,
      -w/2,
      -h/2,
      w,
      h
    );

    ctx.restore();
  }

  ctx.restore();


  /*
    최종 이미지 저장
  */

  const link=document.createElement("a");

  link.download=
    "그림일기.png";

  link.href=
    canvas.toDataURL("image/png");

  link.click();

});


/* =========================
   줄바꿈 텍스트
========================= */

function drawWrappedText(
  ctx,
  text,
  x,
  y,
  maxWidth,
  lineHeight
){

  const lines=[];

  const paragraphs=
    String(text).split("\n");

  paragraphs.forEach(paragraph=>{

    if(paragraph===""){
      lines.push("");
      return;
    }

    let line="";

    for(const char of paragraph){

      const test=
        line+char;

      if(
        ctx.measureText(test).width >
        maxWidth
      ){

        lines.push(line);
        line=char;

      }else{

        line=test;

      }
    }

    lines.push(line);

  });

  lines.forEach((line,i)=>{

    ctx.fillText(
      line,
      x,
      y+i*lineHeight
    );

  });
}
