<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>그림일기</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:#f5f5f5;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",
  "Noto Sans KR",sans-serif;
  color:#222;
}

button,input,textarea{font-family:inherit}

button{
  border:1px solid #ddd;
  background:#fff;
  border-radius:10px;
  padding:8px 10px;
  cursor:pointer;
}

button:active{transform:scale(.97)}

.app{
  width:100%;
  max-width:900px;
  margin:auto;
  padding:12px;
}

h1{
  text-align:center;
  margin:4px 0 12px;
  font-size:23px;
}

.diary-area{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.title-wrap,
.diary-wrap{
  position:relative;
  border:1px solid #ddd;
  border-radius:14px;
  overflow:hidden;
  background:#fff;
}

.title-input{
  width:100%;
  border:0;
  outline:0;
  padding:13px;
  font-size:19px;
  font-weight:bold;
  background:transparent;
  color:#222;
}

.diary-input{
  width:100%;
  min-height:140px;
  resize:vertical;
  border:0;
  outline:0;
  padding:13px;
  font-size:16px;
  line-height:1.6;
  background:transparent;
  color:#222;
}

.color-tools{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:6px;
  padding:7px;
  border-top:1px solid #eee;
  background:rgba(255,255,255,.7);
}

.color-tools span{
  font-size:12px;
  margin-right:2px;
}

.color-btn{
  width:28px;
  height:28px;
  padding:0;
  border-radius:50%;
}

.custom-color{
  width:35px;
  height:28px;
  padding:0;
  border:1px solid #ccc;
}

.photo-label{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border:1px solid #ddd;
  background:#fff;
  border-radius:9px;
  padding:6px 9px;
  font-size:12px;
  cursor:pointer;
}

.photo-label input{display:none}

.feature-buttons{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:6px;
  margin-top:10px;
}

.feature-button{
  min-height:44px;
  font-size:12px;
  padding:6px 3px;
}

.feature-button.active{
  background:#f4f4f4;
  border-color:#aaa;
  font-weight:bold;
}

.feature-panel{
  display:none;
  margin-top:10px;
}

.feature-panel.show{display:block}

.background-box{
  border:1px solid #ddd;
  border-radius:14px;
  padding:10px;
  background:#fff;
}

.section-title{
  font-weight:bold;
  font-size:14px;
  margin-bottom:8px;
}

.background-buttons{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
}

.bg-btn{
  min-height:45px;
  font-size:12px;
}

.custom-bg-label{
  display:flex;
  justify-content:center;
  align-items:center;
  margin-top:7px;
  border:1px solid #ddd;
  border-radius:9px;
  padding:8px;
  font-size:12px;
  background:#fff;
  cursor:pointer;
}

.custom-bg-label input{display:none}

.stage{
  position:relative;
  width:100%;
  height:430px;
  margin-top:10px;
  overflow:hidden;
  border:1px solid #ddd;
  border-radius:16px;
  background:#fffdfd;
  touch-action:none;
}

.actor,
.accessory,
.furniture,
.gift-on-stage{
  position:absolute;
  object-fit:contain;
  user-select:none;
  touch-action:none;
}

.actor{z-index:30}
.accessory{z-index:40}
.furniture{z-index:20}

.gift-on-stage{
  z-index:35;
  pointer-events:auto;
  cursor:pointer;
}

.actor.selected,
.accessory.selected,
.furniture.selected,
.gift-on-stage.selected{
  outline:2px dashed #777;
  outline-offset:3px;
  border-radius:8px;
}

.actor.sleeping{
  animation:actorSleep 2.2s ease-in-out infinite alternate;
}

.actor.idle{
  animation:actorIdle 1.8s ease-in-out infinite alternate;
}

@keyframes actorSleep{
  from{
    transform:translateY(0) scaleY(1);
    opacity:.88;
  }
  to{
    transform:translateY(5px) scaleY(.96);
    opacity:.72;
  }
}

@keyframes actorIdle{
  from{transform:translateY(0)}
  to{transform:translateY(2px)}
}

.control-box{
  margin-top:10px;
  padding:11px;
  border:1px solid #ddd;
  border-radius:14px;
  background:#fff;
}

.control-title{
  font-weight:bold;
  margin-bottom:8px;
}

.control-row{
  display:flex;
  align-items:center;
  gap:7px;
  margin-top:7px;
}

.control-row label{
  font-size:12px;
  white-space:nowrap;
}

input[type="range"]{flex:1}

.delete-btn{
  background:#fff0f0;
  border-color:#ffd0d0;
}

.lock-btn{background:#f5f5f5}

.hidden{display:none!important}

.tool-box{
  border:1px solid #ddd;
  border-radius:14px;
  padding:10px;
  background:#fff;
}

.tool-box-title{
  font-weight:bold;
  font-size:14px;
  margin-bottom:8px;
}

.file-label{
  display:flex;
  justify-content:center;
  align-items:center;
  border:1px solid #ddd;
  border-radius:10px;
  padding:9px;
  background:#fff;
  font-size:13px;
  cursor:pointer;
}

.file-label input{display:none}

.choice-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
}

.choice-btn{
  min-height:45px;
  padding:5px;
  font-size:13px;
}

.custom-choice{margin-top:7px}

.petting-box{
  display:none;
  margin-top:10px;
  border:1px solid #ddd;
  border-radius:12px;
  padding:8px;
  background:#fafafa;
}

.petting-box.show{display:block}

.petting-title{
  font-size:13px;
  font-weight:bold;
  margin-bottom:6px;
}

.petting-stage{
  position:relative;
  width:100%;
  height:290px;
  overflow:hidden;
  border-radius:12px;
  background:#fff;
  border:1px solid #eee;
  touch-action:none;
}

.petting-actor{
  position:absolute;
  object-fit:contain;
  user-select:none;
  pointer-events:none;
  transform-origin:center center;
}

.petting-actor.petted{
  animation:petShake .32s ease-in-out infinite alternate;
}

@keyframes petShake{
  0%{transform:rotate(-5deg) translateX(-5px)}
  50%{transform:rotate(0) translateX(0)}
  100%{transform:rotate(5deg) translateX(5px)}
}

.petting-accessory{
  position:absolute;
  object-fit:contain;
  pointer-events:none;
}

.petting-status{
  position:absolute;
  left:50%;
  bottom:8px;
  transform:translateX(-50%);
  padding:5px 10px;
  border-radius:20px;
  background:rgba(255,255,255,.85);
  font-size:12px;
  z-index:100;
  pointer-events:none;
}

.pet-heart{
  position:absolute;
  right:18px;
  top:18px;
  font-size:24px;
  pointer-events:none;
  animation:petHeart .7s ease-out forwards;
  z-index:90;
}

@keyframes petHeart{
  from{
    opacity:1;
    transform:translateY(0) scale(.8);
  }
  to{
    opacity:0;
    transform:translateY(-45px) scale(1.2);
  }
}

.gift-box{
  border:1px solid #ddd;
  border-radius:12px;
  padding:9px;
  background:#fff;
}

.gift-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
}

.gift-choice{
  min-height:48px;
  font-size:13px;
}

.inventory-box{
  margin-top:9px;
  padding-top:8px;
  border-top:1px solid #eee;
}

.inventory-title{
  font-size:13px;
  font-weight:bold;
  margin-bottom:7px;
}

.inventory-list{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
}

.inventory-item{
  min-height:55px;
  padding:4px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.inventory-item img{
  width:45px;
  height:45px;
  object-fit:contain;
}

.inventory-item.held{
  outline:2px solid #aaa;
}

.inventory-empty{
  grid-column:1/-1;
  text-align:center;
  color:#999;
  font-size:12px;
  padding:10px 0;
}

.bottom-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:10px;
}

.save-btn{
  font-weight:bold;
  background:#fff;
}

.clear-btn{
  background:#fff0f0;
  border-color:#ffd0d0;
}

@media(max-width:600px){

  .feature-buttons{
    grid-template-columns:repeat(5,1fr);
  }

  .feature-button{
    font-size:11px;
  }

  .stage{
    height:380px;
  }

  .background-buttons{
    grid-template-columns:repeat(3,1fr);
  }

  .control-row{
    flex-wrap:wrap;
  }

  .control-row button{
    flex:1;
  }
}
</style>
</head>

<body>

<div class="app">

<h1>그림일기</h1>

<div class="diary-area">

<div class="title-wrap" id="titleWrap">

<input id="titleInput"
class="title-input"

<button class="color-btn"
style="background:#fff"
data-target="title"
data-color="#ffffff"></button>

<button class="color-btn"
style="background:#fff4f7"
data-target="title"
data-color="#fff4f7"></button>

<button class="color-btn"
style="background:#fff4d6"
data-target="title"
data-color="#fff4d6"></button>

<button class="color-btn"
style="background:#effff2"
data-target="title"
data-color="#effff2"></button>

<button class="color-btn"
style="background:#eef7ff"
data-target="title"
data-color="#eef7ff"></button>

<button class="color-btn"
style="background:#f5efff"
data-target="title"
data-color="#f5efff"></button>

<input type="color"
class="custom-color"
id="titleColor"
value="#ffffff">

<label class="photo-label">
🖼️ 사진
<input type="file" id="titlePhoto" accept="image/*">
</label>

</div>
</div>

<div class="diary-wrap" id="diaryWrap">

<textarea id="diaryInput"
class="diary-input"
placeholder="오늘 있었던 일을 적어보세요."></textarea>

<div class="color-tools">

<span>일기 색</span>

<button class="color-btn"
style="background:#fff"
data-target="diary"
data-color="#ffffff"></button>

<button class="color-btn"
style="background:#fff1f5"
data-target="diary"
data-color="#fff1f5"></button>

<button class="color-btn"
style="background:#fff6df"
data-target="diary"
data-color="#fff6df"></button>

<button class="color-btn"
style="background:#effff0"
data-target="diary"
data-color="#effff0"></button>

<button class="color-btn"
style="background:#eef8ff"
data-target="diary"
data-color="#eef8ff"></button>

<button class="color-btn"
style="background:#f5efff"
data-target="diary"
data-color="#f5efff"></button>

<input type="color"
class="custom-color"
id="diaryColor"
value="#ffffff">

<label class="photo-label">
🖼️ 사진
<input type="file" id="diaryPhoto" accept="image/*">
</label>

</div>
</div>

</div>

<div class="feature-buttons">

<button type="button"
class="feature-button"
data-panel="characterPanel">
👤 캐릭터
</button>

<button type="button"
class="feature-button"
data-panel="giftPanel">
🎁 선물
</button>

<button type="button"
class="feature-button"
data-panel="accessoryPanel">
🎀 악세서리
</button>

<button type="button"
class="feature-button"
data-panel="furniturePanel">
🪑 가구
</button>

<button type="button"
class="feature-button"
data-panel="backgroundPanel">
🌈 배경
</button>

</div>

<div class="feature-panel" id="characterPanel">

<div class="tool-box">

＋ 캐릭터
<input type="file"
id="characterFile"

</div>

<div class="feature-panel" id="giftPanel">

<div class="gift-grid">

class="gift-choice"

data-name="선물상자">
🎁<br>선물상자
</button>

<button type="button"
class="gift-choice"
data-emoji="🍪"
data-name="쿠키">

</button>

<button type="button"
class="gift-choice"
data-emoji="🌷"
data-name="꽃">
🌷<br>꽃
</button>

<button type="button"
class="gift-choice"
data-emoji="🧸"
data-name="인형">

</button>

<button type="button"
class="gift-choice"
data-emoji="⭐"
data-name="별">

</button>

<button type="button"
class="gift-choice"

🍎<br>사과

</div>

<label class="file-label custom-choice">
＋ 선물

id="giftFile"
accept="image/*">
</label>

<div class="inventory-box">

<div class="inventory-title">🎒 소지품</div>

<div class="inventory-list"
id="inventoryList">

<div class="inventory-empty">
아직 선물이 없어요
</div>

</div>

</div>

</div>

</div>

<div class="feature-panel" id="accessoryPanel">

<div class="tool-box">

<div class="tool-box-title">🎀 악세서리</div>

<div class="choice-grid">

<button type="button"
class="choice-btn accessory-choice"
data-emoji="🎩"
data-name="모자">
🎩<br>모자
</button>

<button type="button"
class="choice-btn accessory-choice"
data-emoji="👑"
data-name="왕관">
👑<br>왕관
</button>

<button type="button"
class="choice-btn accessory-choice"
data-emoji="🎀"
data-name="리본">
🎀<br>리본
</button>

<button type="button"
class="choice-btn accessory-choice"
data-emoji="☁️"
data-name="구름">
☁️<br>구름
</button>

<button type="button"
class="choice-btn accessory-choice"
data-emoji="🤍"

🤍<br>하트
</button>

<button type="button"
class="choice-btn accessory-choice"
data-emoji="✨"

<button type="button"
class="choice-btn furniture-choice"
data-emoji="🪴"

<button type="button"

민트

복숭아

<button type="button"

<button type="button"

max="180"

<button type="button"

class="lock-btn">
🔒 악세서리 고정

<button type="button"
id="accessoryDelete"
class="delete-btn">
악세서리 삭제
</button>

</div>

</div>

<div id="furnitureControl"
class="control-box hidden">

🪑 선택한 가구
</div>

<div class="control-row">

<label>크기</label>

<input type="range"
id="furnitureSize"
min="35"
max="250"
value="90">

</div>

<div class="control-row">

<label>각도</label>

<input type="range"
id="furnitureRotation"
min="-180"
max="180"
value="0">

</div>

<div class="control-row">

<button type="button"
id="furnitureLock"
class="lock-btn">
🔒 가구 고정
</button>

<button type="button"
id="furnitureDelete"
class="delete-btn">
가구 삭제
</button>

</div>

</div>

<div id="giftControl"
class="control-box hidden">

<div class="control-title">
🎁 선택한 선물
</div>

<div class="control-row">

<label>크기</label>

<input type="range"

/* 캐릭터 드래그 */

function setupActorDrag(actor){

  let sx=0;
  let sy=0;

  let ox=0;
  let oy=0;

  let dragging=false;
  let wasSelected=false;


  actor.element.addEventListener(
  "pointerdown",
  e=>{

    e.preventDefault();
    e.stopPropagation();

    sx=e.clientX;
    sy=e.clientY;

    ox=actor.x;
    oy=actor.y;

    dragging=false;

    wasSelected=
      selectedActor===actor;

    actor.dragging=true;

    actor.element.setPointerCapture(
      e.pointerId
    );

    if(!wasSelected){
      selectActor(actor);
    }

  });


  actor.element.addEventListener(
  "pointermove",
  e=>{

    if(
      !actor.element.hasPointerCapture(
        e.pointerId
      )
    )return;

    const dx=
      e.clientX-sx;

    const dy=
      e.clientY-sy;


    if(
      Math.abs(dx)>5||
      Math.abs(dy)>5
    ){

      dragging=true;

      if(selectedActor!==actor){

        selectedActor=actor;

        actor.element.classList.add(
          "selected"
        );

        characterStatus.textContent=
          `${actor.name||"캐릭터"} 선택됨`;

        characterSize.value=
          actor.size;

        updateCharacterButtons(
          actor
        );

        renderInventory(actor);

      }


      actor.x=ox+dx;
      actor.y=oy+dy;


      if(
        actor.moving&&
        !actor.sleeping
      ){

        scheduleActorBehavior(
          actor,
          9000,
          15000
        );

      }


      updateActorPosition(actor);

    }

  });


  actor.element.addEventListener(
  "pointerup",
  e=>{

    actor.dragging=false;

    if(
      actor.element.hasPointerCapture(
        e.pointerId
      )
    ){

      actor.element.releasePointerCapture(
        e.pointerId
      );

    }


    if(
      !dragging&&
      wasSelected&&
      selectedActor===actor
    ){

      clearSelections();

    }

  });


  actor.element.addEventListener(
  "pointercancel",
  e=>{

    actor.dragging=false;

    if(
      actor.element.hasPointerCapture(
        e.pointerId
      )
    ){

      actor.element.releasePointerCapture(
        e.pointerId
      );

    }

  });

}

/* 행동 */

function clearActorBehavior(actor){

  if(actor.behaviorTimer){

    clearTimeout(
      actor.behaviorTimer
    );

    actor.behaviorTimer=null;

  }

  actor.behaviorToken++;

  actor.jumpToken++;

  actor.element.style.transform="";

  accessories
  .filter(a=>a.owner===actor)
  .forEach(a=>{
    a.element.style.transform=
      `rotate(${a.rotation||0}deg)`;
  });

}


function scheduleActorBehavior(
  actor,
  min=7000,
  max=13000
){

  clearActorBehavior(actor);

  if(
    !actor.moving||
    actor.sleeping||
    actor.dragging
  )return;

  const token=
    actor.behaviorToken;

  actor.behaviorTimer=
    setTimeout(()=>{

      if(
        !actors.includes(actor)||
        token!==actor.behaviorToken||
        !actor.moving||
        actor.sleeping||
        actor.dragging
      ){

        if(
          actors.includes(actor)&&
          actor.moving&&
          !actor.sleeping&&
          !actor.dragging
        ){

          scheduleActorBehavior(
            actor,
            7000,
            13000
          );

        }

        return;

      }


      const actions=[
        "walk",
        "walk",
        "walk",
        "idle",
        "jump",
        "sleep"
      ];


      const action=
        actions[
          Math.floor(
            Math.random()*
            actions.length
          )
        ];


      doActorAction(
        actor,
        action
      );

    },
    min+
    Math.random()*
    (max-min)
    );

}


/*
  점프
  캐릭터와 붙어 있는 악세서리가
  같은 높이로 함께 움직임.
*/

function animateActorJump(actor){

  const token=
    ++actor.jumpToken;

  const duration=700;

  const start=
    performance.now();

  actor.element.classList.add(
    "jumping"
  );

  function frame(now){

    if(
      !actors.includes(actor)||
      token!==actor.jumpToken
    )return;


    const progress=
      Math.min(
        1,
        (now-start)/duration
      );


    /*
      0 → 위로 → 다시 원래 위치
      캐릭터와 악세서리에 동일한 값 적용
    */

    const jumpY=
      -28*
      Math.sin(
        Math.PI*progress
      );


    actor.element.style.transform=
      `translateY(${jumpY}px)`;


    accessories
    .filter(a=>a.owner===actor)
    .forEach(a=>{

      /*
        악세서리의 회전은 그대로 두고
        점프 높이만 추가
      */

      a.element.style.transform=
        `rotate(${a.rotation||0}deg) translateY(${jumpY}px)`;

    });


    if(progress<1){

      requestAnimationFrame(
        frame
      );

    }else{

      actor.element.style.transform="";

      accessories
      .filter(a=>a.owner===actor)
      .forEach(a=>{

        a.element.style.transform=
          `rotate(${a.rotation||0}deg)`;

      });

      actor.element.classList.remove(
        "jumping"
      );


      if(
        actors.includes(actor)&&
        actor.moving&&
        !actor.sleeping&&
        !actor.dragging&&
        token===actor.jumpToken
      ){

        scheduleActorBehavior(
          actor,
          9000,
          15000
        );

      }

    }

  }


  requestAnimationFrame(
    frame
  );

}


function doActorAction(
  actor,
  action
){

  if(
    !actor.moving||
    actor.dragging||
    actor.sleeping
  )return;


  actor.element.classList.remove(
    "sleeping",
    "idle"
  );


  if(action==="walk"){

    actor.element.style.transform="";

    accessories
    .filter(a=>a.owner===actor)
    .forEach(a=>{
      a.element.style.transform=
        `rotate(${a.rotation||0}deg)`;
    });

    scheduleActorBehavior(
      actor,
      9000,
      15000
    );

    return;

  }


  if(action==="idle"){

    actor.element.style.transform="";

    accessories
    .filter(a=>a.owner===actor)
    .forEach(a=>{
      a.element.style.transform=
        `rotate(${a.rotation||0}deg)`;
    });

    actor.element.classList.add(
      "idle"
    );


    setTimeout(()=>{

      if(
        actors.includes(actor)&&
        actor.moving&&
        !actor.sleeping&&
        !actor.dragging
      ){

        actor.element.classList.remove(
          "idle"
        );

        scheduleActorBehavior(
          actor,
          8000,
          14000
        );

      }

    },
    3000+
    Math.random()*2500
    );

    return;

  }


  if(action==="jump"){

    actor.element.classList.remove(
      "idle"
    );

    animateActorJump(actor);

    return;

  }


  if(action==="sleep"){

    actor.element.style.transform="";

    accessories
    .filter(a=>a.owner===actor)
    .forEach(a=>{
      a.element.style.transform=
        `rotate(${a.rotation||0}deg)`;
    });

    actor.sleeping=true;
    actor.moving=false;

    actor.element.classList.remove(
      "idle",
      "jumping"
    );

    actor.element.classList.add(
      "sleeping"
    );


    if(selectedActor===actor){

      characterMoveButton.textContent=
        "💤 자는 중";

      wakeButton.classList.remove(
        "hidden"
      );

    }

  }

}


function startActorBehavior(actor){

  actor.moving=true;
  actor.sleeping=false;

  actor.element.classList.remove(
    "sleeping",
    "jumping",
    "idle"
  );

  actor.element.style.transform="";

  updateCharacterButtons(actor);

  scheduleActorBehavior(
    actor,
    7000,
    12000
  );

}


function stopActor(actor){

  actor.moving=false;
  actor.sleeping=false;

  clearActorBehavior(actor);

  actor.element.classList.remove(
    "sleeping",
    "jumping",
    "idle"
  );

  updateCharacterButtons(actor);

}


function resumeActor(actor){

  actor.moving=true;
  actor.sleeping=false;

  actor.element.classList.remove(
    "sleeping",
    "jumping",
    "idle"
  );

  actor.element.style.transform="";

  accessories
  .filter(a=>a.owner===actor)
  .forEach(a=>{
    a.element.style.transform=
      `rotate(${a.rotation||0}deg)`;
  });

  updateCharacterButtons(actor);

  scheduleActorBehavior(
    actor,
    6000,
    10000
  );

}


function wakeActor(actor){

  if(!actor.sleeping)return;

  actor.sleeping=false;
  actor.moving=true;

  actor.element.classList.remove(
    "sleeping"
  );

  actor.element.style.transform="";

  accessories
  .filter(a=>a.owner===actor)
  .forEach(a=>{
    a.element.style.transform=
      `rotate(${a.rotation||0}deg)`;
  });

  updateCharacterButtons(actor);

  scheduleActorBehavior(
    actor,
    5000,
    9000
  );

}


characterMoveButton.addEventListener(
"click",
()=>{

  if(!selectedActor){

    alert(
      "먼저 캐릭터를 선택해주세요."
    );

    return;

  }


  if(selectedActor.sleeping){

    wakeActor(
      selectedActor
    );

    return;

  }


  if(selectedActor.moving){

    stopActor(
      selectedActor
    );

  }else{

    resumeActor(
      selectedActor
    );

/* 자동 움직임 */

function animateActors(){

  actors.forEach(actor=>{

    if(
      !actor.moving||
      actor.dragging||
      actor.sleeping
    )return;


    actor.x+=actor.vx;


    if(
      actor.x<0||
      actor.x+actor.size>
      stage.clientWidth
    ){

      actor.vx*=-1;

      actor.x=Math.max(
        0,
        Math.min(
          actor.x,
          stage.clientWidth-
          actor.size
        )
      );

    }


    actor.y+=
      Math.sin(
        Date.now()/700+
        actor.id
      )*.12;


    updateActorPosition(
      actor
    );

  });


  requestAnimationFrame(
    animateActors
  );

}

function renderPettingView(actor){

  if(!actor)return;

  stopPetting();


  pettingStage
  .querySelectorAll(
    ".petting-actor,"+
    ".petting-accessory,"+
    ".pet-heart"
  )
  .forEach(el=>
    el.remove()
  );


  const stageW=
    pettingStage.clientWidth;

  const stageH=
    pettingStage.clientHeight;


  const iw=
    actor.original?.naturalWidth||
    actor.element.naturalWidth||
    1;

  const ih=
    actor.original?.naturalHeight||
    actor.element.naturalHeight||
    1;


  let targetW=
    stageW*.82;

  let targetH=
    targetW*ih/iw;


  if(targetH>stageH*.82){

    targetH=
      stageH*.82;

    targetW=
      targetH*iw/ih;

  }


  const left=
    (stageW-targetW)/2;

  const top=
    (stageH-targetH)/2-5;


  const img=new Image();

  img.src=actor.src;

  img.className=
    "petting-actor";

  img.style.width=
    targetW+"px";

  img.style.height=
    targetH+"px";

  img.style.left=
    left+"px";

  img.style.top=
    top+"px";


  pettingStage.appendChild(img);


  const factor=
    targetW/actor.size;


  accessories
  .filter(a=>a.owner===actor)
  .forEach(a=>{

    const acc=
      new Image();

    acc.src=a.src;

    acc.className=
      "petting-accessory";

    acc.style.width=
      a.size*factor+"px";

    acc.style.height=
      a.size*factor+"px";

    acc.style.left=
      left+
      a.relativeX*factor+
      "px";

    acc.style.top=
      top+
      a.relativeY*factor+
      "px";

    acc.style.transform=
      `rotate(${a.rotation||0}deg)`;


    pettingStage.appendChild(acc);

  });

}


let pettingActive=false;
let pettingTimer=null;
let petPointerId=null;


function petOnce(){

  if(!selectedActor)return;


  const actor=
    pettingStage.querySelector(
      ".petting-actor"
    );

  if(!actor)return;


  actor.classList.add(
    "petted"
  );

  pettingStatus.textContent=
    "쓰담쓰담… 💕";


  selectedActor.petCount++;


  const heart=
    document.createElement(
      "div"
    );

  heart.className=
    "pet-heart";

  heart.textContent="♡";


  const offset=
    Math.random()*45;


  heart.style.right=
    (18+offset)+"px";

  heart.style.top=
    (18+Math.random()*15)+"px";


  pettingStage.appendChild(
    heart
  );


  setTimeout(()=>{
    heart.remove();
  },700);

}


function startPetting(e){

  if(!selectedActor)return;

  petPointerId=
    e.pointerId;

  pettingActive=true;

  pettingStage.setPointerCapture(
    e.pointerId
  );

  petOnce();


  if(pettingTimer)
    clearInterval(
      pettingTimer
    );


  pettingTimer=
    setInterval(()=>{

      if(
        !pettingActive||
        !selectedActor
      )return;


      petOnce();

    },180);

}


function stopPetting(){

  pettingActive=false;


  if(pettingTimer){

    clearInterval(
      pettingTimer
    );

    pettingTimer=null;

  }


  if(
    petPointerId!==null&&
    pettingStage.hasPointerCapture(
      petPointerId
    )
  ){

    pettingStage.releasePointerCapture(
      petPointerId
    );

  }


  petPointerId=null;


  const actor=
    pettingStage.querySelector(
      ".petting-actor"
    );


  if(actor)
    actor.classList.remove(
      "petted"
    );


  pettingStatus.textContent=
    "캐릭터를 쓰다듬어보세요.";

}

});


pettingStage.addEventListener(

e=>{

  e.preventDefault();

  stopPetting();

});

});

    gift.element.remove();

    gift.element=null;

  gift.element=

  gift.held=true;

function loadImage(src){

  resolve=>{

    const img=
      new Image();

    img.onload=()=>{
      resolve(img);

    img.onerror=()=>{
      resolve(null);

  );

}

function getKoreanDateTime(){

  const now=
    new Date();

  const weekdays=[
    "일요일",
    "월요일",
    "화요일",
    "수요일",
    "목요일",
    "금요일",
    "토요일"
  ];


  const year=
    now.getFullYear();

  const month=
    now.getMonth()+1;

  const date=
    now.getDate();

  const weekday=
    weekdays[now.getDay()];


  const hour=
    String(
      now.getHours()
    ).padStart(2,"0");

  const minute=
    String(
      now.getMinutes()
    ).padStart(2,"0");


  return {
    text:
      `${year}년 ${month}월 ${date}일 ${weekday} ${hour}:${minute}`,

    year,
    month,
    date,
    weekday,
    hour,
    minute
  };

}


/* 저장 */

document
.getElementById("saveButton")
.addEventListener(
"click",
async()=>{

  const saveButton=
    document.getElementById(
      "saveButton"
    );


  saveButton.disabled=true;
  saveButton.textContent=
    "저장 중…";


  try{

    const dateInfo=
      getKoreanDateTime();


    const scale=3;

    const stageW=
      stage.clientWidth;

    const stageH=
      stage.clientHeight;

    const padding=30;

    const titleH=70;

    const diaryH=
      Math.max(
        170,
        diaryInput.scrollHeight+30
      );


    const dateH=34;


    const canvas=
      document.createElement(
        "canvas"
      );


    canvas.width=
      (stageW+padding*2)*scale;


    canvas.height=
      (
        padding+
        titleH+
        diaryH+
        stageH+
        dateH+
        padding
      )*scale;


    const ctx=
      canvas.getContext(
        "2d"
      );


    ctx.imageSmoothingEnabled=true;


    /* 전체 */

    ctx.fillStyle="#fff";

    ctx.fillRect(
      0,
      0,
      canvas.width,
      canvas.height
    );


    /* 제목 */

    if(titlePhotoImage){

      const img=
        await loadImage(
          titlePhotoImage
        );


      if(img){

        drawCoverImage(
          ctx,
          img,
          padding*scale,
          padding*scale,
          stageW*scale,
          titleH*scale
        );

      }

    }else{

      ctx.fillStyle=
        getComputedStyle(
          titleWrap
        ).backgroundColor||
        "#fff";


      ctx.fillRect(
        padding*scale,
        padding*scale,
        stageW*scale,
        titleH*scale
      );

    }


    ctx.fillStyle="#222";

    ctx.font=
      `bold ${20*scale}px sans-serif`;

    ctx.textBaseline="middle";


    ctx.fillText(
      titleInput.value||
      "오늘의 제목",

      (padding+15)*scale,

      (padding+
      titleH/2)*scale
    );


    /* 일기 */

    const diaryY=
      padding+
      titleH+
      10;


    if(diaryPhotoImage){

      const img=
        await loadImage(
          diaryPhotoImage
        );


      if(img){

        drawCoverImage(
          ctx,
          img,
          padding*scale,
          diaryY*scale,
          stageW*scale,
          diaryH*scale
        );

      }

    }else{

      ctx.fillStyle=
        getComputedStyle(
          diaryWrap
        ).backgroundColor||
        "#fff";


      ctx.fillRect(
        padding*scale,
        diaryY*scale,
        stageW*scale,
        diaryH*scale
      );

    }


    ctx.fillStyle="#222";

    ctx.font=
      `${17*scale}px sans-serif`;


    const text=
      diaryInput.value||"";


    const maxWidth=
      (stageW-30)*scale;


    let line="";

    let y=
      (diaryY+28)*scale;


    const lineHeight=
      29*scale;


    for(const ch of text){

      const test=
        line+ch;


      if(
        ctx.measureText(test).width>
        maxWidth&&
        line
      ){

        ctx.fillText(
          line,
          (padding+15)*scale,
          y
        );

        line=ch;

        y+=lineHeight;

      }else{

        line=test;

      }

    }


    if(line){

      ctx.fillText(
        line,
        (padding+15)*scale,
        y
      );

    }


    /* 무대 */

    const stageY=
      diaryY+
      diaryH+
      10;


    if(customBackgroundImage){

      const bg=
        await loadImage(
          customBackgroundImage
        );


      if(bg){

        drawCoverImage(
          ctx,
          bg,
          padding*scale,
          stageY*scale,
          stageW*scale,
          stageH*scale
        );

      }

    }else{

      drawStageBackground(
        ctx,
        currentBackground,
        padding*scale,
        stageY*scale,
        stageW*scale,
        stageH*scale
      );

    }


    /* 가구 */

    for(const f of furnitures){

      const img=
        await loadImage(
          f.src
        );


      if(!img)continue;


      drawRotatedContain(
        ctx,
        img,
        (padding+f.x)*scale,
        (stageY+f.y)*scale,
        f.size*scale,
        f.size*scale,
        f.rotation||0
      );

    }


    /* 캐릭터 */

    for(const actor of actors){

      const img=
        await loadImage(
          actor.src
        );


      if(!img)continue;


      const iw=
        img.naturalWidth||
        img.width||
        1;


      const ih=
        img.naturalHeight||
        img.height||
        1;


      const drawW=
        actor.size;


      const drawH=
        drawW*ih/iw;


      ctx.drawImage(
        img,

        (padding+actor.x)*scale,

        (
          stageY+
          actor.y+
          (actor.size-drawH)/2
        )*scale,

        drawW*scale,
        drawH*scale
      );

    }


    /* 악세서리 */

    for(const a of accessories){

      const img=
        await loadImage(
          a.src
        );


      if(!img)continue;


      drawRotatedContain(
        ctx,
        img,
        (padding+a.x)*scale,
        (stageY+a.y)*scale,
        a.size*scale,
        a.size*scale,
        a.rotation||0
      );

    }


    /* 선물 */

    for(const actor of actors){

      for(
        const gift of actor.inventory
      ){

        if(!gift.onStage)continue;


        const img=
          await loadImage(
            gift.src
          );


        if(!img)continue;


        drawRotatedContain(
          ctx,
          img,
          (padding+gift.x)*scale,
          (stageY+gift.y)*scale,
          gift.size*scale,
          gift.size*scale,
          gift.rotation||0
        );

      }

    }


    /* 날짜 / 요일 / 시간 */

    const dateY=
      stageY+
      stageH+
      21;


    ctx.fillStyle="#888";

    ctx.font=
      `${11*scale}px sans-serif`;

    ctx.textAlign="center";
    ctx.textBaseline="middle";


    ctx.fillText(
      dateInfo.text,
      canvas.width/2,
      dateY*scale
    );


    ctx.textAlign="left";


    const blob=
      await new Promise(resolve=>{
        canvas.toBlob(
          resolve,
          "image/png"
        );
      });


    if(!blob){
      throw new Error(
        "이미지를 만들 수 없습니다."
      );
    }


    const file=
      new File(
        [blob],
        `그림일기_${dateInfo.year}-${String(dateInfo.month).padStart(2,"0")}-${String(dateInfo.date).padStart(2,"0")}.png`,
        {
          type:"image/png"
        }
      );


    if(
      navigator.share&&
      navigator.canShare&&
      navigator.canShare({
        files:[file]
      })
    ){

      await navigator.share({
        files:[file],
        title:"그림일기",
        text:"그림일기 저장"
      });

    }else{

      const link=
        document.createElement("a");

      link.download=
        file.name;

      link.href=
        URL.createObjectURL(blob);

      document.body.appendChild(link);

      link.click();

      link.remove();

      setTimeout(()=>{
        URL.revokeObjectURL(
          link.href
        );
      },1000);

    }

  }catch(error){

    if(
      error.name!=="AbortError"
    ){

      console.error(error);

      alert(
        "저장하는 중 문제가 생겼어요."
      );

    }

  }finally{

    saveButton.disabled=false;

    saveButton.textContent=
      "저장";

  }

});


/* 저장용 배경 */

function drawStageBackground(
  ctx,
  type,
  x,
  y,
  w,
  h
){

  if(type==="plain"){

    ctx.fillStyle="#fffdfd";

    ctx.fillRect(
      x,y,w,h
    );

    return;

  }


  const colors={

    pink:[
      "#ffeef4",
      "#fff8fa"
    ],

    yellow:[
      "#fff7c7",
      "#fffdf0"
    ],

    blue:[
      "#e5f5ff",
      "#ffffff"
    ],

    green:[
      "#eaf8e4",
      "#ffffff"
    ],

    purple:[
      "#f1eaff",
      "#ffffff"
    ],

    peach:[
      "#ffebdf",
      "#ffffff"
    ],

    night:[
      "#dfe3f4",
      "#f7f8ff"
    ]

  };


  const pair=
    colors[type]||
    [
      "#fffdfd",
      "#fffdfd"
    ];


  const gradient=
    ctx.createLinearGradient(
      0,
      y,
      0,
      y+h
    );


  gradient.addColorStop(
    0,
    pair[0]
  );

  gradient.addColorStop(
    1,
    pair[1]
  );


  ctx.fillStyle=
    gradient;


  ctx.fillRect(
    x,
    y,
    w,
    h
  );

}


function drawCoverImage(
  ctx,
  img,
  x,
  y,
  w,
  h
){

  const iw=
    img.naturalWidth||
    img.width;

  const ih=
    img.naturalHeight||
    img.height;


  const s=
    Math.max(
      w/iw,
      h/ih
    );


  const nw=
    iw*s;

  const nh=
    ih*s;


  ctx.drawImage(
    img,
    x+(w-nw)/2,
    y+(h-nh)/2,
    nw,
    nh
  );

}


function drawContain(
  ctx,
  img,
  x,
  y,
  w,
  h
){

  const iw=
    img.naturalWidth||
    img.width;

  const ih=
    img.naturalHeight||
    img.height;


  const s=
    Math.min(
      w/iw,
      h/ih
    );


  const nw=
    iw*s;

  const nh=
    ih*s;


  ctx.drawImage(
    img,
    x+(w-nw)/2,
    y+(h-nh)/2,
    nw,
    nh
  );

}


function drawRotatedContain(
  ctx,
  img,
  x,
  y,
  w,
  h,
  angle
){

  ctx.save();


  ctx.translate(
    x+w/2,
    y+h/2
  );


  ctx.rotate(
    angle*Math.PI/180
  );


  drawContain(
    ctx,
    img,
    -w/2,
    -h/2,
    w,
    h
  );


  ctx.restore();

}
