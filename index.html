<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
viewport-fit=cover">

<meta name="apple-mobile-web-app-capable"
content="yes">

<meta name="apple-mobile-web-app-status-bar-style"
content="default">

<title>그림일기</title>

<style>

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  background: #fff;
  color: #111;

  font-family:
  -apple-system,
  BlinkMacSystemFont,
  "Apple SD Gothic Neo",
  "Noto Sans KR",
  sans-serif;
}


/* =========================
   날짜
========================= */

header {
  padding: 18px 16px 10px;
}

.date {
  font-size: 13px;
  color: #777;
}


/* =========================
   전체
========================= */

.container {
  padding: 0 16px 35px;
}


/* =========================
   제목
========================= */

input[type="text"] {

  width: 100%;

  border: 1px solid #ddd;

  border-radius: 12px;

  padding: 12px;

  font-size: 16px;

  outline: none;

  background: #fff;
}


/* =========================
   일기
========================= */

textarea {

  width: 100%;

  min-height: 180px;

  margin-top: 10px;

  border: 1px solid #ddd;

  border-radius: 12px;

  padding: 14px;

  font-size: 16px;

  line-height: 1.6;

  outline: none;

  resize: vertical;

  background: #fff;
}


/* =========================
   캐릭터 공간
========================= */

.stage {

  position: relative;

  width: 100%;

  height: 380px;

  margin: 15px 0;

  border: 1px solid #ddd;

  border-radius: 18px;

  overflow: hidden;

  background: #fafafa;

  touch-action: none;
}


/* =========================
   캐릭터
========================= */

.actor {

  position: absolute;

  width: 90px;
  height: 90px;

  object-fit: contain;

  user-select: none;

  -webkit-user-select: none;

  touch-action: none;

  cursor: grab;

  transition:
    opacity 0.25s ease;
}


/* 드래그 중 */

.actor.dragging {

  cursor: grabbing;

  transition: none;

}


/* 선택 */

.actor.selected {

  outline:
  2px dashed #777;

  outline-offset: 4px;

  border-radius: 12px;
}


/* 졸기 */

.actor.sleeping {

  opacity: 0.65;

}


/* 뛰기 */

.actor.running {

  opacity: 1;

}


/* 같이 있는 상태 */

.actor.together {

  opacity: 0.9;

}


/* =========================
   상태
========================= */

.status {

  position: absolute;

  left: 50%;

  bottom: 8px;

  transform:
  translateX(-50%);

  font-size: 12px;

  color: #777;

  pointer-events: none;

  white-space: nowrap;
}


/* =========================
   캐릭터 추가
========================= */

.add-area {

  margin: 12px 0 18px;
}


.photo-button {

  display: block;

  width: 100%;

  padding: 12px 16px;

  border: 1px solid #ddd;

  border-radius: 12px;

  background: #fff;

  color: #111;

  font-size: 15px;

  text-align: center;

  cursor: pointer;
}


#photo {
  display: none;
}


/* =========================
   버튼
========================= */

button {

  width: 100%;

  border: 1px solid #ddd;

  background: #fff;

  color: #111;

  border-radius: 12px;

  padding: 13px 16px;

  font-size: 15px;

  margin-top: 10px;
}


/* =========================
   캐릭터 제어
========================= */

.control-box {

  display: none;

  margin-top: 10px;

  padding: 10px;

  border: 1px solid #ddd;

  border-radius: 12px;

  background: #fafafa;
}


.control-box.show {
  display: block;
}


.control-title {

  font-size: 13px;

  color: #666;

  margin-bottom: 5px;
}


/* =========================
   안내
========================= */

.help {

  margin-top: 8px;

  text-align: center;

  font-size: 12px;

  color: #888;
}

</style>
</head>


<body>


<header>

<div
class="date"
id="date">
</div>

</header>


<div class="container">


<!-- 제목 -->

<input
type="text"
id="title"
placeholder="오늘의 제목">


<!-- 일기 -->

<textarea
id="diary"
placeholder="오늘의 일기를 써보세요.">
</textarea>


<!-- 캐릭터 공간 -->

<div
class="stage"
id="stage">

<div
class="status"
id="status">

캐릭터를 추가해보세요

</div>

</div>


<!-- 캐릭터 추가 -->

<div class="add-area">

<label
class="photo-button"
for="photo">

＋ 캐릭터 추가

</label>

<input
id="photo"
type="file"
accept="image/*">

</div>


<!-- 선택 캐릭터 제어 -->

<div
class="control-box"
id="controlBox">

<div class="control-title">

선택한 캐릭터

</div>


<button
id="pauseButton">

⏸ 이 캐릭터 멈추기

</button>


<button
id="resumeButton">

▶ 다시 움직이기

</button>

</div>


<div class="help">

캐릭터를 손가락으로 끌어서 원하는 곳에 놓을 수 있어요.

</div>


<!-- 기존 저장 버튼 삭제 -->
<!-- 갤러리에 저장 기능을 저장 버튼으로 통합 -->

<button
id="gallerySave">

저장

</button>


</div>



<script>


/* =================================================
   날짜
================================================= */

const dateElement =
document.getElementById("date");


const now =
new Date();


dateElement.textContent =
now.getFullYear() +
"년 " +
(now.getMonth() + 1) +
"월 " +
now.getDate() +
"일";



/* =================================================
   일기
================================================= */

const titleInput =
document.getElementById("title");


const diaryInput =
document.getElementById("diary");


titleInput.value =
localStorage.getItem(
"diary-title"
) || "";


diaryInput.value =
localStorage.getItem(
"diary-text"
) || "";



/* =================================================
   요소
================================================= */

const photoInput =
document.getElementById("photo");


const stage =
document.getElementById("stage");


const status =
document.getElementById("status");


const controlBox =
document.getElementById("controlBox");


const pauseButton =
document.getElementById("pauseButton");


const resumeButton =
document.getElementById("resumeButton");


/*
   캐릭터 배열
*/

const actors = [];


/*
   현재 선택
*/

let selectedActor = null;



/* =================================================
   캐릭터 추가
================================================= */

photoInput.addEventListener(
"change",
function(event) {

const file =
event.target.files[0];


if (!file) {
return;
}


const reader =
new FileReader();


reader.onload =
function(e) {


const img =
document.createElement("img");


img.className =
"actor";


img.src =
e.target.result;


/*
   캐릭터 크기
*/

img.style.width =
"90px";

img.style.height =
"90px";


/*
   랜덤 시작 위치
*/

const startX =
Math.random() *
Math.max(
0,
stage.clientWidth - 90
);


const startY =
Math.random() *
Math.max(
0,
stage.clientHeight - 90
);


img.style.left =
startX + "px";


img.style.top =
startY + "px";


/*
   성격
*/

const personality =
createPersonality();


const actor = {

element: img,

x: startX,

y: startY,

targetX: startX,

targetY: startY,

speed:
personality.speed,

runSpeed:
personality.runSpeed,

sleepChance:
personality.sleepChance,

runChance:
personality.runChance,

state:
"idle",

paused:
false,

dragging:
false,

nextAction:
Date.now() +
1000 +
Math.random() * 2500,

partner:
null,

togetherUntil:
0

};


actors.push(actor);


stage.appendChild(img);


/*
   손가락 드래그
*/

enableDragging(actor);


/*
   첫 행동
*/

chooseNewAction(actor);

updateStatus();

};


reader.readAsDataURL(file);


/*
   같은 파일 다시 선택 가능
*/

photoInput.value = "";

});



/* =================================================
   캐릭터 성격
================================================= */

function createPersonality() {

const types = [

/* 느긋 */

{
speed:
0.5 +
Math.random() * 0.4,

runSpeed:
1.1 +
Math.random() * 0.4,

sleepChance:
0.35,

runChance:
0.10
},


/* 활발 */

{
speed:
0.8 +
Math.random() * 0.5,

runSpeed:
1.8 +
Math.random() * 0.7,

sleepChance:
0.12,

runChance:
0.45
},


/* 잠꾸러기 */

{
speed:
0.55 +
Math.random() * 0.35,

runSpeed:
1.2 +
Math.random() * 0.4,

sleepChance:
0.55,

runChance:
0.08
},


/* 분주 */

{
speed:
0.9 +
Math.random() * 0.5,

runSpeed:
2.0 +
Math.random() * 0.8,

sleepChance:
0.15,

runChance:
0.40
}

];


return types[
Math.floor(
Math.random() *
types.length
)
];

}



/* =================================================
   드래그 기능
================================================= */

function enableDragging(actor) {


const element =
actor.element;


let pointerOffsetX = 0;

let pointerOffsetY = 0;


/*
   손가락을 누름
*/

element.addEventListener(
"pointerdown",
function(e) {

e.preventDefault();

e.stopPropagation();


/*
   선택
*/

selectActor(actor);


/*
   드래그 상태
*/

actor.dragging =
true;


element.classList
.add("dragging");


/*
   브라우저가 포인터를
   계속 이 캐릭터에게 전달하도록 함
*/

try {

element.setPointerCapture(
e.pointerId
);

} catch(error) {}


/*
   손가락이 캐릭터의
   어느 위치를 눌렀는지 계산
*/

const rect =
stage.getBoundingClientRect();


const actorLeft =
actor.x;


const actorTop =
actor.y;


const pointerX =
e.clientX -
rect.left;


const pointerY =
e.clientY -
rect.top;


pointerOffsetX =
pointerX -
actorLeft;


pointerOffsetY =
pointerY -
actorTop;


/*
   드래그하는 동안
   자동 이동 목표를 현재 위치로 고정
*/

actor.targetX =
actor.x;

actor.targetY =
actor.y;


/*
   같이 있던 상태 해제
*/

if (actor.partner) {

actor.partner.partner =
null;

actor.partner = null;

}

});



/*
   손가락 이동
*/

element.addEventListener(
"pointermove",
function(e) {

if (!actor.dragging) {
return;
}


e.preventDefault();


const rect =
stage.getBoundingClientRect();


/*
   스테이지 기준 좌표
*/

let newX =
e.clientX -
rect.left -
pointerOffsetX;


let newY =
e.clientY -
rect.top -
pointerOffsetY;


/*
   화면 밖 방지
*/

const maxX =
Math.max(
0,
stage.clientWidth -
element.offsetWidth
);


const maxY =
Math.max(
0,
stage.clientHeight -
element.offsetHeight
);


newX =
Math.max(
0,
Math.min(
newX,
maxX
)
);


newY =
Math.max(
0,
Math.min(
newY,
maxY
)
);


/*
   실제 위치
*/

actor.x =
newX;

actor.y =
newY;

actor.targetX =
newX;

actor.targetY =
newY;


element.style.left =
newX + "px";

element.style.top =
newY + "px";

});



/*
   손가락 놓기
*/

element.addEventListener(
"pointerup",
function(e) {

finishDragging(
actor,
e
);

});


/*
   손가락이 화면 밖으로 나감
*/

element.addEventListener(
"pointercancel",
function(e) {

finishDragging(
actor,
e
);

});

}



/* =================================================
   드래그 종료
================================================= */

function finishDragging(
actor,
e
) {

if (!actor.dragging) {
return;
}


actor.dragging =
false;


actor.element.classList
.remove("dragging");


try {

actor.element.releasePointerCapture(
e.pointerId
);

} catch(error) {}


/*
   손으로 옮긴 위치에서
   새로운 목적지를 정함
*/

if (!actor.paused) {

actor.nextAction =
Date.now() +
500 +
Math.random() * 1200;

}


/*
   다시 행동
*/

if (!actor.paused) {

chooseNewAction(actor);

}


updateStatus();

}



/* =================================================
   캐릭터 선택
================================================= */

function selectActor(actor) {


if (selectedActor) {

selectedActor.element
.classList
.remove("selected");

}


/*
   같은 캐릭터를 다시 누르면
   선택 해제
*/

if (selectedActor === actor) {

selectedActor =
null;

controlBox
.classList
.remove("show");

updateStatus();

return;

}


selectedActor =
actor;


actor.element
.classList
.add("selected");


controlBox
.classList
.add("show");


updateStatus();

}



/* =================================================
   멈추기
================================================= */

pauseButton.addEventListener(
"click",
function() {

if (!selectedActor) {
return;
}


selectedActor.paused =
true;


selectedActor.dragging =
false;


selectedActor.state =
"paused";


selectedActor.targetX =
selectedActor.x;


selectedActor.targetY =
selectedActor.y;


selectedActor.element
.classList
.remove("running");

selectedActor.element
.classList
.remove("sleeping");


updateStatus();

});



/* =================================================
   다시 움직이기
================================================= */

resumeButton.addEventListener(
"click",
function() {

if (!selectedActor) {
return;
}


selectedActor.paused =
false;


chooseNewAction(
selectedActor
);


updateStatus();

});



/* =================================================
   행동 선택
================================================= */

function chooseNewAction(actor) {

if (
actor.paused ||
actor.dragging
) {
return;
}


/*
   다른 캐릭터와 함께 있는 중
*/

if (
actor.partner &&
Date.now() <
actor.togetherUntil
) {

return;

}


const random =
Math.random();


if (
random <
actor.sleepChance
) {

sleep(actor);

}

else if (
random <
actor.sleepChance +
actor.runChance
) {

run(actor);

}

else {

walk(actor);

}

}



/* =================================================
   졸기
================================================= */

function sleep(actor) {

if (
actor.paused ||
actor.dragging
) {
return;
}


actor.state =
"sleeping";


actor.element.classList
.add("sleeping");


actor.element.classList
.remove("running");


actor.targetX =
actor.x;

actor.targetY =
actor.y;


/*
   2~6초
*/

actor.nextAction =
Date.now() +
2000 +
Math.random() * 4000;

}



/* =================================================
   걷기
================================================= */

function walk(actor) {

if (
actor.paused ||
actor.dragging
) {
return;
}


actor.state =
"walking";


actor.element.classList
.remove("sleeping");


actor.element.classList
.remove("running");


setRandomTarget(actor);


/*
   2.5~6초
*/

actor.nextAction =
Date.now() +
2500 +
Math.random() * 3500;

}



/* =================================================
   뛰기
================================================= */

function run(actor) {

if (
actor.paused ||
actor.dragging
) {
return;
}


actor.state =
"running";


actor.element.classList
.remove("sleeping");


actor.element.classList
.add("running");


setRandomTarget(actor);


/*
   1.5~3.7초
*/

actor.nextAction =
Date.now() +
1500 +
Math.random() * 2200;

}



/* =================================================
   랜덤 목적지
================================================= */

function setRandomTarget(actor) {

const maxX =
Math.max(
0,
stage.clientWidth -
actor.element.offsetWidth
);


const maxY =
Math.max(
0,
stage.clientHeight -
actor.element.offsetHeight
);


actor.targetX =
Math.random() *
maxX;


actor.targetY =
Math.random() *
maxY;

}



/* =================================================
   캐릭터 이동
================================================= */

function updateActors() {

const currentTime =
Date.now();


for (
const actor of actors
) {


/*
   멈춤
*/

if (
actor.paused
) {
continue;
}


/*
   직접 드래그 중
*/

if (
actor.dragging
) {
continue;
}


/*
   상호작용 중
*/

if (
actor.partner &&
currentTime <
actor.togetherUntil
) {

continue;

}


/*
   상호작용 종료
*/

if (
actor.partner &&
currentTime >=
actor.togetherUntil
) {

const partner =
actor.partner;


actor.partner =
null;


if (
partner.partner ===
actor
) {

partner.partner =
null;

}


actor.element.classList
.remove("together");

}


/*
   다음 행동
*/

if (
currentTime >=
actor.nextAction
) {

chooseNewAction(actor);

}


/*
   졸기
*/

if (
actor.state ===
"sleeping"
) {

continue;

}


/*
   이동 계산
*/

const dx =
actor.targetX -
actor.x;


const dy =
actor.targetY -
actor.y;


const distance =
Math.sqrt(
dx * dx +
dy * dy
);


if (
distance < 1
) {

continue;

}


/*
   속도
*/

let speed =
actor.speed;


if (
actor.state ===
"running"
) {

speed =
actor.runSpeed;

}


/*
   너무 크게 이동하지 않음
*/

const step =
Math.min(
speed,
distance
);


actor.x +=
(dx / distance) *
step;


actor.y +=
(dy / distance) *
step;


/*
   화면 안에 고정
*/

const maxX =
Math.max(
0,
stage.clientWidth -
actor.element.offsetWidth
);


const maxY =
Math.max(
0,
stage.clientHeight -
actor.element.offsetHeight
);


actor.x =
Math.max(
0,
Math.min(
actor.x,
maxX
)
);


actor.y =
Math.max(
0,
Math.min(
actor.y,
maxY
)
);


/*
   위치 적용
*/

actor.element.style.left =
actor.x + "px";


actor.element.style.top =
actor.y + "px";

}


/*
   캐릭터 상호작용
*/

checkInteractions();


requestAnimationFrame(
updateActors
);

}



/* =================================================
   캐릭터끼리 만남
================================================= */

function checkInteractions() {

if (
actors.length < 2
) {
return;
}


const currentTime =
Date.now();


for (
let i = 0;
i < actors.length;
i++
) {

const a =
actors[i];


if (
a.paused ||
a.dragging ||
a.partner
) {
continue;
}


for (
let j = i + 1;
j < actors.length;
j++
) {

const b =
actors[j];


if (
b.paused ||
b.dragging ||
b.partner
) {
continue;
}


const dx =
a.x - b.x;


const dy =
a.y - b.y;


const distance =
Math.sqrt(
dx * dx +
dy * dy
);


/*
   너무 가까워졌을 때
*/

if (
distance < 65
) {


/*
   낮은 확률로 상호작용
*/

if (
Math.random() <
0.015
) {

startInteraction(
a,
b,
currentTime
);

}


}

}

}

}



/* =================================================
   상호작용
================================================= */

function startInteraction(
a,
b,
currentTime
) {

a.partner =
b;

b.partner =
a;


/*
   2~4초
*/

const duration =
2500 +
Math.random() *
2000;


a.togetherUntil =
currentTime +
duration;


b.togetherUntil =
currentTime +
duration;


a.state =
"idle";


b.state =
"idle";


a.targetX =
a.x;

a.targetY =
a.y;


b.targetX =
b.x;

b.targetY =
b.y;


a.element.classList
.add("together");


b.element.classList
.add("together");

}



/* =================================================
   상태
================================================= */

function updateStatus() {

if (
actors.length === 0
) {

status.textContent =
"캐릭터를 추가해보세요";

return;

}


if (
selectedActor
) {

if (
selectedActor.paused
) {

status.textContent =
"선택한 캐릭터가 멈춰 있어요";

}

else if (
selectedActor.dragging
) {

status.textContent =
"캐릭터를 움직이고 있어요";

}

else if (
selectedActor.partner
) {

status.textContent =
"다른 캐릭터와 함께 있어요";

}

else {

status.textContent =
"선택한 캐릭터 · " +
getStateText(
selectedActor.state
);

}

return;

}


status.textContent =
"캐릭터들이 자유롭게 움직이고 있어요";

}



/* =================================================
   상태 이름
================================================= */

function getStateText(state) {

switch(state) {

case "sleeping":
return "졸고 있어요 😴";

case "running":
return "뛰고 있어요";

case "walking":
return "걷고 있어요";

case "paused":
return "멈춰 있어요";

default:
return "쉬고 있어요";

}

}



/* =================================================
   상태 갱신
================================================= */

setInterval(
updateStatus,
300
);



/* =================================================
   자동 움직임 시작
================================================= */

requestAnimationFrame(
updateActors
);



/* =================================================
   저장
   기존 저장 버튼을 삭제하고
   이 버튼 하나로 일기 + 캐릭터 전체 저장
================================================= */

const gallerySave =
document.getElementById(
"gallerySave"
);


gallerySave.addEventListener(
"click",
async function() {

try {


/*
   ===============================================
   저장용 캔버스 설정

   화면을 억지로 가로/세로로 찌그러뜨리지 않고
   실제 화면의 비율을 그대로 유지합니다.
   ===============================================
*/

const canvasWidth = 900;


/*
   실제 스테이지의 가로/세로 비율
*/

const stageScale =
canvasWidth /
stage.clientWidth;


/*
   캐릭터 영역도 화면과 같은 비율로 확대
*/

const savedStageWidth =
stage.clientWidth *
stageScale;


const savedStageHeight =
stage.clientHeight *
stageScale;


/*
   여백
*/

const margin = 60;


/*
   제목 영역
*/

const dateHeight = 45;

const titleHeight = 65;

const diaryStartY =
margin +
dateHeight +
35;


/*
   일기 내용의 줄을
   실제 저장 이미지에 맞게 계산
*/

const diaryFontSize = 26;

const diaryLineHeight = 42;

const diaryMaxWidth =
canvasWidth -
margin * 2;


const diaryLines =
getWrappedLines(
diaryInput.value || "",
diaryMaxWidth,
diaryFontSize,
"26px sans-serif"
);


/*
   일기 높이
*/

const diaryHeight =
Math.max(
diaryLineHeight,
diaryLines.length *
diaryLineHeight
);


/*
   캐릭터 영역 시작 위치

   일기 내용이 길어져도
   캐릭터 칸이 겹치지 않도록 자동으로 아래로 이동
*/

const stageY =
diaryStartY +
diaryHeight +
45;


/*
   아래 여백
*/

const bottomMargin = 60;


/*
   최종 캔버스 높이

   제목 + 일기 + 캐릭터 칸까지
   전부 들어가도록 자동 계산
*/

const canvasHeight =
stageY +
savedStageHeight +
bottomMargin;


canvas.width =
canvasWidth;

canvas.height =
canvasHeight;


const ctx =
canvas.getContext(
"2d"
);


/*
   ===============================================
   흰색 배경
   ===============================================
*/

ctx.fillStyle =
"#fff";

ctx.fillRect(
0,
0,
canvasWidth,
canvasHeight
);



/*
   ===============================================
   날짜
   ===============================================
*/

ctx.fillStyle =
"#111";

ctx.font =
"24px sans-serif";

ctx.textBaseline =
"alphabetic";


ctx.fillText(
dateElement.textContent,
margin,
margin + 25
);



/*
   ===============================================
   제목
   ===============================================
*/

ctx.font =
"bold 42px sans-serif";


ctx.fillText(
titleInput.value ||
"오늘의 일기",
margin,
margin +
dateHeight +
25
);



/*
   ===============================================
   일기
   ===============================================
*/

ctx.font =
"26px sans-serif";


let diaryY =
diaryStartY;


for (
const line of diaryLines
) {

ctx.fillText(
line,
margin,
diaryY
);

diaryY +=
diaryLineHeight;

}



/*
   ===============================================
   캐릭터 공간

   실제 stage와 동일한 가로세로 비율
   ===============================================
*/

ctx.save();


/*
   둥근 사각형 모양의 캐릭터 칸
*/

roundRectPath(
ctx,
margin,
stageY,
savedStageWidth,
savedStageHeight,
18
);


ctx.fillStyle =
"#fafafa";

ctx.fill();


ctx.strokeStyle =
"#ddd";

ctx.lineWidth =
2;

ctx.stroke();


/*
   캐릭터가 칸 밖으로 나가지 않도록
   실제 stage처럼 잘라냄
*/

ctx.clip();


/*
   stage 좌표 → 저장 이미지 좌표

   X와 Y 모두 같은 scale을 사용합니다.
   따라서 캐릭터가 절대로 짜부되지 않습니다.
*/

for (
const actor of actors
) {

try {

const image =
await loadImage(
actor.element.src
);


/*
   실제 캐릭터의 현재 표시 크기

   90x90으로 강제로 그리지 않고
   현재 element의 실제 width/height를 사용합니다.
*/

const actualWidth =
actor.element.getBoundingClientRect().width;


const actualHeight =
actor.element.getBoundingClientRect().height;


/*
   X/Y 위치도 같은 비율로 변환
*/

const x =
margin +
actor.x *
stageScale;


const y =
stageY +
actor.y *
stageScale;


/*
   가로와 세로를 각각 따로 늘리지 않고
   동일한 scale 사용
*/

const w =
actualWidth *
stageScale;


const h =
actualHeight *
stageScale;


/*
   이미지 원래 비율을 유지해서 저장
*/

ctx.drawImage(
image,
x,
y,
w,
h
);

}

catch(error) {

console.log(
"캐릭터 저장 실패",
error
);

}

}


ctx.restore();



/*
   ===============================================
   PNG 생성
   ===============================================
*/

canvas.toBlob(
async function(blob) {

if (!blob) {

alert(
"이미지를 만들지 못했어요."
);

return;

}


const file =
new File(
[blob],
"그림일기.png",
{
type:
"image/png"
}
);


/*
   아이폰/iPad에서
   공유 메뉴를 통해 사진 앱에 저장 가능
*/

if (
navigator.share &&
navigator.canShare &&
navigator.canShare({
files: [file]
})
) {

try {

await navigator.share({

files: [file],

title:
"그림일기"

});

return;

}

catch(error) {

if (
error.name ===
"AbortError"
) {

return;

}

}

}


/*
   공유 기능이 없는 환경
*/

const url =
URL.createObjectURL(
blob
);


window.open(
url,
"_blank"
);

},
"image/png"
);


/*
   ===============================================
   일기 내용도 자동 저장
   ===============================================
*/

localStorage.setItem(
"diary-title",
titleInput.value
);

localStorage.setItem(
"diary-text",
diaryInput.value
);


}

catch(error) {

console.error(error);

alert(
"저장하는 중 문제가 생겼어요."
);

}

});



/* =================================================
   긴 글 줄바꿈 계산
================================================= */

function getWrappedLines(
text,
maxWidth,
fontSize,
font
) {

const tempCanvas =
document.createElement(
"canvas"
);


const tempCtx =
tempCanvas.getContext(
"2d"
);


tempCtx.font =
font;


const lines = [];

const paragraphs =
String(text).split("\n");


for (
const paragraph of paragraphs
) {

if (
paragraph.length === 0
) {

lines.push("");

continue;

}


let currentLine = "";


for (
const char of paragraph
) {

const testLine =
currentLine +
char;


const width =
tempCtx.measureText(
testLine
).width;


if (
width > maxWidth &&
currentLine
) {

lines.push(
currentLine
);


currentLine =
char;

}

else {

currentLine =
testLine;

}

}


lines.push(
currentLine
);

}


return lines;

}



/* =================================================
   캔버스 둥근 사각형
================================================= */

function roundRectPath(
ctx,
x,
y,
width,
height,
radius
) {

ctx.beginPath();


ctx.moveTo(
x + radius,
y
);


ctx.lineTo(
x + width - radius,
y
);


ctx.quadraticCurveTo(
x + width,
y,
x + width,
y + radius
);


ctx.lineTo(
x + width,
y + height - radius
);


ctx.quadraticCurveTo(
x + width,
y + height,
x + width - radius,
y + height
);


ctx.lineTo(
x + radius,
y + height
);


ctx.quadraticCurveTo(
x,
y + height,
x,
y + height - radius
);


ctx.lineTo(
x,
y + radius
);


ctx.quadraticCurveTo(
x,
y,
x + radius,
y
);


ctx.closePath();

}



/* =================================================
   이미지 불러오기
================================================= */

function loadImage(src) {

return new Promise(
function(resolve, reject) {

const img =
new Image();


img.onload =
function() {

resolve(img);

};


img.onerror =
function() {

reject(
new Error(
"이미지를 불러올 수 없습니다."
)
);

};


img.src =
src;

});

}

</script>
