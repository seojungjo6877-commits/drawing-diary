<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>그림일기</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:#eee;
  color:#111;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;
}

.app{
  max-width:700px;
  min-height:100vh;
  margin:auto;
  background:white;
  padding-bottom:90px;
}

header{
  height:60px;
  border-bottom:1px solid #ddd;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 16px;
}

.logo{
  font-size:20px;
  font-weight:900;
}

.date{
  font-size:12px;
  color:#777;
}

main{
  padding:14px;
}

.box{
  border:1px solid #ddd;
  border-radius:14px;
  padding:14px;
  margin-bottom:12px;
}

.title{
  width:100%;
  border:0;
  outline:0;
  font-size:22px;
  font-weight:900;
  margin-bottom:10px;
}

.diary{
  width:100%;
  min-height:130px;
  border:0;
  outline:0;
  resize:none;
  font-size:16px;
  line-height:1.7;
}

.head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
  font-weight:900;
}

button{
  border:0;
  border-radius:10px;
  padding:10px 13px;
  background:#eee;
  color:#111;
  font-weight:800;
}

.black{
  background:#111;
  color:white;
}

/* 실제 사진 선택 버튼 */
.photoButton{
  display:block;
  width:100%;
  padding:15px;
  border-radius:12px;
  background:#111;
  color:white;
  text-align:center;
  font-weight:900;
  font-size:15px;
}

#photo{
  display:block;
  width:100%;
  margin-top:8px;
  font-size:14px;
}

.characters{
  display:flex;
  gap:8px;
  overflow-x:auto;
  margin-top:12px;
}

.character{
  width:75px;
  flex-shrink:0;
  text-align:center;
}

.character img{
  width:68px;
  height:68px;
  object-fit:contain;
  border:1px solid #ddd;
  border-radius:10px;
}

.character-name{
  font-size:10px;
  margin-top:4px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.scene{
  height:55vh;
  min-height:380px;
  border:1px solid #bbb;
  border-radius:14px;
  position:relative;
  overflow:hidden;
  background:white;
}

.empty{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:#aaa;
  font-size:13px;
  pointer-events:none;
}

.actor{
  position:absolute;
  width:110px;
  height:110px;
  object-fit:contain;
  touch-action:none;
  user-select:none;
}

.actor.selected{
  outline:1px dashed #999;
  outline-offset:3px;
}

.tools{
  display:flex;
  gap:6px;
  overflow-x:auto;
  margin-top:8px;
}

.tools button{
  white-space:nowrap;
}

.bottom{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:min(700px,100%);
  padding:8px 14px;
  background:#fffffff2;
  border-top:1px solid #ddd;
  display:flex;
  gap:8px;
  z-index:20;
}

.bottom button{
  flex:1;
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="logo">그림일기</div>
  <div class="date" id="date"></div>
</header>

<main>

<div class="box">

<input
  id="title"
  class="title"
  placeholder="오늘의 제목"
>

<textarea
  id="diary"
  class="diary"
  placeholder="오늘은 어떤 하루였나요?"
></textarea>

</div>


<div class="box">

<div class="head">
  <span>캐릭터</span>
</div>

<label class="photoButton" for="photo">
  ＋ 사진 추가
</label>

<input
  id="photo"
  type="file"
  accept="image/jpeg,image/png,image/webp,image/gif"
>

<div class="characters" id="characters"></div>

</div>


<div class="scene" id="scene">

<div class="empty" id="empty">
  사진을 선택하면<br>
  캐릭터가 나타납니다.
</div>

</div>


<div class="tools">

<button onclick="moveAction('walk')">걷기</button>
<button onclick="moveAction('jump')">점프</button>
<button onclick="moveAction('wiggle')">흔들기</button>
<button onclick="stopAction()">멈춤</button>
<button onclick="deleteActor()">삭제</button>

</div>

</main>


<div class="bottom">

<button onclick="clearScene()">
  장면 비우기
</button>

<button class="black" onclick="saveDiary()">
  일기 저장
</button>

</div>

</div>


<script>

document.getElementById("date").textContent =
new Date().toLocaleDateString(
  "ko-KR",
  {
    year:"numeric",
    month:"long",
    day:"numeric"
  }
);


let selectedActor = null;


/* 사진 선택 */
document.getElementById("photo").addEventListener(
  "change",
  function(event){

    const file = event.target.files[0];

    if(!file){
      return;
    }

    /*
      아이폰에서도 안정적으로 읽도록
      FileReader를 사용
    */

    const reader = new FileReader();

    reader.onload = function(e){

      createCharacter(e.target.result);

    };

    reader.onerror = function(){

      alert("사진을 읽지 못했어요.");

    };

    reader.readAsDataURL(file);

  }
);


/* 캐릭터 만들기 */
function createCharacter(imageURL){

  const scene =
    document.getElementById("scene");

  const actor =
    document.createElement("img");

  actor.src = imageURL;

  actor.className = "actor";

  actor.style.left =
    "calc(50% - 55px)";

  actor.style.top =
    "calc(50% - 55px)";

  scene.appendChild(actor);

  selectedActor = actor;

  document.getElementById("empty")
    .style.display = "none";

  makeMovable(actor);

}


/* 캐릭터 움직이기 */
function makeMovable(actor){

  let dragging = false;
  let offsetX = 0;
  let offsetY = 0;

  actor.addEventListener(
    "pointerdown",
    function(e){

      dragging = true;

      selectedActor = actor;

      actor.classList.add("selected");

      actor.setPointerCapture(e.pointerId);

      const rect =
        actor.getBoundingClientRect();

      offsetX =
        e.clientX - rect.left;

      offsetY =
        e.clientY - rect.top;

    }
  );


  actor.addEventListener(
    "pointermove",
    function(e){

      if(!dragging){
        return;
      }

      const scene =
        document
        .getElementById("scene")
        .getBoundingClientRect();

      let x =
        e.clientX -
        scene.left -
        offsetX;

      let y =
        e.clientY -
        scene.top -
        offsetY;

      x = Math.max(
        0,
        Math.min(
          scene.width -
          actor.offsetWidth,
          x
        )
      );

      y = Math.max(
        0,
        Math.min(
          scene.height -
          actor.offsetHeight,
          y
        )
      );

      actor.style.left =
        x + "px";

      actor.style.top =
        y + "px";

    }
  );


  actor.addEventListener(
    "pointerup",
    function(){

      dragging = false;

    }
  );

}


/* 캐릭터 선택 */
document
  .getElementById("scene")
  .addEventListener(
    "pointerdown",
    function(e){

      if(e.target.classList.contains("actor")){

        if(selectedActor){

          selectedActor.classList.remove(
            "selected"
          );

        }

        selectedActor = e.target;

        selectedActor.classList.add(
          "selected"
        );

      }

    }
  );


/* 움직임 */
function moveAction(type){

  if(!selectedActor){

    alert("캐릭터를 먼저 눌러주세요.");

    return;

  }

  stopAction();

  if(type === "walk"){

    selectedActor.animate(
      [
        {transform:"translateY(0)"},
        {transform:"translateY(-8px)"},
        {transform:"translateY(0)"}
      ],
      {
        duration:600,
        iterations:Infinity
      }
    );

  }


  if(type === "jump"){

    selectedActor.animate(
      [
        {transform:"translateY(0)"},
        {transform:"translateY(-40px)"},
        {transform:"translateY(0)"}
      ],
      {
        duration:500
      }
    );

  }


  if(type === "wiggle"){

    selectedActor.animate(
      [
        {transform:"rotate(-8deg)"},
        {transform:"rotate(8deg)"},
        {transform:"rotate(0)"}
      ],
      {
        duration:500
      }
    );

  }

}


/* 멈춤 */
function stopAction(){

  if(!selectedActor){
    return;
  }

  selectedActor
    .getAnimations()
    .forEach(
      animation => animation.cancel()
    );

  selectedActor.style.transform =
    "none";

}


/* 캐릭터 삭제 */
function deleteActor(){

  if(!selectedActor){

    alert("캐릭터를 먼저 눌러주세요.");

    return;

  }

  selectedActor.remove();

  selectedActor = null;

  checkEmpty();

}


/* 장면 비우기 */
function clearScene(){

  document
    .querySelectorAll(".actor")
    .forEach(
      actor => actor.remove()
    );

  selectedActor = null;

  checkEmpty();

}


/* 빈 장면 표시 */
function checkEmpty(){

  const count =
    document.querySelectorAll(
      ".actor"
    ).length;

  document.getElementById("empty")
    .style.display =
      count === 0
      ? "flex"
      : "none";

}


/* 일기 저장 */
function saveDiary(){

  const title =
    document.getElementById("title").value;

  const diary =
    document.getElementById("diary").value;

  localStorage.setItem(
    "diaryTitle",
    title
  );

  localStorage.setItem(
    "diaryBody",
    diary
  );

  alert("일기를 저장했어요!");

}


/* 기존 일기 불러오기 */
document.getElementById("title").value =
  localStorage.getItem("diaryTitle") || "";

document.getElementById("diary").value =
  localStorage.getItem("diaryBody") || "";

</script>

</body>
</html>
