<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>그림일기</title>

<style>
*{
    box-sizing:border-box;
    -webkit-user-select:none;
    user-select:none;
}

body{
    margin:0;
    padding:15px;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;
    background:#f5f5f5;
    color:#222;
}

h1{
    text-align:center;
    margin:5px 0 15px;
}

input, textarea, select, button{
    font:inherit;
}

input[type="text"],
textarea,
select{
    width:100%;
    border:1px solid #ccc;
    border-radius:10px;
    padding:10px;
    background:white;
}

textarea{
    min-height:110px;
    resize:vertical;
    -webkit-user-select:text;
    user-select:text;
}

.section{
    margin-top:12px;
    padding:12px;
    background:white;
    border-radius:14px;
}

.section-title{
    font-weight:bold;
    margin-bottom:8px;
}

button{
    border:1px solid #ccc;
    background:white;
    border-radius:10px;
    padding:9px 11px;
    margin:3px;
}

button:active{
    background:#eee;
}

.grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:6px;
}

.grid button{
    margin:0;
}

label{
    display:block;
    margin:8px 0 4px;
    font-size:14px;
}

input[type="range"]{
    width:100%;
}

#stage{
    position:relative;
    width:100%;
    height:430px;
    margin-top:12px;
    overflow:hidden;
    border-radius:16px;
    background:#dff3ff;
    border:1px solid #ddd;
    touch-action:none;
}

.actor,
.accessory,
.furniture{
    position:absolute;
    touch-action:none;
    transform-origin:center center;
}

.actor{
    width:100px;
    height:100px;
    object-fit:contain;
    cursor:grab;
}

.accessory{
    width:55px;
    height:55px;
    object-fit:contain;
    cursor:grab;
    z-index:20;
}

.furniture{
    width:120px;
    height:120px;
    object-fit:contain;
    cursor:grab;
    z-index:10;
}

.selected{
    outline:3px dashed #222;
    outline-offset:4px;
    border-radius:8px;
}

.locked{
    opacity:.95;
}

.control{
    display:none;
    margin-top:8px;
    padding:10px;
    background:#fafafa;
    border-radius:10px;
}

.status{
    text-align:center;
    font-size:13px;
    color:#666;
    min-height:20px;
    margin-top:5px;
}

.bottom-buttons{
    margin-top:12px;
    display:flex;
    gap:6px;
}

.bottom-buttons button{
    flex:1;
    margin:0;
}
</style>
</head>

<body>

<h1>그림일기</h1>

<div class="section">
    <div class="section-title">일기</div>

    <label>제목</label>
    <input id="titleInput" type="text" placeholder="오늘의 제목">

    <label>내용</label>
    <textarea id="diaryInput" placeholder="오늘의 이야기를 써보세요."></textarea>
</div>

<div class="section">
    <div class="section-title">배경</div>

    <select id="backgroundSelect">
        <option value="default">기본 배경</option>
        <option value="sky">파란 하늘</option>
        <option value="night">밤하늘</option>
        <option value="grass">초원</option>
        <option value="pink">분홍색</option>
        <option value="yellow">노란색</option>
    </select>

    <label>직접 배경 추가</label>
    <input id="backgroundFile" type="file" accept="image/*">
</div>

<div class="section">
    <div class="section-title">캐릭터</div>
    <input id="characterFile" type="file" accept="image/*">

    <div id="actorControl" class="control">
        <button id="pauseBtn">⏸ 멈춤</button>
        <button id="resumeBtn">▶ 움직이기</button>
        <button id="frontBtn">앞으로</button>
        <button id="backBtn">뒤로</button>
        <button id="deleteActorBtn">이 캐릭터 삭제</button>

        <label>캐릭터 크기</label>
        <input id="actorSizeSlider"
               type="range"
               min="40"
               max="200"
               value="100">
    </div>
</div>

<div class="section">
    <div class="section-title">악세서리</div>

    <div class="grid">
        <button data-accessory="hat">🎩 모자</button>
        <button data-accessory="crown">👑 왕관</button>
        <button data-accessory="ribbon">🎀 리본</button>
        <button data-accessory="glasses">😎 선글라스</button>
        <button data-accessory="cat">🐱 고양이귀</button>
        <button data-accessory="star">✨ 별</button>
    </div>

    <label>직접 악세서리 추가</label>
    <input id="accessoryFile" type="file" accept="image/*">

    <div id="accessoryControl" class="control">
        <label>악세서리 크기</label>
        <input id="accessorySizeSlider"
               type="range"
               min="30"
               max="200"
               value="100">

        <label>각도</label>
        <input id="accessoryRotationSlider"
               type="range"
               min="-180"
               max="180"
               value="0">

        <button id="accessoryLockBtn">🔒 악세서리 고정</button>
        <button id="deleteAccessoryBtn">악세서리 삭제</button>
    </div>
</div>

<div class="section">
    <div class="section-title">가구</div>

    <div class="grid">
        <button data-furniture="chair">🪑 의자</button>
        <button data-furniture="sofa">🛋️ 소파</button>
        <button data-furniture="bed">🛏️ 침대</button>
        <button data-furniture="plant">🪴 화분</button>
        <button data-furniture="drawer">🗄️ 서랍장</button>
        <button data-furniture="window">🪟 창문</button>
    </div>

    <label>직접 가구 추가</label>
    <input id="furnitureFile" type="file" accept="image/*">

    <div id="furnitureControl" class="control">
        <label>가구 크기</label>
        <input id="furnitureSizeSlider"
               type="range"
               min="40"
               max="200"
               value="100">

        <button id="furnitureLockBtn">🔒 가구 고정</button>
        <button id="deleteFurnitureBtn">가구 삭제</button>
    </div>
</div>

<div id="stage"></div>

<div class="status" id="status"></div>

<div class="bottom-buttons">
    <button id="saveBtn">저장</button>
    <button id="clearBtn">전체 삭제</button>
</div>

<script>
const stage = document.getElementById("stage");

const actors = [];
const accessories = [];
const furnitures = [];

let selectedActor = null;
let selectedAccessory = null;
let selectedFurniture = null;

let backgroundImage = null;

let animationRunning = true;


/* =========================
   배경
========================= */

const backgrounds = {
    default:"#dff3ff",
    sky:"linear-gradient(#87ceeb,#dff6ff)",
    night:"linear-gradient(#111b4d,#243b73)",
    grass:"linear-gradient(#bce7ff 0 45%,#9bd27d 45%)",
    pink:"linear-gradient(#ffd6e7,#fff0f6)",
    yellow:"linear-gradient(#fff3a6,#fff9d9)"
};

function setBackground(type){
    if(type === "default"){
        stage.style.background = backgrounds.default;
    }else{
        stage.style.background = backgrounds[type];
    }

    backgroundImage = null;
}

document.getElementById("backgroundSelect")
.addEventListener("change", e=>{
    setBackground(e.target.value);
});

document.getElementById("backgroundFile")
.addEventListener("change", e=>{
    const file = e.target.files[0];
    if(!file) return;

    const reader = new FileReader();

    reader.onload = ()=>{
        backgroundImage = new Image();

        backgroundImage.onload = ()=>{
            stage.style.backgroundImage =
                `url("${reader.result}")`;
            stage.style.backgroundSize = "cover";
            stage.style.backgroundPosition = "center";
        };

        backgroundImage.src = reader.result;
    };

    reader.readAsDataURL(file);
});


/* =========================
   상태
========================= */

function updateStatus(text=""){
    document.getElementById("status").textContent = text;
}

function clearSelections(){
    if(selectedActor){
        selectedActor.element.classList.remove("selected");
    }

    if(selectedAccessory){
        selectedAccessory.element.classList.remove("selected");
    }

    if(selectedFurniture){
        selectedFurniture.element.classList.remove("selected");
    }

    selectedActor = null;
    selectedAccessory = null;
    selectedFurniture = null;

    document.getElementById("actorControl").style.display="none";
    document.getElementById("accessoryControl").style.display="none";
    document.getElementById("furnitureControl").style.display="none";
}


/* =========================
   캐릭터
========================= */

function selectActor(actor){
    clearSelections();

    selectedActor = actor;
    actor.element.classList.add("selected");

    document.getElementById("actorControl").style.display="block";
    document.getElementById("actorSizeSlider").value =
        actor.size;

    updateStatus("캐릭터 선택됨");
}

function createActor(src, originalImage=null){

    const element = document.createElement("img");

    element.className="actor";
    element.src=src;

    const actor={
        element,
        x:50 + Math.random()*200,
        y:80 + Math.random()*220,
        size:100,
        originalImage,
        vx:(Math.random()>.5?1:-1) *
           (0.4 + Math.random()*0.8),
        paused:false
    };

    element.style.width="100px";
    element.style.height="100px";

    actors.push(actor);
    stage.appendChild(element);

    updateActorPosition(actor);
    enableActorDrag(actor);

    return actor;
}

function updateActorPosition(actor){
    actor.element.style.left =
        actor.x + "px";

    actor.element.style.top =
        actor.y + "px";
}

function enableActorDrag(actor){

    let dragging=false;
    let offsetX=0;
    let offsetY=0;

    actor.element.addEventListener("pointerdown",e=>{

        e.preventDefault();

        if(selectedActor === actor){
            clearSelections();
            return;
        }

        selectActor(actor);

        dragging=true;

        const rect =
            stage.getBoundingClientRect();

        offsetX =
            e.clientX -
            rect.left -
            actor.x;

        offsetY =
            e.clientY -
            rect.top -
            actor.y;

        actor.element.setPointerCapture?.(e.pointerId);
    });

    actor.element.addEventListener("pointermove",e=>{

        if(!dragging) return;

        const rect =
            stage.getBoundingClientRect();

        actor.x =
            e.clientX -
            rect.left -
            offsetX;

        actor.y =
            e.clientY -
            rect.top -
            offsetY;

        clampActor(actor);
        updateActorPosition(actor);
        updateAttachedAccessories(actor);
    });

    actor.element.addEventListener("pointerup",()=>{
        dragging=false;
    });

    actor.element.addEventListener("pointercancel",()=>{
        dragging=false;
    });
}

function clampActor(actor){

    const w=actor.element.offsetWidth;
    const h=actor.element.offsetHeight;

    actor.x=Math.max(
        0,
        Math.min(
            stage.clientWidth-w,
            actor.x
        )
    );

    actor.y=Math.max(
        0,
        Math.min(
            stage.clientHeight-h,
            actor.y
        )
    );
}

document.getElementById("characterFile")
.addEventListener("change",e=>{

    const file=e.target.files[0];
    if(!file) return;

    const reader=new FileReader();

    reader.onload=()=>{
        const img=new Image();

        img.onload=()=>{
            const actor=createActor(
                reader.result,
                img
            );

            selectActor(actor);
        };

        img.src=reader.result;
    };

    reader.readAsDataURL(file);
});


/* 캐릭터 자동 이동 */

function animate(){

    if(animationRunning){

        actors.forEach(actor=>{

            if(actor.paused) return;

            actor.x += actor.vx;

            const max =
                stage.clientWidth -
                actor.element.offsetWidth;

            if(actor.x <= 0){
                actor.x=0;
                actor.vx=Math.abs(actor.vx);
            }

            if(actor.x >= max){
                actor.x=max;
                actor.vx=-Math.abs(actor.vx);
            }

            updateActorPosition(actor);
            updateAttachedAccessories(actor);
        });
    }

    requestAnimationFrame(animate);
}

animate();


document.getElementById("pauseBtn")
.addEventListener("click",()=>{
    if(selectedActor){
        selectedActor.paused=true;
    }
});

document.getElementById("resumeBtn")
.addEventListener("click",()=>{
    if(selectedActor){
        selectedActor.paused=false;
    }
});

document.getElementById("frontBtn")
.addEventListener("click",()=>{
    if(selectedActor){
        selectedActor.element.style.zIndex=30;
    }
});

document.getElementById("backBtn")
.addEventListener("click",()=>{
    if(selectedActor){
        selectedActor.element.style.zIndex=5;
    }
});

document.getElementById("deleteActorBtn")
.addEventListener("click",()=>{

    if(!selectedActor) return;

    const actor=selectedActor;

    const related=
        accessories.filter(
            a=>a.owner===actor
        );

    related.forEach(a=>{
        a.element.remove();

        const index=
            accessories.indexOf(a);

        if(index>=0)
            accessories.splice(index,1);
    });

    actor.element.remove();

    const index=actors.indexOf(actor);

    if(index>=0)
        actors.splice(index,1);

    clearSelections();
});


document.getElementById("actorSizeSlider")
.addEventListener("input",e=>{

    if(!selectedActor) return;

    const actor=selectedActor;
    const centerX =
        actor.x +
        actor.element.offsetWidth/2;

    const centerY =
        actor.y +
        actor.element.offsetHeight/2;

    actor.size =
        Number(e.target.value);

    actor.element.style.width =
        actor.size + "px";

    actor.element.style.height =
        actor.size + "px";

    actor.x =
        centerX -
        actor.element.offsetWidth/2;

    actor.y =
        centerY -
        actor.element.offsetHeight/2;

    clampActor(actor);
    updateActorPosition(actor);
    updateAttachedAccessories(actor);
});


/* =========================
   악세서리
========================= */

const accessorySVG = {
    hat:"🎩",
    crown:"👑",
    ribbon:"🎀",
    glasses:"😎",
    cat:"🐱",
    star:"✨"
};

function emojiImage(emoji){

    const svg=
        `<svg xmlns="http://www.w3.org/2000/svg"
              width="100"
              height="100">
            <text x="50"
                  y="72"
                  text-anchor="middle"
                  font-size="70">${emoji}</text>
        </svg>`;

    return "data:image/svg+xml;charset=utf-8,"+
        encodeURIComponent(svg);
}

function createAccessory(
    src,
    originalImage=null
){

    const element=
        document.createElement("img");

    element.className="accessory";
    element.src=src;

    const owner=
        selectedActor || null;

    const accessory={
        element,
        owner,
        x:100,
        y:100,
        size:100,
        rotation:0,
        locked:false,
        originalImage,
        relativeX:20,
        relativeY:-20
    };

    element.style.width="55px";
    element.style.height="55px";

    accessories.push(accessory);
    stage.appendChild(element);

    if(owner){

        accessory.x=
            owner.x +
            owner.element.offsetWidth/2 -
            27;

        accessory.y=
            owner.y -
            5;

        accessory.relativeX=
            accessory.x-owner.x;

        accessory.relativeY=
            accessory.y-owner.y;
    }

    updateAccessoryPosition(accessory);
    applyAccessoryRotation(accessory);
    enableAccessoryDrag(accessory);

    return accessory;
}

function updateAccessoryPosition(a){

    a.element.style.left=
        a.x+"px";

    a.element.style.top=
        a.y+"px";
}

function applyAccessoryRotation(a){

    /*
      중요:
      크기는 width/height로 처리하고
      transform은 회전만 담당한다.
    */

    a.element.style.transform=
        `rotate(${a.rotation}deg)`;
}

function selectAccessory(a){

    clearSelections();

    selectedAccessory=a;

    a.element.classList.add("selected");

    document.getElementById(
        "accessoryControl"
    ).style.display="block";

    document.getElementById(
        "accessorySizeSlider"
    ).value=a.size;

    document.getElementById(
        "accessoryRotationSlider"
    ).value=a.rotation;

    updateAccessoryLockButton();

    updateStatus("악세서리 선택됨");
}

function enableAccessoryDrag(a){

    let dragging=false;
    let offsetX=0;
    let offsetY=0;

    a.element.addEventListener(
        "pointerdown",
        e=>{

            e.preventDefault();
            e.stopPropagation();

            /*
              선택된 악세서리를 다시 누르면
              선택 해제.
            */
            if(selectedAccessory===a){

                clearSelections();
                return;
            }

            selectAccessory(a);

            /*
              고정되어 있으면 위치 이동은 금지.
              선택만 가능.
            */
            if(a.locked){
                return;
            }

            dragging=true;

            const rect=
                stage.getBoundingClientRect();

            offsetX=
                e.clientX-
                rect.left-
                a.x;

            offsetY=
                e.clientY-
                rect.top-
                a.y;

            a.element.setPointerCapture?.(
                e.pointerId
            );
        }
    );

    a.element.addEventListener(
        "pointermove",
        e=>{

            if(!dragging) return;

            e.preventDefault();

            const rect=
                stage.getBoundingClientRect();

            a.x=
                e.clientX-
                rect.left-
                offsetX;

            a.y=
                e.clientY-
                rect.top-
                offsetY;

            clampAccessory(a);
            updateAccessoryPosition(a);

            if(a.owner){

                a.relativeX=
                    a.x-a.owner.x;

                a.relativeY=
                    a.y-a.owner.y;
            }
        }
    );

    a.element.addEventListener(
        "pointerup",
        ()=>{
            dragging=false;
        }
    );

    a.element.addEventListener(
        "pointercancel",
        ()=>{
            dragging=false;
        }
    );
}

function clampAccessory(a){

    const w=a.element.offsetWidth;
    const h=a.element.offsetHeight;

    a.x=Math.max(
        0,
        Math.min(
            stage.clientWidth-w,
            a.x
        )
    );

    a.y=Math.max(
        0,
        Math.min(
            stage.clientHeight-h,
            a.y
        )
    );
}

function updateAttachedAccessories(actor){

    accessories.forEach(a=>{

        if(
            a.owner===actor &&
            selectedAccessory!==a
        ){

            a.x=
                actor.x+
                a.relativeX;

            a.y=
                actor.y+
                a.relativeY;

            updateAccessoryPosition(a);
        }
    });
}


/* 악세서리 종류 */

document.querySelectorAll(
    "[data-accessory]"
).forEach(button=>{

    button.addEventListener("click",()=>{

        const type=
            button.dataset.accessory;

        const a=
            createAccessory(
                emojiImage(
                    accessorySVG[type]
                )
            );

        selectAccessory(a);
    });
});


/* 직접 악세서리 */

document.getElementById(
    "accessoryFile"
).addEventListener("change",e=>{

    const file=e.target.files[0];
    if(!file) return;

    const reader=new FileReader();

    reader.onload=()=>{

        const img=new Image();

        img.onload=()=>{

            const a=
                createAccessory(
                    reader.result,
                    img
                );

            selectAccessory(a);
        };

        img.src=reader.result;
    };

    reader.readAsDataURL(file);
});


/* 악세서리 크기 */

document.getElementById(
    "accessorySizeSlider"
).addEventListener("input",e=>{

    if(!selectedAccessory) return;

    const a=selectedAccessory;

    const centerX=
        a.x+
        a.element.offsetWidth/2;

    const centerY=
        a.y+
        a.element.offsetHeight/2;

    a.size=
        Number(e.target.value);

    /*
      transform scale을 사용하지 않고
      실제 width / height를 변경.
    */
    const newSize=
        55*(a.size/100);

    a.element.style.width=
        newSize+"px";

    a.element.style.height=
        newSize+"px";

    a.x=
        centerX-
        a.element.offsetWidth/2;

    a.y=
        centerY-
        a.element.offsetHeight/2;

    clampAccessory(a);
    updateAccessoryPosition(a);

    if(a.owner){

        a.relativeX=
            a.x-a.owner.x;

        a.relativeY=
            a.y-a.owner.y;
    }
});


/* 악세서리 각도 */

document.getElementById(
    "accessoryRotationSlider"
).addEventListener("input",e=>{

    if(!selectedAccessory) return;

    const a=selectedAccessory;

    a.rotation=
        Number(e.target.value);

    /*
      각도 조절은 반드시 transform에서
      rotate만 사용.
    */
    applyAccessoryRotation(a);
});


/* 악세서리 고정 */

function updateAccessoryLockButton(){

    if(!selectedAccessory) return;

    const button=
        document.getElementById(
            "accessoryLockBtn"
        );

    if(selectedAccessory.locked){

        button.textContent=
            "🔓 악세서리 고정 해제";

    }else{

        button.textContent=
            "🔒 악세서리 고정";
    }
}

document.getElementById(
    "accessoryLockBtn"
).addEventListener("click",()=>{

    if(!selectedAccessory) return;

    const a=selectedAccessory;

    a.locked=!a.locked;

    if(a.locked){

        /*
          고정하는 순간
          선택 표시와 올가미를 완전히 제거.
        */
        a.element.classList.remove(
            "selected"
        );

        selectedAccessory=null;

        document.getElementById(
            "accessoryControl"
        ).style.display="none";

        updateStatus("악세서리가 고정됨");

    }else{

        /*
          고정 해제 버튼을 누르면
          다시 선택 상태.
        */
        selectAccessory(a);
    }
});


/* 악세서리 삭제 */

document.getElementById(
    "deleteAccessoryBtn"
).addEventListener("click",()=>{

    if(!selectedAccessory) return;

    const a=selectedAccessory;

    a.element.remove();

    const index=
        accessories.indexOf(a);

    if(index>=0)
        accessories.splice(index,1);

    clearSelections();
});


/* =========================
   가구
========================= */

const furnitureEmoji={
    chair:"🪑",
    sofa:"🛋️",
    bed:"🛏️",
    plant:"🪴",
    drawer:"🗄️",
    window:"🪟"
};

function createFurniture(
    src,
    originalImage=null
){

    const element=
        document.createElement("img");

    element.className="furniture";
    element.src=src;

    const furniture={
        element,
        x:30+Math.random()*180,
        y:200+Math.random()*120,
        size:100,
        locked:false,
        originalImage
    };

    element.style.width="120px";
    element.style.height="120px";

    furnitures.push(furniture);
    stage.appendChild(element);

    updateFurniturePosition(furniture);
    enableFurnitureDrag(furniture);

    return furniture;
}

function updateFurniturePosition(f){

    f.element.style.left=
        f.x+"px";

    f.element.style.top=
        f.y+"px";
}

function selectFurniture(f){

    clearSelections();

    selectedFurniture=f;

    f.element.classList.add("selected");

    document.getElementById(
        "furnitureControl"
    ).style.display="block";

    document.getElementById(
        "furnitureSizeSlider"
    ).value=f.size;

    updateFurnitureLockButton();

    updateStatus("가구 선택됨");
}

function enableFurnitureDrag(f){

    let dragging=false;
    let offsetX=0;
    let offsetY=0;

    f.element.addEventListener(
        "pointerdown",
        e=>{

            e.preventDefault();
            e.stopPropagation();

            /*
              가구는 반복해서 눌러도
              선택 해제하지 않는다.
              따라서 두 번째 터치도 바로 드래그 가능.
            */
            selectFurniture(f);

            if(f.locked){
                return;
            }

            dragging=true;

            const rect=
                stage.getBoundingClientRect();

            offsetX=
                e.clientX-
                rect.left-
                f.x;

            offsetY=
                e.clientY-
                rect.top-
                f.y;

            f.element.setPointerCapture?.(
                e.pointerId
            );
        }
    );

    f.element.addEventListener(
        "pointermove",
        e=>{

            if(!dragging) return;

            const rect=
                stage.getBoundingClientRect();

            f.x=
                e.clientX-
                rect.left-
                offsetX;

            f.y=
                e.clientY-
                rect.top-
                offsetY;

            clampFurniture(f);
            updateFurniturePosition(f);
        }
    );

    f.element.addEventListener(
        "pointerup",
        ()=>{
            dragging=false;
        }
    );

    f.element.addEventListener(
        "pointercancel",
        ()=>{
            dragging=false;
        }
    );
}

function clampFurniture(f){

    const w=f.element.offsetWidth;
    const h=f.element.offsetHeight;

    f.x=Math.max(
        0,
        Math.min(
            stage.clientWidth-w,
            f.x
        )
    );

    f.y=Math.max(
        0,
        Math.min(
            stage.clientHeight-h,
            f.y
        )
    );
}


/* 가구 버튼 */

document.querySelectorAll(
    "[data-furniture]"
).forEach(button=>{

    button.addEventListener("click",()=>{

        const type=
            button.dataset.furniture;

        const f=
            createFurniture(
                emojiImage(
                    furnitureEmoji[type]
                )
            );

        selectFurniture(f);
    });
});


/* 직접 가구 */

document.getElementById(
    "furnitureFile"
).addEventListener("change",e=>{

    const file=e.target.files[0];
    if(!file) return;

    const reader=new FileReader();

    reader.onload=()=>{

        const img=new Image();

        img.onload=()=>{

            const f=
                createFurniture(
                    reader.result,
                    img
                );

            selectFurniture(f);
        };

        img.src=reader.result;
    };

    reader.readAsDataURL(file);
});


/* 가구 크기 */

document.getElementById(
    "furnitureSizeSlider"
).addEventListener("input",e=>{

    if(!selectedFurniture) return;

    const f=selectedFurniture;

    const centerX=
        f.x+
        f.element.offsetWidth/2;

    const centerY=
        f.y+
        f.element.offsetHeight/2;

    f.size=
        Number(e.target.value);

    const newSize=
        120*(f.size/100);

    f.element.style.width=
        newSize+"px";

    f.element.style.height=
        newSize+"px";

    f.x=
        centerX-
        f.element.offsetWidth/2;

    f.y=
        centerY-
        f.element.offsetHeight/2;

    clampFurniture(f);
    updateFurniturePosition(f);
});


/* 가구 고정 */

function updateFurnitureLockButton(){

    if(!selectedFurniture) return;

    const button=
        document.getElementById(
            "furnitureLockBtn"
        );

    if(selectedFurniture.locked){

        button.textContent=
            "🔓 가구 고정 해제";

    }else{

        button.textContent=
            "🔒 가구 고정";
    }
}

document.getElementById(
    "furnitureLockBtn"
).addEventListener("click",()=>{

    if(!selectedFurniture) return;

    const f=selectedFurniture;

    f.locked=!f.locked;

    if(f.locked){

        /*
          고정 즉시 선택 해제.
        */
        f.element.classList.remove(
            "selected"
        );

        selectedFurniture=null;

        document.getElementById(
            "furnitureControl"
        ).style.display="none";

        updateStatus("가구가 고정됨");

    }else{

        selectFurniture(f);
    }
});


/* 가구 삭제 */

document.getElementById(
    "deleteFurnitureBtn"
).addEventListener("click",()=>{

    if(!selectedFurniture) return;

    const f=selectedFurniture;

    f.element.remove();

    const index=
        furnitures.indexOf(f);

    if(index>=0)
        furnitures.splice(index,1);

    clearSelections();
});


/* =========================
   저장
========================= */

function loadImage(src){

    return new Promise(resolve=>{

        const img=new Image();

        img.onload=()=>resolve(img);
        img.onerror=()=>resolve(null);

        img.src=src;
    });
}

function drawImageContain(
    ctx,
    img,
    x,
    y,
    w,
    h
){

    if(!img) return;

    const ratio=
        Math.min(
            w/img.naturalWidth,
            h/img.naturalHeight
        );

    const nw=
        img.naturalWidth*ratio;

    const nh=
        img.naturalHeight*ratio;

    ctx.drawImage(
        img,
        x+(w-nw)/2,
        y+(h-nh)/2,
        nw,
        nh
    );
}

async function saveDiary(){

    const scale=3;

    const canvas=
        document.createElement("canvas");

    const width=900;
    const stageHeight=430;

    canvas.width=
        width*scale;

    canvas.height=
        (300+stageHeight+40)*scale;

    const ctx=
        canvas.getContext("2d");

    ctx.imageSmoothingEnabled=true;
    ctx.imageSmoothingQuality="high";

    ctx.scale(scale,scale);

    /*
      전체 흰색
    */
    ctx.fillStyle="white";
    ctx.fillRect(
        0,
        0,
        width,
        300+stageHeight+40
    );

    /*
      제목 영역
    */
    ctx.fillStyle="#222";
    ctx.font=
        "bold 32px sans-serif";

    ctx.fillText(
        "오늘의 일기",
        40,
        50
    );

    const title=
        document.getElementById(
            "titleInput"
        ).value;

    ctx.font=
        "bold 25px sans-serif";

    ctx.fillText(
        title || "제목 없음",
        40,
        90
    );

    /*
      일기 내용
    */
    const diary=
        document.getElementById(
            "diaryInput"
        ).value;

    ctx.font=
        "22px sans-serif";

    const lines=
        diary.split("\n");

    let y=130;

    lines.forEach(line=>{

        if(y>270) return;

        ctx.fillText(
            line,
            40,
            y
        );

        y+=32;
    });

    /*
      스테이지
    */
    const stageY=300;

    ctx.save();

    ctx.translate(0,stageY);

    if(backgroundImage){

        ctx.drawImage(
            backgroundImage,
            0,
            0,
            width,
            stageHeight
        );

    }else{

        ctx.fillStyle=
            getComputedStyle(
                stage
            ).backgroundColor ||
            "#dff3ff";

        ctx.fillRect(
            0,
            0,
            width,
            stageHeight
        );

        /*
          CSS gradient는 canvas에서
          그대로 가져올 수 없기 때문에
          선택 배경을 별도로 그림.
        */
        const bg=
            document.getElementById(
                "backgroundSelect"
            ).value;

        if(bg==="sky"){
            const g=
                ctx.createLinearGradient(
                    0,0,0,stageHeight
                );
            g.addColorStop(0,"#87ceeb");
            g.addColorStop(1,"#dff6ff");
            ctx.fillStyle=g;
            ctx.fillRect(
                0,0,width,stageHeight
            );
        }

        if(bg==="night"){
            const g=
                ctx.createLinearGradient(
                    0,0,0,stageHeight
                );
            g.addColorStop(0,"#111b4d");
            g.addColorStop(1,"#243b73");
            ctx.fillStyle=g;
            ctx.fillRect(
                0,0,width,stageHeight
            );
        }

        if(bg==="grass"){
            ctx.fillStyle="#bce7ff";
            ctx.fillRect(
                0,0,width,stageHeight*0.45
            );

            ctx.fillStyle="#9bd27d";
            ctx.fillRect(
                0,
                stageHeight*0.45,
                width,
                stageHeight*0.55
            );
        }

        if(bg==="pink"){
            const g=
                ctx.createLinearGradient(
                    0,0,0,stageHeight
                );
            g.addColorStop(0,"#ffd6e7");
            g.addColorStop(1,"#fff0f6");
            ctx.fillStyle=g;
            ctx.fillRect(
                0,0,width,stageHeight
            );
        }

        if(bg==="yellow"){
            const g=
                ctx.createLinearGradient(
                    0,0,0,stageHeight
                );
            g.addColorStop(0,"#fff3a6");
            g.addColorStop(1,"#fff9d9");
            ctx.fillStyle=g;
            ctx.fillRect(
                0,0,width,stageHeight
            );
        }
    }

    /*
      가구
    */
    for(const f of furnitures){

        const img=
            f.originalImage ||
            await loadImage(
                f.element.src
            );

        if(!img) continue;

        drawImageContain(
            ctx,
            img,
            f.x,
            f.y,
            f.element.offsetWidth,
            f.element.offsetHeight
        );
    }

    /*
      캐릭터
    */
    for(const actor of actors){

        const img=
            actor.originalImage ||
            await loadImage(
                actor.element.src
            );

        if(!img) continue;

        drawImageContain(
            ctx,
            img,
            actor.x,
            actor.y,
            actor.element.offsetWidth,
            actor.element.offsetHeight
        );
    }

    /*
      악세서리
    */
    for(const a of accessories){

        const img=
            a.originalImage ||
            await loadImage(
                a.element.src
            );

        if(!img) continue;

        const w=
            a.element.offsetWidth;

        const h=
            a.element.offsetHeight;

        /*
          저장할 때도 실제 각도를 적용.
        */
        ctx.save();

        ctx.translate(
            a.x+w/2,
            a.y+h/2
        );

        ctx.rotate(
            a.rotation*Math.PI/180
        );

        drawImageContain(
            ctx,
            img,
            -w/2,
            -h/2,
            w,
            h
        );

        ctx.restore();
    }

    ctx.restore();

    /*
      이미지 저장
    */
    const link=
        document.createElement("a");

    link.download=
        "그림일기.png";

    link.href=
        canvas.toDataURL(
            "image/png"
        );

    link.click();

    updateStatus("저장 완료");
}

document.getElementById(
    "saveBtn"
).addEventListener(
    "click",
    saveDiary
);


/* =========================
   전체 삭제
========================= */

document.getElementById(
    "clearBtn"
).addEventListener("click",()=>{

    actors.forEach(
        a=>a.element.remove()
    );

    accessories.forEach(
        a=>a.element.remove()
    );

    furnitures.forEach(
        f=>f.element.remove()
    );

    actors.length=0;
    accessories.length=0;
    furnitures.length=0;

    document.getElementById(
        "titleInput"
    ).value="";

    document.getElementById(
        "diaryInput"
    ).value="";

    clearSelections();

    setBackground("default");

    document.getElementById(
        "backgroundSelect"
    ).value="default";

    backgroundImage=null;

    stage.style.backgroundImage="";

    updateStatus("");
});
</script>
