<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
viewport-fit=cover">

<meta name="apple-mobile-web-app-capable"
content="yes">

<meta name="apple-mobile-web-app-status-bar-style"
content="default">

<title>그림일기</title>

<style>

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  background: #fff;
  color: #111;

  font-family:
  -apple-system,
  BlinkMacSystemFont,
  "Apple SD Gothic Neo",
  "Noto Sans KR",
  sans-serif;
}


/* =========================
   날짜
========================= */

header {
  padding: 18px 16px 10px;
}

.date {
  font-size: 13px;
  color: #777;
}


/* =========================
   전체
========================= */

.container {
  padding: 0 16px 35px;
}


/* =========================
   제목
========================= */

input[type="text"] {

  width: 100%;

  border: 1px solid #ddd;

  border-radius: 12px;

  padding: 12px;

  font-size: 16px;

  outline: none;

  background: #fff;
}


/* =========================
   일기
========================= */

textarea {

  width: 100%;

  min-height: 180px;

  margin-top: 10px;

  border: 1px solid #ddd;

  border-radius: 12px;

  padding: 14px;

  font-size: 16px;

  line-height: 1.6;

  outline: none;

  resize: vertical;

  background: #fff;
}


/* =========================
   캐릭터 공간
========================= */

.stage {

  position: relative;

  width: 100%;

  height: 380px;

  margin: 15px 0;

  border: 1px solid #ddd;

  border-radius: 18px;

  overflow: hidden;

  background: #fafafa;
}


/* =========================
   캐릭터
========================= */

.actor {

  position: absolute;

  width: 90px;
  height: 90px;

  object-fit: contain;

  user-select: none;

  -webkit-user-select: none;

  touch-action: none;

  cursor: pointer;

  transition:
  transform 0.25s ease,
  opacity 0.3s ease;
}


/* 선택된 캐릭터 */

.actor.selected {

  outline:
  2px dashed #777;

  outline-offset: 4px;

  border-radius: 12px;
}


/* 졸기 */

.actor.sleeping {

  opacity: 0.7;

}


/* 뛰기 */

.actor.running {

  transform:
  scale(1.08);
}


/* 같이 있는 상태 */

.actor.together {

  opacity: 0.9;

}


/* =========================
   상태 표시
========================= */

.status {

  position: absolute;

  left: 50%;

  bottom: 8px;

  transform:
  translateX(-50%);

  font-size: 12px;

  color: #777;

  pointer-events: none;

  white-space: nowrap;
}


/* =========================
   사진 추가
========================= */

.add-area {

  margin: 12px 0 18px;
}


.photo-button {

  display: block;

  width: 100%;

  padding: 12px 16px;

  border: 1px solid #ddd;

  border-radius: 12px;

  background: #fff;

  color: #111;

  font-size: 15px;

  text-align: center;

  cursor: pointer;
}


#photo {
  display: none;
}


/* =========================
   버튼
========================= */

button {

  width: 100%;

  border: 1px solid #ddd;

  background: #fff;

  color: #111;

  border-radius: 12px;

  padding: 13px 16px;

  font-size: 15px;

  margin-top: 10px;
}


/* =========================
   캐릭터 조작
========================= */

.control-box {

  display: none;

  margin-top: 10px;

  padding: 10px;

  border: 1px solid #ddd;

  border-radius: 12px;

  background: #fafafa;
}


.control-box.show {
  display: block;
}


.control-title {

  font-size: 13px;

  color: #666;

  margin-bottom: 5px;
}


/* =========================
   안내
========================= */

.help {

  margin-top: 8px;

  text-align: center;

  font-size: 12px;

  color: #888;
}

</style>
</head>


<body>


<header>

<div
class="date"
id="date">
</div>

</header>


<div
class="container">


<!-- 제목 -->

<input
type="text"
id="title"
placeholder="오늘의 제목">


<!-- 일기 -->

<textarea
id="diary"
placeholder="오늘의 일기를 써보세요.">
</textarea>


<!-- 캐릭터 공간 -->

<div
class="stage"
id="stage">

<div
class="status"
id="status">

캐릭터를 추가해보세요

</div>

</div>


<!-- 캐릭터 추가 -->

<div
class="add-area">

<label
class="photo-button"
for="photo">

＋ 캐릭터 추가

</label>

<input
id="photo"
type="file"
accept="image/*">

</div>


<!-- 선택 캐릭터 조작 -->

<div
class="control-box"
id="controlBox">

<div
class="control-title">

선택한 캐릭터

</div>

<button
id="pauseButton">

⏸ 이 캐릭터 멈추기

</button>

<button
id="resumeButton">

▶ 다시 움직이기

</button>

</div>


<div
class="help">

캐릭터를 누르면 한 캐릭터를 선택할 수 있어요.

</div>


<!-- 저장 -->

<button
id="save">

저장

</button>


<button
id="gallerySave">

갤러리에 저장

</button>


</div>


<script>


/* =================================================
   날짜
================================================= */

const dateElement =
document.getElementById("date");

const now =
new Date();

dateElement.textContent =
now.getFullYear() +
"년 " +
(now.getMonth() + 1) +
"월 " +
now.getDate() +
"일";



/* =================================================
   일기
================================================= */

const titleInput =
document.getElementById("title");

const diaryInput =
document.getElementById("diary");

const saveButton =
document.getElementById("save");


titleInput.value =
localStorage.getItem(
"diary-title"
) || "";


diaryInput.value =
localStorage.getItem(
"diary-text"
) || "";


saveButton.addEventListener(
"click",
function() {

localStorage.setItem(
"diary-title",
titleInput.value
);

localStorage.setItem(
"diary-text",
diaryInput.value
);

alert("저장했어요!");

});



/* =================================================
   기본 요소
================================================= */

const photoInput =
document.getElementById("photo");

const stage =
document.getElementById("stage");

const status =
document.getElementById("status");

const controlBox =
document.getElementById("controlBox");

const pauseButton =
document.getElementById("pauseButton");

const resumeButton =
document.getElementById("resumeButton");


/*
   모든 캐릭터 데이터
*/

const actors = [];


/*
   현재 선택 캐릭터
*/

let selectedActor = null;



/* =================================================
   캐릭터 추가
================================================= */

photoInput.addEventListener(
"change",
function(event) {

const file =
event.target.files[0];

if (!file) {
return;
}


const reader =
new FileReader();


reader.onload =
function(e) {

const img =
document.createElement("img");


img.className =
"actor";


img.src =
e.target.result;


/*
   랜덤 등장 위치
*/

const maxX =
Math.max(
0,
stage.clientWidth - 90
);

const maxY =
Math.max(
0,
stage.clientHeight - 90
);


const startX =
Math.random() * maxX;

const startY =
Math.random() * maxY;


img.style.left =
startX + "px";

img.style.top =
startY + "px";


/*
   캐릭터마다 다른 성격
*/

const personality =
createPersonality();


const actor = {

element: img,

x: startX,

y: startY,

targetX: startX,

targetY: startY,

speed:
personality.speed,

runSpeed:
personality.runSpeed,

walkChance:
personality.walkChance,

runChance:
personality.runChance,

sleepChance:
personality.sleepChance,

personality:
personality.name,

state:
"idle",

paused:
false,

nextAction:
Date.now() +
1000 +
Math.random() * 2500,

togetherUntil:
0,

partner:
null,

direction:
Math.random() > 0.5
? 1
: -1

};


actors.push(actor);


stage.appendChild(img);


/*
   캐릭터 터치
*/

img.addEventListener(
"pointerdown",
function(e) {

e.stopPropagation();

selectActor(actor);

}
);


/*
   첫 행동
*/

chooseNewAction(actor);

updateStatus();

};


/*
   파일 읽기
*/

reader.readAsDataURL(file);


/*
   같은 사진 재선택 가능
*/

photoInput.value = "";

});



/* =================================================
   캐릭터 성격 만들기
================================================= */

function createPersonality() {

const types = [

{
name: "느긋한 타입",

speed:
0.55 + Math.random() * 0.4,

runSpeed:
1.1 + Math.random() * 0.5,

walkChance: 0.60,

runChance: 0.10,

sleepChance: 0.30
},

{
name: "활발한 타입",

speed:
0.9 + Math.random() * 0.5,

runSpeed:
2.0 + Math.random() * 0.8,

walkChance: 0.40,

runChance: 0.45,

sleepChance: 0.15
},

{
name: "잠꾸러기 타입",

speed:
0.6 + Math.random() * 0.4,

runSpeed:
1.2 + Math.random() * 0.4,

walkChance: 0.35,

runChance: 0.10,

sleepChance: 0.55
},

{
name: "분주한 타입",

speed:
1.0 + Math.random() * 0.5,

runSpeed:
2.2 + Math.random() * 0.7,

walkChance: 0.45,

runChance: 0.40,

sleepChance: 0.15
}

];


return types[
Math.floor(
Math.random() *
types.length
)
];

}



/* =================================================
   캐릭터 선택
================================================= */

function selectActor(actor) {


/*
   기존 선택 제거
*/

if (selectedActor) {

selectedActor.element
.classList
.remove("selected");

}


/*
   같은 캐릭터를 다시 누르면
   선택 해제
*/

if (selectedActor === actor) {

selectedActor = null;

controlBox
.classList
.remove("show");

updateStatus();

return;

}


selectedActor = actor;


actor.element
.classList
.add("selected");


controlBox
.classList
.add("show");


updateStatus();

}



/* =================================================
   선택 캐릭터 멈추기
================================================= */

pauseButton.addEventListener(
"click",
function() {

if (!selectedActor) {
return;
}


selectedActor.paused =
true;


selectedActor.state =
"paused";


selectedActor.element
.classList
.remove("running");

selectedActor.element
.classList
.remove("sleeping");


updateStatus();

});



/* =================================================
   선택 캐릭터 재생
================================================= */

resumeButton.addEventListener(
"click",
function() {

if (!selectedActor) {
return;
}


selectedActor.paused =
false;


chooseNewAction(
selectedActor
);


updateStatus();

});



/* =================================================
   새로운 행동
================================================= */

function chooseNewAction(actor) {

if (actor.paused) {
return;
}


/*
   이미 다른 캐릭터와
   상호작용 중이라면
*/

if (
actor.partner &&
Date.now() <
actor.togetherUntil
) {

return;

}


const r =
Math.random();


/*
   성격에 따라 행동 결정
*/

if (
r <
actor.sleepChance
) {

sleep(actor);

}

else if (
r <
actor.sleepChance +
actor.runChance
) {

run(actor);

}

else {

walk(actor);

}

}



/* =================================================
   졸기
================================================= */

function sleep(actor) {

if (actor.paused) {
return;
}


actor.state =
"sleeping";


actor.element
.classList
.add("sleeping");


actor.element
.classList
.remove("running");


/*
   2~6초 졸기
*/

actor.nextAction =
Date.now() +
2000 +
Math.random() * 4000;

}



/* =================================================
   걷기
================================================= */

function walk(actor) {

if (actor.paused) {
return;
}


actor.state =
"walking";


actor.element
.classList
.remove("sleeping");


actor.element
.classList
.remove("running");


setRandomTarget(actor);


/*
   걷는 시간
*/

actor.nextAction =
Date.now() +
2500 +
Math.random() * 3500;

}



/* =================================================
   뛰기
================================================= */

function run(actor) {

if (actor.paused) {
return;
}


actor.state =
"running";


actor.element
.classList
.remove("sleeping");


actor.element
.classList
.add("running");


setRandomTarget(actor);


/*
   뛰는 시간
*/

actor.nextAction =
Date.now() +
1500 +
Math.random() * 2200;

}



/* =================================================
   랜덤 목표
================================================= */

function setRandomTarget(actor) {

const maxX =
Math.max(
0,
stage.clientWidth -
actor.element.offsetWidth
);

const maxY =
Math.max(
0,
stage.clientHeight -
actor.element.offsetHeight
);


actor.targetX =
Math.random() * maxX;

actor.targetY =
Math.random() * maxY;


if (
actor.targetX <
actor.x
) {

actor.direction = -1;

}
else {

actor.direction = 1;

}


applyDirection(actor);

}



/* =================================================
   방향
================================================= */

function applyDirection(actor) {

if (
actor.state ===
"running"
) {

actor.element.style.transform =
"scaleX(" +
actor.direction +
") scale(1.08)";

}

else {

actor.element.style.transform =
"scaleX(" +
actor.direction +
")";

}

}



/* =================================================
   캐릭터 움직이기
================================================= */

function updateActors() {

const now =
Date.now();


actors.forEach(
function(actor) {


/*
   멈춘 캐릭터
*/

if (actor.paused) {
return;
}


/*
   다른 캐릭터와 함께 있는 중
*/

if (
actor.partner &&
now <
actor.togetherUntil
) {

stayTogether(actor);

return;

}


/*
   상호작용 종료
*/

if (
actor.partner &&
now >=
actor.togetherUntil
) {

actor.partner.element
.classList
.remove("together");

actor.element
.classList
.remove("together");

actor.partner =
null;

}


/*
   행동 변경
*/

if (
now >=
actor.nextAction
) {

chooseNewAction(actor);

}


/*
   졸고 있으면 움직이지 않음
*/

if (
actor.state ===
"sleeping"
) {

return;

}


/*
   이동
*/

const dx =
actor.targetX -
actor.x;

const dy =
actor.targetY -
actor.y;


const distance =
Math.sqrt(
dx * dx +
dy * dy
);


if (distance < 1) {
return;
}


let speed =
actor.speed;


if (
actor.state ===
"running"
) {

speed =
actor.runSpeed;

}


actor.x +=
(dx / distance) *
speed;


actor.y +=
(dy / distance) *
speed;


/*
   화면 밖 방지
*/

const maxX =
stage.clientWidth -
actor.element.offsetWidth;

const maxY =
stage.clientHeight -
actor.element.offsetHeight;


actor.x =
Math.max(
0,
Math.min(
actor.x,
maxX
)
);


actor.y =
Math.max(
0,
Math.min(
actor.y,
maxY
)
);


/*
   화면 적용
*/

actor.element.style.left =
actor.x + "px";

actor.element.style.top =
actor.y + "px";


/*
   이동 방향
*/

if (dx < 0) {

actor.direction = -1;

}
else {

actor.direction = 1;

}


applyDirection(actor);

}
);


/*
   캐릭터끼리 만났는지 검사
*/

checkInteractions();


requestAnimationFrame(
updateActors
);

}



/* =================================================
   캐릭터끼리 만나는지 검사
================================================= */

function checkInteractions() {

if (
actors.length <
2
) {
return;
}


const now =
Date.now();


for (
let i = 0;
i < actors.length;
i++
) {

const a =
actors[i];


if (
a.paused ||
a.partner
) {
continue;
}


for (
let j = i + 1;
j < actors.length;
j++
) {

const b =
actors[j];


if (
b.paused ||
b.partner
) {
continue;
}


/*
   거리
*/

const dx =
a.x - b.x;

const dy =
a.y - b.y;


const distance =
Math.sqrt(
dx * dx +
dy * dy
);


/*
   충분히 가까워짐
*/

if (
distance <
75
) {


/*
   25% 확률로 상호작용
*/

if (
Math.random() <
0.025
) {

startInteraction(
a,
b
);

}


}

}

}

}



/* =================================================
   캐릭터 상호작용
================================================= */

function startInteraction(a, b) {

const now =
Date.now();


a.partner =
b;

b.partner =
a;


/*
   2~4초 함께 있기
*/

const duration =
2500 +
Math.random() *
2000;


a.togetherUntil =
now + duration;

b.togetherUntil =
now + duration;


a.state =
"idle";

b.state =
"idle";


a.targetX =
a.x;

a.targetY =
a.y;

b.targetX =
b.x;

b.targetY =
b.y;


a.element
.classList
.add("together");

b.element
.classList
.add("together");


/*
   서로 바라보기
*/

if (
b.x >
a.x
) {

a.direction = 1;

b.direction = -1;

}
else {

a.direction = -1;

b.direction = 1;

}


applyDirection(a);

applyDirection(b);

}



/* =================================================
   같이 있는 동안 위치 유지
================================================= */

function stayTogether(actor) {

if (
!actor.partner
) {
return;
}


const partner =
actor.partner;


/*
   서로 너무 멀어지면
   살짝 가까워짐
*/

const dx =
partner.x -
actor.x;

const dy =
partner.y -
actor.y;


const distance =
Math.sqrt(
dx * dx +
dy * dy
);


if (
distance >
90
) {

actor.targetX =
partner.x;

actor.targetY =
partner.y;

}


/*
   서로 바라보기
*/

if (
partner.x >
actor.x
) {

actor.direction = 1;

}
else {

actor.direction = -1;

}


applyDirection(actor);

}



/* =================================================
   상태 표시
================================================= */

function updateStatus() {

if (
actors.length === 0
) {

status.textContent =
"캐릭터를 추가해보세요";

return;

}


if (selectedActor) {

if (
selectedActor.paused
) {

status.textContent =
"선택한 캐릭터가 멈춰 있어요";

}

else if (
selectedActor.partner
) {

status.textContent =
"다른 캐릭터와 함께 있어요";

}

else {

status.textContent =
"선택한 캐릭터 · " +
getStateText(
selectedActor.state
);

}

return;

}


status.textContent =
"캐릭터들이 각자 자유롭게 움직이고 있어요";

}



/* =================================================
   상태 이름
================================================= */

function getStateText(state) {

switch (state) {

case "sleeping":
return "졸고 있어요 😴";

case "running":
return "뛰고 있어요";

case "walking":
return "걷고 있어요";

case "paused":
return "멈춰 있어요";

default:
return "쉬고 있어요";

}

}



/* =================================================
   상태 표시 갱신
================================================= */

setInterval(
updateStatus,
300
);



/* =================================================
   애니메이션 시작
================================================= */

requestAnimationFrame(
updateActors
);



/* =================================================
   갤러리 저장
================================================= */

const gallerySave =
document.getElementById(
"gallerySave"
);


gallerySave.addEventListener(
"click",
async function() {


const canvas =
document.createElement(
"canvas"
);


const ctx =
canvas.getContext("2d");


const width = 900;

const height = 1100;


canvas.width =
width;

canvas.height =
height;


/*
   흰색
*/

ctx.fillStyle =
"#fff";

ctx.fillRect(
0,
0,
width,
height
);


/*
   날짜
*/

ctx.fillStyle =
"#111";

ctx.font =
"24px sans-serif";

ctx.fillText(
dateElement.textContent,
60,
55
);


/*
   제목
*/

ctx.font =
"bold 42px sans-serif";

ctx.fillText(
titleInput.value ||
"오늘의 일기",
60,
110
);


/*
   일기
*/

ctx.font =
"26px sans-serif";

drawText(
ctx,
diaryInput.value || "",
60,
175,
780,
42
);


/*
   캐릭터 영역
*/

const stageX = 60;

const stageY = 500;

const stageW = 780;

const stageH = 400;


ctx.strokeStyle =
"#ddd";

ctx.lineWidth = 2;


ctx.strokeRect(
stageX,
stageY,
stageW,
stageH
);


/*
   캐릭터 저장
*/

for (

);

/* =================================================
   글 줄바꿈
================================================= */

function drawText(
ctx,
text,
x,
y,
maxWidth,
lineHeight
) {

const lines =
String(text).split("\n");


let currentY =
y;


for (
const line of lines
) {

let currentLine = "";


for (
const char of line
) {

const testLine =
currentLine + char;


const width =
ctx.measureText(
testLine
).width;


if (
width >
maxWidth &&
currentLine
) {

ctx.fillText(
currentLine,
x,
currentY
);


currentY +=
lineHeight;


currentLine =
char;

}

else {

currentLine =
testLine;

}

}


ctx.fillText(
currentLine,
x,
currentY
);


currentY +=
lineHeight;

}

}



/* =================================================
   이미지 불러오기
================================================= */

function loadImage(src) {

return new Promise(
function(resolve, reject) {

const img =
new Image();


img.onload =
function() {

resolve(img);

};


img.onerror =
function() {

reject(
new Error(
"이미지를 불러올 수 없습니다."
)
);

};


img.src =
src;

}
);

}
