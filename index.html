<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>그림일기</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:#fff;
  color:#111;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
}

header{padding:18px 16px 10px}
.date{font-size:13px;color:#777}
.container{padding:0 16px 35px}

input[type="text"]{
  width:100%;
  border:1px solid #ddd;
  border-radius:12px;
  padding:12px;
  font-size:16px;
  outline:none;
  background:#fff;
}

textarea{
  width:100%;
  min-height:180px;
  margin-top:10px;
  border:1px solid #ddd;
  border-radius:12px;
  padding:14px;
  font-size:16px;
  line-height:1.6;
  outline:none;
  resize:vertical;
  background:#fff;
}

.stage{
  position:relative;
  width:100%;
  height:380px;
  margin:15px 0;
  border:1px solid #ddd;
  border-radius:18px;
  overflow:hidden;

  /* 원래 기본 배경 */
  background:#fafafa;

  background-position:center;
  background-size:cover;
  background-repeat:no-repeat;
  touch-action:none;
}

.actor,
.accessory,
.furniture{
  position:absolute;
  object-fit:contain;
  user-select:none;
  -webkit-user-select:none;
  -webkit-touch-callout:none;
  touch-action:none;
}

.actor{
  width:90px;
  height:90px;
  z-index:30;
  cursor:grab;
}

.actor.selected{
  outline:2px dashed #777;
  outline-offset:4px;
  border-radius:12px;
}

.actor.sleeping{opacity:.65}

.accessory{
  width:55px;
  height:55px;
  z-index:40;
  cursor:grab;
  transform-origin:center center;
}

.accessory.selected{
  outline:2px dashed #777;
  outline-offset:3px;
  border-radius:8px;
}

.accessory.locked{
  cursor:default;
}

.furniture{
  width:90px;
  height:90px;
  z-index:20;
  cursor:grab;
}

.furniture.selected{
  outline:2px dashed #777;
  outline-offset:4px;
  border-radius:10px;
}

.furniture.locked{
  cursor:default;
}

.status{
  position:absolute;
  left:50%;
  bottom:8px;
  transform:translateX(-50%);
  font-size:12px;
  color:#777;
  pointer-events:none;
  white-space:nowrap;
  z-index:100;
}

.add-area{margin:12px 0 18px}

.photo-button,
.background-file-label,
.accessory-upload,
.furniture-upload{
  display:block;
  width:100%;
  padding:12px 16px;
  border:1px solid #ddd;
  border-radius:12px;
  background:#fff;
  color:#111;
  text-align:center;
  cursor:pointer;
}

#photo,
#backgroundFile,
#accessoryFile,
#furnitureFile{
  display:none;
}

.background-area{margin-bottom:18px}

.background-select{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:12px;
  background:#fff;
  font-size:15px;
}

.background-file-label{margin-top:10px}

.control-box,
.accessory-box,
.furniture-box{
  margin-top:10px;
  padding:10px;
  border:1px solid #ddd;
  border-radius:12px;
  background:#fafafa;
}

.control-box{display:none}
.control-box.show{display:block}

.accessory-control,
.furniture-control{
  display:none;
}

.accessory-control.show,
.furniture-control.show{
  display:block;
}

.control-title,
.accessory-title,
.furniture-title{
  font-size:13px;
  color:#666;
  margin-bottom:8px;
}

.size-control{margin-top:12px}

.size-label{
  font-size:13px;
  color:#666;
  margin-bottom:5px;
}

input[type=range]{
  width:100%;
  margin:0;
  accent-color:#777;
}

.accessory-grid,
.furniture-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
}

.accessory-choice,
.furniture-choice{
  border:1px solid #ddd;
  border-radius:10px;
  background:#fff;
  padding:8px 4px;
  font-size:24px;
  line-height:1.2;
  cursor:pointer;
  margin:0;
}

.accessory-choice span,
.furniture-choice span{
  display:block;
  font-size:11px;
  margin-top:3px;
  color:#666;
}

.accessory-upload,
.furniture-upload{
  margin-top:8px;
  padding:10px;
  font-size:13px;
}

.rotation-control{margin-top:12px}

.help{
  margin-top:8px;
  text-align:center;
  font-size:12px;
  color:#888;
}

button{
  width:100%;
  border:1px solid #ddd;
  background:#fff;
  color:#111;
  border-radius:12px;
  padding:13px 16px;
  font-size:15px;
  margin-top:10px;
}

button:disabled{opacity:.5}
</style>
</head>

<body>

<header>
<div class="date" id="date"></div>
</header>

<div class="container">

<input type="text" id="title" placeholder="오늘의 제목">

<textarea id="diary" placeholder="오늘의 일기를 써보세요."></textarea>

<div class="background-area">

<select id="backgroundSelect" class="background-select">
<option value="plain">기본 배경</option>
<option value="sky">파란 하늘</option>
<option value="night">밤하늘</option>
<option value="grass">초원</option>
<option value="pink">분홍색</option>
<option value="yellow">노란색</option>
</select>

<label class="background-file-label" for="backgroundFile">
＋ 배경 사진 추가
</label>

<input id="backgroundFile" type="file" accept="image/*">

</div>

<!-- 일기 내용 아래 캐릭터를 놓는 공간 -->
<div class="stage" id="stage">
<div class="status" id="status">캐릭터를 추가해보세요</div>
</div>

<div class="add-area">
<label class="photo-button" for="photo">＋ 캐릭터 추가</label>
<input id="photo" type="file" accept="image/*">
</div>


<!-- 캐릭터 컨트롤 -->

<div class="control-box" id="controlBox">

<div class="control-title">선택한 캐릭터</div>

<button id="pauseButton">⏸ 이 캐릭터 멈추기</button>
<button id="resumeButton">▶ 다시 움직이기</button>
<button id="bringActorFrontButton">⬆️ 앞으로 보내기</button>
<button id="sendActorBackButton">⬇️ 뒤로 보내기</button>
<button id="deleteActorButton">🗑 이 캐릭터 삭제</button>

<div class="size-control">
<div class="size-label">캐릭터 크기</div>
<input type="range" id="sizeSlider" min="50" max="200" value="100">
</div>


<!-- 악세사리 -->

<div class="accessory-box">

<div class="accessory-title">악세사리</div>

<div class="accessory-grid">

<button class="accessory-choice" data-emoji="🎩">
🎩<span>모자</span>
</button>

<button class="accessory-choice" data-emoji="👑">
👑<span>왕관</span>
</button>

<button class="accessory-choice" data-emoji="🎀">
🎀<span>리본</span>
</button>

<button class="accessory-choice" data-emoji="😎">
😎<span>선글라스</span>
</button>

<button class="accessory-choice" data-emoji="🐱">
🐱<span>고양이귀</span>
</button>

<button class="accessory-choice" data-emoji="✨">
✨<span>별</span>
</button>

</div>

<label class="accessory-upload" for="accessoryFile">
＋ 악세사리 사진 추가
</label>

<input id="accessoryFile" type="file" accept="image/*">


<div class="accessory-control" id="accessoryControl">

<div class="size-label">
선택한 악세사리 크기
</div>

<input
type="range"
id="accessorySizeSlider"
min="20"
max="200"
value="100"
>

<div class="rotation-control">

<div class="size-label">
선택한 악세사리 각도
</div>

<input
type="range"
id="accessoryRotationSlider"
min="-180"
max="180"
value="0"
>

</div>

<button id="lockAccessoryButton">
🔒 악세사리 고정
</button>

<button id="deleteAccessoryButton">
🗑 악세사리 삭제
</button>

</div>

</div>

</div>


<!-- 가구 -->

<div class="furniture-box">

<div class="furniture-title">가구</div>

<div class="furniture-grid">

<button class="furniture-choice" data-emoji="🪑">
🪑<span>의자</span>
</button>

<button class="furniture-choice" data-emoji="🛋️">
🛋️<span>소파</span>
</button>

<button class="furniture-choice" data-emoji="🛏️">
🛏️<span>침대</span>
</button>

<button class="furniture-choice" data-emoji="🪴">
🪴<span>화분</span>
</button>

<button class="furniture-choice" data-emoji="🗄️">
🗄️<span>서랍장</span>
</button>

<button class="furniture-choice" data-emoji="🪟">
🪟<span>창문</span>
</button>

</div>

<label class="furniture-upload" for="furnitureFile">
＋ 가구 사진 추가
</label>

<input id="furnitureFile" type="file" accept="image/*">

<div class="furniture-control" id="furnitureControl">

<div class="size-label">
선택한 가구 크기
</div>

<input
type="range"
id="furnitureSizeSlider"
min="30"
max="250"
value="100"
>

<button id="lockFurnitureButton">
🔒 가구 고정
</button>

<button id="deleteFurnitureButton">
🗑 가구 삭제
</button>

</div>

</div>


<div class="help">
캐릭터, 악세사리, 가구를 손가락으로 끌어서 원하는 곳에 놓을 수 있어요.
</div>

<button id="save">저장</button>

<button id="clearAll">전체 삭제</button>

</div>


<script>

/* =========================================
기본 요소
========================================= */

const dateElement=
document.getElementById("date");

const titleInput=
document.getElementById("title");

const diaryInput=
document.getElementById("diary");

const photoInput=
document.getElementById("photo");

const stage=
document.getElementById("stage");

const status=
document.getElementById("status");

const controlBox=
document.getElementById("controlBox");

const pauseButton=
document.getElementById("pauseButton");

const resumeButton=
document.getElementById("resumeButton");

const bringActorFrontButton=
document.getElementById("bringActorFrontButton");

const sendActorBackButton=
document.getElementById("sendActorBackButton");

const deleteActorButton=
document.getElementById("deleteActorButton");

const sizeSlider=
document.getElementById("sizeSlider");

const backgroundSelect=
document.getElementById("backgroundSelect");

const backgroundFile=
document.getElementById("backgroundFile");

const accessoryFile=
document.getElementById("accessoryFile");

const accessoryControl=
document.getElementById("accessoryControl");

const accessorySizeSlider=
document.getElementById("accessorySizeSlider");

const accessoryRotationSlider=
document.getElementById("accessoryRotationSlider");

const lockAccessoryButton=
document.getElementById("lockAccessoryButton");

const deleteAccessoryButton=
document.getElementById("deleteAccessoryButton");

const furnitureFile=
document.getElementById("furnitureFile");

const furnitureControl=
document.getElementById("furnitureControl");

const furnitureSizeSlider=
document.getElementById("furnitureSizeSlider");

const lockFurnitureButton=
document.getElementById("lockFurnitureButton");

const deleteFurnitureButton=
document.getElementById("deleteFurnitureButton");

const saveButton=
document.getElementById("save");

const clearAllButton=
document.getElementById("clearAll");


const actors=[];
const accessories=[];
const furnitures=[];

let selectedActor=null;
let selectedAccessory=null;
let selectedFurniture=null;


/* =========================================
날짜
========================================= */

const now=new Date();

dateElement.textContent=
now.getFullYear()+"년 "+
(now.getMonth()+1)+"월 "+
now.getDate()+"일";


/* =========================================
일기
========================================= */

titleInput.value=
localStorage.getItem("diary-title")||"";

diaryInput.value=
localStorage.getItem("diary-text")||"";

titleInput.addEventListener(
"input",
()=>{
localStorage.setItem(
"diary-title",
titleInput.value
);
}
);

diaryInput.addEventListener(
"input",
()=>{
localStorage.setItem(
"diary-text",
diaryInput.value
);
}
);


/* =========================================
배경
========================================= */

let currentBackground={
type:"plain",
src:null
};

function applyBackground(type){

currentBackground={
type:type,
src:null
};

stage.style.backgroundImage="";

if(type==="sky"){

/* 원래 파란 하늘 */
stage.style.background=
"linear-gradient(#bde8ff,#fff)";

}

else if(type==="night"){

stage.style.background=
"linear-gradient(#101528,#343b5c)";

}

else if(type==="grass"){

stage.style.background=
"linear-gradient(#dff5d8 0%,#c9ebc1 65%,#a9d79e 65%,#a9d79e 100%)";

}

else if(type==="pink"){

stage.style.background="#ffe8ef";

}

else if(type==="yellow"){

stage.style.background="#fff4b8";

}

else{

/* 원래 기본 배경 */
stage.style.background="#fafafa";

}

}

backgroundSelect.addEventListener(
"change",
e=>applyBackground(e.target.value)
);

backgroundFile.addEventListener(
"change",
e=>{

const file=e.target.files[0];

if(!file)return;

const reader=
new FileReader();

reader.onload=ev=>{

currentBackground={
type:"image",
src:ev.target.result
};

stage.style.backgroundImage=
`url("${ev.target.result}")`;

stage.style.backgroundSize="cover";
stage.style.backgroundPosition="center";
stage.style.backgroundRepeat="no-repeat";

};

reader.readAsDataURL(file);

backgroundFile.value="";

}
);

applyBackground("plain");


/* =========================================
선택 해제
========================================= */

function clearSelections(){

if(selectedActor)
selectedActor.element.classList.remove(
"selected"
);

if(selectedAccessory)
selectedAccessory.element.classList.remove(
"selected"
);

if(selectedFurniture)
selectedFurniture.element.classList.remove(
"selected"
);

selectedActor=null;
selectedAccessory=null;
selectedFurniture=null;

controlBox.classList.remove("show");

accessoryControl.classList.remove("show");

furnitureControl.classList.remove("show");

}


/* =========================================
캐릭터 선택
========================================= */

function selectActor(actor){

clearSelections();

selectedActor=actor;

actor.element.classList.add(
"selected"
);

controlBox.classList.add(
"show"
);

sizeSlider.value=
actor.size;

updateStatus();

}


/* =========================================
악세사리 선택
========================================= */

function selectAccessory(a){

clearSelections();

selectedAccessory=a;

a.element.classList.add(
"selected"
);

accessoryControl.classList.add(
"show"
);

accessorySizeSlider.value=
a.size;

accessoryRotationSlider.value=
a.rotation;

updateAccessoryLockButton();

updateStatus();

}


/* =========================================
가구 선택
========================================= */

function selectFurniture(f){

clearSelections();

selectedFurniture=f;

f.element.classList.add(
"selected"
);

furnitureControl.classList.add(
"show"
);

furnitureSizeSlider.value=
f.size;

updateFurnitureLockButton();

updateStatus();

}


/* =========================================
이모지
========================================= */

function emojiSVG(emoji){

return "data:image/svg+xml;charset=utf-8,"+
encodeURIComponent(
`<svg xmlns="http://www.w3.org/2000/svg"
width="200"
height="200">
<text x="100"
y="125"
font-size="120"
text-anchor="middle">${emoji}</text>
</svg>`
);

}


/* =========================================
캐릭터 성격
========================================= */

function createPersonality(){

const types=[

{
speed:.6,
runSpeed:1.5,
sleepChance:.3,
runChance:.15
},

{
speed:.9,
runSpeed:2.2,
sleepChance:.1,
runChance:.45
},

{
speed:.5,
runSpeed:1.2,
sleepChance:.55,
runChance:.05
},

{
speed:1,
runSpeed:2.5,
sleepChance:.15,
runChance:.4
}

];

return types[
Math.floor(
Math.random()*types.length
)
];

}


/* =========================================
캐릭터 추가
========================================= */

photoInput.addEventListener(
"change",
e=>{

const file=e.target.files[0];

if(!file)return;

const reader=
new FileReader();

reader.onload=ev=>{

const img=
document.createElement("img");

img.className="actor";

img.src=ev.target.result;

const personality=
createPersonality();

const actor={

element:img,

originalFile:file,
originalImage:null,

x:
20+
Math.random()*
Math.max(
1,
stage.clientWidth-130
),

y:
20+
Math.random()*
Math.max(
1,
stage.clientHeight-130
),

targetX:0,
targetY:0,

size:100,

speed:personality.speed,
runSpeed:personality.runSpeed,
sleepChance:personality.sleepChance,
runChance:personality.runChance,

state:"walking",

paused:false,
dragging:false,

layer:"front",

nextAction:
Date.now()+1500

};

actor.targetX=actor.x;
actor.targetY=actor.y;

const original=
new Image();

original.onload=()=>{
actor.originalImage=
original;
};

original.src=
ev.target.result;

img.style.left=
actor.x+"px";

img.style.top=
actor.y+"px";

actors.push(actor);

stage.appendChild(img);

applyActorLayer(actor);

enableActorDrag(actor);

updateStatus();

};

reader.readAsDataURL(file);

photoInput.value="";

});


/* =========================================
캐릭터 레이어
========================================= */

function applyActorLayer(actor){

if(!actor)return;

actor.element.style.zIndex=
actor.layer==="back"
?"15"
:"30";

for(const a of accessories){

if(a.owner===actor){

a.element.style.zIndex=
actor.layer==="back"
?"14"
:"40";

}

}

}


/* =========================================
캐릭터 드래그
========================================= */

function enableActorDrag(actor){

const el=actor.element;

let startPointerX=0;
let startPointerY=0;

let startX=0;
let startY=0;

el.addEventListener(
"pointerdown",
e=>{

e.preventDefault();
e.stopPropagation();

if(selectedActor===actor){

clearSelections();

updateStatus();

return;

}

selectActor(actor);

actor.dragging=true;

startPointerX=e.clientX;
startPointerY=e.clientY;

startX=actor.x;
startY=actor.y;

try{
el.setPointerCapture(e.pointerId);
}catch(_){}

}
);


el.addEventListener(
"pointermove",
e=>{

if(!actor.dragging)return;

e.preventDefault();

const dx=
e.clientX-
startPointerX;

const dy=
e.clientY-
startPointerY;

const maxX=
Math.max(
0,
stage.clientWidth-
el.offsetWidth
);

const maxY=
Math.max(
0,
stage.clientHeight-
el.offsetHeight
);

actor.x=
Math.max(
0,
Math.min(
startX+dx,
maxX
)
);

actor.y=
Math.max(
0,
Math.min(
startY+dy,
maxY
)
);

actor.targetX=actor.x;
actor.targetY=actor.y;

el.style.left=
actor.x+"px";

el.style.top=
actor.y+"px";

updateAttachedAccessories(
actor
);

}
);


el.addEventListener(
"pointerup",
e=>{

actor.dragging=false;

try{
el.releasePointerCapture(
e.pointerId
);
}catch(_){}

}
);

}


/* =========================================
캐릭터 크기
========================================= */

sizeSlider.addEventListener(
"input",
()=>{

if(!selectedActor)return;

const a=selectedActor;

const oldSize=
a.element.offsetWidth;

const centerX=
a.x+oldSize/2;

const centerY=
a.y+oldSize/2;

a.size=
Number(sizeSlider.value);

const newSize=
90*a.size/100;

a.element.style.width=
newSize+"px";

a.element.style.height=
newSize+"px";

a.x=
Math.max(
0,
Math.min(
centerX-newSize/2,
stage.clientWidth-newSize
)
);

a.y=
Math.max(
0,
Math.min(
centerY-newSize/2,
stage.clientHeight-newSize
)
);

a.element.style.left=
a.x+"px";

a.element.style.top=
a.y+"px";

updateAttachedAccessories(a);

}
);


/* =========================================
자동 움직임
========================================= */

function chooseNewAction(a){

if(a.paused||a.dragging)return;

const r=Math.random();

if(r<a.sleepChance){

a.state="sleeping";

a.element.classList.add(
"sleeping"
);

a.element.classList.remove(
"running"
);

a.nextAction=
Date.now()+
2000+
Math.random()*3000;

}

else{

a.state=
r<
a.sleepChance+a.runChance
?"running"
:"walking";

a.element.classList.remove(
"sleeping"
);

a.element.classList.toggle(
"running",
a.state==="running"
);

const mx=
Math.max(
0,
stage.clientWidth-
a.element.offsetWidth
);

const my=
Math.max(
0,
stage.clientHeight-
a.element.offsetHeight
);

a.targetX=
Math.random()*mx;

a.targetY=
Math.random()*my;

a.nextAction=
Date.now()+
(
a.state==="running"
?1500
:2500
)+
Math.random()*2500;

}

}


function updateActors(){

const time=
Date.now();

for(const a of actors){

if(
a.paused||
a.dragging
)
continue;

if(
time>=a.nextAction
)
chooseNewAction(a);

if(
a.state==="sleeping"
)
continue;

const dx=
a.targetX-a.x;

const dy=
a.targetY-a.y;

const distance=
Math.hypot(dx,dy);

if(distance<1)
continue;

const step=
Math.min(
a.state==="running"
?a.runSpeed
:a.speed,
distance
);

a.x+=
dx/distance*
step;

a.y+=
dy/distance*
step;

a.element.style.left=
a.x+"px";

a.element.style.top=
a.y+"px";

updateAttachedAccessories(a);

}

updateStatus();

requestAnimationFrame(
updateActors
);

}

function enableAccessoryDrag(a){

let startX=0;
let startY=0;

let moved=false;

el.addEventListener(
"pointerdown",
e=>{

e.stopPropagation();

pointerStartX=e.clientX;

startX=a.x;

  이동은 시작하지 않음.
*/

a.dragging=false;

}

a.dragging=true;

try{

e.pointerId
);

}catch(_){}

}
);

"pointermove",
e=>{

e.preventDefault();
e.stopPropagation();

e.clientX-
pointerStartX;

e.clientY-
pointerStartY;


/*
  아주 조금 움직인 것은
  단순 터치로 처리.

if(
Math.abs(dx)>4 ||
Math.abs(dy)>4
){

startY+dy;

Math.max(
0,
stage.clientWidth-
el.offsetWidth

stage.clientHeight-
el.offsetHeight
);

Math.max(

x,
maxX
)
);

y=
Math.max(
0,
Math.min(
y,
maxY
)
);

a.x=x;
a.y=y;

a.relativeX=
a.x-
a.owner.x;

a.relativeY=
a.y-
a.owner.y;

================================================== */

function wrapText(
ctx,
text,
maxWidth
){

const lines=[];

for(
const paragraph
of String(text).split("\n")
){

if(!paragraph){

lines.push("");

continue;

}

let line="";

for(
const char
of paragraph
){

const test=
line+char;

if(
ctx.measureText(test).width>
maxWidth &&
line
){

lines.push(line);

line=char;

}

else{

line=test;

}

}

lines.push(line);

}

return lines;

}


function loadImage(src){

return new Promise(
(resolve,reject)=>{

const img=
new Image();

img.onload=
()=>resolve(img);

img.onerror=
reject;

img.src=src;

}
);


}


async function getImage(item){

if(item.originalImage)
return item.originalImage;

if(item.originalFile)
return await createImageBitmap(
item.originalFile
);

return await loadImage(
item.element.src
);

}


function roundedBox(
ctx,
x,
y,
w,
h,
r
){

ctx.beginPath();

ctx.moveTo(
x+r,
y
);

ctx.lineTo(
x+w-r,
y
);

ctx.quadraticCurveTo(
x+w,
y,
x+w,
y+r
);

ctx.lineTo(
x+w,
y+h-r
);

ctx.quadraticCurveTo(
x+w,
y+h,
x+w-r,
y+h
);

ctx.lineTo(
x+r,
y+h
);

ctx.quadraticCurveTo(
x,
y+h,
x,
y+h-r
);

ctx.lineTo(
x,
y+r
);

ctx.quadraticCurveTo(
x,
y,
x+r,
y
);

ctx.closePath();

}

bg.naturalWidth/
bg.naturalHeight;

const stageRatio=
stageW/stageH;

let dw;
let dh;

if(ratio>stageRatio){

dh=stageH;
dw=dh*ratio;

}

else{

dw=stageW;
dh=dw/ratio;

}

ctx.drawImage(
bg,
sx+(stageW-dw)/2,
sy+(stageH-dh)/2,
dw,
dh
);

}

else{

/*
  저장 이미지에서도 원래 배경 유지
*/

if(currentBackground.type==="sky"){

const g=
ctx.createLinearGradient(
0,0,0,stageH
);

g.addColorStop(
0,
"#bde8ff"
);

g.addColorStop(
1,
"#fff"
);

ctx.fillStyle=g;

}

else if(currentBackground.type==="night"){

ctx.fillStyle="#101528";

}

else if(currentBackground.type==="grass"){

ctx.fillStyle="#c9ebc1";

}

else if(currentBackground.type==="pink"){

ctx.fillStyle="#ffe8ef";

}

else if(currentBackground.type==="yellow"){

ctx.fillStyle="#fff4b8";

}

else{

/*
  기본 배경 원래 색
*/
ctx.fillStyle="#fafafa";

}

ctx.fillRect(
sx,
sy,
stageW,
stageH
);

}


const scaleX=
stageW/
stage.clientWidth;

const scaleY=
stageH/
stage.clientHeight;


/* 가구 */

for(
const f
of furnitures
){

try{

const img=
await getImage(f);

const w=
f.element.offsetWidth;

const h=
f.element.offsetHeight;

const nw=
img.naturalWidth||
img.width;

const nh=
img.naturalHeight||
img.height;

const fit=
Math.min(
w/nw,
h/nh
);

const dw=nw*fit;
const dh=nh*fit;

ctx.drawImage(
img,

sx+
f.x*scaleX+
(w-dw)/2*scaleX,

sy+
f.y*scaleY+
(h-dh)/2*scaleY,

dw*scaleX,
dh*scaleY
);

}catch(_){}

}


/* 캐릭터 */

async function drawActor(a){

const img=
await getImage(a);

const w=
a.element.offsetWidth;

const h=
a.element.offsetHeight;

const nw=
img.naturalWidth||
img.width;

const nh=
img.naturalHeight||
img.height;

const fit=
Math.min(
w/nw,
h/nh
);

const dw=nw*fit;
const dh=nh*fit;

ctx.drawImage(
img,

sx+
a.x*scaleX+
(w-dw)/2*scaleX,

sy+
a.y*scaleY+
(h-dh)/2*scaleY,

dw*scaleX,
dh*scaleY
);

}


for(
const a
of actors
){

if(
a.layer==="back"
){

try{
await drawActor(a);
}catch(_){}

}

}


for(
const a
of actors
){

if(
a.layer!=="back"
){

try{
await drawActor(a);
}catch(_){}

}

}


/* 악세사리 */

for(
const a
of accessories
){

try{

const img=
await getImage(a);

const w=
a.element.offsetWidth;

const h=
a.element.offsetHeight;

const nw=
img.naturalWidth||
img.width;

const nh=
img.naturalHeight||
img.height;

const fit=
Math.min(
w/nw,
h/nh
);

const dw=nw*fit;
const dh=nh*fit;

const x=
sx+
a.x*scaleX+
(w-dw)/2*scaleX;

const yy=
sy+
a.y*scaleY+
(h-dh)/2*scaleY;

const cx=
x+
dw*scaleX/2;

const cy=
yy+
dh*scaleY/2;

ctx.save();

ctx.translate(
cx,
cy
);

ctx.rotate(
a.rotation*
Math.PI/
180
);

ctx.drawImage(
img,
-dw*scaleX/2,
-dh*scaleY/2,
dw*scaleX,
dh*scaleY
);

ctx.restore();

}catch(_){}

}


ctx.restore();


/* 테두리 */

ctx.save();

roundedBox(
ctx,
sx,
sy,
stageW,
stageH,
24
);

ctx.strokeStyle="#ddd";

ctx.lineWidth=2;

ctx.stroke();

ctx.restore();


/* PNG */

const blob=
await new Promise(
resolve=>
canvas.toBlob(
resolve,
"image/png"
)
);

const file=
new File(
[blob],
"그림일기.png",
{
type:"image/png"
}
);


/* 아이폰 공유 */

if(
navigator.share &&
navigator.canShare &&
navigator.canShare({
files:[file]
})
){

try{

await navigator.share({
files:[file],
title:"그림일기"
});

return;

}catch(e){

if(
e.name==="AbortError"
)
return;

}

}


/* 다운로드 */

const url=
URL.createObjectURL(blob);

const link=
document.createElement("a");

link.href=url;

link.download=
"그림일기.png";

document.body.appendChild(link);

link.click();

link.remove();

setTimeout(
()=>{
URL.revokeObjectURL(url);
},
1000
);

}

catch(error){

console.error(error);

alert(
"저장 중 문제가 생겼어요."
);

}

finally{

saveButton.disabled=false;

}

});


/* ==================================================
   전체 삭제
================================================== */

clearAllButton.addEventListener(
"click",
()=>{

titleInput.value="";
diaryInput.value="";

localStorage.removeItem(
"diary-title"
);

localStorage.removeItem(
"diary-text"
);


for(
const a
of actors
)
a.element.remove();

for(
const a
of accessories
)
a.element.remove();

for(
const f
of furnitures
)
f.element.remove();


actors.length=0;
accessories.length=0;
furnitures.length=0;

clearSelections();

updateStatus();

}
);


/* 시작 */

updateStatus();

requestAnimationFrame(
updateActors
);

</script>

</body>
</html>
