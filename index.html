<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               viewport-fit=cover">

<meta name="apple-mobile-web-app-capable"
      content="yes">

<meta name="apple-mobile-web-app-status-bar-style"
      content="default">

<title>그림일기</title>

<style>

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  background: #fff;
  color: #111;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Apple SD Gothic Neo",
    "Noto Sans KR",
    sans-serif;
}


/* =========================
   상단
========================= */

header {
  padding: 18px 16px 10px;
}

.date {
  font-size: 13px;
  color: #777;
}


/* =========================
   전체
========================= */

.container {
  padding: 0 16px 35px;
}


/* =========================
   제목
========================= */

input[type="text"] {
  width: 100%;

  border: 1px solid #ddd;
  border-radius: 12px;

  padding: 12px;

  font-size: 16px;

  outline: none;

  background: #fff;
}


/* =========================
   일기
========================= */

textarea {
  width: 100%;

  min-height: 180px;

  margin-top: 10px;

  border: 1px solid #ddd;
  border-radius: 12px;

  padding: 14px;

  font-size: 16px;

  line-height: 1.6;

  outline: none;

  background: #fff;

  resize: vertical;
}


/* =========================
   캐릭터 공간
========================= */

.stage {
  position: relative;

  width: 100%;
  height: 380px;

  margin: 15px 0;

  border: 1px solid #ddd;
  border-radius: 18px;

  overflow: hidden;

  background: #fafafa;

  touch-action: none;
}


/* =========================
   캐릭터
========================= */

.actor {
  position: absolute;

  width: 90px;
  height: 90px;

  object-fit: contain;

  user-select: none;
  -webkit-user-select: none;

  touch-action: none;

  transition:
    transform 0.25s ease,
    opacity 0.25s ease;

  cursor: pointer;
}


/*
   선택된 캐릭터
*/

.actor.selected {
  outline: 2px dashed #777;

  outline-offset: 4px;

  border-radius: 12px;
}


/*
   졸고 있는 상태
*/

.actor.sleeping {
  opacity: 0.75;

  transform:
    scale(0.92)
    rotate(-3deg);
}


/*
   뛰는 상태
*/

.actor.running {
  transform:
    scale(1.08);
}


/* =========================
   캐릭터 상태 표시
========================= */

.status {
  position: absolute;

  left: 50%;

  bottom: 8px;

  transform:
    translateX(-50%);

  font-size: 12px;

  color: #777;

  pointer-events: none;

  opacity: 0.8;
}


/* =========================
   사진 추가
========================= */

.add-area {
  margin: 12px 0 18px;
}


.photo-button {
  display: block;

  width: 100%;

  padding: 12px 16px;

  border: 1px solid #ddd;
  border-radius: 12px;

  background: #fff;

  color: #111;

  font-size: 15px;

  text-align: center;

  cursor: pointer;
}


#photo {
  display: none;
}


/* =========================
   버튼
========================= */

button {
  width: 100%;

  border: 1px solid #ddd;

  background: #fff;

  color: #111;

  border-radius: 12px;

  padding: 13px 16px;

  font-size: 15px;

  margin-top: 10px;
}


/* =========================
   선택 캐릭터 제어
========================= */

.control-box {
  display: none;

  margin-top: 10px;

  padding: 10px;

  border: 1px solid #ddd;

  border-radius: 12px;

  background: #fafafa;
}


.control-box.show {
  display: block;
}


.control-title {
  font-size: 13px;

  color: #666;

  margin-bottom: 5px;
}


/* =========================
   안내
========================= */

.help {
  margin-top: 8px;

  text-align: center;

  font-size: 12px;

  color: #888;
}

</style>
</head>


<body>


<header>

  <div
    class="date"
    id="date">
  </div>

</header>


<div
  class="container"
  id="diaryPage">


  <!-- =====================
       제목
  ====================== -->

  <input
    type="text"
    id="title"
    placeholder="오늘의 제목"
  >


  <!-- =====================
       일기
  ====================== -->

  <textarea
    id="diary"
    placeholder="오늘의 일기를 써보세요."
  ></textarea>


  <!-- =====================
       캐릭터 공간
  ====================== -->

  <div
    class="stage"
    id="stage">

    <div
      class="status"
      id="status">
      캐릭터를 추가해보세요
    </div>

  </div>


  <!-- =====================
       사진 추가
  ====================== -->

  <div class="add-area">

    <label
      class="photo-button"
      for="photo">

      ＋ 캐릭터 추가

    </label>


    <input
      id="photo"
      type="file"
      accept="image/*"
    >

  </div>


  <!-- =====================
       선택 캐릭터 제어
  ====================== -->

  <div
    class="control-box"
    id="controlBox">

    <div class="control-title">
      선택한 캐릭터
    </div>

    <button
      id="pauseButton">
      ⏸ 멈추기
    </button>

    <button
      id="resumeButton">
      ▶ 다시 움직이기
    </button>

  </div>


  <div class="help">
    캐릭터를 누르면 한 캐릭터만 선택할 수 있어요.
  </div>


  <!-- =====================
       저장
  ====================== -->

  <button
    class="save-button"
    id="save">

    저장

  </button>


  <button
    class="gallery-button"
    id="gallerySave">

    갤러리에 저장

  </button>


</div>


<script>


/* =====================================================
   날짜
===================================================== */

const dateElement =
  document.getElementById("date");


const now =
  new Date();


dateElement.textContent =
  now.getFullYear() + "년 " +
  (now.getMonth() + 1) + "월 " +
  now.getDate() + "일";



/* =====================================================
   일기 저장
===================================================== */

const titleInput =
  document.getElementById("title");


const diaryInput =
  document.getElementById("diary");


const saveButton =
  document.getElementById("save");


titleInput.value =
  localStorage.getItem("diary-title") || "";


diaryInput.value =
  localStorage.getItem("diary-text") || "";


saveButton.addEventListener(
  "click",
  function() {

    localStorage.setItem(
      "diary-title",
      titleInput.value
    );

    localStorage.setItem(
      "diary-text",
      diaryInput.value
    );

    alert("저장했어요!");

  }
);



/* =====================================================
   캐릭터
===================================================== */

const photoInput =
  document.getElementById("photo");


const stage =
  document.getElementById("stage");


const status =
  document.getElementById("status");


const controlBox =
  document.getElementById("controlBox");


const pauseButton =
  document.getElementById("pauseButton");


const resumeButton =
  document.getElementById("resumeButton");


let selectedActor = null;


/*
   캐릭터 목록
*/

const actors = [];



/* =====================================================
   사진 → 캐릭터
===================================================== */

photoInput.addEventListener(
  "change",
  function(event) {

    const file =
      event.target.files[0];


    if (!file) {
      return;
    }


    const reader =
      new FileReader();


    reader.onload =
      function(e) {

        const img =
          document.createElement("img");


        img.className =
          "actor";


        img.src =
          e.target.result;


        /*
           처음 등장 위치
        */

        const maxX =
          Math.max(
            0,
            stage.clientWidth - 90
          );


        const maxY =
          Math.max(
            0,
            stage.clientHeight - 90
          );


        img.style.left =
          Math.random() * maxX + "px";


        img.style.top =
          Math.random() * maxY + "px";


        /*
           캐릭터 상태
        */

        const actorData = {

          element: img,

          x:
            parseFloat(img.style.left),

          y:
            parseFloat(img.style.top),

          targetX:
            parseFloat(img.style.left),

          targetY:
            parseFloat(img.style.top),

          speed:
            0.8 + Math.random() * 1.8,

          direction:
            Math.random() > 0.5
              ? 1
              : -1,

          state:
            "idle",

          paused:
            false,

          timer:
            null,

          nextAction:
            Date.now() +
            1000 +
            Math.random() * 3000

        };


        actors.push(actorData);


        stage.appendChild(img);


        /*
           클릭/터치
        */

        img.addEventListener(
          "pointerdown",
          function(e) {

            e.stopPropagation();

            selectActor(actorData);

          }
        );


        /*
           상태 시작
        */

        chooseNewAction(actorData);


        updateStatus();


      };


    reader.readAsDataURL(file);


    photoInput.value = "";

  }
);



/* =====================================================
   캐릭터 선택
===================================================== */

function selectActor(actor) {

  /*
     이전 캐릭터 선택 해제
  */

  if (selectedActor) {

    selectedActor.element
      .classList
      .remove("selected");

  }


  /*
     같은 캐릭터를 다시 누르면 선택 해제
  */

  if (selectedActor === actor) {

    selectedActor = null;

    controlBox
      .classList
      .remove("show");

    updateStatus();

    return;

  }


  selectedActor = actor;


  actor.element
    .classList
    .add("selected");


  controlBox
    .classList
    .add("show");


  updateStatus();

}



/* =====================================================
   선택 캐릭터 멈추기
===================================================== */

pauseButton.addEventListener(
  "click",
  function() {

    if (!selectedActor) {
      return;
    }


    selectedActor.paused =
      true;


    selectedActor.state =
      "paused";


    selectedActor.element
      .classList
      .remove("running");


    selectedActor.element
      .classList
      .remove("sleeping");


    updateStatus();

  }
);



/* =====================================================
   다시 움직이기
===================================================== */

resumeButton.addEventListener(
  "click",
  function() {

    if (!selectedActor) {
      return;
    }


    selectedActor.paused =
      false;


    chooseNewAction(
      selectedActor
    );


    updateStatus();

  }
);



/* =====================================================
   랜덤 행동 결정
===================================================== */

function chooseNewAction(actor) {

  if (actor.paused) {
    return;
  }


  const random =
    Math.random();


  /*
     0 ~ 20%
     졸기
  */

  if (random < 0.20) {

    sleep(actor);

  }


  /*
     20 ~ 45%
     멈춰 있기
  */

  else if (random < 0.45) {

    idle(actor);

  }


  /*
     45 ~ 75%
     걷기
  */

  else if (random < 0.75) {

    walk(actor);

  }


  /*
     75 ~ 100%
     뛰기
  */

  else {

    run(actor);

  }

}



/* =====================================================
   졸기
===================================================== */

function sleep(actor) {

  if (actor.paused) {
    return;
  }


  actor.state =
    "sleeping";


  actor.element
    .classList
    .remove("running");


  actor.element
    .classList
    .add("sleeping");


  /*
     2~5초 정도 졸기
  */

  actor.nextAction =
    Date.now() +
    2000 +
    Math.random() * 3000;

}



/* =====================================================
   가만히 있기
===================================================== */

function idle(actor) {

  if (actor.paused) {
    return;
  }


  actor.state =
    "idle";


  actor.element
    .classList
    .remove("running");


  actor.element
    .classList
    .remove("sleeping");


  actor.nextAction =
    Date.now() +
    1000 +
    Math.random() * 2500;

}



/* =====================================================
   걷기
===================================================== */

function walk(actor) {

  if (actor.paused) {
    return;
  }


  actor.state =
    "walking";


  actor.element
    .classList
    .remove("running");


  actor.element
    .classList
    .remove("sleeping");


  setRandomTarget(actor);


  actor.nextAction =
    Date.now() +
    2500 +
    Math.random() * 2500;

}



/* =====================================================
   뛰기
===================================================== */

function run(actor) {

  if (actor.paused) {
    return;
  }


  actor.state =
    "running";


  actor.element
    .classList
    .add("running");


  actor.element
    .classList
    .remove("sleeping");


  setRandomTarget(actor);


  actor.nextAction =
    Date.now() +
    1800 +
    Math.random() * 1800;

}



/* =====================================================
   새로운 목표 위치
===================================================== */

function setRandomTarget(actor) {

  const width =
    stage.clientWidth;


  const height =
    stage.clientHeight;


  const characterWidth =
    actor.element.offsetWidth;


  const characterHeight =
    actor.element.offsetHeight;


  const maxX =
    Math.max(
      0,
      width - characterWidth
    );


  const maxY =
    Math.max(
      0,
      height - characterHeight
    );


  actor.targetX =
    Math.random() * maxX;


  actor.targetY =
    Math.random() * maxY;


  /*
     이동 방향
  */

  if (
    actor.targetX <
    actor.x
  ) {

    actor.direction = -1;

  } else {

    actor.direction = 1;

  }


  /*
     이미지 방향 뒤집기
  */

  actor.element.style.transform =
    actor.state === "running"
      ? "scaleX(" +
        actor.direction +
        ") scale(1.08)"
      : "scaleX(" +
        actor.direction +
        ")";

}



/* =====================================================
   캐릭터 움직임
===================================================== */

function updateActors() {

  const currentTime =
    Date.now();


  actors.forEach(
    function(actor) {

      /*
         멈춘 캐릭터
      */

      if (actor.paused) {
        return;
      }


      /*
         행동 시간이 끝남
      */

      if (
        currentTime >=
        actor.nextAction
      ) {

        chooseNewAction(actor);

      }


      /*
         졸거나 가만히 있는 동안은 이동하지 않음
      */

      if (
        actor.state === "sleeping" ||
        actor.state === "idle"
      ) {

        return;

      }


      /*
         목표 위치까지 이동
      */

      const dx =
        actor.targetX -
        actor.x;


      const dy =
        actor.targetY -
        actor.y;


      const distance =
        Math.sqrt(
          dx * dx +
          dy * dy
        );


      /*
         목표 도착
      */

      if (distance < 1) {

        return;

      }


      /*
         이동 속도
      */

      let speed =
        actor.speed;


      if (
        actor.state === "running"
      ) {

        speed *= 2.2;

      }


      actor.x +=
        (dx / distance) *
        speed;


      actor.y +=
        (dy / distance) *
        speed;


      /*
         위치 적용
      */

      actor.element.style.left =
        actor.x + "px";


      actor.element.style.top =
        actor.y + "px";


      /*
         방향
      */

      if (dx < 0) {

        actor.direction = -1;

      } else {

        actor.direction = 1;

      }


      if (
        actor.state === "running"
      ) {

        actor.element.style.transform =
          "scaleX(" +
          actor.direction +
          ") scale(1.08)";

      }

      else {

        actor.element.style.transform =
          "scaleX(" +
          actor.direction +
          ")";

      }

    }
  );


  requestAnimationFrame(
    updateActors
  );

}



/* =====================================================
   상태 표시
===================================================== */

function updateStatus() {

  if (!actors.length) {

    status.textContent =
      "캐릭터를 추가해보세요";

    return;

  }


  if (selectedActor) {

    if (selectedActor.paused) {

      status.textContent =
        "선택한 캐릭터가 멈춰 있어요";

    }

    else {

      status.textContent =
        "선택한 캐릭터: " +
        getStateText(
          selectedActor.state
        );

    }

    return;

  }


  status.textContent =
    "캐릭터들이 자유롭게 움직이고 있어요";

}



/* =====================================================
   상태 한글 변환
===================================================== */

function getStateText(state) {

  switch (state) {

    case "sleeping":
      return "졸고 있어요 😴";

    case "running":
      return "뛰고 있어요";

    case "walking":
      return "걷고 있어요";

    case "idle":
      return "쉬고 있어요";

    case "paused":
      return "멈춰 있어요";

    default:
      return "움직이고 있어요";

  }

}



/* =====================================================
   상태 표시 업데이트
===================================================== */

setInterval(
  updateStatus,
  300
);



/* =====================================================
   애니메이션 시작
===================================================== */

requestAnimationFrame(
  updateActors
);



/* =====================================================
   갤러리 저장
===================================================== */

const gallerySave =
  document.getElementById("gallerySave");


gallerySave.addEventListener(
  "click",
  async function() {

    const canvas =
      document.createElement("canvas");


    const ctx =
      canvas.getContext("2d");


    const width =
      900;


    const height =
      1100;


    canvas.width =
      width;


    canvas.height =
      height;


    /*
       흰색 배경
    */

    ctx.fillStyle =
      "#ffffff";


    ctx.fillRect(
      0,
      0,
      width,
      height
    );


    /*
       날짜
    */

    ctx.fillStyle =
      "#111";


    ctx.font =
      "24px sans-serif";


    ctx.fillText(
      dateElement.textContent,
      60,
      55
    );


    /*
       제목
    */

    ctx.font =
      "bold 42px sans-serif";


    ctx.fillText(
      titleInput.value ||
      "오늘의 일기",
      60,
      110
    );


    /*
       일기
    */

    ctx.font =
      "26px sans-serif";


    drawText(
      ctx,
      diaryInput.value || "",
      60,
      175,
      780,
      42
    );


    /*
       캐릭터 공간
    */

    const stageX = 60;

    const stageY = 500;

    const stageW = 780;

    const stageH = 400;


    ctx.strokeStyle =
      "#dddddd";


    ctx.lineWidth = 2;


    ctx.strokeRect(
      stageX,
      stageY,
      stageW,
      stageH
    );


    /*
       현재 캐릭터 저장
    */

    for (
      const actor of actors
    ) {

      try {

        const image =
          await loadImage(
            actor.element.src
          );


        const scaleX =
          stageW /
          stage.clientWidth;


        const scaleY =
          stageH /
          stage.clientHeight;


        const x =
          stageX +
          actor.x *
          scaleX;


        const y =
          stageY +
          actor.y *
          scaleY;


        const w =
          actor.element.offsetWidth *
          scaleX;


        const h =
          actor.element.offsetHeight *
          scaleY;


        ctx.drawImage(
          image,
          x,
          y,
          w,
          h
        );

      }

      catch (error) {

        console.log(
          "캐릭터 저장 실패",
          error
        );

      }

    }


    /*
       PNG
    */

    canvas.toBlob(
      async function(blob) {

        if (!blob) {

          alert(
            "이미지를 만들지 못했어요."
          );

          return;

        }


        const file =
          new File(
            [blob],
            "그림일기.png",
            {
              type:
                "image/png"
            }
          );


        /*
           아이폰 공유
        */

        if (
          navigator.share &&
          navigator.canShare &&
          navigator.canShare({
            files: [file]
          })
        ) {

          try {

            await navigator.share({
              files: [file],
              title: "그림일기"
            });


            return;

          }

          catch (error) {

            if (
              error &&
              error.name ===
              "AbortError"
            ) {

              return;

            }

          }

        }


        /*
           공유가 안 되면
           새 화면에서 이미지 열기
        */

        const url =
          URL.createObjectURL(
            blob
          );


        window.open(
          url,
          "_blank"
        );

      },
      "image/png"
    );

  }
);



/* =====================================================
   긴 글 줄바꿈
===================================================== */

function drawText(
  ctx,
  text,
  x,
  y,
  maxWidth,
  lineHeight
) {

  const lines =
    String(text).split("\n");


  let currentY =
    y;


  for (
    const line of lines
  ) {

    let currentLine = "";


    for (
      const char of line
    ) {

      const testLine =
        currentLine + char;


      const width =
        ctx.measureText(
          testLine
        ).width;


      if (
        width > maxWidth &&
        currentLine
      ) {

        ctx.fillText(
          currentLine,
          x,
          currentY
        );


        currentY +=
          lineHeight;


        currentLine =
          char;

      }

      else {

        currentLine =
          testLine;

      }

    }


    ctx.fillText(
      currentLine,
      x,
      currentY
    );


    currentY +=
      lineHeight;

  }

}



/* =====================================================
   이미지 불러오기
===================================================== */

function loadImage(src) {

  return new Promise(
    function(resolve, reject) {

      const img =
        new Image();


      img.onload =
        function() {

          resolve(img);

        };


      img.onerror =
        function() {

          reject(
            new Error(
              "이미지를 불러올 수 없습니다."
            )
          );

        };


      img.src =
        src;

    }
  );

}

</script>
