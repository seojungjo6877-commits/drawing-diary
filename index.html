<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
viewport-fit=cover">

<meta name="apple-mobile-web-app-capable"
content="yes">

<meta name="apple-mobile-web-app-status-bar-style"
content="default">

<title>그림일기</title>

<style>

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  background: #fff;
  color: #111;

  font-family:
  -apple-system,
  BlinkMacSystemFont,
  "Apple SD Gothic Neo",
  "Noto Sans KR",
  sans-serif;
}


/* =========================
   날짜
========================= */

header {
  padding: 18px 16px 10px;
}

.date {
  font-size: 13px;
  color: #777;
}


/* =========================
   전체
========================= */

.container {
  padding: 0 16px 35px;
}


/* =========================
   제목
========================= */

input[type="text"] {

  width: 100%;

  border: 1px solid #ddd;

  border-radius: 12px;

  padding: 12px;

  font-size: 16px;

  outline: none;

  background: #fff;
}


/* =========================
   일기
========================= */

textarea {

  width: 100%;

  min-height: 180px;

  margin-top: 10px;

  border: 1px solid #ddd;

  border-radius: 12px;

  padding: 14px;

  font-size: 16px;

  line-height: 1.6;

  outline: none;

  resize: vertical;

  background: #fff;
}


/* =========================
   캐릭터 공간
========================= */

.stage {

  position: relative;

  width: 100%;

  height: 380px;

  margin: 15px 0;

  border: 1px solid #ddd;

  border-radius: 18px;

  overflow: hidden;

  background: #fafafa;

  touch-action: none;
}


/* =========================
   캐릭터
========================= */

.actor {

  position: absolute;

  width: 90px;
  height: 90px;

  object-fit: contain;

  user-select: none;

  -webkit-user-select: none;

  touch-action: none;

  cursor: grab;

  transition:
    opacity 0.25s ease;
}


/* 드래그 중 */

.actor.dragging {

  cursor: grabbing;

  transition: none;
}


/* 선택 */

.actor.selected {

  outline:
  2px dashed #777;

  outline-offset: 4px;

  border-radius: 12px;
}


/* 졸기 */

.actor.sleeping {

  opacity: 0.65;
}


/* 뛰기 */

.actor.running {

  opacity: 1;
}


/* 같이 있는 상태 */

.actor.together {

  opacity: 0.9;
}


/* =========================
   상태
========================= */

.status {

  position: absolute;

  left: 50%;

  bottom: 8px;

  transform:
  translateX(-50%);

  font-size: 12px;

  color: #777;

  pointer-events: none;

  white-space: nowrap;
}


/* =========================
   캐릭터 추가
========================= */

.add-area {

  margin: 12px 0 18px;
}


.photo-button {

  display: block;

  width: 100%;

  padding: 12px 16px;

  border: 1px solid #ddd;

  border-radius: 12px;

  background: #fff;

  color: #111;

  font-size: 15px;

  text-align: center;

  cursor: pointer;
}


#photo {
  display: none;
}


/* =========================
   버튼
========================= */

button {

  width: 100%;

  border: 1px solid #ddd;

  background: #fff;

  color: #111;

  border-radius: 12px;

  padding: 13px 16px;

  font-size: 15px;

  margin-top: 10px;
}


/* =========================
   캐릭터 제어
========================= */

.control-box {

  display: none;

  margin-top: 10px;

  padding: 10px;

  border: 1px solid #ddd;

  border-radius: 12px;

  background: #fafafa;
}


.control-box.show {
  display: block;
}


.control-title {

  font-size: 13px;

  color: #666;

  margin-bottom: 5px;
}


/* =========================
   안내
========================= */

.help {

  margin-top: 8px;

  text-align: center;

  font-size: 12px;

  color: #888;
}

</style>
</head>


<body>


<header>

<div
class="date"
id="date">
</div>

</header>


<div class="container">


<!-- 제목 -->

<input
type="text"
id="title"
placeholder="오늘의 제목">


<!-- 일기 -->

<textarea
id="diary"
placeholder="오늘의 일기를 써보세요.">
</textarea>


<!-- 캐릭터 공간 -->

<div
class="stage"
id="stage">

<div
class="status"
id="status">

캐릭터를 추가해보세요

</div>

</div>


<!-- 캐릭터 추가 -->

<div class="add-area">

<label
class="photo-button"
for="photo">

＋ 캐릭터 추가

</label>

<input
id="photo"
type="file"
accept="image/*">

</div>


<!-- 선택 캐릭터 제어 -->

<div
class="control-box"
id="controlBox">

<div class="control-title">

선택한 캐릭터

</div>


<button
id="pauseButton">

⏸ 이 캐릭터 멈추기

</button>


<button
id="resumeButton">

▶ 다시 움직이기

</button>

</div>


<div class="help">

캐릭터를 손가락으로 끌어서 원하는 곳에 놓을 수 있어요.

</div>


<!-- 저장 버튼 하나만 존재 -->

<button
id="save">

저장

</button>


</div>



<script>


/* =================================================
   날짜
================================================= */

const dateElement =
document.getElementById("date");


const now =
new Date();


dateElement.textContent =
now.getFullYear() +
"년 " +
(now.getMonth() + 1) +
"월 " +
now.getDate() +
"일";



/* =================================================
   일기
================================================= */

const titleInput =
document.getElementById("title");


const diaryInput =
document.getElementById("diary");


titleInput.value =
localStorage.getItem(
"diary-title"
) || "";


diaryInput.value =
localStorage.getItem(
"diary-text"
) || "";



/* =================================================
   요소
================================================= */

const photoInput =
document.getElementById("photo");


const stage =
document.getElementById("stage");


const status =
document.getElementById("status");


const controlBox =
document.getElementById("controlBox");


const pauseButton =
document.getElementById("pauseButton");


const resumeButton =
document.getElementById("resumeButton");


const saveButton =
document.getElementById("save");


/*
   캐릭터 배열
*/

const actors = [];


/*
   현재 선택
*/

let selectedActor = null;



/* =================================================
   캐릭터 추가
================================================= */

photoInput.addEventListener(
"change",
function(event) {

const file =
event.target.files[0];


if (!file) {
return;
}


const reader =
new FileReader();


reader.onload =
function(e) {

const img =
document.createElement("img");


img.className =
"actor";


img.src =
e.target.result;


/*
   캐릭터 크기
*/

img.style.width =
"90px";

img.style.height =
"90px";


/*
   랜덤 시작 위치
*/

const startX =
Math.random() *
Math.max(
0,
stage.clientWidth - 90
);


const startY =
Math.random() *
Math.max(
0,
stage.clientHeight - 90
);


img.style.left =
startX + "px";


img.style.top =
startY + "px";


/*
   성격
*/

const personality =
createPersonality();


const actor = {

element: img,

x: startX,

y: startY,

targetX: startX,

targetY: startY,

speed:
personality.speed,

runSpeed:
personality.runSpeed,

sleepChance:
personality.sleepChance,

runChance:
personality.runChance,

state:
"idle",

paused:
false,

dragging:
false,

nextAction:
Date.now() +
1000 +
Math.random() * 2500,

partner:
null,

togetherUntil:
0

};


actors.push(actor);


stage.appendChild(img);


enableDragging(actor);


chooseNewAction(actor);


updateStatus();

};


reader.readAsDataURL(file);


/*
   같은 파일 다시 선택 가능
*/

photoInput.value = "";

});



/* =================================================
   캐릭터 성격
================================================= */

function createPersonality() {

const types = [

{
speed:
0.5 +
Math.random() * 0.4,

runSpeed:
1.1 +
Math.random() * 0.4,

sleepChance:
0.35,

runChance:
0.10
},

{
speed:
0.8 +
Math.random() * 0.5,

runSpeed:
1.8 +
Math.random() * 0.7,

sleepChance:
0.12,

runChance:
0.45
},

{
speed:
0.55 +
Math.random() * 0.35,

runSpeed:
1.2 +
Math.random() * 0.4,

sleepChance:
0.55,

runChance:
0.08
},

{
speed:
0.9 +
Math.random() * 0.5,

runSpeed:
2.0 +
Math.random() * 0.8,

sleepChance:
0.15,

runChance:
0.40
}

];


return types[
Math.floor(
Math.random() *
types.length
)
];

}



/* =================================================
   드래그
================================================= */

function enableDragging(actor) {

const element =
actor.element;

let pointerOffsetX = 0;
let pointerOffsetY = 0;


element.addEventListener(
"pointerdown",
function(e) {

e.preventDefault();
e.stopPropagation();


selectActor(actor);


actor.dragging =
true;


element.classList
.add("dragging");


try {

element.setPointerCapture(
e.pointerId
);

} catch(error) {}


const rect =
stage.getBoundingClientRect();


const pointerX =
e.clientX -
rect.left;


const pointerY =
e.clientY -
rect.top;


pointerOffsetX =
pointerX -
actor.x;


pointerOffsetY =
pointerY -
actor.y;


actor.targetX =
actor.x;

actor.targetY =
actor.y;


if (actor.partner) {

actor.partner.partner =
null;

actor.partner =
null;

}

});


element.addEventListener(
"pointermove",
function(e) {

if (!actor.dragging) {
return;
}


e.preventDefault();


const rect =
stage.getBoundingClientRect();


let newX =
e.clientX -
rect.left -
pointerOffsetX;


let newY =
e.clientY -
rect.top -
pointerOffsetY;


const maxX =
Math.max(
0,
stage.clientWidth -
element.offsetWidth
);


const maxY =
Math.max(
0,
stage.clientHeight -
element.offsetHeight
);


newX =
Math.max(
0,
Math.min(
newX,
maxX
)
);


newY =
Math.max(
0,
Math.min(
newY,
maxY
)
);


actor.x =
newX;

actor.y =
newY;

actor.targetX =
newX;

actor.targetY =
newY;


element.style.left =
newX + "px";

element.style.top =
newY + "px";

});


element.addEventListener(
"pointerup",
function(e) {

finishDragging(
actor,
e
);

});


element.addEventListener(
"pointercancel",
function(e) {

finishDragging(
actor,
e
);

});

}



/* =================================================
   드래그 종료
================================================= */

function finishDragging(
actor,
e
) {

if (!actor.dragging) {
return;
}


actor.dragging =
false;


actor.element.classList
.remove("dragging");


try {

actor.element.releasePointerCapture(
e.pointerId
);

} catch(error) {}


if (!actor.paused) {

actor.nextAction =
Date.now() +
500 +
Math.random() * 1200;


chooseNewAction(actor);

}


updateStatus();

}



/* =================================================
   캐릭터 선택
================================================= */

function selectActor(actor) {

if (selectedActor) {

selectedActor.element
.classList
.remove("selected");

}


if (selectedActor === actor) {

selectedActor =
null;

controlBox
.classList
.remove("show");

updateStatus();

return;

}


selectedActor =
actor;


actor.element
.classList
.add("selected");


controlBox
.classList
.add("show");


updateStatus();

}



/* =================================================
   멈추기
================================================= */

pauseButton.addEventListener(
"click",
function() {

if (!selectedActor) {
return;
}


selectedActor.paused =
true;


selectedActor.dragging =
false;


selectedActor.state =
"paused";


selectedActor.targetX =
selectedActor.x;


selectedActor.targetY =
selectedActor.y;


selectedActor.element
.classList
.remove("running");

selectedActor.element
.classList
.remove("sleeping");


updateStatus();

});



/* =================================================
   다시 움직이기
================================================= */

resumeButton.addEventListener(
"click",
function() {

if (!selectedActor) {
return;
}


selectedActor.paused =
false;


chooseNewAction(
selectedActor
);


updateStatus();

});



/* =================================================
   행동 선택
================================================= */

function chooseNewAction(actor) {

if (
actor.paused ||
actor.dragging
) {
return;
}


if (
actor.partner &&
Date.now() <
actor.togetherUntil
) {

return;

}


const random =
Math.random();


if (
random <
actor.sleepChance
) {

sleep(actor);

}

else if (
random <
actor.sleepChance +
actor.runChance
) {

run(actor);

}

else {

walk(actor);

}

}



/* =================================================
   졸기
================================================= */

function sleep(actor) {

if (
actor.paused ||
actor.dragging
) {
return;
}


actor.state =
"sleeping";


actor.element.classList
.add("sleeping");


actor.element.classList
.remove("running");


actor.targetX =
actor.x;

actor.targetY =
actor.y;


actor.nextAction =
Date.now() +
2000 +
Math.random() * 4000;

}



/* =================================================
   걷기
================================================= */

function walk(actor) {

if (
actor.paused ||
actor.dragging
) {
return;
}


actor.state =
"walking";


actor.element.classList
.remove("sleeping");


actor.element.classList
.remove("running");


setRandomTarget(actor);


actor.nextAction =
Date.now() +
2500 +
Math.random() * 3500;

}



/* =================================================
   뛰기
================================================= */

function run(actor) {

if (
actor.paused ||
actor.dragging
) {
return;
}


actor.state =
"running";


actor.element.classList
.remove("sleeping");


actor.element.classList
.add("running");


setRandomTarget(actor);


actor.nextAction =
Date.now() +
1500 +
Math.random() * 2200;

}



/* =================================================
   랜덤 목적지
================================================= */

function setRandomTarget(actor) {

const maxX =
Math.max(
0,
stage.clientWidth -
actor.element.offsetWidth
);


const maxY =
Math.max(
0,
stage.clientHeight -
actor.element.offsetHeight
);


actor.targetX =
Math.random() *
maxX;


actor.targetY =
Math.random() *
maxY;

}



/* =================================================
   캐릭터 이동
================================================= */

function updateActors() {

const currentTime =
Date.now();


for (
const actor of actors
) {

if (
actor.paused
) {
continue;
}


if (
actor.dragging
) {
continue;
}


if (
actor.partner &&
currentTime <
actor.togetherUntil
) {

continue;

}


if (
actor.partner &&
currentTime >=
actor.togetherUntil
) {

const partner =
actor.partner;


actor.partner =
null;


if (
partner.partner ===
actor
) {

partner.partner =
null;

}


actor.element.classList
.remove("together");

}


if (
currentTime >=
actor.nextAction
) {

chooseNewAction(actor);

}


if (
actor.state ===
"sleeping"
) {

continue;

}


const dx =
actor.targetX -
actor.x;


const dy =
actor.targetY -
actor.y;


const distance =
Math.sqrt(
dx * dx +
dy * dy
);


if (
distance < 1
) {

continue;

}


let speed =
actor.speed;


if (
actor.state ===
"running"
) {

speed =
actor.runSpeed;

}


const step =
Math.min(
speed,
distance
);


actor.x +=
(dx / distance) *
step;


actor.y +=
(dy / distance) *
step;


const maxX =
Math.max(
0,
stage.clientWidth -
actor.element.offsetWidth
);


const maxY =
Math.max(
0,
stage.clientHeight -
actor.element.offsetHeight
);


actor.x =
Math.max(
0,
Math.min(
actor.x,
maxX
)
);


actor.y =
Math.max(
0,
Math.min(
actor.y,
maxY
)
);


actor.element.style.left =
actor.x + "px";


actor.element.style.top =
actor.y + "px";

}


checkInteractions();


updateStatus();


requestAnimationFrame(
updateActors
);

}



/* =================================================
   캐릭터끼리 만남
================================================= */

function checkInteractions() {

if (
actors.length < 2
) {
return;
}


const currentTime =
Date.now();


for (
let i = 0;
i < actors.length;
i++
) {

const a =
actors[i];


if (
a.paused ||
a.dragging ||
a.partner
) {
continue;
}


for (
let j = i + 1;
j < actors.length;
j++
) {

const b =
actors[j];


if (
b.paused ||
b.dragging ||
b.partner
) {
continue;
}


const dx =
a.x - b.x;


const dy =
a.y - b.y;


const distance =
Math.sqrt(
dx * dx +
dy * dy
);


if (
distance < 65
) {

if (
Math.random() <
0.015
) {

startInteraction(
a,
b,
currentTime
);

}

}

}

}

}



/* =================================================
   상호작용
================================================= */

function startInteraction(
a,
b,
currentTime
) {

a.partner =
b;

b.partner =
a;


const duration =
2500 +
Math.random() *
2000;


a.togetherUntil =
currentTime +
duration;


b.togetherUntil =
currentTime +
duration;


a.state =
"idle";


b.state =
"idle";


a.targetX =
a.x;

a.targetY =
a.y;


b.targetX =
b.x;

b.targetY =
b.y;


a.element.classList
.add("together");


b.element.classList
.add("together");

}



/* =================================================
   상태
================================================= */

function updateStatus() {

if (
actors.length === 0
) {

status.textContent =
"캐릭터를 추가해보세요";

return;

}


if (
selectedActor
) {

if (
selectedActor.paused
) {

status.textContent =
"선택한 캐릭터가 멈춰 있어요";

}

else if (
selectedActor.dragging
) {

status.textContent =
"캐릭터를 움직이고 있어요";

}

else if (
selectedActor.partner
) {

status.textContent =
"다른 캐릭터와 함께 있어요";

}

else {

status.textContent =
"선택한 캐릭터 · " +
getStateText(
selectedActor.state
);

}

return;

}


status.textContent =
"캐릭터들이 자유롭게 움직이고 있어요";

}



/* =================================================
   상태 이름
================================================= */

function getStateText(state) {

switch(state) {

case "sleeping":
return "졸고 있어요 😴";

case "running":
return "뛰고 있어요";

case "walking":
return "걷고 있어요";

case "paused":
return "멈춰 있어요";

default:
return "쉬고 있어요";

}

}



/* =================================================
   저장용 줄바꿈
================================================= */

function getWrappedLines(
ctx,
text,
maxWidth
) {

const result = [];

const paragraphs =
String(text).split("\n");


for (
const paragraph of paragraphs
) {

if (
paragraph.length === 0
) {

result.push("");

continue;

}


let line = "";


for (
const char of paragraph
) {

const test =
line + char;


if (
ctx.measureText(test).width >
maxWidth &&
line
) {

result.push(line);

line =
char;

}

else {

line =
test;

}

}


result.push(line);

}


return result;

}



/* =================================================
   둥근 사각형
================================================= */

function roundedRect(
ctx,
x,
y,
w,
h,
r
) {

ctx.beginPath();

ctx.moveTo(
x + r,
y
);

ctx.lineTo(
x + w - r,
y
);

ctx.quadraticCurveTo(
x + w,
y,
x + w,
y + r
);

ctx.lineTo(
x + w,
y + h - r
);

ctx.quadraticCurveTo(
x + w,
y + h,
x + w - r,
y + h
);

ctx.lineTo(
x + r,
y + h
);

ctx.quadraticCurveTo(
x,
y + h,
x,
y + h - r
);

ctx.lineTo(
x,
y + r
);

ctx.quadraticCurveTo(
x,
y,
x + r,
y
);

ctx.closePath();

}



/* =================================================
   이미지 불러오기
================================================= */

function loadImage(src) {

return new Promise(
function(resolve, reject) {

const image =
new Image();


image.onload =
function() {

resolve(image);

};


image.onerror =
function() {

reject(
new Error(
"이미지를 불러오지 못했습니다."
)
);

};


image.src =
src;

});

}



/* =================================================
   Blob 만들기
================================================= */

function canvasToBlob(
canvas
) {

return new Promise(
function(resolve, reject) {

canvas.toBlob(
function(blob) {

if (blob) {

resolve(blob);

}

else {

reject(
new Error(
"PNG 생성 실패"
)
);

}

},
"image/png"
);

});

}



/* =================================================
   저장
=================================================

   iPhone/iPad에서는 웹페이지가 사진 앱에
   직접 파일을 넣는 것을 허용하지 않습니다.

   그래서 이미지 파일을 만든 뒤
   iOS 공유 메뉴를 열고

   "이미지 저장"

   을 누르면 사진 앱에 저장됩니다.

================================================= */

saveButton.addEventListener(
"click",
async function() {

saveButton.disabled =
true;

const oldText =
saveButton.textContent;

saveButton.textContent =
"이미지 만드는 중...";


try {


/*
   ===============================================
   현재 화면 크기
   ===============================================
*/

const stageWidth =
stage.clientWidth;


const stageHeight =
stage.clientHeight;


/*
   저장 이미지 가로 크기
*/

const outputWidth =
900;


/*
   화면과 저장 이미지의
   동일한 비율
*/

const scale =
outputWidth /
stageWidth;


/*
   캐릭터 영역 크기
*/

const outputStageWidth =
stageWidth *
scale;


const outputStageHeight =
stageHeight *
scale;


/*
   좌우 여백
*/

const margin =
60;


/*
   기본 폰트
*/

const normalFont =
"26px sans-serif";


/*
   임시 캔버스에서
   일기 줄 수 계산
*/

const measureCanvas =
document.createElement(
"canvas"
);


const measureCtx =
measureCanvas.getContext(
"2d"
);


measureCtx.font =
normalFont;


const diaryMaxWidth =
outputWidth -
margin * 2;


const diaryLines =
getWrappedLines(
measureCtx,
diaryInput.value || "",
diaryMaxWidth
);


const diaryLineHeight =
42;


const diaryHeight =
Math.max(
diaryLineHeight,
diaryLines.length *
diaryLineHeight
);


/*
   저장 이미지 배치
*/

const dateY =
55;


const titleY =
115;


const diaryY =
175;


const stageY =
diaryY +
diaryHeight +
45;


/*
   최종 이미지 높이
*/

const outputHeight =
stageY +
outputStageHeight +
60;


/*
   실제 캔버스
*/

const canvas =
document.createElement(
"canvas"
);


canvas.width =
Math.ceil(
outputWidth
);


canvas.height =
Math.ceil(
outputHeight
);


const ctx =
canvas.getContext(
"2d"
);


/*
   ===============================================
   배경
================================================= */

ctx.fillStyle =
"#fff";

ctx.fillRect(
0,
0,
canvas.width,
canvas.height
);


/*
   ===============================================
   날짜
================================================= */

ctx.fillStyle =
"#111";

ctx.font =
"24px sans-serif";

ctx.textBaseline =
"alphabetic";


ctx.fillText(
dateElement.textContent,
margin,
dateY
);


/*
   ===============================================
   제목
================================================= */

ctx.font =
"bold 42px sans-serif";


ctx.fillText(
titleInput.value ||
"오늘의 일기",
margin,
titleY
);


/*
   ===============================================
   일기
================================================= */

ctx.font =
normalFont;


let currentDiaryY =
diaryY;


for (
const line of diaryLines
) {

ctx.fillText(
line,
margin,
currentDiaryY
);

currentDiaryY +=
diaryLineHeight;

}


/*
   ===============================================
   캐릭터 칸
================================================= */

ctx.save();


roundedRect(
ctx,
margin,
stageY,
outputStageWidth,
outputStageHeight,
18
);


ctx.fillStyle =
"#fafafa";

ctx.fill();


ctx.strokeStyle =
"#ddd";

ctx.lineWidth =
2;

ctx.stroke();


/*
   캐릭터 칸 안에서만 그리기
*/

ctx.clip();


/*
   ===============================================
   캐릭터 저장

   핵심:
   X와 Y에 똑같은 scale을 적용합니다.

   따라서 90x90으로 강제로 변형하거나
   가로/세로를 서로 다른 비율로 늘리지 않습니다.
   ===============================================
*/

for (
const actor of actors
) {

try {

const image =
await loadImage(
actor.element.src
);


/*
   현재 캐릭터의 실제 표시 크기
*/

const rect =
actor.element.getBoundingClientRect();


const actorWidth =
rect.width;


const actorHeight =
rect.height;


/*
   화면 좌표 → 저장 이미지 좌표
*/

const x =
margin +
actor.x *
scale;


const y =
stageY +
actor.y *
scale;


/*
   현재 크기를 같은 배율로 확대
*/

const width =
actorWidth *
scale;


const height =
actorHeight *
scale;


/*
   이미지 자체의 비율은
   object-fit: contain으로 유지된 상태이므로
   그대로 저장
*/

ctx.drawImage(
image,
x,
y,
width,
height
);

}

catch(error) {

console.error(
"캐릭터 이미지 저장 실패:",
error
);

}

}


/*
   캐릭터 칸 테두리 다시 표시
*/

ctx.restore();


ctx.save();


roundedRect(
ctx,
margin,
stageY,
outputStageWidth,
outputStageHeight,
18
);


ctx.strokeStyle =
"#ddd";

ctx.lineWidth =
2;

ctx.stroke();


ctx.restore();



/*
   ===============================================
   PNG 파일 생성
================================================= */

const blob =
await canvasToBlob(
canvas
);


const file =
new File(
[blob],
"그림일기.png",
{
type:
"image/png"
}
);


/*
   ===============================================
   일기 내용 저장
================================================= */

localStorage.setItem(
"diary-title",
titleInput.value
);

localStorage.setItem(
"diary-text",
diaryInput.value
);



/*
   ===============================================
   iPhone / iPad
   공유 메뉴 열기
================================================= */

if (
navigator.share &&
navigator.canShare
) {

let canShareFile =
false;


try {

canShareFile =
navigator.canShare({
files: [file]
});

}

catch(error) {

canShareFile =
false;

}


if (canShareFile) {

await navigator.share({

files: [file],

title:
"그림일기",

text:
"그림일기"

});


return;

}

}


/*
   ===============================================
   공유 기능이 없는 브라우저용
================================================= */

const url =
URL.createObjectURL(
blob
);


const link =
document.createElement(
"a"
);


link.href =
url;


link.download =
"그림일기.png";


document.body.appendChild(
link
);


link.click();


document.body.removeChild(
link
);


setTimeout(
function() {

URL.revokeObjectURL(
url
);

},
1000
);


}
catch(error) {

console.error(
"저장 오류:",
error
);


alert(
"저장하지 못했어요. 다시 눌러주세요."
);

}
finally {

saveButton.disabled =
false;

saveButton.textContent =
oldText;

}

});



/* =================================================
   자동 움직임 시작
================================================= */

requestAnimationFrame(
updateActors
);

</script>

</body>
</html>
