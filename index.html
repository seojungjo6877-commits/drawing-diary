<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>그림일기</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  background: #fff;
  color: #111;
  font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
               "Noto Sans KR", sans-serif;
}

header {
  padding: 18px 16px 10px;
}

.date {
  font-size: 13px;
  color: #777;
}

input[type="text"],
textarea {
  width: 100%;
  border: 1px solid #ddd;
  border-radius: 12px;
  padding: 12px;
  font-size: 16px;
  outline: none;
  background: #fff;
}

textarea {
  min-height: 120px;
  resize: vertical;
}

button {
  border: 1px solid #ddd;
  background: #fff;
  color: #111;
  border-radius: 12px;
  padding: 12px 16px;
  font-size: 15px;
}

.container {
  padding: 0 16px 30px;
}

.stage {
  position: relative;
  width: 100%;
  height: 380px;
  margin: 15px 0;
  border: 1px solid #ddd;
  border-radius: 18px;
  overflow: hidden;
  background: #fafafa;
}

.actor {
  position: absolute;
  width: 110px;
  height: 110px;
  object-fit: contain;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}

.add-area {
  margin: 12px 0;
}

/*
  핵심:
  사진 선택 input을 화면에 실제로 표시한다.
  아이폰 Safari에서 label -> hidden input 방식이 막히는 것을 피한다.
*/
.photo-input {
  width: 100%;
  padding: 12px;
  border: 1px solid #ddd;
  border-radius: 12px;
  background: white;
  font-size: 15px;
}

.notice {
  margin-top: 8px;
  font-size: 12px;
  color: #777;
}
</style>
</head>

<body>

<header>
  <div class="date" id="date"></div>
</header>

<div class="container">

  <input
    type="text"
    id="title"
    placeholder="오늘의 제목"
  >

  <div class="stage" id="stage"></div>

  <div class="add-area">

    <!-- 아이폰에서 직접 누르는 사진 선택 버튼 -->
    <input
      class="photo-input"
      id="photo"
      type="file"
      accept="image/*"
    >

    <div class="notice">
      사진을 선택하면 사진이 캐릭터가 되어 화면에 나타나요.
    </div>

  </div>

  <textarea
    id="diary"
    placeholder="오늘의 일기를 써보세요."
  ></textarea>

  <br><br>

  <button id="save">저장</button>

</div>

<script>
/* =========================
   날짜
========================= */

const dateElement = document.getElementById("date");

const now = new Date();

dateElement.textContent =
  now.getFullYear() + "년 " +
  (now.getMonth() + 1) + "월 " +
  now.getDate() + "일";


/* =========================
   일기 저장
========================= */

const titleInput = document.getElementById("title");
const diaryInput = document.getElementById("diary");
const saveButton = document.getElementById("save");

titleInput.value =
  localStorage.getItem("diary-title") || "";

diaryInput.value =
  localStorage.getItem("diary-text") || "";

saveButton.addEventListener("click", function () {

  localStorage.setItem(
    "diary-title",
    titleInput.value
  );

  localStorage.setItem(
    "diary-text",
    diaryInput.value
  );

  alert("저장했어요!");
});


/* =========================
   사진 → 캐릭터
========================= */

const photoInput = document.getElementById("photo");
const stage = document.getElementById("stage");


photoInput.addEventListener("change", function(event) {

  const file = event.target.files[0];

  if (!file) {
    return;
  }

  /*
    사진 파일을 화면에서 사용할 수 있도록
    Data URL로 변환
  */

  const reader = new FileReader();

  reader.onload = function(e) {

    const img = document.createElement("img");

    img.className = "actor";

    img.src = e.target.result;

    /*
      처음 등장 위치
    */

    img.style.left = "30px";
    img.style.top = "30px";

    stage.appendChild(img);

    makeDraggable(img);
  };

  reader.readAsDataURL(file);

});


/* =========================
   캐릭터 움직이기
========================= */

function makeDraggable(element) {

  let startX = 0;
  let startY = 0;

  let originalLeft = 0;
  let originalTop = 0;

  let dragging = false;


  element.addEventListener(
    "touchstart",
    function(e) {

      e.preventDefault();

      const touch = e.touches[0];

      startX = touch.clientX;
      startY = touch.clientY;

      originalLeft =
        parseFloat(element.style.left) || 0;

      originalTop =
        parseFloat(element.style.top) || 0;

      dragging = true;

    },
    { passive: false }
  );


  element.addEventListener(
    "touchmove",
    function(e) {

      if (!dragging) return;

      e.preventDefault();

      const touch = e.touches[0];

      const moveX =
        touch.clientX - startX;

      const moveY =
        touch.clientY - startY;

      let newLeft =
        originalLeft + moveX;

      let newTop =
        originalTop + moveY;


      /*
        화면 밖으로 너무 나가지 않도록 제한
      */

      const maxLeft =
        stage.clientWidth - element.offsetWidth;

      const maxTop =
        stage.clientHeight - element.offsetHeight;


      newLeft =
        Math.max(
          0,
          Math.min(newLeft, maxLeft)
        );

      newTop =
        Math.max(
          0,
          Math.min(newTop, maxTop)
        );


      element.style.left =
        newLeft + "px";

      element.style.top =
        newTop + "px";

    },
    { passive: false }
  );


  element.addEventListener(
    "touchend",
    function() {

      dragging = false;

    }
  );


  /*
    PC에서도 마우스로 움직일 수 있게
  */

  element.addEventListener(
    "mousedown",
    function(e) {

      e.preventDefault();

      startX = e.clientX;
      startY = e.clientY;

      originalLeft =
        parseFloat(element.style.left) || 0;

      originalTop =
        parseFloat(element.style.top) || 0;

      dragging = true;


      function mouseMove(ev) {

        if (!dragging) return;

        const moveX =
          ev.clientX - startX;

        const moveY =
          ev.clientY - startY;

        let newLeft =
          originalLeft + moveX;

        let newTop =
          originalTop + moveY;


        const maxLeft =
          stage.clientWidth - element.offsetWidth;

        const maxTop =
          stage.clientHeight - element.offsetHeight;


        newLeft =
          Math.max(
            0,
            Math.min(newLeft, maxLeft)
          );

        newTop =
          Math.max(
            0,
            Math.min(newTop, maxTop)
          );


        element.style.left =
          newLeft + "px";

        element.style.top =
          newTop + "px";
      }


      function mouseUp() {

        dragging = false;

        document.removeEventListener(
          "mousemove",
          mouseMove
        );

        document.removeEventListener(
          "mouseup",
          mouseUp
        );
      }


      document.addEventListener(
        "mousemove",
        mouseMove
      );

      document.addEventListener(
        "mouseup",
        mouseUp
      );

    }
  );

}
</script>

</body>
</html>
