<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>그림일기</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  background: #fff;
  color: #111;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Apple SD Gothic Neo",
    "Noto Sans KR",
    sans-serif;
}

header {
  padding: 18px 16px 10px;
}

.date {
  font-size: 13px;
  color: #777;
}

.container {
  padding: 0 16px 35px;
}

input[type="text"] {
  width: 100%;
  border: 1px solid #ddd;
  border-radius: 12px;
  padding: 12px;
  font-size: 16px;
  outline: none;
  background: #fff;
}

textarea {
  width: 100%;
  min-height: 180px;
  margin-top: 10px;
  border: 1px solid #ddd;
  border-radius: 12px;
  padding: 14px;
  font-size: 16px;
  line-height: 1.6;
  outline: none;
  resize: vertical;
  background: #fff;
}

.stage {
  position: relative;
  width: 100%;
  height: 380px;
  margin: 15px 0;
  border: 1px solid #ddd;
  border-radius: 18px;
  overflow: hidden;
  background: #fafafa;
  background-position: center;
  background-size: cover;
  background-repeat: no-repeat;

  /*
    iPhone/iPad 터치 드래그용
  */
  touch-action: none;
  overscroll-behavior: none;
}

/* =========================
   캐릭터
========================= */

.actor {
  position: absolute;
  width: 90px;
  height: 90px;
  object-fit: contain;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  touch-action: none;
  cursor: grab;
  z-index: 30;
}

.actor.dragging {
  cursor: grabbing;
}

.actor.selected {
  outline: 2px dashed #777;
  outline-offset: 4px;
  border-radius: 12px;
}

.actor.sleeping {
  opacity: .65;
}

/* =========================
   악세사리
========================= */

.accessory {
  position: absolute;
  width: 55px;
  height: 55px;
  object-fit: contain;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  touch-action: none;
  cursor: grab;
  z-index: 40;
  transform-origin: center center;
}

.accessory.dragging {
  cursor: grabbing;
}

.accessory.selected {
  outline: 2px dashed #777;
  outline-offset: 3px;
  border-radius: 8px;
}

/* =========================
   가구
========================= */

.furniture {
  position: absolute;
  width: 90px;
  height: 90px;
  object-fit: contain;

  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;

  /*
    핵심:
    가구 자체가 브라우저의 기본 터치 동작을
    가져가지 않도록 함
  */
  touch-action: none;

  cursor: grab;

  z-index: 20;
}

.furniture.dragging {
  cursor: grabbing;
}

.furniture.locked {
  cursor: default;
}

.furniture.selected {
  outline: 2px dashed #777;
  outline-offset: 4px;
  border-radius: 10px;
}

.status {
  position: absolute;
  left: 50%;
  bottom: 8px;
  transform: translateX(-50%);
  font-size: 12px;
  color: #777;
  pointer-events: none;
  white-space: nowrap;
  z-index: 100;
}

.add-area {
  margin: 12px 0 18px;
}

.photo-button,
.background-file-label {
  display: block;
  width: 100%;
  padding: 12px 16px;
  border: 1px solid #ddd;
  border-radius: 12px;
  background: #fff;
  color: #111;
  font-size: 15px;
  text-align: center;
  cursor: pointer;
}

#photo,
#backgroundFile,
#accessoryFile,
#furnitureFile {
  display: none;
}

.background-area {
  margin-bottom: 18px;
}

.background-select {
  width: 100%;
  padding: 12px;
  border: 1px solid #ddd;
  border-radius: 12px;
  background: #fff;
  color: #111;
  font-size: 15px;
  outline: none;
}

.background-file-label {
  margin-top: 10px;
}

.control-box,
.accessory-box,
.furniture-box {
  margin-top: 10px;
  padding: 10px;
  border: 1px solid #ddd;
  border-radius: 12px;
  background: #fafafa;
}

.control-box {
  display: none;
}

.control-box.show {
  display: block;
}

.accessory-box,
.furniture-box {
  display: block;
}

.accessory-control,
.furniture-control {
  display: none;
}

.accessory-control.show,
.furniture-control.show {
  display: block;
}

.control-title,
.accessory-title,
.furniture-title {
  font-size: 13px;
  color: #666;
  margin-bottom: 8px;
}

.size-control {
  margin-top: 12px;
}

.size-label {
  font-size: 13px;
  color: #666;
  margin-bottom: 5px;
}

input[type="range"] {
  width: 100%;
  margin: 0;
  accent-color: #777;
}

.accessory-grid,
.furniture-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 7px;
}

.accessory-choice,
.furniture-choice {
  border: 1px solid #ddd;
  border-radius: 10px;
  background: #fff;
  padding: 8px 4px;
  font-size: 24px;
  line-height: 1.2;
  cursor: pointer;
  margin: 0;
}

.accessory-choice span,
.furniture-choice span {
  display: block;
  font-size: 11px;
  margin-top: 3px;
  color: #666;
}

.accessory-upload,
.furniture-upload {
  display: block;
  width: 100%;
  margin-top: 8px;
  padding: 10px;
  border: 1px solid #ddd;
  border-radius: 10px;
  background: #fff;
  text-align: center;
  font-size: 13px;
  cursor: pointer;
}

.rotation-control {
  margin-top: 12px;
}

.help {
  margin-top: 8px;
  text-align: center;
  font-size: 12px;
  color: #888;
}

button {
  width: 100%;
  border: 1px solid #ddd;
  background: #fff;
  color: #111;
  border-radius: 12px;
  padding: 13px 16px;
  font-size: 15px;
  margin-top: 10px;
}

button:disabled {
  opacity: .5;
}
</style>
</head>

<body>

<header>
  <div class="date" id="date"></div>
</header>

<div class="container">

<input
  type="text"
  id="title"
  placeholder="오늘의 제목"
>

<textarea
  id="diary"
  placeholder="오늘의 일기를 써보세요."
></textarea>


<!-- 배경 -->

<div class="background-area">

<select id="backgroundSelect" class="background-select">

<option value="plain">기본 배경</option>
<option value="sky">파란 하늘</option>
<option value="night">밤하늘</option>
<option value="grass">초원</option>
<option value="pink">분홍색</option>
<option value="yellow">노란색</option>

</select>

<label
  class="background-file-label"
  for="backgroundFile"
>
＋ 배경 사진 추가
</label>

<input
  id="backgroundFile"
  type="file"
  accept="image/*"
>

</div>


<!-- 무대 -->

<div class="stage" id="stage">

<div
  class="status"
  id="status"
>
캐릭터를 추가해보세요
</div>

</div>


<!-- 캐릭터 추가 -->

<div class="add-area">

<label
  class="photo-button"
  for="photo"
>
＋ 캐릭터 추가
</label>

<input
  id="photo"
  type="file"
  accept="image/*"
>

</div>


<!-- 캐릭터 조작 -->

<div
  class="control-box"
  id="controlBox"
>

<div class="control-title">
선택한 캐릭터
</div>

<button id="pauseButton">
⏸ 이 캐릭터 멈추기
</button>

<button id="resumeButton">
▶ 다시 움직이기
</button>

<button id="bringActorFrontButton">
⬆️ 앞으로 보내기
</button>

<button id="sendActorBackButton">
⬇️ 뒤로 보내기
</button>

<button id="deleteActorButton">
🗑 이 캐릭터 삭제
</button>

<div class="size-control">

<div class="size-label">
캐릭터 크기
</div>

<input
  type="range"
  id="sizeSlider"
  min="50"
  max="200"
  value="100"
>

</div>


<!-- 악세사리 -->

<div class="accessory-box">

<div class="accessory-title">
악세사리
</div>

<div class="accessory-grid">

<button
  class="accessory-choice"
  data-emoji="🎩"
>
🎩
<span>모자</span>
</button>

<button
  class="accessory-choice"
  data-emoji="👑"
>
👑
<span>왕관</span>
</button>

<button
  class="accessory-choice"
  data-emoji="🎀"
>
🎀
<span>리본</span>
</button>

<button
  class="accessory-choice"
  data-emoji="😎"
>
😎
<span>선글라스</span>
</button>

<button
  class="accessory-choice"
  data-emoji="🐱"
>
🐱
<span>고양이귀</span>
</button>

<button
  class="accessory-choice"
  data-emoji="✨"
>
✨
<span>별</span>
</button>

</div>

<label
  class="accessory-upload"
  for="accessoryFile"
>
＋ 악세사리 사진 추가
</label>

<input
  id="accessoryFile"
  type="file"
  accept="image/*"
>

<div
  class="accessory-control"
  id="accessoryControl"
>

<div class="size-label">
선택한 악세사리 크기
</div>

<input
  type="range"
  id="accessorySizeSlider"
  min="20"
  max="200"
  value="100"
>

<div class="rotation-control">

<div class="size-label">
선택한 악세사리 각도
</div>

<input
  type="range"
  id="accessoryRotationSlider"
  min="-180"
  max="180"
  value="0"
>

</div>

<button id="deleteAccessoryButton">
🗑 악세사리 삭제
</button>

</div>

</div>

</div>


<!-- 가구 -->

<div class="furniture-box">

<div class="furniture-title">
가구
</div>

<div class="furniture-grid">

<button
  class="furniture-choice"
  data-emoji="🪑"
>
🪑
<span>의자</span>
</button>

<button
  class="furniture-choice"
  data-emoji="🛋️"
>
🛋️
<span>소파</span>
</button>

<button
  class="furniture-choice"
  data-emoji="🛏️"
>
🛏️
<span>침대</span>
</button>

<button
  class="furniture-choice"
  data-emoji="🪴"
>
🪴
<span>화분</span>
</button>

<button
  class="furniture-choice"
  data-emoji="🗄️"
>
🗄️
<span>서랍장</span>
</button>

<button
  class="furniture-choice"
  data-emoji="🪟"
>
🪟
<span>창문</span>
</button>

</div>

<label
  class="furniture-upload"
  for="furnitureFile"
>
＋ 가구 사진 추가
</label>

<input
  id="furnitureFile"
  type="file"
  accept="image/*"
>

<div
  class="furniture-control"
  id="furnitureControl"
>

<div class="size-label">
선택한 가구 크기
</div>

<input
  type="range"
  id="furnitureSizeSlider"
  min="30"
  max="250"
  value="100"
>


<button id="lockFurnitureButton">
🔒 가구 고정
</button>

<button id="deleteFurnitureButton">
🗑 가구 삭제
</button>

</div>

</div>


<div class="help">
캐릭터, 악세사리, 가구를 손가락으로 끌어서 원하는 곳에 놓을 수 있어요.
</div>

<button id="save">
저장
</button>

<button id="clearAll">
전체 삭제
</button>

</div>


<script>

/* =========================================
   요소
========================================= */

const dateElement =
document.getElementById("date");

const titleInput =
document.getElementById("title");

const diaryInput =
document.getElementById("diary");

const photoInput =
document.getElementById("photo");

const stage =
document.getElementById("stage");

const status =
document.getElementById("status");

const controlBox =
document.getElementById("controlBox");

const pauseButton =
document.getElementById("pauseButton");

const resumeButton =
document.getElementById("resumeButton");

const bringActorFrontButton =
document.getElementById(
  "bringActorFrontButton"
);

const sendActorBackButton =
document.getElementById(
  "sendActorBackButton"
);

const deleteActorButton =
document.getElementById(
  "deleteActorButton"
);

const sizeSlider =
document.getElementById(
  "sizeSlider"
);

const backgroundSelect =
document.getElementById(
  "backgroundSelect"
);

const backgroundFile =
document.getElementById(
  "backgroundFile"
);

const accessoryFile =
document.getElementById(
  "accessoryFile"
);

const accessoryControl =
document.getElementById(
  "accessoryControl"
);

const accessorySizeSlider =
document.getElementById(
  "accessorySizeSlider"
);

const accessoryRotationSlider =
document.getElementById(
  "accessoryRotationSlider"
);

const deleteAccessoryButton =
document.getElementById(
  "deleteAccessoryButton"
);

const furnitureFile =
document.getElementById(
  "furnitureFile"
);

const furnitureControl =
document.getElementById(
  "furnitureControl"
);

const furnitureSizeSlider =
document.getElementById(
  "furnitureSizeSlider"
);

const lockFurnitureButton =
document.getElementById(
  "lockFurnitureButton"
);

const deleteFurnitureButton =
document.getElementById(
  "deleteFurnitureButton"
);

const saveButton =
document.getElementById("save");

const clearAllButton =
document.getElementById("clearAll");


/* =========================================
   데이터
========================================= */

const actors = [];
const accessories = [];
const furnitures = [];

let selectedActor = null;
let selectedAccessory = null;
let selectedFurniture = null;


/* =========================================
   날짜
========================================= */

const now = new Date();

dateElement.textContent =
now.getFullYear() +
"년 " +
(now.getMonth() + 1) +
"월 " +
now.getDate() +
"일";


/* =========================================
   일기 저장
========================================= */

titleInput.value =
localStorage.getItem(
  "diary-title"
) || "";

diaryInput.value =
localStorage.getItem(
  "diary-text"
) || "";

titleInput.addEventListener(
"input",
function() {

localStorage.setItem(
  "diary-title",
  titleInput.value
);

});

diaryInput.addEventListener(
"input",
function() {

localStorage.setItem(
  "diary-text",
  diaryInput.value
);

});


/* =========================================
   배경
========================================= */

let currentBackground = {
  type: "plain",
  src: null
};

function applyBackground(type) {

currentBackground.type =
type;

currentBackground.src =
null;

if (type === "sky") {

stage.style.background =
"linear-gradient(#bde8ff,#fff)";

}
else if (type === "night") {

stage.style.background =
"linear-gradient(#101528,#343b5c)";

}
else if (type === "grass") {

stage.style.background =
"linear-gradient(#dff5d8 0%,#c9ebc1 65%,#a9d79e 65%,#a9d79e 100%)";

}
else if (type === "pink") {

stage.style.background =
"#ffe8ef";

}
else if (type === "yellow") {

stage.style.background =
"#fff4b8";

}
else {

stage.style.background =
"#fafafa";

}

}

backgroundSelect.addEventListener(
"change",
function() {

applyBackground(
  this.value
);

});


backgroundFile.addEventListener(
"change",
function(e) {

const file =
e.target.files[0];

if (!file)
return;

const reader =
new FileReader();

reader.onload =
function(event) {

currentBackground.type =
"image";

currentBackground.src =
event.target.result;

stage.style.backgroundImage =
"url('" +
event.target.result +
"')";

stage.style.backgroundSize =
"cover";

stage.style.backgroundPosition =
"center";

stage.style.backgroundRepeat =
"no-repeat";

};

reader.readAsDataURL(file);

backgroundFile.value =
"";

});


applyBackground("plain");


/* =========================================
   선택 초기화
========================================= */

function clearSelections() {

if (selectedActor) {

selectedActor.element
.classList.remove(
  "selected"
);

}

if (selectedAccessory) {

selectedAccessory.element
.classList.remove(
  "selected"
);

}

if (selectedFurniture) {

selectedFurniture.element
.classList.remove(
  "selected"
);

}

selectedActor = null;
selectedAccessory = null;
selectedFurniture = null;

controlBox.classList.remove(
  "show"
);

accessoryControl.classList.remove(
  "show"
);

furnitureControl.classList.remove(
  "show"
);

}


/* =========================================
   캐릭터 선택
========================================= */

function selectActor(actor) {

if (
selectedActor === actor
) {

clearSelections();

updateStatus();

return false;

}

clearSelections();

selectedActor =
actor;

actor.element.classList.add(
  "selected"
);

controlBox.classList.add(
  "show"
);

sizeSlider.value =
actor.size;

updateStatus();

return true;

}


/* =========================================
   악세사리 선택
========================================= */

function selectAccessory(accessory) {

if (
selectedAccessory === accessory
) {

clearSelections();

updateStatus();

return false;

}

clearSelections();

selectedAccessory =
accessory;

accessory.element.classList.add(
  "selected"
);

accessoryControl.classList.add(
  "show"
);

accessorySizeSlider.value =
accessory.size;

accessoryRotationSlider.value =
accessory.rotation;

updateStatus();

return true;

}


/* =========================================
   가구 선택
========================================= */

function selectFurniture(furniture) {

if (
selectedFurniture === furniture
) {

clearSelections();

updateStatus();

return false;

}

clearSelections();

selectedFurniture =
furniture;

furniture.element.classList.add(
  "selected"
);

furnitureControl.classList.add(
  "show"
);

furnitureSizeSlider.value =
furniture.size;

updateFurnitureLockButton();

updateStatus();

return true;

}


/* =========================================
   SVG 이모지
========================================= */

function emojiSVG(emoji) {

return (
  "data:image/svg+xml;charset=utf-8," +
  encodeURIComponent(
`
<svg
xmlns="http://www.w3.org/2000/svg"
width="200"
height="200"
>
<text
x="100"
y="125"
font-size="120"
text-anchor="middle"
>
${emoji}
</text>
</svg>
`
  )
);

}


/* =========================================
   캐릭터 성격
========================================= */

function createPersonality() {

const types = [

{
speed: .6,
runSpeed: 1.5,
sleepChance: .3,
runChance: .15
},

{
speed: .9,
runSpeed: 2.2,
sleepChance: .1,
runChance: .45
},

{
speed: .5,
runSpeed: 1.2,
sleepChance: .55,
runChance: .05
},

{
speed: 1,
runSpeed: 2.5,
sleepChance: .15,
runChance: .4
}

];

return types[
Math.floor(
  Math.random() *
  types.length
)
];

}


/* =========================================
   캐릭터 추가
========================================= */

photoInput.addEventListener(
"change",
function(e) {

const file =
e.target.files[0];

if (!file)
return;

const reader =
new FileReader();

reader.onload =
function(event) {

const img =
document.createElement("img");

img.className =
"actor";

img.src =
event.target.result;

const personality =
createPersonality();

const actor = {

element: img,

originalFile: file,

originalImage: null,

x: 20 +
Math.random() *
Math.max(
  1,
  stage.clientWidth - 130
),

y: 20 +
Math.random() *
Math.max(
  1,
  stage.clientHeight - 130
),

targetX: 0,

targetY: 0,

size: 100,

speed:
personality.speed,

runSpeed:
personality.runSpeed,

sleepChance:
personality.sleepChance,

runChance:
personality.runChance,

state: "walking",

paused: false,

dragging: false,

layer: "front",

nextAction:
Date.now() + 1500

};

actor.targetX =
actor.x;

actor.targetY =
actor.y;

const original =
new Image();

original.onload =
function() {

actor.originalImage =
original;

};

original.src =
event.target.result;

img.style.left =
actor.x + "px";

img.style.top =
actor.y + "px";

actors.push(actor);

stage.appendChild(img);

applyActorLayer(actor);

enableActorDrag(actor);

updateStatus();

};

reader.readAsDataURL(file);

photoInput.value =
"";

});


/* =========================================
   캐릭터 레이어
========================================= */

function applyActorLayer(actor) {

if (!actor)
return;

actor.element.style.zIndex =
actor.layer === "back"
? "15"
: "30";

for (
const accessory of accessories
) {

if (
accessory.owner !== actor
)
continue;

accessory.element.style.zIndex =
actor.layer === "back"
? "14"
: "40";

}

}


/* =========================================
   캐릭터 드래그
========================================= */

function enableActorDrag(actor) {

const el =
actor.element;

/* =========================================
   캐릭터 행동
========================================= */

function chooseNewAction(actor) {

if (
actor.paused ||
actor.dragging
)
return;

const r =
Math.random();

if (
r < actor.sleepChance
) {

actor.state =
"sleeping";

actor.element.classList.add(
  "sleeping"
);

actor.element.classList.remove(
  "running"
);

actor.nextAction =
Date.now() +
2000 +
Math.random() * 3000;

}
else {

actor.state =
r <
actor.sleepChance +
actor.runChance
? "running"
: "walking";

actor.element.classList.remove(
  "sleeping"
);

if (
actor.state === "running"
) {

actor.element.classList.add(
  "running"
);

}
else {

actor.element.classList.remove(
  "running"
);

}

const maxX =
Math.max(
  0,
  stage.clientWidth -
  actor.element.offsetWidth
);

const maxY =
Math.max(
  0,
  stage.clientHeight -
  actor.element.offsetHeight
);

actor.targetX =
Math.random() * maxX;

actor.targetY =
Math.random() * maxY;

actor.nextAction =
Date.now() +
(
actor.state === "running"
? 1500
: 2500
) +
Math.random() * 2500;

}

}


function updateActors() {

const time =
Date.now();

for (
const actor of actors
) {

if (
actor.paused ||
actor.dragging
)
continue;

if (
time >= actor.nextAction
) {

chooseNewAction(actor);

}

if (
actor.state === "sleeping"
)
continue;

const dx =
actor.targetX -
actor.x;

const dy =
actor.targetY -
actor.y;

const distance =
Math.sqrt(
  dx * dx +
  dy * dy
);

if (
distance < 1
)
continue;

const speed =
actor.state === "running"
? actor.runSpeed
: actor.speed;

const step =
Math.min(
  speed,
  distance
);

actor.x +=
dx / distance *
step;

actor.y +=
dy / distance *
step;

actor.element.style.left =
actor.x + "px";

actor.element.style.top =
actor.y + "px";

updateAttachedAccessories(
  actor
);

}

updateStatus();

requestAnimationFrame(
  updateActors
);

}

/* =========================================
   저장
========================================= */

function wrapText(
ctx,
text,
maxWidth
) {

const lines = [];

const paragraphs =
String(text).split("\n");

for (
const paragraph of paragraphs
) {

if (!paragraph) {

lines.push("");

continue;

}

let line = "";

for (
const char of paragraph
) {

const test =
line + char;

if (
ctx.measureText(test).width >
maxWidth &&
line
) {

lines.push(line);

line = char;

}
else {

line = test;

}

}

lines.push(line);

}

return lines;

}

img.onload =
function() {

resolve(img);

};

img.onerror =
function() {

reject();

};

img.src =
src;

});

}


async function getImage(item) {

if (
item.originalImage
) {

return item.originalImage;

}

if (
item.originalFile
) {

return await createImageBitmap(
  item.originalFile
);

}

return await loadImage(
  item.element.src
);

}

);

diaryH +
25;

*/

(W - stageW) / 2;

y;

roundedBox(

if (

currentBackground.src
) {

);

const ratio =

let dh;

if (

) {

dh = stageH;
dw = dh * ratio;

) {

  "#101528"
);

  "#343b5c"
);

g;

else if (
currentBackground.type ===
"grass"
) {

const g =
ctx.createLinearGradient(

);

  0,
  "#dff5d8"
);

g.addColorStop(
  .65,
  "#c9ebc1"
);

g.addColorStop(
  .65,
  "#a9d79e"

g;

else if (
currentBackground.type ===
"pink"
) {

ctx.fillStyle =
"#ffe8ef";

}
else if (
currentBackground.type ===

) {

ctx.fillStyle =
"#fff4b8";

/*

*/

const scaleX =
stageW /
stage.clientWidth;

stageH /

/*

for (

async function drawActor(actor) {

const w =
actor.element.offsetWidth;

const h =
actor.element.offsetHeight;

const nw =
img.naturalWidth ||
img.width;

const nh =
img.naturalHeight ||
img.height;

const fit =
Math.min(
  w / nw,
  h / nh
);

const dw =
nw * fit;

const dh =
nh * fit;

ctx.drawImage(
  img,
  sx +
  actor.x *
  scaleX +
  (w-dw)/2 *
  scaleX,
  sy +
  actor.y *
  scaleY +
  (h-dh)/2 *
  scaleY,
  dw * scaleX,
  dh * scaleY
);

for (

) {

for (

) {

/*

*/

) {

a.element.offsetHeight;

);

const cx =

ctx.save();

ctx.translate(

);

  a.rotation *

);

  img,
  -dw*scaleX/2,

catch(error) {}

}

ctx.restore();


/*
  테두리
*/

ctx.save();

roundedBox(
  ctx,
  sx,

  stageW,

  24
);

"#ddd";

/* =========================================
   둥근 박스
========================================= */

function roundedBox(
ctx,
x,
y,
w,
h,
r
) {

ctx.beginPath();

ctx.moveTo(
  x+r,
  y
);

ctx.lineTo(
  x+w-r,
  y
);

ctx.quadraticCurveTo(
  x+w,
  y,
  x+w,
  y+r
);

ctx.lineTo(
  x+w,
  y+h-r
);

ctx.quadraticCurveTo(
  x+w,
  y+h,
  x+w-r,
  y+h
);

ctx.lineTo(
  x+r,
  y+h
);

ctx.quadraticCurveTo(
  x,
  y+h,
  x,
  y+h-r
);

ctx.lineTo(
  x,
  y+r
);

ctx.quadraticCurveTo(
  x,
  y,
  x+r,
  y
);

ctx.closePath();

}
