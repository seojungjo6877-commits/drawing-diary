<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="apple-mobile-web-app-capable"
content="yes">

<meta name="apple-mobile-web-app-status-bar-style"
content="default">

<title>그림일기</title>

<style>

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  background: #fff;
  color: #111;

  font-family:
  -apple-system,
  BlinkMacSystemFont,
  "Apple SD Gothic Neo",
  "Noto Sans KR",
  sans-serif;
}

header {
  padding: 18px 16px 10px;
}

.date {
  font-size: 13px;
  color: #777;
}

.container {
  padding: 0 16px 35px;
}

input[type="text"] {
  width: 100%;
  border: 1px solid #ddd;
  border-radius: 12px;
  padding: 12px;
  font-size: 16px;
  outline: none;
  background: #fff;
}

textarea {
  width: 100%;
  min-height: 180px;
  margin-top: 10px;
  border: 1px solid #ddd;
  border-radius: 12px;
  padding: 14px;
  font-size: 16px;
  line-height: 1.6;
  outline: none;
  resize: vertical;
  background: #fff;
}

.stage {
  position: relative;
  width: 100%;
  height: 380px;
  margin: 15px 0;
  border: 1px solid #ddd;
  border-radius: 18px;
  overflow: hidden;
  background: #fafafa;
  touch-action: none;
}

.actor {
  position: absolute;

  width: 90px;
  height: 90px;

  object-fit: contain;

  user-select: none;
  -webkit-user-select: none;

  touch-action: none;
  cursor: grab;

  image-rendering: auto;
}

.actor.dragging {
  cursor: grabbing;
}

.actor.selected {
  outline: 2px dashed #777;
  outline-offset: 4px;
  border-radius: 12px;
}

.actor.sleeping {
  opacity: 0.65;
}

.actor.running {
  opacity: 1;
}

.status {
  position: absolute;
  left: 50%;
  bottom: 8px;

  transform: translateX(-50%);

  font-size: 12px;
  color: #777;

  pointer-events: none;
  white-space: nowrap;
}

.add-area {
  margin: 12px 0 18px;
}

.photo-button {
  display: block;

  width: 100%;

  padding: 12px 16px;

  border: 1px solid #ddd;
  border-radius: 12px;

  background: #fff;
  color: #111;

  font-size: 15px;
  text-align: center;

  cursor: pointer;
}

#photo {
  display: none;
}

button {
  width: 100%;

  border: 1px solid #ddd;

  background: #fff;
  color: #111;

  border-radius: 12px;

  padding: 13px 16px;

  font-size: 15px;

  margin-top: 10px;
}

button:disabled {
  opacity: 0.5;
}

.control-box {
  display: none;

  margin-top: 10px;

  padding: 10px;

  border: 1px solid #ddd;

  border-radius: 12px;

  background: #fafafa;
}

.control-box.show {
  display: block;
}

.control-title {
  font-size: 13px;
  color: #666;
  margin-bottom: 5px;
}

.size-control {
  margin-top: 12px;
}

.size-label {
  font-size: 13px;
  color: #666;
  margin-bottom: 5px;
}

#sizeSlider {
  width: 100%;
  margin: 0;
  accent-color: #777;
}

.help {
  margin-top: 8px;

  text-align: center;

  font-size: 12px;

  color: #888;
}

#clearAll {
  margin-top: 10px;
}

</style>
</head>


<body>

<header>

<div
class="date"
id="date"
></div>

</header>


<div class="container">


<input
type="text"
id="title"
placeholder="오늘의 제목"
>


<textarea
id="diary"
placeholder="오늘의 일기를 써보세요."
></textarea>


<div
class="stage"
id="stage"
>

<div
class="status"
id="status"
>
캐릭터를 추가해보세요
</div>

</div>


<div class="add-area">

<label
class="photo-button"
for="photo"
>
＋ 캐릭터 추가
</label>

<input
id="photo"
type="file"
accept="image/*"
>

</div>


<div
class="control-box"
id="controlBox"
>

<div class="control-title">
선택한 캐릭터
</div>


<button
id="pauseButton"
>
⏸ 이 캐릭터 멈추기
</button>


<button
id="resumeButton"
>
▶ 다시 움직이기
</button>


<button
id="deleteActorButton"
>
🗑 이 캐릭터 삭제
</button>


<div class="size-control">

<div class="size-label">
크기
</div>

<input
type="range"
id="sizeSlider"
min="50"
max="200"
value="100"
step="1"
>

</div>

</div>


<div class="help">
캐릭터를 손가락으로 끌어서 원하는 곳에 놓을 수 있어요.
</div>


<button
id="save"
>
저장
</button>


<button
id="clearAll"
>
전체 삭제
</button>


</div>


<script>

/* =================================================
   기본 요소
================================================= */

const dateElement =
document.getElementById("date");

const titleInput =
document.getElementById("title");

const diaryInput =
document.getElementById("diary");

const photoInput =
document.getElementById("photo");

const stage =
document.getElementById("stage");

const status =
document.getElementById("status");

const controlBox =
document.getElementById("controlBox");

const pauseButton =
document.getElementById("pauseButton");

const resumeButton =
document.getElementById("resumeButton");

const deleteActorButton =
document.getElementById("deleteActorButton");

const sizeSlider =
document.getElementById("sizeSlider");

const saveButton =
document.getElementById("save");

const clearAllButton =
document.getElementById("clearAll");


/* =================================================
   날짜
================================================= */

const today =
new Date();

dateElement.textContent =
today.getFullYear() +
"년 " +
(today.getMonth() + 1) +
"월 " +
today.getDate() +
"일";


/* =================================================
   일기 저장
================================================= */

titleInput.value =
localStorage.getItem("diary-title") || "";

diaryInput.value =
localStorage.getItem("diary-text") || "";


titleInput.addEventListener(
"input",
function() {

localStorage.setItem(
"diary-title",
titleInput.value
);

});


diaryInput.addEventListener(
"input",
function() {

localStorage.setItem(
"diary-text",
diaryInput.value
);

});


/* =================================================
   캐릭터
================================================= */

const actors = [];

let selectedActor = null;


/* =================================================
   캐릭터 추가
================================================= */

photoInput.addEventListener(
"change",
function(event) {

const file =
event.target.files[0];

if (!file) {
return;
}


const reader =
new FileReader();


reader.onload =
function(e) {

const img =
document.createElement("img");


img.className =
"actor";


img.src =
e.target.result;


/* 화면 표시용 크기 */

const baseSize =
90;


img.style.width =
baseSize + "px";

img.style.height =
baseSize + "px";


const maxX =
Math.max(
0,
stage.clientWidth - baseSize
);

const maxY =
Math.max(
0,
stage.clientHeight - baseSize
);


const startX =
Math.random() * maxX;

const startY =
Math.random() * maxY;


img.style.left =
startX + "px";

img.style.top =
startY + "px";


/* =================================================
   중요

   file 자체를 보관한다.
   화면의 90px 이미지는 저장에 사용하지 않는다.
================================================= */

const personality =
createPersonality();


const actor = {

element: img,

/*
  ★ 업로드한 원본 파일
*/
originalFile: file,

/*
  ★ 원본 이미지
*/
originalImage: null,

/*
  원본 해상도
*/
naturalWidth: 0,
naturalHeight: 0,

x: startX,
y: startY,

targetX: startX,
targetY: startY,

size: 100,

speed:
personality.speed,

runSpeed:
personality.runSpeed,

sleepChance:
personality.sleepChance,

runChance:
personality.runChance,

state:
"walking",

paused:
false,

dragging:
false,

nextAction:
Date.now() +
1000 +
Math.random() * 2000

};


/* =================================================
   원본 파일을 저장용 Image로 읽음
================================================= */

const originalImage =
new Image();


originalImage.onload =
function() {

actor.originalImage =
originalImage;

actor.naturalWidth =
originalImage.naturalWidth;

actor.naturalHeight =
originalImage.naturalHeight;

};


originalImage.src =
e.target.result;


actors.push(actor);

stage.appendChild(img);

enableDragging(actor);

chooseNewAction(actor);

updateStatus();

};


reader.readAsDataURL(file);


/*
  같은 파일을 다시 선택해도
  change 이벤트가 발생하도록 초기화
*/

photoInput.value =
"";

});


/* =================================================
   성격
================================================= */

function createPersonality() {

const types = [

{
speed:
0.5 +
Math.random() * 0.4,

runSpeed:
1.1 +
Math.random() * 0.4,

sleepChance:
0.35,

runChance:
0.10
},

{
speed:
0.8 +
Math.random() * 0.5,

runSpeed:
1.8 +
Math.random() * 0.7,

sleepChance:
0.12,

runChance:
0.45
},

{
speed:
0.55 +
Math.random() * 0.35,

runSpeed:
1.2 +
Math.random() * 0.4,

sleepChance:
0.55,

runChance:
0.08
},

{
speed:
0.9 +
Math.random() * 0.5,

runSpeed:
2.0 +
Math.random() * 0.8,

sleepChance:
0.15,

runChance:
0.40
}

];


return types[
Math.floor(
Math.random() *
types.length
)
];

}


/* =================================================
   크기
================================================= */

function applyActorSize(actor) {

const scale =
actor.size / 100;

const baseSize =
90;


const newSize =
baseSize * scale;


/*
  기존 중심점 유지
*/

const centerX =
actor.x +
actor.element.offsetWidth / 2;

const centerY =
actor.y +
actor.element.offsetHeight / 2;


actor.element.style.width =
newSize + "px";

actor.element.style.height =
newSize + "px";


actor.x =
centerX -
newSize / 2;

actor.y =
centerY -
newSize / 2;


const maxX =
Math.max(
0,
stage.clientWidth - newSize
);

const maxY =
Math.max(
0,
stage.clientHeight - newSize
);


actor.x =
Math.max(
0,
Math.min(
actor.x,
maxX
)
);

actor.y =
Math.max(
0,
Math.min(
actor.y,
maxY
)
);


actor.targetX =
actor.x;

actor.targetY =
actor.y;


actor.element.style.left =
actor.x + "px";

actor.element.style.top =
actor.y + "px";

}


/* =================================================
   크기 조절
================================================= */

sizeSlider.addEventListener(
"input",
function() {

if (!selectedActor) {
return;
}


selectedActor.size =
Number(
sizeSlider.value
);


applyActorSize(
selectedActor
);

});


/* =================================================
   선택
================================================= */

function selectActor(actor) {

if (
selectedActor === actor
) {

actor.element.classList.remove(
"selected"
);

selectedActor =
null;

controlBox.classList.remove(
"show"
);

updateStatus();

return false;

}


if (selectedActor) {

selectedActor.element.classList.remove(
"selected"
);

}


selectedActor =
actor;


actor.element.classList.add(
"selected"
);


controlBox.classList.add(
"show"
);


sizeSlider.value =
actor.size;


updateStatus();

return true;

}


/* =================================================
   드래그
================================================= */

function enableDragging(actor) {

const element =
actor.element;

let offsetX = 0;
let offsetY = 0;


element.addEventListener(
"pointerdown",
function(e) {

e.preventDefault();

e.stopPropagation();


const wasSelected =
selectedActor === actor;


const selectionResult =
selectActor(actor);


if (
wasSelected &&
!selectionResult
) {

actor.dragging =
false;

return;

}


actor.dragging =
true;


element.classList.add(
"dragging"
);


try {

element.setPointerCapture(
e.pointerId
);

}
catch(error) {}


const rect =
stage.getBoundingClientRect();


const px =
e.clientX -
rect.left;

const py =
e.clientY -
rect.top;


offsetX =
px -
actor.x;

offsetY =
py -
actor.y;


actor.targetX =
actor.x;

actor.targetY =
actor.y;

});


element.addEventListener(
"pointermove",
function(e) {

if (!actor.dragging) {
return;
}


e.preventDefault();


const rect =
stage.getBoundingClientRect();


let newX =
e.clientX -
rect.left -
offsetX;

let newY =
e.clientY -
rect.top -
offsetY;


const maxX =
Math.max(
0,
stage.clientWidth -
element.offsetWidth
);

const maxY =
Math.max(
0,
stage.clientHeight -
element.offsetHeight
);


newX =
Math.max(
0,
Math.min(
newX,
maxX
)
);

newY =
Math.max(
0,
Math.min(
newY,
maxY
)
);


actor.x =
newX;

actor.y =
newY;

actor.targetX =
newX;

actor.targetY =
newY;


element.style.left =
newX + "px";

element.style.top =
newY + "px";

});


element.addEventListener(
"pointerup",
function(e) {

finishDragging(
actor,
e
);

});


element.addEventListener(
"pointercancel",
function(e) {

finishDragging(
actor,
e
);

});

}


/* =================================================
   드래그 종료
================================================= */

function finishDragging(
actor,
e
) {

if (!actor.dragging) {
return;
}


actor.dragging =
false;


actor.element.classList.remove(
"dragging"
);


try {

actor.element.releasePointerCapture(
e.pointerId
);

}
catch(error) {}


if (!actor.paused) {

actor.nextAction =
Date.now() +
500 +
Math.random() * 1000;

}


updateStatus();

}


/* =================================================
   멈추기
================================================= */

pauseButton.addEventListener(
"click",
function(e) {

e.preventDefault();
e.stopPropagation();


if (!selectedActor) {
return;
}


const actor =
selectedActor;


actor.paused =
true;

actor.state =
"paused";


actor.targetX =
actor.x;

actor.targetY =
actor.y;


actor.element.classList.remove(
"running"
);

actor.element.classList.remove(
"sleeping"
);


updateStatus();

});


/* =================================================
   다시 움직이기
================================================= */

resumeButton.addEventListener(
"click",
function(e) {

e.preventDefault();
e.stopPropagation();


if (!selectedActor) {
return;
}


const actor =
selectedActor;


actor.paused =
false;

actor.state =
"walking";


actor.nextAction =
Date.now() +
300;


chooseNewAction(actor);

updateStatus();

});


/* =================================================
   선택 캐릭터 삭제
================================================= */

deleteActorButton.addEventListener(
"click",
function(e) {

e.preventDefault();
e.stopPropagation();


if (!selectedActor) {
return;
}


const actor =
selectedActor;


actor.element.remove();


const index =
actors.indexOf(actor);


if (index !== -1) {

actors.splice(
index,
1
);

}


selectedActor =
null;


controlBox.classList.remove(
"show"
);


updateStatus();

});


/* =================================================
   전체 삭제
================================================= */

clearAllButton.addEventListener(
"click",
function(e) {

e.preventDefault();
e.stopPropagation();


titleInput.value =
"";

diaryInput.value =
"";


localStorage.removeItem(
"diary-title"
);

localStorage.removeItem(
"diary-text"
);


for (
const actor of actors
) {

actor.element.remove();

}


actors.length =
0;


selectedActor =
null;


controlBox.classList.remove(
"show"
);


photoInput.value =
"";


updateStatus();

});


/* =================================================
   행동
================================================= */

function chooseNewAction(actor) {

if (
actor.paused ||
actor.dragging
) {
return;
}


const random =
Math.random();


if (
random <
actor.sleepChance
) {

sleep(actor);

}

else if (
random <
actor.sleepChance +
actor.runChance
) {

run(actor);

}

else {

walk(actor);

}

}


/* =================================================
   잠
================================================= */

function sleep(actor) {

if (
actor.paused ||
actor.dragging
) {
return;
}


actor.state =
"sleeping";


actor.element.classList.add(
"sleeping"
);

actor.element.classList.remove(
"running"
);


actor.targetX =
actor.x;

actor.targetY =
actor.y;


actor.nextAction =
Date.now() +
2000 +
Math.random() * 4000;

}


/* =================================================
   걷기
================================================= */

function walk(actor) {

if (
actor.paused ||
actor.dragging
) {
return;
}


actor.state =
"walking";


actor.element.classList.remove(
"sleeping"
);

actor.element.classList.remove(
"running"
);


setRandomTarget(actor);


actor.nextAction =
Date.now() +
2500 +
Math.random() * 3500;

}


/* =================================================
   뛰기
================================================= */

function run(actor) {

if (
actor.paused ||
actor.dragging
) {
return;
}


actor.state =
"running";


actor.element.classList.remove(
"sleeping"
);

actor.element.classList.add(
"running"
);


setRandomTarget(actor);


actor.nextAction =
Date.now() +
1500 +
Math.random() * 2200;

}


/* =================================================
   목적지
================================================= */

function setRandomTarget(actor) {

const maxX =
Math.max(
0,
stage.clientWidth -
actor.element.offsetWidth
);

const maxY =
Math.max(
0,
stage.clientHeight -
actor.element.offsetHeight
);


actor.targetX =
Math.random() * maxX;

actor.targetY =
Math.random() * maxY;

}


/* =================================================
   움직임
================================================= */

function updateActors() {

const currentTime =
Date.now();


for (
const actor of actors
) {

if (actor.paused) {
continue;
}

if (actor.dragging) {
continue;
}


if (
currentTime >=
actor.nextAction
) {

chooseNewAction(actor);

}


if (
actor.state ===
"sleeping"
) {
continue;
}


const dx =
actor.targetX -
actor.x;

const dy =
actor.targetY -
actor.y;


const distance =
Math.sqrt(
dx * dx +
dy * dy
);


if (
distance < 1
) {
continue;
}


let speed =
actor.speed;


if (
actor.state ===
"running"
) {

speed =
actor.runSpeed;

}


const step =
Math.min(
speed,
distance
);


actor.x +=
(dx / distance) *
step;

actor.y +=
(dy / distance) *
step;


const maxX =
Math.max(
0,
stage.clientWidth -
actor.element.offsetWidth
);

const maxY =
Math.max(
0,
stage.clientHeight -
actor.element.offsetHeight
);


actor.x =
Math.max(
0,
Math.min(
actor.x,
maxX
)
);

actor.y =
Math.max(
0,
Math.min(
actor.y,
maxY
)
);


actor.element.style.left =
actor.x + "px";

actor.element.style.top =
actor.y + "px";

}


updateStatus();


requestAnimationFrame(
updateActors
);

}


/* =================================================
   상태
================================================= */

function updateStatus() {

if (
actors.length === 0
) {

status.textContent =
"캐릭터를 추가해보세요";

return;

}


if (
selectedActor
) {

if (
selectedActor.paused
) {

status.textContent =
"선택한 캐릭터가 멈춰 있어요";

}

else if (
selectedActor.dragging
) {

status.textContent =
"캐릭터를 움직이고 있어요";

}

else {

status.textContent =
"선택한 캐릭터 · " +
getStateText(
selectedActor.state
);

}

return;

}


status.textContent =
"캐릭터들이 자유롭게 움직이고 있어요";

}


function getStateText(state) {

switch(state) {

case "sleeping":
return "졸고 있어요 😴";

case "running":
return "뛰고 있어요";

case "walking":
return "걷고 있어요";

case "paused":
return "멈춰 있어요";

default:
return "쉬고 있어요";

}

}


/* =================================================
   글 줄바꿈
================================================= */

function getWrappedLines(
ctx,
text,
maxWidth
) {

const result = [];

const paragraphs =
String(text).split("\n");


for (
const paragraph of paragraphs
) {

if (
paragraph.length === 0
) {

result.push("");

continue;

}


let line = "";


for (
const char of paragraph
) {

const test =
line + char;


if (
ctx.measureText(test).width >
maxWidth &&
line
) {

result.push(line);

line =
char;

}
else {

line =
test;

}

}


result.push(line);

}


return result;

}


/* =================================================
   둥근 사각형
================================================= */

function roundedRect(
ctx,
x,
y,
w,
h,
r
) {

ctx.beginPath();

ctx.moveTo(
x + r,
y
);

ctx.lineTo(
x + w - r,
y
);

ctx.quadraticCurveTo(
x + w,
y,
x + w,
y + r
);

ctx.lineTo(
x + w,
y + h - r
);

ctx.quadraticCurveTo(
x + w,
y + h,
x + w - r,
y + h
);

ctx.lineTo(
x + r,
y + h
);

ctx.quadraticCurveTo(
x,
y + h,
x,
y + h - r
);

ctx.lineTo(
x,
y + r
);

ctx.quadraticCurveTo(
x,
y,
x + r,
y
);

ctx.closePath();

}


/* =================================================
   원본 이미지 준비
================================================= */

async function getOriginalImage(actor) {

if (
actor.originalImage &&
actor.originalImage.complete &&
actor.originalImage.naturalWidth > 0
) {

return actor.originalImage;

}


/*
  ★ 파일 자체에서 다시 읽는다.
  화면에 표시된 90px 이미지와 무관함.
*/

if (
actor.originalFile
) {

const bitmap =
await createImageBitmap(
actor.originalFile
);

return bitmap;

}


/*
  마지막 예비 방법
*/

return await loadImage(
actor.element.src
);

}


/* =================================================
   이미지 로드
================================================= */

function loadImage(src) {

return new Promise(
function(resolve, reject) {

const image =
new Image();


image.onload =
function() {

resolve(image);

};


image.onerror =
function() {

reject(
new Error(
"이미지를 불러오지 못했습니다."
)
);

};


image.src =
src;

});

}


/* =================================================
   저장
================================================= */

saveButton.addEventListener(
"click",
async function(e) {

e.preventDefault();
e.stopPropagation();


if (
saveButton.disabled
) {
return;
}


saveButton.disabled =
true;


const oldText =
saveButton.textContent;


saveButton.textContent =
"이미지 만드는 중...";


try {


localStorage.setItem(
"diary-title",
titleInput.value
);

localStorage.setItem(
"diary-text",
diaryInput.value
);


/* =================================================
   ★ 논리적 크기
================================================= */

const logicalWidth =
900;

const margin =
70;

const contentWidth =
logicalWidth -
margin * 2;


/* =================================================
   ★ 3배 해상도

   기존:
   900 × 높이

   변경:
   2700 × 높이

   즉 저장 PNG 자체가 훨씬 큰 해상도
================================================= */

const QUALITY_SCALE =
3;


/* =================================================
   글씨
================================================= */

const titleFont =
"bold 44px sans-serif";

const diaryFont =
"32px sans-serif";

const dateFont =
"25px sans-serif";


const measureCanvas =
document.createElement("canvas");

const measureCtx =
measureCanvas.getContext("2d");


measureCtx.font =
diaryFont;


const diaryLines =
getWrappedLines(
measureCtx,
diaryInput.value ||
"오늘의 일기를 써보세요.",
contentWidth
);


const diaryLineHeight =
52;


const topArea =
150;

const titleArea =
130;

const contentPadding =
45;


const contentHeight =
Math.max(
170,
diaryLines.length *
diaryLineHeight +
contentPadding * 2
);


const stageOutputWidth =
760;

const stageOutputHeight =
650;

const sectionGap =
25;


const logicalHeight =
topArea +
titleArea +
contentHeight +
stageOutputHeight +
sectionGap * 3 +
80;


/* =================================================
   ★ 실제 캔버스는 3배
================================================= */

const canvas =
document.createElement("canvas");


canvas.width =
logicalWidth *
QUALITY_SCALE;

canvas.height =
logicalHeight *
QUALITY_SCALE;


const ctx =
canvas.getContext("2d");


/*
  좌표는 기존처럼 900 기준으로 사용
  실제 픽셀만 3배가 됨
*/

ctx.scale(
QUALITY_SCALE,
QUALITY_SCALE
);


ctx.imageSmoothingEnabled =
true;

ctx.imageSmoothingQuality =
"high";


/* =================================================
   배경
================================================= */

ctx.fillStyle =
"#fff";

ctx.fillRect(
0,
0,
logicalWidth,
logicalHeight
);


/* =================================================
   오늘의 일기
================================================= */

ctx.textBaseline =
"middle";

ctx.textAlign =
"center";

ctx.fillStyle =
"#111";

ctx.font =
"bold 52px sans-serif";


ctx.fillText(
"오늘의 일기",
logicalWidth / 2,
70
);


ctx.font =
dateFont;

ctx.fillStyle =
"#777";


ctx.fillText(
dateElement.textContent,
logicalWidth / 2,
120
);


/* =================================================
   제목
================================================= */

let currentY =
topArea +
sectionGap;


roundedRect(
ctx,
margin,
currentY,
contentWidth,
titleArea,
20
);


ctx.fillStyle =
"#fafafa";

ctx.fill();


ctx.strokeStyle =
"#ddd";

ctx.lineWidth =
2;

ctx.stroke();


ctx.textAlign =
"left";


ctx.fillStyle =
"#777";

ctx.font =
"20px sans-serif";


ctx.fillText(
"제목",
margin + 30,
currentY + 30
);


ctx.fillStyle =
"#111";

ctx.font =
titleFont;


ctx.fillText(
titleInput.value ||
"오늘의 제목",
margin + 30,
currentY + 82
);


/* =================================================
   일기
================================================= */

currentY +=
titleArea +
sectionGap;


roundedRect(
ctx,
margin,
currentY,
contentWidth,
contentHeight,
20
);


ctx.fillStyle =
"#fff";

ctx.fill();


ctx.strokeStyle =
"#ddd";

ctx.lineWidth =
2;

ctx.stroke();


ctx.fillStyle =
"#777";

ctx.font =
"20px sans-serif";


ctx.fillText(
"일기 내용",
margin + 30,
currentY + 32
);


ctx.fillStyle =
"#111";

ctx.font =
diaryFont;


let textY =
currentY + 78;


for (
const line of diaryLines
) {

ctx.fillText(
line,
margin + 30,
textY
);

textY +=
diaryLineHeight;

}


/* =================================================
   캐릭터 영역
================================================= */

currentY +=
contentHeight +
sectionGap;


const stageX =
(logicalWidth -
stageOutputWidth) /
2;

const stageY =
currentY;


const scaleX =
stageOutputWidth /
stage.clientWidth;

const scaleY =
stageOutputHeight /
stage.clientHeight;


/* =================================================
   스테이지
================================================= */

ctx.save();


roundedRect(
ctx,
stageX,
stageY,
stageOutputWidth,
stageOutputHeight,
24
);


ctx.fillStyle =
"#fafafa";

ctx.fill();


ctx.strokeStyle =
"#ddd";

ctx.lineWidth =
2;

ctx.stroke();


ctx.clip();


/* =================================================
   ★ 캐릭터 저장
================================================= */

for (
const actor of actors
) {

try {


/*
  ★ 화면에 표시된 img가 아니라
  ★ 업로드한 원본 파일에서 가져온다.
*/

const image =
await getOriginalImage(actor);


/*
  원본 해상도
*/

const naturalWidth =
image.naturalWidth ||
image.width;

const naturalHeight =
image.naturalHeight ||
image.height;


/*
  현재 화면에서 캐릭터가 차지하는
  '90px 박스'의 크기
*/

const boxWidth =
actor.element.offsetWidth;

const boxHeight =
actor.element.offsetHeight;


/*
  ★ object-fit: contain과 동일하게
  원본 비율을 유지하면서 박스 안에 맞춤
*/

const fitScale =
Math.min(
boxWidth / naturalWidth,
boxHeight / naturalHeight
);


const displayedImageWidth =
naturalWidth *
fitScale;

const displayedImageHeight =
naturalHeight *
fitScale;


/*
  화면의 90px 박스 안에서
  실제 이미지가 가운데에 들어간 위치
*/

const offsetX =
(boxWidth -
displayedImageWidth) /
2;

const offsetY =
(boxHeight -
displayedImageHeight) /
2;


/*
  스테이지 위치
*/

const boxX =
stageX +
actor.x *
scaleX;

const boxY =
stageY +
actor.y *
scaleY;


/*
  ★ 캐릭터 자체는 비율이 절대
  찌그러지지 않도록 동일한 배율 사용

  3배 해상도는 이미
  canvas 전체에 적용되어 있음.
*/

const uniformScale =
Math.min(
scaleX,
scaleY
);


/*
  실제 이미지 위치
*/

const drawX =
boxX +
offsetX *
uniformScale;

const drawY =
boxY +
offsetY *
uniformScale;


/*
  ★ 실제 저장 크기
*/

const drawWidth =
displayedImageWidth *
uniformScale;

const drawHeight =
displayedImageHeight *
uniformScale;


/*
  ★★★ 핵심 ★★★

  화면의 90px 이미지를 확대하지 않고
  원본 이미지 픽셀에서 직접 그림.

  그리고 캔버스 자체가 3배 해상도라서
  최종 PNG도 훨씬 선명함.
*/

ctx.drawImage(
image,
0,
0,
naturalWidth,
naturalHeight,
drawX,
drawY,
drawWidth,
drawHeight
);


/*
  createImageBitmap으로 읽은 경우
  메모리 정리
*/

if (
typeof image.close === "function" &&
image !== actor.originalImage
) {

image.close();

}


}
catch(error) {

console.error(
"캐릭터 저장 실패:",
error
);

}

}


ctx.restore();


/* =================================================
   스테이지 테두리
================================================= */

ctx.save();


roundedRect(
ctx,
stageX,
stageY,
stageOutputWidth,
stageOutputHeight,
24
);


ctx.strokeStyle =
"#ddd";

ctx.lineWidth =
2;


ctx.stroke();


ctx.restore();


/* =================================================
   PNG 생성
================================================= */

const blob =
await new Promise(
function(resolve, reject) {

canvas.toBlob(
function(result) {

if (result) {

resolve(result);

}
else {

reject(
new Error(
"PNG 생성 실패"
)
);

}

},
"image/png"
);

});


/* =================================================
   파일
================================================= */

const file =
new File(
[blob],
"그림일기.png",
{
type: "image/png"
}
);


/* =================================================
   iPhone 공유
================================================= */

if (
navigator.share &&
navigator.canShare
) {

try {

const canShare =
navigator.canShare({
files: [file]
});


if (canShare) {

await navigator.share({

files: [file],

title:
"그림일기"

});

return;

}

}
catch(error) {

if (
error.name ===
"AbortError"
) {

return;

}

}

}


/* =================================================
   다운로드
================================================= */

const url =
URL.createObjectURL(blob);


const link =
document.createElement("a");


link.href =
url;


link.download =
"그림일기.png";


document.body.appendChild(
link
);


link.click();


link.remove();


setTimeout(
function() {

URL.revokeObjectURL(
url
);

},
1000
);


}
catch(error) {

console.error(
"저장 오류:",
error
);


alert(
"이미지를 만드는 중 문제가 생겼어요."
);

}
finally {

saveButton.disabled =
false;


saveButton.textContent =
oldText;

}

});


/* =================================================
   시작
================================================= */

requestAnimationFrame(
updateActors
);

</script>
