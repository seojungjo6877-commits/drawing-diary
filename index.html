<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="apple-mobile-web-app-capable"
content="yes">

<meta name="apple-mobile-web-app-status-bar-style"
content="default">

<title>그림일기</title>

<style>

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  background: #fff;
  color: #111;

  font-family:
  -apple-system,
  BlinkMacSystemFont,
  "Apple SD Gothic Neo",
  "Noto Sans KR",
  sans-serif;
}

header {
  padding: 18px 16px 10px;
}

.date {
  font-size: 13px;
  color: #777;
}

.container {
  padding: 0 16px 35px;
}

input[type="text"] {
  width: 100%;
  border: 1px solid #ddd;
  border-radius: 12px;
  padding: 12px;
  font-size: 16px;
  outline: none;
  background: #fff;
}

textarea {
  width: 100%;
  min-height: 180px;
  margin-top: 10px;
  border: 1px solid #ddd;
  border-radius: 12px;
  padding: 14px;
  font-size: 16px;
  line-height: 1.6;
  outline: none;
  resize: vertical;
  background: #fff;
}

.stage {
  position: relative;
  width: 100%;
  height: 380px;
  margin: 15px 0;
  border: 1px solid #ddd;
  border-radius: 18px;
  overflow: hidden;
  background-color: #fafafa;
  background-position: center;
  background-size: cover;
  background-repeat: no-repeat;
  touch-action: none;
}

.actor {
  position: absolute;
  width: 90px;
  height: 90px;
  object-fit: contain;
  user-select: none;
  -webkit-user-select: none;
  touch-action: none;
  cursor: grab;
  image-rendering: auto;
  z-index: 10;
}

.actor.dragging {
  cursor: grabbing;
}

.actor.selected {
  outline: 2px dashed #777;
  outline-offset: 4px;
  border-radius: 12px;
}

.actor.sleeping {
  opacity: 0.65;
}

.actor.running {
  opacity: 1;
}

.accessory {
  position: absolute;
  width: 55px;
  height: 55px;
  object-fit: contain;
  user-select: none;
  -webkit-user-select: none;
  touch-action: none;
  cursor: grab;
  z-index: 20;
}

.accessory.dragging {
  cursor: grabbing;
}

.accessory.selected {
  outline: 2px dashed #777;
  outline-offset: 3px;
  border-radius: 8px;
}

.status {
  position: absolute;
  left: 50%;
  bottom: 8px;
  transform: translateX(-50%);
  font-size: 12px;
  color: #777;
  pointer-events: none;
  white-space: nowrap;
  z-index: 100;
}

.add-area {
  margin: 12px 0 18px;
}

.photo-button {
  display: block;
  width: 100%;
  padding: 12px 16px;
  border: 1px solid #ddd;
  border-radius: 12px;
  background: #fff;
  color: #111;
  font-size: 15px;
  text-align: center;
  cursor: pointer;
}

#photo {
  display: none;
}

.background-area {
  margin-bottom: 18px;
}

.background-select {
  width: 100%;
  padding: 12px;
  border: 1px solid #ddd;
  border-radius: 12px;
  background: #fff;
  color: #111;
  font-size: 15px;
  outline: none;
}

.background-file-label {
  display: block;
  width: 100%;
  padding: 12px 16px;
  margin-top: 10px;
  border: 1px solid #ddd;
  border-radius: 12px;
  background: #fff;
  color: #111;
  font-size: 15px;
  text-align: center;
  cursor: pointer;
}

#backgroundFile {
  display: none;
}

.control-box {
  display: none;
  margin-top: 10px;
  padding: 10px;
  border: 1px solid #ddd;
  border-radius: 12px;
  background: #fafafa;
}

.control-box.show {
  display: block;
}

.control-title {
  font-size: 13px;
  color: #666;
  margin-bottom: 5px;
}

.size-control {
  margin-top: 12px;
}

.size-label {
  font-size: 13px;
  color: #666;
  margin-bottom: 5px;
}

#sizeSlider,
#accessorySizeSlider {
  width: 100%;
  margin: 0;
  accent-color: #777;
}

.accessory-box {
  display: none;
  margin-top: 10px;
  padding: 10px;
  border: 1px solid #ddd;
  border-radius: 12px;
  background: #fafafa;
}

.accessory-box.show {
  display: block;
}

.accessory-title {
  font-size: 13px;
  color: #666;
  margin-bottom: 8px;
}

.accessory-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 7px;
}

.accessory-choice {
  border: 1px solid #ddd;
  border-radius: 10px;
  background: #fff;
  padding: 8px 4px;
  font-size: 24px;
  line-height: 1.2;
  cursor: pointer;
  margin: 0;
}

.accessory-choice span {
  display: block;
  font-size: 11px;
  margin-top: 3px;
  color: #666;
}

.accessory-upload {
  display: block;
  width: 100%;
  margin-top: 8px;
  padding: 10px;
  border: 1px solid #ddd;
  border-radius: 10px;
  background: #fff;
  text-align: center;
  font-size: 13px;
  cursor: pointer;
}

#accessoryFile {
  display: none;
}

.accessory-control {
  display: none;
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid #ddd;
}

.accessory-control.show {
  display: block;
}

.help {
  margin-top: 8px;
  text-align: center;
  font-size: 12px;
  color: #888;
}

button {
  width: 100%;
  border: 1px solid #ddd;
  background: #fff;
  color: #111;
  border-radius: 12px;
  padding: 13px 16px;
  font-size: 15px;
  margin-top: 10px;
}

button:disabled {
  opacity: 0.5;
}

#clearAll {
  margin-top: 10px;
}

</style>
</head>

<body>

<header>
<div class="date" id="date"></div>
</header>

<div class="container">

<input
type="text"
id="title"
placeholder="오늘의 제목"
>

<textarea
id="diary"
placeholder="오늘의 일기를 써보세요."
></textarea>

<div class="background-area">

<select
id="backgroundSelect"
class="background-select"
>

<option value="plain">기본 배경</option>
<option value="sky">파란 하늘</option>
<option value="night">밤하늘</option>
<option value="grass">초원</option>
<option value="pink">분홍색</option>
<option value="yellow">노란색</option>

</select>

<label
class="background-file-label"
for="backgroundFile"
>
＋ 배경 사진 추가
</label>

<input
id="backgroundFile"
type="file"
accept="image/*"
>

</div>

<div
class="stage"
id="stage"
>

<div
class="status"
id="status"
>
캐릭터를 추가해보세요
</div>

</div>

<div class="add-area">

<label
class="photo-button"
for="photo"
>
＋ 캐릭터 추가
</label>

<input
id="photo"
type="file"
accept="image/*"
>

</div>

<div
class="control-box"
id="controlBox"
>

<div class="control-title">
선택한 캐릭터
</div>

<button id="pauseButton">
⏸ 이 캐릭터 멈추기
</button>

<button id="resumeButton">
▶ 다시 움직이기
</button>

<button id="deleteActorButton">
🗑 이 캐릭터 삭제
</button>

<div class="size-control">

<div class="size-label">
캐릭터 크기
</div>

<input
type="range"
id="sizeSlider"
min="50"
max="200"
value="100"
step="1"
>

</div>

<div class="accessory-box show">

<div class="accessory-title">
악세사리
</div>

<div class="accessory-grid">

<button
class="accessory-choice"
data-emoji="🎩"
>
🎩
<span>모자</span>
</button>

<button
class="accessory-choice"
data-emoji="👑"
>
👑
<span>왕관</span>
</button>

<button
class="accessory-choice"
data-emoji="🎀"
>
🎀
<span>리본</span>
</button>

<button
class="accessory-choice"
data-emoji="😎"
>
😎
<span>선글라스</span>
</button>

<button
class="accessory-choice"
data-emoji="🐱"
>
🐱
<span>고양이귀</span>
</button>

<button
class="accessory-choice"
data-emoji="✨"
>
✨
<span>별</span>
</button>

</div>

<label
class="accessory-upload"
for="accessoryFile"
>
＋ 악세사리 사진 추가
</label>

<input
id="accessoryFile"
type="file"
accept="image/*"
>

<div
class="accessory-control"
id="accessoryControl"
>

<div class="size-label">
선택한 악세사리 크기
</div>

<input
type="range"
id="accessorySizeSlider"
min="20"
max="200"
value="100"
step="1"
>

<button id="deleteAccessoryButton">
🗑 악세사리 삭제
</button>

</div>

</div>

</div>

<div class="help">
캐릭터와 악세사리를 손가락으로 끌어서 원하는 곳에 놓을 수 있어요.
</div>

<button id="save">
저장
</button>

<button id="clearAll">
전체 삭제
</button>

</div>

<script>

/* 요소 */

const dateElement =
document.getElementById("date");

const titleInput =
document.getElementById("title");

const diaryInput =
document.getElementById("diary");

const photoInput =
document.getElementById("photo");

const stage =
document.getElementById("stage");

const status =
document.getElementById("status");

const controlBox =
document.getElementById("controlBox");

const pauseButton =
document.getElementById("pauseButton");

const resumeButton =
document.getElementById("resumeButton");

const deleteActorButton =
document.getElementById("deleteActorButton");

const sizeSlider =
document.getElementById("sizeSlider");

const saveButton =
document.getElementById("save");

const clearAllButton =
document.getElementById("clearAll");

const backgroundSelect =
document.getElementById("backgroundSelect");

const backgroundFile =
document.getElementById("backgroundFile");

const accessoryFile =
document.getElementById("accessoryFile");

const accessoryControl =
document.getElementById("accessoryControl");

const accessorySizeSlider =
document.getElementById("accessorySizeSlider");

const deleteAccessoryButton =
document.getElementById("deleteAccessoryButton");


/* 날짜 */

const today = new Date();

dateElement.textContent =
today.getFullYear() +
"년 " +
(today.getMonth() + 1) +
"월 " +
today.getDate() +
"일";


/* 일기 */

titleInput.value =
localStorage.getItem("diary-title") || "";

diaryInput.value =
localStorage.getItem("diary-text") || "";

titleInput.addEventListener(
"input",
function() {

localStorage.setItem(
"diary-title",
titleInput.value
);

});

diaryInput.addEventListener(
"input",
function() {

localStorage.setItem(
"diary-text",
diaryInput.value
);

});


/* 상태 */

const actors = [];
const accessories = [];

let selectedActor = null;
let selectedAccessory = null;


/* 배경 */

let currentBackground = {
type: "plain",
src: null
};


function applyBackground(type) {

currentBackground.type = type;
currentBackground.src = null;

switch(type) {

case "sky":

stage.style.background =
"linear-gradient(#bde8ff, #ffffff)";

break;

case "night":

stage.style.background =
"linear-gradient(#101528, #343b5c)";

break;

case "grass":

stage.style.background =
"linear-gradient(#dff5d8 0%, #c9ebc1 65%, #a9d79e 65%, #a9d79e 100%)";

break;

case "pink":

stage.style.background =
"#ffe8ef";

break;

case "yellow":

stage.style.background =
"#fff4b8";

break;

default:

stage.style.background =
"#fafafa";

break;

}

}


backgroundSelect.addEventListener(
"change",
function() {

applyBackground(
backgroundSelect.value
);

});


backgroundFile.addEventListener(
"change",
function(event) {

const file =
event.target.files[0];

if (!file) return;

const reader =
new FileReader();

reader.onload =
function(e) {

currentBackground.type =
"image";

currentBackground.src =
e.target.result;

stage.style.background =
"url('" +
e.target.result +
"')";

stage.style.backgroundSize =
"cover";

stage.style.backgroundPosition =
"center";

stage.style.backgroundRepeat =
"no-repeat";

backgroundSelect.value =
"plain";

};

reader.readAsDataURL(file);

backgroundFile.value = "";

});


applyBackground("plain");


/* 캐릭터 추가 */

photoInput.addEventListener(
"change",
function(event) {

const file =
event.target.files[0];

if (!file) return;

const reader =
new FileReader();

reader.onload =
function(e) {

const img =
document.createElement("img");

img.className =
"actor";

img.src =
e.target.result;

const baseSize = 90;

img.style.width =
baseSize + "px";

img.style.height =
baseSize + "px";

const maxX =
Math.max(
0,
stage.clientWidth -
baseSize
);

const maxY =
Math.max(
0,
stage.clientHeight -
baseSize
);

const startX =
Math.random() * maxX;

const startY =
Math.random() * maxY;

const personality =
createPersonality();

const actor = {

element: img,

originalFile: file,

originalImage: null,

naturalWidth: 0,

naturalHeight: 0,

x: startX,

y: startY,

targetX: startX,

targetY: startY,

size: 100,

speed:
personality.speed,

runSpeed:
personality.runSpeed,

sleepChance:
personality.sleepChance,

runChance:
personality.runChance,

state: "walking",

paused: false,

dragging: false,

nextAction:
Date.now() +
1000 +
Math.random() * 2000

};

const originalImage =
new Image();

originalImage.onload =
function() {

actor.originalImage =
originalImage;

actor.naturalWidth =
originalImage.naturalWidth;

actor.naturalHeight =
originalImage.naturalHeight;

};

originalImage.src =
e.target.result;

actors.push(actor);

stage.appendChild(img);

enableDragging(actor);

chooseNewAction(actor);

updateStatus();

};

reader.readAsDataURL(file);

photoInput.value = "";

});


/* 성격 */

function createPersonality() {

const types = [

{
speed:
0.5 +
Math.random() * 0.4,

runSpeed:
1.1 +
Math.random() * 0.4,

sleepChance:
0.35,

runChance:
0.10
},

{
speed:
0.8 +
Math.random() * 0.5,

runSpeed:
1.8 +
Math.random() * 0.7,

sleepChance:
0.12,

runChance:
0.45
},

{
speed:
0.55 +
Math.random() * 0.35,

runSpeed:
1.2 +
Math.random() * 0.4,

sleepChance:
0.55,

runChance:
0.08
},

{
speed:
0.9 +
Math.random() * 0.5,

runSpeed:
2.0 +
Math.random() * 0.8,

sleepChance:
0.15,

runChance:
0.40
}

];

return types[
Math.floor(
Math.random() *
types.length
)
];

}


/* 캐릭터 크기 */

function applyActorSize(actor) {

const scale =
actor.size / 100;

const baseSize = 90;

const newSize =
baseSize * scale;

const centerX =
actor.x +
actor.element.offsetWidth / 2;

const centerY =
actor.y +
actor.element.offsetHeight / 2;

actor.element.style.width =
newSize + "px";

actor.element.style.height =
newSize + "px";

actor.x =
centerX -
newSize / 2;

actor.y =
centerY -
newSize / 2;

const maxX =
Math.max(
0,
stage.clientWidth -
newSize
);

const maxY =
Math.max(
0,
stage.clientHeight -
newSize
);

actor.x =
Math.max(
0,
Math.min(
actor.x,
maxX
)
);

actor.y =
Math.max(
0,
Math.min(
actor.y,
maxY
)
);

actor.targetX =
actor.x;

actor.targetY =
actor.y;

actor.element.style.left =
actor.x + "px";

actor.element.style.top =
actor.y + "px";

updateAttachedAccessories(actor);

}


sizeSlider.addEventListener(
"input",
function() {

if (!selectedActor) return;

selectedActor.size =
Number(sizeSlider.value);

applyActorSize(
selectedActor
);

});


/* 캐릭터 선택 */

function selectActor(actor) {

if (selectedActor === actor) {

actor.element.classList.remove(
"selected"
);

selectedActor = null;

controlBox.classList.remove(
"show"
);

selectedAccessory = null;

accessoryControl.classList.remove(
"show"
);

updateStatus();

return false;

}

if (selectedActor) {

selectedActor.element.classList.remove(
"selected"
);

}

if (selectedAccessory) {

selectedAccessory.element.classList.remove(
"selected"
);

selectedAccessory = null;

}

selectedActor = actor;

actor.element.classList.add(
"selected"
);

controlBox.classList.add(
"show"
);

sizeSlider.value =
actor.size;

updateStatus();

return true;

}


/* 악세사리 선택 */

function selectAccessory(accessory) {

if (
selectedAccessory &&
selectedAccessory !== accessory
) {

selectedAccessory.element.classList.remove(
"selected"
);

}

selectedAccessory =
accessory;

accessory.element.classList.add(
"selected"
);

accessoryControl.classList.add(
"show"
);

accessorySizeSlider.value =
accessory.size;

updateStatus();

}


/* 악세사리 생성 */

function createAccessory(
src,
originalFile = null,
emoji = null
) {

if (!selectedActor) {

alert(
"먼저 꾸밀 캐릭터를 선택해주세요."
);

return;

}

const img =
document.createElement("img");

img.className =
"accessory";

img.src =
src;

const size = 55;

img.style.width =
size + "px";

img.style.height =
size + "px";

const actor =
selectedActor;

const startX =
Math.max(
0,
Math.min(
stage.clientWidth - size,
actor.x +
(actor.element.offsetWidth - size) / 2
)
);

const startY =
Math.max(
0,
Math.min(
stage.clientHeight - size,
actor.y - size / 3
)
);

img.style.left =
startX + "px";

img.style.top =
startY + "px";


/*
  owner = 이 악세사리를
  어떤 캐릭터에 고정할지 저장
*/

const accessory = {

element: img,

owner: actor,

originalFile:
originalFile,

originalImage:
null,

emoji:
emoji,

x: startX,

y: startY,

relativeX:
startX - actor.x,

relativeY:
startY - actor.y,

size: 100,

dragging: false

};


if (originalFile) {

const originalImage =
new Image();

originalImage.onload =
function() {

accessory.originalImage =
originalImage;

};

originalImage.src =
src;

}

accessories.push(
accessory
);

stage.appendChild(img);

enableAccessoryDragging(
accessory
);

selectAccessory(
accessory
);

}


/* 기본 악세사리 */

document
.querySelectorAll(".accessory-choice")
.forEach(
function(button) {

button.addEventListener(
"click",
function(e) {

e.preventDefault();
e.stopPropagation();

const emoji =
button.dataset.emoji;

const svg =
`
<svg
xmlns="http://www.w3.org/2000/svg"
width="200"
height="200"
viewBox="0 0 200 200"
>
<rect
width="200"
height="200"
fill="transparent"
/>

<text
x="100"
y="125"
font-size="120"
text-anchor="middle"
dominant-baseline="middle"
>
${emoji}
</text>

</svg>
`;

const src =
"data:image/svg+xml;charset=utf-8," +
encodeURIComponent(svg);

createAccessory(
src,
null,
emoji
);

});

});


/* 사진 악세사리 */

accessoryFile.addEventListener(
"change",
function(event) {

const file =
event.target.files[0];

if (!file) return;

const reader =
new FileReader();

reader.onload =
function(e) {

createAccessory(
e.target.result,
file,
null
);

};

reader.readAsDataURL(file);

accessoryFile.value = "";

});


/* 악세사리 드래그 */

function enableAccessoryDragging(
accessory
) {

const element =
accessory.element;

let offsetX = 0;
let offsetY = 0;

element.addEventListener(
"pointerdown",
function(e) {

e.preventDefault();
e.stopPropagation();

selectAccessory(
accessory
);

accessory.dragging =
true;

element.classList.add(
"dragging"
);

try {

element.setPointerCapture(
e.pointerId
);

}
catch(error) {}

const rect =
stage.getBoundingClientRect();

const px =
e.clientX -
rect.left;

const py =
e.clientY -
rect.top;

offsetX =
px -
accessory.x;

offsetY =
py -
accessory.y;

});


element.addEventListener(
"pointermove",
function(e) {

if (!accessory.dragging)
return;

e.preventDefault();

const rect =
stage.getBoundingClientRect();

let newX =
e.clientX -
rect.left -
offsetX;

let newY =
e.clientY -
rect.top -
offsetY;

const maxX =
Math.max(
0,
stage.clientWidth -
element.offsetWidth
);

const maxY =
Math.max(
0,
stage.clientHeight -
element.offsetHeight
);

newX =
Math.max(
0,
Math.min(
newX,
maxX
)
);

newY =
Math.max(
0,
Math.min(
newY,
maxY
)
);

accessory.x =
newX;

accessory.y =
newY;


/*
  악세사리를 직접 움직였으면

if (accessory.owner) {

element.style.left =

/* 악세사리 드래그 종료 */

function finishAccessoryDragging(
accessory,
e
) {

if (!accessory.dragging)
return;

accessory.dragging =
false;

accessory.element.classList.remove(
"dragging"
);

try {

accessory.element.releasePointerCapture(
e.pointerId
);

}
catch(error) {}

updateStatus();

}


/* 악세사리 크기 */

function applyAccessorySize(
accessory
) {

const oldWidth =
accessory.element.offsetWidth;

const oldHeight =
accessory.element.offsetHeight;

const baseSize = 55;

const newSize =
baseSize *
(accessory.size / 100);

const centerX =
accessory.x +
oldWidth / 2;

const centerY =
accessory.y +
oldHeight / 2;

accessory.element.style.width =
newSize + "px";

accessory.element.style.height =
newSize + "px";

accessory.x =
centerX -
newSize / 2;

accessory.y =
centerY -
newSize / 2;

const maxX =
Math.max(
0,
stage.clientWidth -
newSize
);

const maxY =
Math.max(
0,
stage.clientHeight -
newSize
);

accessory.x =
Math.max(
0,
Math.min(
accessory.x,
maxX
)
);

accessory.y =
Math.max(
0,
Math.min(
accessory.y,
maxY
)
);

accessory.element.style.left =
accessory.x + "px";

accessory.element.style.top =
accessory.y + "px";


/*
  크기를 바꿔도
  현재 캐릭터에 고정된 위치 유지
*/

if (accessory.owner) {

accessory.relativeX =
accessory.x -
accessory.owner.x;

accessory.relativeY =
accessory.y -
accessory.owner.y;

}

}

/* 캐릭터 드래그 */

function enableDragging(actor) {

const element =
actor.element;

let offsetX = 0;
let offsetY = 0;

element.addEventListener(
"pointerdown",
function(e) {

e.preventDefault();
e.stopPropagation();

const wasSelected =
selectedActor === actor;

const selectionResult =
selectActor(actor);

if (
wasSelected &&
!selectionResult
) {

actor.dragging =
false;

return;

}

actor.dragging =
true;

element.classList.add(
"dragging"
);

try {

element.setPointerCapture(
e.pointerId
);

}
catch(error) {}

const rect =
stage.getBoundingClientRect();

const px =
e.clientX -
rect.left;

const py =
e.clientY -
rect.top;

offsetX =
px -
actor.x;

offsetY =
py -
actor.y;

actor.targetX =
actor.x;

actor.targetY =
actor.y;

});


element.addEventListener(
"pointermove",
function(e) {

if (!actor.dragging)
return;

e.preventDefault();

const rect =
stage.getBoundingClientRect();

let newX =
e.clientX -
rect.left -
offsetX;

let newY =
e.clientY -
rect.top -
offsetY;

const maxX =
Math.max(
0,
stage.clientWidth -
element.offsetWidth
);

const maxY =
Math.max(
0,
stage.clientHeight -
element.offsetHeight
);

newX =
Math.max(
0,
Math.min(
newX,
maxX
)
);

newY =
Math.max(
0,
Math.min(
newY,
maxY
)
);

actor.x =
newX;

actor.y =
newY;

actor.targetX =
newX;

actor.targetY =
newY;

element.style.left =
newX + "px";

element.style.top =
newY + "px";


/*
  캐릭터를 직접 드래그해도
  붙어 있는 악세사리가 같이 이동
*/

updateAttachedAccessories(
actor
);

});


element.addEventListener(
"pointerup",
function(e) {

finishDragging(
actor,
e
);

});


element.addEventListener(
"pointercancel",
function(e) {

finishDragging(
actor,
e
);

});

}


/* 캐릭터 드래그 종료 */

function finishDragging(
actor,
e
) {

if (!actor.dragging)
return;

actor.dragging =
false;

actor.element.classList.remove(
"dragging"
);

try {

actor.element.releasePointerCapture(
e.pointerId
);

}
catch(error) {}

if (!actor.paused) {

actor.nextAction =
Date.now() +
500 +
Math.random() * 1000;

}

updateStatus();

}


/* 캐릭터에 붙은 악세사리 이동 */

function updateAttachedAccessories(
actor
) {

for (
const accessory of accessories
) {

if (
accessory.owner !== actor
) continue;

if (
accessory.dragging
) continue;

accessory.x =
actor.x +
accessory.relativeX;

accessory.y =
actor.y +
accessory.relativeY;

const maxX =
Math.max(
0,
stage.clientWidth -
accessory.element.offsetWidth
);

const maxY =
Math.max(
0,
stage.clientHeight -
accessory.element.offsetHeight
);

accessory.x =
Math.max(
0,
Math.min(
accessory.x,
maxX
)
);

accessory.y =
Math.max(
0,
Math.min(
accessory.y,
maxY
)
);

accessory.element.style.left =
accessory.x + "px";

accessory.element.style.top =
accessory.y + "px";

}

}

/* 행동 */

function chooseNewAction(actor) {

if (
actor.paused ||
actor.dragging
) return;

const random =
Math.random();

if (
random <
actor.sleepChance
) {

sleep(actor);

}
else if (
random <
actor.sleepChance +
actor.runChance
) {

run(actor);

}
else {

walk(actor);

}

}


function sleep(actor) {

if (
actor.paused ||
actor.dragging
) return;

actor.state =
"sleeping";

actor.element.classList.add(
"sleeping"
);

actor.element.classList.remove(
"running"
);

actor.targetX =
actor.x;

actor.targetY =
actor.y;

actor.nextAction =
Date.now() +
2000 +
Math.random() * 4000;

}


function walk(actor) {

if (
actor.paused ||
actor.dragging
) return;

actor.state =
"walking";

actor.element.classList.remove(
"sleeping"
);

actor.element.classList.remove(
"running"
);

setRandomTarget(
actor
);

actor.nextAction =
Date.now() +
2500 +
Math.random() * 3500;

}


function run(actor) {

if (
actor.paused ||
actor.dragging
) return;

actor.state =
"running";

actor.element.classList.remove(
"sleeping"
);

actor.element.classList.add(
"running"
);

setRandomTarget(
actor
);

actor.nextAction =
Date.now() +
1500 +
Math.random() * 2200;

}


/* 목적지 */

function setRandomTarget(actor) {

const maxX =
Math.max(
0,
stage.clientWidth -
actor.element.offsetWidth
);

const maxY =
Math.max(
0,
stage.clientHeight -
actor.element.offsetHeight
);

actor.targetX =
Math.random() * maxX;

actor.targetY =
Math.random() * maxY;

}


/* 움직임 */

function updateActors() {

const currentTime =
Date.now();

for (
const actor of actors
) {

if (actor.paused)
continue;

if (actor.dragging)
continue;

if (
currentTime >=
actor.nextAction
) {

chooseNewAction(
actor
);

}

if (
actor.state ===
"sleeping"
) {

updateAttachedAccessories(
actor
);

continue;

}

const dx =
actor.targetX -
actor.x;

const dy =
actor.targetY -
actor.y;

const distance =
Math.sqrt(
dx * dx +
dy * dy
);

if (
distance < 1
) {

updateAttachedAccessories(
actor
);

continue;

}

let speed =
actor.speed;

if (
actor.state ===
"running"
) {

speed =
actor.runSpeed;

}

const step =
Math.min(
speed,
distance
);

actor.x +=
(dx / distance) *
step;

actor.y +=
(dy / distance) *
step;

const maxX =
Math.max(
0,
stage.clientWidth -
actor.element.offsetWidth
);

const maxY =
Math.max(
0,
stage.clientHeight -
actor.element.offsetHeight
);

actor.x =
Math.max(
0,
Math.min(
actor.x,
maxX
)
);

actor.y =
Math.max(
0,
Math.min(
actor.y,
maxY
)
);

actor.element.style.left =
actor.x + "px";

actor.element.style.top =
actor.y + "px";


/*
  움직일 때마다
  악세사리도 같은 속도로 이동
*/

updateAttachedAccessories(
actor
);

}

updateStatus();

requestAnimationFrame(
updateActors
);

}


/* 상태 */

function updateStatus() {

if (
actors.length === 0
) {

status.textContent =
"캐릭터를 추가해보세요";

return;

}

if (
selectedAccessory
) {

status.textContent =
"악세사리를 움직여 원하는 곳에 놓아보세요";

return;

}

if (
selectedActor
) {

if (
selectedActor.paused
) {

status.textContent =
"선택한 캐릭터가 멈춰 있어요";

}

else if (
selectedActor.dragging
) {

status.textContent =
"캐릭터를 움직이고 있어요";

}

else {

status.textContent =
"선택한 캐릭터 · " +
getStateText(
selectedActor.state
);

}

return;

}

status.textContent =
"캐릭터들이 자유롭게 움직이고 있어요";

}


function getStateText(state) {

switch(state) {

case "sleeping":

return "졸고 있어요 😴";

case "running":

return "뛰고 있어요";

case "walking":

return "걷고 있어요";

case "paused":

return "멈춰 있어요";

default:

return "쉬고 있어요";

}

}


/* 줄바꿈 */

function getWrappedLines(
ctx,
text,
maxWidth
) {

const result = [];

const paragraphs =
String(text).split("\n");

for (
const paragraph of paragraphs
) {

if (
paragraph.length === 0
) {

result.push("");

continue;

}

let line = "";

for (
const char of paragraph
) {

const test =
line + char;

if (
ctx.measureText(test).width >
maxWidth &&
line
) {

result.push(line);

line = char;

}
else {

line = test;

}

}

result.push(line);

}

return result;

}


/* 둥근 사각형 */

function roundedRect(
ctx,
x,
y,
w,
h,
r
) {

ctx.beginPath();

ctx.moveTo(
x + r,
y
);

ctx.lineTo(
x + w - r,
y
);

ctx.quadraticCurveTo(
x + w,
y,
x + w,
y + r
);

ctx.lineTo(
x + w,
y + h - r
);

ctx.quadraticCurveTo(
x + w,
y + h,
x + w - r,
y + h
);

ctx.lineTo(
x + r,
y + h
);

ctx.quadraticCurveTo(
x,
y + h,
x,
y + h - r
);

ctx.lineTo(
x,
y + r
);

ctx.quadraticCurveTo(
x,
y,
x + r,
y
);

ctx.closePath();

}


/* 이미지 로드 */

function loadImage(src) {

return new Promise(
function(resolve, reject) {

const image =
new Image();

image.onload =
function() {

resolve(image);

};

image.onerror =
function() {

reject(
new Error(
"이미지를 불러오지 못했습니다."
)
);

};

image.src =
src;

});

}


/* 원본 캐릭터 */

async function getOriginalImage(actor) {

if (
actor.originalImage &&
actor.originalImage.complete &&
actor.originalImage.naturalWidth > 0
) {

return actor.originalImage;

}

if (
actor.originalFile
) {

return await createImageBitmap(
actor.originalFile
);

}

return await loadImage(
actor.element.src
);

}


/* 악세사리 원본 */

async function getAccessoryImage(
accessory
) {

accessory.originalImage &&
accessory.originalImage.complete &&
accessory.originalImage.naturalWidth > 0
) {

return accessory.originalImage;

}

if (
accessory.originalFile
) {

return await createImageBitmap(
accessory.originalFile
);

}

return await loadImage(
accessory.element.src
);

}

gradient.addColorStop(
0,
"#dff5d8"
);

gradient.addColorStop(
0.65,
"#c9ebc1"
);

gradient.addColorStop(
0.65,
"#a9d79e"
);

gradient.addColorStop(
1,
"#a9d79e"
);

ctx.fillStyle =
gradient;

}
else {

ctx.fillStyle =
backgroundColor;

}

ctx.fillRect(
stageX,
stageY,
stageOutputWidth,
stageOutputHeight
);

}


/* 캐릭터 저장 */

for (
const actor of actors
) {

try {

const image =
await getOriginalImage(
actor
);

const naturalWidth =
image.naturalWidth ||
image.width;

const naturalHeight =
image.naturalHeight ||
image.height;

const boxWidth =
actor.element.offsetWidth;

const boxHeight =
actor.element.offsetHeight;

const fitScale =
Math.min(
boxWidth /
naturalWidth,
boxHeight /
naturalHeight
);

const displayedImageWidth =
naturalWidth *
fitScale;

const displayedImageHeight =
naturalHeight *
fitScale;

const offsetX =
(boxWidth -
displayedImageWidth) /
2;

const offsetY =
(boxHeight -
displayedImageHeight) /
2;

const boxX =
stageX +
actor.x *
scaleX;

const boxY =
stageY +
actor.y *
scaleY;

const uniformScale =
Math.min(
scaleX,
scaleY
);

const drawX =
boxX +
offsetX *
uniformScale;

const drawY =
boxY +
offsetY *
uniformScale;

const drawWidth =
displayedImageWidth *
uniformScale;

const drawHeight =
displayedImageHeight *
uniformScale;

ctx.drawImage(
image,
0,
0,
naturalWidth,
naturalHeight,
drawX,
drawY,
drawWidth,
drawHeight
);

}
catch(error) {

console.error(
"캐릭터 저장 실패:",
error
);

}

}


/* 악세사리 저장 */

for (
const accessory of accessories
) {

try {

const image =
await getAccessoryImage(
accessory
);

const naturalWidth =
image.naturalWidth ||
image.width;

const naturalHeight =
image.naturalHeight ||
image.height;

const boxWidth =
accessory.element.offsetWidth;

const boxHeight =
accessory.element.offsetHeight;

const fitScale =
Math.min(
boxWidth /
naturalWidth,
boxHeight /
naturalHeight
);

const displayedWidth =
naturalWidth *
fitScale;

const displayedHeight =
naturalHeight *
fitScale;

const offsetX =
(boxWidth -
displayedWidth) /
2;

const offsetY =
(boxHeight -
displayedHeight) /
2;

const boxX =
stageX +
accessory.x *
scaleX;

const boxY =
stageY +
accessory.y *
scaleY;

const uniformScale =
Math.min(
scaleX,
scaleY
);

const drawX =
boxX +
offsetX *
uniformScale;

const drawY =
boxY +
offsetY *
uniformScale;

const drawWidth =
displayedWidth *
uniformScale;

const drawHeight =
displayedHeight *
uniformScale;

ctx.drawImage(
image,
0,
0,
naturalWidth,
naturalHeight,
drawX,
drawY,
drawWidth,
drawHeight
);

}
catch(error) {

console.error(
"악세사리 저장 실패:",
error
);

}

}

ctx.restore();


/* 테두리 */

ctx.save();

roundedRect(
ctx,
stageX,
stageY,
stageOutputWidth,
stageOutputHeight,
24
);

ctx.strokeStyle =
"#ddd";

ctx.lineWidth = 2;

ctx.stroke();

ctx.restore();


/* PNG */

const blob =
await new Promise(
function(resolve, reject) {

canvas.toBlob(
function(result) {

if (result) {

resolve(result);

}
else {

reject(
new Error(
"PNG 생성 실패"
)
);

}

},
"image/png"
);

}
);

const file =
new File(
[blob],
"그림일기.png",
{
type:
"image/png"
}
);


/* 공유 */

if (
navigator.share &&
navigator.canShare
) {

try {

const canShare =
navigator.canShare({
files: [file]
});

if (canShare) {

await navigator.share({

files: [file],

title:
"그림일기"

});

return;

}

}
catch(error) {

if (
error.name ===
"AbortError"
) {

return;

}

}

}


/* 다운로드 */

const url =
URL.createObjectURL(
blob
);

const link =
document.createElement("a");

link.href =
url;

link.download =
"그림일기.png";

document.body.appendChild(
link
);

link.click();

link.remove();

setTimeout(
function() {

URL.revokeObjectURL(
url
);

},
1000
);

}
catch(error) {

console.error(
"저장 오류:",
error
);

alert(
"이미지를 만드는 중 문제가 생겼어요."
);

}
finally {

saveButton.disabled =
false;

saveButton.textContent =
oldText;

}

});


/* 시작 */

requestAnimationFrame(
updateActors
);

</script>

</body>
</html>
