<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>그림일기</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:#f5f5f5;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",
  "Noto Sans KR",sans-serif;
  color:#222;
}

button,input,textarea{
  font-family:inherit;
}

button{
  border:1px solid #ddd;
  background:#fff;
  border-radius:10px;
  padding:8px 10px;
  cursor:pointer;
}

button:active{
  transform:scale(.97);
}

.app{
  width:100%;
  max-width:900px;
  margin:auto;
  padding:12px;
}

h1{
  text-align:center;
  margin:4px 0 12px;
  font-size:23px;
}

/* ---------------------------
   일기 영역
--------------------------- */

.diary-area{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.title-wrap,
.diary-wrap{
  position:relative;
  border:1px solid #ddd;
  border-radius:14px;
  overflow:hidden;
  background:#fff;
}

.title-input{
  width:100%;
  border:0;
  outline:0;
  padding:13px;
  font-size:19px;
  font-weight:bold;
  background:transparent;
  color:#222;
}

.diary-input{
  width:100%;
  min-height:140px;
  resize:vertical;
  border:0;
  outline:0;
  padding:13px;
  font-size:16px;
  line-height:1.6;
  background:transparent;
  color:#222;
}

.color-tools{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:6px;
  padding:7px;
  border-top:1px solid #eee;
  background:rgba(255,255,255,.7);
}

.color-tools span{
  font-size:12px;
  margin-right:2px;
}

.color-btn{
  width:28px;
  height:28px;
  padding:0;
  border-radius:50%;
}

.custom-color{
  width:35px;
  height:28px;
  padding:0;
  border:1px solid #ccc;
}

.photo-label{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border:1px solid #ddd;
  background:#fff;
  border-radius:9px;
  padding:6px 9px;
  font-size:12px;
  cursor:pointer;
}

.photo-label input{
  display:none;
}

/* ---------------------------
   배경
--------------------------- */

.background-box{
  margin-top:10px;
  border:1px solid #ddd;
  border-radius:14px;
  padding:10px;
  background:#fff;
}

.section-title{
  font-weight:bold;
  font-size:14px;
  margin-bottom:8px;
}

.background-buttons{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
}

.bg-btn{
  min-height:45px;
  font-size:12px;
}

.custom-bg-label{
  display:flex;
  justify-content:center;
  align-items:center;
  margin-top:7px;
  border:1px solid #ddd;
  border-radius:9px;
  padding:8px;
  font-size:12px;
  background:#fff;
}

.custom-bg-label input{
  display:none;
}

/* ---------------------------
   무대
--------------------------- */

.stage{
  position:relative;
  width:100%;
  height:430px;
  margin-top:10px;
  overflow:hidden;
  border:1px solid #ddd;
  border-radius:16px;
  background:#fafafa;
  touch-action:none;
}

.actor{
  position:absolute;
  width:90px;
  height:90px;
  object-fit:contain;
  user-select:none;
  touch-action:none;
  z-index:30;
}

.actor.selected{
  outline:2px dashed #777;
  outline-offset:3px;
  border-radius:10px;
}

.accessory{
  position:absolute;
  object-fit:contain;
  user-select:none;
  touch-action:none;
  z-index:40;
}

.accessory.selected{
  outline:2px dashed #777;
  outline-offset:2px;
  border-radius:8px;
}

.furniture{
  position:absolute;
  object-fit:contain;
  user-select:none;
  touch-action:none;
  z-index:20;
}

.furniture.selected{
  outline:2px dashed #777;
  outline-offset:3px;
  border-radius:8px;
}

.gift-on-stage{
  position:absolute;
  object-fit:contain;
  user-select:none;
  pointer-events:none;
  z-index:35;
}

/* ---------------------------
   선택 영역
--------------------------- */

.control-box{
  margin-top:10px;
  padding:11px;
  border:1px solid #ddd;
  border-radius:14px;
  background:#fff;
}

.control-title{
  font-weight:bold;
  margin-bottom:8px;
}

.control-row{
  display:flex;
  align-items:center;
  gap:7px;
  margin-top:7px;
}

.control-row label{
  font-size:12px;
  white-space:nowrap;
}

input[type="range"]{
  flex:1;
}

.delete-btn{
  background:#fff0f0;
  border-color:#ffd0d0;
}

.lock-btn{
  background:#f5f5f5;
}

.hidden{
  display:none !important;
}

/* ---------------------------
   캐릭터 / 악세사리 / 가구 박스
--------------------------- */

.tools-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:10px;
}

.tool-box{
  border:1px solid #ddd;
  border-radius:14px;
  padding:10px;
  background:#fff;
}

.tool-box-title{
  font-weight:bold;
  font-size:14px;
  margin-bottom:8px;
}

.character-add{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.file-label{
  display:flex;
  justify-content:center;
  align-items:center;
  border:1px solid #ddd;
  border-radius:10px;
  padding:9px;
  background:#fff;
  font-size:13px;
}

.file-label input{
  display:none;
}

.choice-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
}

.choice-btn{
  min-height:45px;
  padding:5px;
  font-size:13px;
}

.custom-choice{
  margin-top:7px;
}

/* ---------------------------
   쓰다듬기
--------------------------- */

.petting-box{
  display:none;
  margin-top:10px;
  border:1px solid #ddd;
  border-radius:12px;
  padding:8px;
  background:#fafafa;
}

.petting-box.show{
  display:block;
}

.petting-title{
  font-size:13px;
  font-weight:bold;
  margin-bottom:6px;
}

.petting-stage{
  position:relative;
  width:100%;
  height:290px;
  overflow:hidden;
  border-radius:12px;
  background:#fff;
  border:1px solid #eee;
  touch-action:none;
}

.petting-actor{
  position:absolute;
  object-fit:contain;
  user-select:none;
  pointer-events:none;
  transition:transform .12s ease;
}

.petting-actor.petted{
  transform:scale(1.06);
}

.petting-accessory{
  position:absolute;
  object-fit:contain;
  pointer-events:none;
}

.petting-status{
  position:absolute;
  left:50%;
  bottom:8px;
  transform:translateX(-50%);
  padding:5px 10px;
  border-radius:20px;
  background:rgba(255,255,255,.85);
  font-size:12px;
  z-index:100;
  pointer-events:none;
}

.pet-heart{
  position:absolute;
  font-size:24px;
  pointer-events:none;
  animation:petHeart .7s ease-out forwards;
}

@keyframes petHeart{
  from{
    opacity:1;
    transform:translateY(0) scale(.8);
  }
  to{
    opacity:0;
    transform:translateY(-45px) scale(1.2);
  }
}

/* ---------------------------
   선물
--------------------------- */

.gift-box{
  margin-top:10px;
  border:1px solid #ddd;
  border-radius:12px;
  padding:9px;
  background:#fff;
}

.gift-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
}

.gift-choice{
  min-height:48px;
  font-size:13px;
}

.inventory-box{
  margin-top:9px;
  padding-top:8px;
  border-top:1px solid #eee;
}

.inventory-title{
  font-size:13px;
  font-weight:bold;
  margin-bottom:7px;
}

.inventory-list{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
}

.inventory-item{
  min-height:55px;
  padding:4px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.inventory-item img{
  width:45px;
  height:45px;
  object-fit:contain;
}

.inventory-item.held{
  outline:2px solid #aaa;
}

.inventory-empty{
  grid-column:1/-1;
  text-align:center;
  color:#999;
  font-size:12px;
  padding:10px 0;
}

/* ---------------------------
   저장 / 전체삭제
--------------------------- */

.bottom-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:10px;
}

.save-btn{
  font-weight:bold;
  background:#fff;
}

.clear-btn{
  background:#fff0f0;
  border-color:#ffd0d0;
}

/* ---------------------------
   반응형
--------------------------- */

@media(max-width:600px){
  .tools-grid{
    grid-template-columns:1fr;
  }

  .stage{
    height:380px;
  }

  .background-buttons{
    grid-template-columns:repeat(3,1fr);
  }
}
</style>
</head>

<body>

<div class="app">

<h1>그림일기</h1>

<!-- =========================
     제목 / 일기
========================= -->

<div class="diary-area">

  <div class="title-wrap" id="titleWrap">
    <input
      id="titleInput"
      class="title-input"
      placeholder="오늘의 제목"
    >

      <span>제목 색</span>

      <button class="color-btn" style="background:#fff" data-target="title" data-color="#ffffff"></button>

      <button class="color-btn" style="background:#fff4d6" data-target="title" data-color="#fff4d6"></button>
      <button class="color-btn" style="background:#effff2" data-target="title" data-color="#effff2"></button>
      <button class="color-btn" style="background:#eef7ff" data-target="title" data-color="#eef7ff"></button>
      <button class="color-btn" style="background:#f5efff" data-target="title" data-color="#f5efff"></button>

      <input
        type="color"

        id="titleColor"
        value="#ffffff"

      <label class="photo-label">

  </div>

  <div class="diary-wrap" id="diaryWrap">
    <textarea

    ></textarea>

    <div class="color-tools">
      <span>일기 색</span>

      <button class="color-btn" style="background:#fff" data-target="diary" data-color="#ffffff"></button>
      <button class="color-btn" style="background:#fff1f5" data-target="diary" data-color="#fff1f5"></button>
      <button class="color-btn" style="background:#fff6df" data-target="diary" data-color="#fff6df"></button>
      <button class="color-btn" style="background:#effff0" data-target="diary" data-color="#effff0"></button>
      <button class="color-btn" style="background:#eef8ff" data-target="diary" data-color="#eef8ff"></button>
      <button class="color-btn" style="background:#f5efff" data-target="diary" data-color="#f5efff"></button>

      <input
        type="color"
        class="custom-color"
        id="diaryColor"
        value="#ffffff"
      >

      <label class="photo-label">
        🖼️ 사진
        <input type="file" id="diaryPhoto" accept="image/*">
      </label>
    </div>
  </div>

</div>


<!-- =========================
     배경
========================= -->

<div class="background-box">

  <div class="section-title">🌈 배경</div>

  <div class="background-buttons">

    <button class="bg-btn"
      data-bg="plain"
      style="background:#fffdfd">
      기본
    </button>

    <button class="bg-btn"
      data-bg="pink"
      style="background:#ffeef4">
      딸기우유
    </button>

    <button class="bg-btn"
      data-bg="yellow"
      style="background:#fff7c7">
      크림
    </button>

    <button class="bg-btn"
      data-bg="blue"
      style="background:#e5f5ff">
      하늘
    </button>

    <button class="bg-btn"
      data-bg="green"
      style="background:#eaf8e4">
      민트
    </button>

    <button class="bg-btn"
      data-bg="purple"
      style="background:#f1eaff">
      라벤더
    </button>

    <button class="bg-btn"
      data-bg="peach"
      style="background:#ffebdf">
      복숭아
    </button>

    <button class="bg-btn"
      data-bg="night"
      style="background:#dfe3f4">
      밤
    </button>

  </div>

  <label class="custom-bg-label">
    🖼️ 사진으로 배경 만들기
    <input type="file" id="customBg" accept="image/*">
  </label>

</div>


<!-- =========================
     무대
========================= -->

<div class="stage" id="stage"></div>


<!-- =========================
     캐릭터 선택 창
========================= -->

<div class="control-box" id="controlBox">

  <div class="control-title">
    캐릭터
  </div>

  <div id="characterStatus">
    캐릭터를 선택해주세요.
  </div>

  <div class="control-row">
    <label>크기</label>
    <input
      type="range"
      id="characterSize"
      min="40"
      max="220"
      value="90"
    >
  </div>

  <div class="control-row">
    <button id="petButton">
      🖐 쓰다듬기
    </button>

    <button
      id="deleteCharacter"
      class="delete-btn">
      이 캐릭터 삭제
    </button>
  </div>


  <!-- 쓰다듬기 -->

  <div class="petting-box" id="pettingBox">

    <div class="petting-title">
      🖐 쓰다듬기
    </div>

    <div
      class="petting-stage"
      id="pettingStage">

      <div
        class="petting-status"
        id="pettingStatus">
        캐릭터를 쓰다듬어보세요.
      </div>

    </div>

  </div>


  <!-- =====================
       선물
  ====================== -->

  <div class="gift-box">

    <div class="section-title">
      🎁 선물
    </div>

    <div class="gift-grid">

      <button
        class="gift-choice"
        data-emoji="🎁"
        data-name="선물상자">
        🎁<br>선물상자
      </button>

      <button
        class="gift-choice"
        data-emoji="🍪"
        data-name="쿠키">
        🍪<br>쿠키
      </button>

      <button
        class="gift-choice"
        data-emoji="🌷"
        data-name="꽃">
        🌷<br>꽃
      </button>

      <button
        class="gift-choice"
        data-emoji="🧸"
        data-name="인형">
        🧸<br>인형
      </button>

      <button
        class="gift-choice"
        data-emoji="⭐"
        data-name="별">
        ⭐<br>별
      </button>

      <button
        class="gift-choice"
        data-emoji="🍎"
        data-name="사과">
        🍎<br>사과
      </button>

    </div>

    <label class="file-label custom-choice">
      🖼️ 사진으로 선물 만들기
      <input
        type="file"
        id="giftFile"
        accept="image/*">
    </label>


    <div class="inventory-box">

      <div class="inventory-title">
        🎒 소지품
      </div>

      <div

        id="inventoryList">

        <div class="inventory-empty">

</div>


<!-- =========================
     도구
========================= -->

<div class="tools-grid">

  <!-- 캐릭터 -->

      👤 캐릭터 추가

  <!-- 악세사리 -->

        data-name="모자">

      </button>

      <button
        class="choice-btn accessory-choice"
        data-emoji="👑"
        data-name="왕관">
        👑<br>왕관
      </button>

      <button
        class="choice-btn accessory-choice"
        data-emoji="🎀"
        data-name="리본">
        🎀<br>리본
      </button>

      <button
        class="choice-btn accessory-choice"
        data-emoji="☁️"
        data-name="구름">
        ☁️<br>구름
      </button>

      <button
        class="choice-btn accessory-choice"
        data-emoji="🤍"
        data-name="하트">
        🤍<br>하트
      </button>

      <button
        class="choice-btn accessory-choice"
        data-emoji="✨"
        data-name="별">
        ✨<br>별
      </button>

    <label class="file-label custom-choice">

      <input

  <!-- 가구 -->

  <div class="tool-box">

    <div class="tool-box-title">
      🪑 가구
    </div>

    <div class="choice-grid">

        class="choice-btn furniture-choice"
        data-emoji="🪑"
        data-name="의자">
        🪑<br>의자
      </button>

      <button
        class="choice-btn furniture-choice"
        data-emoji="🛋️"
        data-name="소파">
        🛋️<br>소파
      </button>

      <button
        class="choice-btn furniture-choice"
        data-emoji="🛏️"
        data-name="침대">
        🛏️<br>침대
      </button>

      <button
        class="choice-btn furniture-choice"
        data-emoji="🪴"
        data-name="화분">
        🪴<br>화분
      </button>

      <button
        class="choice-btn furniture-choice"
        data-emoji="🗄️"
        data-name="서랍장">
        🗄️<br>서랍장

      <button
        class="choice-btn furniture-choice"
        data-emoji="🪟"

      </button>

    </div>

    <label class="file-label custom-choice">
      🖼️ 사진으로 가구
      <input
        type="file"
        id="furnitureFile"
        accept="image/*">
    </label>

  </div>

</div>


<div class="bottom-buttons">

  <button
    class="save-btn"
    id="saveButton">
    저장
  </button>

  <button
    class="clear-btn"
    id="clearButton">
    전체 삭제
  </button>

</div>

</div>


<script>

/* =========================================================
   기본 설정
========================================================= */

const stage = document.getElementById("stage");

const titleInput = document.getElementById("titleInput");
const diaryInput = document.getElementById("diaryInput");

const titleWrap = document.getElementById("titleWrap");
const diaryWrap = document.getElementById("diaryWrap");

const characterFile = document.getElementById("characterFile");
const accessoryFile = document.getElementById("accessoryFile");
const furnitureFile = document.getElementById("furnitureFile");
const giftFile = document.getElementById("giftFile");

const customBg = document.getElementById("customBg");

const controlBox = document.getElementById("controlBox");
const characterStatus = document.getElementById("characterStatus");
const characterSize = document.getElementById("characterSize");

const petButton = document.getElementById("petButton");
const pettingBox = document.getElementById("pettingBox");
const pettingStage = document.getElementById("pettingStage");
const pettingStatus = document.getElementById("pettingStatus");

const inventoryList = document.getElementById("inventoryList");

let actors = [];
let accessories = [];
let furnitures = [];

let selectedActor = null;
let selectedAccessory = null;
let selectedFurniture = null;

let customBackgroundImage = null;

let actorId = 0;
let accessoryId = 0;
let furnitureId = 0;
let giftId = 0;


/* =========================================================
   이모지 이미지
========================================================= */

function emojiSVG(emoji){

  const svg = `
  <svg xmlns="http://www.w3.org/2000/svg"
       width="200"
       height="200"
       viewBox="0 0 200 200">

    <rect width="200"
          height="200"
          fill="transparent"/>

    <text
      x="100"
      y="135"
      text-anchor="middle"
      font-size="120">
      ${emoji}
    </text>

  </svg>`;

  return "data:image/svg+xml;charset=utf-8," +
    encodeURIComponent(svg);
}


/* =========================================================
   배경
========================================================= */

let currentBackground = "plain";

const backgrounds = {

  plain:
    "#fffdfd",

  pink:

function updateActorPosition(actor){

  actor.element.style.left =
    actor.x + "px";

  actor.element.style.top =
    actor.y + "px";

  updateAttachedAccessories(actor);
  updateHeldGifts(actor);
}


function setupActorDrag(actor){

  let startX = 0;
  let startY = 0;

  let originalX = 0;
  let originalY = 0;

  let dragging = false;
  let wasSelected = false;

  actor.element.addEventListener(
    "pointerdown",
    e=>{

      e.preventDefault();
      e.stopPropagation();

      wasSelected =
        selectedActor === actor;

      startX = e.clientX;
      startY = e.clientY;

      originalX = actor.x;
      originalY = actor.y;

      dragging = false;

      actor.element.setPointerCapture(
        e.pointerId
      );

      if(!wasSelected){

        selectActor(actor);

      }

      actor.moving = false;

    }
  );


  actor.element.addEventListener(
    "pointermove",
    e=>{

      if(!actor.element.hasPointerCapture(
        e.pointerId
      )) return;

      const dx =
        e.clientX - startX;

      const dy =
        e.clientY - startY;

      if(
        Math.abs(dx)>5 ||
        Math.abs(dy)>5
      ){

        dragging = true;

        actor.x =
          originalX + dx;

        actor.y =
          originalY + dy;

        updateActorPosition(actor);

      }

    }
  );


  actor.element.addEventListener(
    "pointerup",
    e=>{

      if(actor.element.hasPointerCapture(
        e.pointerId
      )){
        actor.element.releasePointerCapture(
          e.pointerId
        );
      }

      actor.moving = true;

      /*
        선택된 캐릭터를 가볍게 한 번 더 누르면
        선택 해제
      */

      if(
        !dragging &&
        wasSelected &&
        selectedActor === actor
      ){

        clearSelections();

      }

    }
  );

}

========================================================= */

function animateActors(){

  actors.forEach(actor=>{

    if(
      !actor.moving ||
      selectedActor === actor
    ){
      return;
    }

    actor.x += actor.vx;

    if(
      actor.x < 0 ||
      actor.x + actor.size > stage.clientWidth
    ){

      actor.vx *= -1;

    }

    actor.y +=
      Math.sin(Date.now()/700 + actor.id)
      * .12;

    updateActorPosition(actor);

  });

  requestAnimationFrame(animateActors);

}

function updateAccessoryPosition(a){

  if(a.owner){

    a.x =
      a.owner.x + a.relativeX;

    a.y =
      a.owner.y + a.relativeY;

  }

  a.element.style.left =
    a.x + "px";

  a.element.style.top =
    a.y + "px";

  a.element.style.width =
    a.size + "px";

  a.element.style.height =
    a.size + "px";

  a.element.style.transform =
    `rotate(${a.rotation}deg)`;

}


function updateAttachedAccessories(actor){

  accessories
    .filter(a=>a.owner===actor)
    .forEach(a=>{

      if(!a.locked){

        a.x =
          actor.x + a.relativeX;

        a.y =
          actor.y + a.relativeY;

      }

      a.element.style.left =
        a.x + "px";

      a.element.style.top =
        a.y + "px";

    });

}


function setupAccessoryDrag(a){

  let sx=0;
  let sy=0;

  let ox=0;
  let oy=0;

  let dragging=false;

  a.element.addEventListener(
    "pointerdown",
    e=>{

      e.preventDefault();
      e.stopPropagation();

      selectAccessory(a);

      sx=e.clientX;
      sy=e.clientY;

      ox=a.x;
      oy=a.y;

      dragging=false;

      if(a.locked) return;

      a.element.setPointerCapture(
        e.pointerId
      );

    }
  );


  a.element.addEventListener(
    "pointermove",
    e=>{

      if(a.locked) return;

      if(!a.element.hasPointerCapture(
        e.pointerId
      )) return;

      const dx =
        e.clientX-sx;

      const dy =
        e.clientY-sy;

      if(
        Math.abs(dx)>3 ||
        Math.abs(dy)>3
      ){

        dragging=true;

        a.x =
          ox+dx;

        a.y =
          oy+dy;

        if(a.owner){

          a.relativeX =
            a.x-a.owner.x;

          a.relativeY =
            a.y-a.owner.y;

        }

        updateAccessoryPosition(a);

      }

    }
  );


  a.element.addEventListener(
    "pointerup",
    e=>{

      if(
        a.element.hasPointerCapture(
          e.pointerId
        )
      ){

        a.element.releasePointerCapture(
          e.pointerId
        );

      }

    }
  );

}

/* =========================================================
   쓰다듬기 화면
========================================================= */

function renderPettingView(actor){

  if(!actor) return;

  pettingStage
    .querySelectorAll(
      ".petting-actor,.petting-accessory"
    )
    .forEach(el=>el.remove());

  const stageW =
    pettingStage.clientWidth;

  const stageH =
    pettingStage.clientHeight;

  const iw =
    actor.original?.naturalWidth ||
    actor.element.naturalWidth ||
    1;

  const ih =
    actor.original?.naturalHeight ||
    actor.element.naturalHeight ||
    1;

  /*
    캐릭터 원본 비율 유지하면서
    쓰다듬기 창을 거의 꽉 채움
  */

  let targetW =
    stageW * .82;

  let targetH =
    targetW * ih / iw;

  if(targetH > stageH*.82){

    targetH =
      stageH*.82;

    targetW =
      targetH * iw / ih;

  }

  const left =
    (stageW-targetW)/2;

  const top =
    (stageH-targetH)/2 - 5;

  const img =
    new Image();

  img.src =
    actor.src;

  img.className =
    "petting-actor";

  img.style.width =
    targetW+"px";

  img.style.height =
    targetH+"px";

  img.style.left =
    left+"px";

  img.style.top =
    top+"px";

  pettingStage.appendChild(img);


  /*
    악세사리는 실제 캐릭터의 위치 관계를
    그대로 복사해서 함께 확대
  */

  const factor =
    targetW / actor.size;

  accessories
    .filter(a=>a.owner===actor)
    .forEach(a=>{

      const acc =
        new Image();

      acc.src=a.src;

      acc.className =
        "petting-accessory";

      acc.style.width =
        (a.size*factor)+"px";

      acc.style.height =
        (a.size*factor)+"px";

      acc.style.left =
        (left +
        a.relativeX*factor)+"px";

      acc.style.top =
        (top +
        a.relativeY*factor)+"px";

      acc.style.transform =
        `rotate(${a.rotation}deg)`;

      pettingStage.appendChild(
        acc
      );

    });

}

/* =========================================================
   선물 이미지 만들기
========================================================= */

function addGiftToActor(
  src,
  name,
  original=null,
  emoji=null
){

  if(!selectedActor){

    alert("먼저 캐릭터를 선택해주세요.");

    return;

  }

  const gift={

    id:++giftId,

    name:name,

    src:src,

    original:original,

    emoji:emoji,

    owner:selectedActor,

    onStage:false,

    held:false,

    element:null,

    timer:null,

    offsetX:45,

    offsetY:45

  };

  selectedActor.inventory.push(
    gift
  );

  renderInventory(
    selectedActor
  );

  /*
    선물을 받은 직후 캐릭터가 들고 있다가
    일정 시간이 지나면 사라짐.
  */

  showGift(
    gift,
    8000
  );

}

/* =========================================================
   사진 선물
========================================================= */

giftFile.addEventListener(
  "change",
  e=>{

    const file =
      e.target.files[0];

    if(!file) return;

    const reader =
      new FileReader();

    reader.onload=()=>{

      const original =
        new Image();

      original.onload=()=>{

        addGiftToActor(
          reader.result,
          "사진 선물",
          original
        );

      };

      original.src =
        reader.result;

    };

    reader.readAsDataURL(file);

    giftFile.value="";

  }
);


/* =========================================================
   선물 표시
========================================================= */

function showGift(
  gift,
  duration=null
){

  if(gift.timer){

    clearTimeout(
      gift.timer
    );

    gift.timer=null;

  }

  if(gift.element){

    gift.element.remove();

    gift.element=null;

  }

  const img =
    new Image();

  img.src =
    gift.src;

  img.className =
    "gift-on-stage";

  img.style.width =
    "52px";

  img.style.height =
    "52px";

  stage.appendChild(
    img
  );

  gift.element=img;
  gift.onStage=true;
  gift.held=true;

  updateGiftPosition(
    gift
  );

  if(duration){

    gift.timer =
      setTimeout(()=>{

        if(gift.element){

          gift.element.remove();

          gift.element=null;

        }

        gift.onStage=false;
        gift.held=false;

        renderInventory(
          gift.owner
        );

      },duration);

  }

}


/* =========================================================
   선물 위치
========================================================= */

function updateGiftPosition(gift){

  if(
    !gift.element ||
    !gift.owner
  ) return;

  const actor =
    gift.owner;

  gift.element.style.left =
    (
      actor.x +
      actor.size*.55
    )+"px";

  gift.element.style.top =
    (
      actor.y +
      actor.size*.48
    )+"px";

}


/* =========================================================
   캐릭터가 움직일 때 선물도 따라감
========================================================= */

function updateHeldGifts(actor){

  actor.inventory
    .filter(g=>g.onStage)
    .forEach(g=>{

      updateGiftPosition(g);

    });

}


/* =========================================================
   소지품
========================================================= */

function renderInventory(actor){

  inventoryList.innerHTML="";

  if(
    !actor ||
    actor.inventory.length===0
  ){

    inventoryList.innerHTML=
      `<div class="inventory-empty">
        아직 선물이 없어요
      </div>`;

    return;

  }

  actor.inventory.forEach(gift=>{

    const button =
      document.createElement("button");

    button.className =
      "inventory-item";

    if(gift.held){

      button.classList.add(
        "held"
      );

    }

    const img =
      new Image();

    img.src =
      gift.src;

    button.appendChild(
      img
    );

    button.title =
      gift.name;

    button.addEventListener(
      "click",
      ()=>{

        /*
          소지품을 누르면 다시 들기.
          다시 누르면 내려놓기.
        */

        if(gift.onStage){

          if(gift.timer){

            clearTimeout(
              gift.timer
            );

            gift.timer=null;

          }

          if(gift.element){

            gift.element.remove();

            gift.element=null;

          }

          gift.onStage=false;
          gift.held=false;

        }else{

          /*
            소지품에서 다시 꺼내 들면
            자동으로 사라지지 않고 들고 있음.
          */

          showGift(
            gift,
            null
          );

        }

        renderInventory(
          actor
        );

      }
    );

    inventoryList.appendChild(
      button
    );

  });

}


/* =========================================================
   캐릭터 삭제
========================================================= */

deleteCharacter.addEventListener(
  "click",
  ()=>{

    if(!selectedActor){

      alert("삭제할 캐릭터를 선택해주세요.");

      return;

    }

    const actor =
      selectedActor;

    /*
      캐릭터의 악세사리 삭제
    */

    accessories
      .filter(a=>a.owner===actor)
      .forEach(a=>{
        a.element.remove();
      });

    accessories =
      accessories.filter(
        a=>a.owner!==actor
      );


    /*
      캐릭터의 선물은 캐릭터와 함께 삭제
    */

    actor.inventory
      .forEach(g=>{

        if(g.timer){

          clearTimeout(
            g.timer
          );

        }

        if(g.element){

          g.element.remove();

        }

      });


    actor.element.remove();

    actors =
      actors.filter(
        a=>a!==actor
      );

    clearSelections();

  }
);


/* =========================================================
   저장용 이미지 로드
========================================================= */

function loadImage(src){

  return new Promise(
    resolve=>{

      const img =
        new Image();

      img.onload=()=>{
        resolve(img);
      };

      img.onerror=()=>{
        resolve(null);
      };

      img.src=src;

    }
  );

}


/* =========================================================
   저장
========================================================= */

document.getElementById(
  "saveButton"
).addEventListener(
  "click",
  async()=>{

    const scale=3;

    const stageW =
      stage.clientWidth;

    const stageH =
      stage.clientHeight;

    const padding=30;

    const titleH=70;

    const diaryH =
      Math.max(
        170,
        diaryInput.scrollHeight + 30
      );

    const canvas =
      document.createElement("canvas");

    canvas.width =
      (stageW+padding*2)*scale;

    canvas.height =
      (
        padding +
        titleH +
        diaryH +
        stageH +
        padding
      )*scale;

    const ctx =
      canvas.getContext("2d");

    ctx.imageSmoothingEnabled=true;

    const cw =
      canvas.width;

    const ch =
      canvas.height;

    /*
      전체 흰 배경
    */

    ctx.fillStyle="#fff";

    ctx.fillRect(
      0,
      0,
      cw,
      ch
    );


    /*
      제목
    */

    ctx.fillStyle =
      getComputedStyle(
        titleWrap
      ).backgroundColor ||
      "#fff";

    ctx.fillRect(
      padding*scale,
      padding*scale,
      stageW*scale,
      titleH*scale
    );

    ctx.fillStyle="#222";

    ctx.font=
      `bold ${20*scale}px sans-serif`;

    ctx.textBaseline="middle";

    ctx.fillText(
      titleInput.value ||
      "오늘의 제목",
      (padding+15)*scale,
      (padding+titleH/2)*scale
    );


    /*
      일기
    */

    const diaryY =
      padding+titleH+10;

    ctx.fillStyle =
      getComputedStyle(
        diaryWrap
      ).backgroundColor ||
      "#fff";

    ctx.fillRect(
      padding*scale,
      diaryY*scale,
      stageW*scale,
      diaryH*scale
    );

    ctx.fillStyle="#222";

    ctx.font=
      `${17*scale}px sans-serif`;

    const text =
      diaryInput.value || "";

    const words =
      text.split("");

    const maxWidth =
      (stageW-30)*scale;

    let line="";
    let y =
      (diaryY+28)*scale;

    const lineHeight =
      29*scale;

    for(
      let i=0;
      i<words.length;
      i++
    ){

      const test =
        line+words[i];

      const width =
        ctx.measureText(test).width;

      if(
        width>maxWidth &&
        line
      ){

        ctx.fillText(
          line,
          (padding+15)*scale,
          y
        );

        line=words[i];
        y+=lineHeight;

      }else{

        line=test;

      }

    }

    if(line){

      ctx.fillText(
        line,
        (padding+15)*scale,
        y
      );

    }


    /*
      무대 위치
    */

    const stageY =
      diaryY+diaryH+10;

    /*
      배경
    */

    if(customBackgroundImage){

      const bg =
        await loadImage(
          customBackgroundImage
        );

      if(bg){

        drawCoverImage(
          ctx,
          bg,
          padding*scale,
          stageY*scale,
          stageW*scale,
          stageH*scale
        );

      }

    }else{

      drawStageBackground(
        ctx,
        currentBackground,
        padding*scale,
        stageY*scale,
        stageW*scale,
        stageH*scale
      );

    }


    /*
      가구
    */

    for(
      const furniture of furnitures
    ){

      const img =
        await loadImage(
          furniture.src
        );

      if(!img) continue;

      drawRotatedContain(
        ctx,
        img,
        padding*scale +
          furniture.x*scale,
        stageY*scale +
          furniture.y*scale,
        furniture.size*scale,
        furniture.size*scale,
        furniture.rotation
      );

    }


    /*
      캐릭터
      ★ 원본 비율 유지
      ★ 90x90에 억지로 찌그러뜨리지 않음
    */

    for(
      const actor of actors
    ){

      const img =
        await loadImage(
          actor.src
        );

      if(!img) continue;

      const iw =
        img.naturalWidth ||
        img.width;

      const ih =
        img.naturalHeight ||
        img.height;

      const drawW =
        actor.size;

      const drawH =
        drawW * ih / iw;

      const boxH =
        actor.size;

      const drawX =
        padding +
        actor.x;

      const drawY =
        stageY +
        actor.y +
        (boxH-drawH)/2;

      ctx.drawImage(
        img,
        drawX*scale,
        drawY*scale,
        drawW*scale,
        drawH*scale
      );

    }


    /*
      악세사리
    */

    for(
      const a of accessories
    ){

      const img =
        await loadImage(
          a.src
        );

      if(!img) continue;

      drawRotatedContain(
        ctx,
        img,
        padding*scale+
          a.x*scale,
        stageY*scale+
          a.y*scale,
        a.size*scale,
        a.size*scale,
        a.rotation
      );

    }


    /*
      현재 보이는 선물
    */

    for(
      const actor of actors
    ){

      for(
        const gift of actor.inventory
      ){

        if(!gift.onStage) continue;

        const img =
          await loadImage(
            gift.src
          );

        if(!img) continue;

        const size=52;

        drawContain(
          ctx,
          img,
          (
            padding+
            actor.x+
            actor.size*.55
          )*scale,
          (
            stageY+
            actor.y+
            actor.size*.48
          )*scale,
          size*scale,
          size*scale
        );

      }

    }


    /*
      캔버스 저장
    */

    const link =
      document.createElement("a");

    link.download =
      "그림일기.png";

    link.href =
      canvas.toDataURL(
        "image/png"
      );

    link.click();

  }
);


/* =========================================================
   저장용 배경
========================================================= */

function drawStageBackground(
  ctx,
  type,
  x,
  y,
  w,
  h
){

  if(type==="plain"){

    ctx.fillStyle="#fffdfd";

    ctx.fillRect(x,y,w,h);

    return;

  }


  let gradient;


  if(type==="pink"){

    gradient =
      ctx.createLinearGradient(
        0,y,
        0,y+h
      );

    gradient.addColorStop(
      0,
      "#ffeef4"
    );

    gradient.addColorStop(
      1,
      "#fff8fa"
    );

  }


  if(type==="yellow"){

    gradient =
      ctx.createLinearGradient(
        0,y,
        0,y+h
      );

    gradient.addColorStop(
      0,
      "#fff7c7"
    );

    gradient.addColorStop(
      1,
      "#fffdf0"
    );

  }


  if(type==="blue"){

    gradient =
      ctx.createLinearGradient(
        0,y,
        0,y+h
      );

    gradient.addColorStop(
      0,
      "#e5f5ff"
    );

    gradient.addColorStop(
      1,
      "#fff"
    );

  }


  if(type==="green"){

    gradient =
      ctx.createLinearGradient(
        0,y,
        0,y+h
      );

    gradient.addColorStop(
      0,
      "#eaf8e4"
    );

    gradient.addColorStop(
      1,
      "#fff"
    );

  }


  if(type==="purple"){

    gradient =
      ctx.createLinearGradient(
        0,y,
        0,y+h
      );

    gradient.addColorStop(
      0,
      "#f1eaff"
    );

    gradient.addColorStop(
      1,
      "#fff"
    );

  }


  if(type==="peach"){

    gradient =
      ctx.createLinearGradient(
        0,y,
        0,y+h
      );

    gradient.addColorStop(
      0,
      "#ffebdf"
    );

    gradient.addColorStop(
      1,
      "#fff"
    );

  }


  if(type==="night"){

    gradient =
      ctx.createLinearGradient(
        0,y,
        0,y+h
      );

    gradient.addColorStop(
      0,
      "#dfe3f4"
    );

    gradient.addColorStop(
      1,
      "#f7f8ff"
    );

  }


  ctx.fillStyle =
    gradient ||
    "#fff";

  ctx.fillRect(
    x,y,w,h
  );

}


/* =========================================================
   이미지 Cover
========================================================= */

function drawCoverImage(
  ctx,
  img,
  x,
  y,
  w,
  h
){

  const iw =
    img.naturalWidth ||
    img.width;

  const ih =
    img.naturalHeight ||
    img.height;

  const scale =
    Math.max(
      w/iw,
      h/ih
    );

  const nw =
    iw*scale;

  const nh =
    ih*scale;

  ctx.drawImage(
    img,
    x+(w-nw)/2,
    y+(h-nh)/2,
    nw,
    nh
  );

}


/* =========================================================
   이미지 Contain
========================================================= */

function drawContain(
  ctx,
  img,
  x,
  y,
  w,
  h
){

  const iw =
    img.naturalWidth ||
    img.width;

  const ih =
    img.naturalHeight ||
    img.height;

  const scale =
    Math.min(
      w/iw,
      h/ih
    );

  const nw =
    iw*scale;

  const nh =
    ih*scale;

  ctx.drawImage(
    img,
    x+(w-nw)/2,
    y+(h-nh)/2,
    nw,
    nh
  );

}


/* =========================================================
   회전 이미지
========================================================= */

function drawRotatedContain(
  ctx,
  img,
  x,
  y,
  w,
  h,
  angle
){

  ctx.save();

  ctx.translate(
    x+w/2,
    y+h/2
  );

  ctx.rotate(
    angle*Math.PI/180
  );

  drawContain(
    ctx,
    img,
    -w/2,
    -h/2,
    w,
    h
  );

  ctx.restore();

}
