<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>그림일기</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:#fff;
  color:#111;
  font-family:-apple-system,BlinkMacSystemFont,
  "Apple SD Gothic Neo","Noto Sans KR",sans-serif;
}

header{
  padding:18px 16px 10px;
}

.date{
  font-size:13px;
  color:#777;
}

.container{
  padding:0 16px 35px;
}

input[type="text"]{
  width:100%;
  border:1px solid #ddd;
  border-radius:12px;
  padding:12px;
  font-size:16px;
  outline:none;
  background:#fff;
}

textarea{
  width:100%;
  min-height:180px;
  margin-top:10px;
  border:1px solid #ddd;
  border-radius:12px;
  padding:14px;
  font-size:16px;
  line-height:1.6;
  outline:none;
  resize:vertical;
  background:#fff;
}

.stage{
  position:relative;
  width:100%;
  height:380px;
  margin:15px 0;
  border:1px solid #ddd;
  border-radius:18px;
  overflow:hidden;
  background:#fafafa;
  background-position:center;
  background-size:cover;
  background-repeat:no-repeat;
  touch-action:none;
  overscroll-behavior:none;
}

.actor{
  position:absolute;
  width:90px;
  height:90px;
  object-fit:contain;
  user-select:none;
  -webkit-user-select:none;
  -webkit-touch-callout:none;
  touch-action:none;
  cursor:grab;
  z-index:30;
}

.actor.dragging{
  cursor:grabbing;
}

.actor.selected{
  outline:2px dashed #777;
  outline-offset:4px;
  border-radius:12px;
}

.actor.sleeping{
  opacity:.65;
}

.accessory{
  position:absolute;
  width:55px;
  height:55px;
  object-fit:contain;
  user-select:none;
  -webkit-user-select:none;
  -webkit-touch-callout:none;
  touch-action:none;
  cursor:grab;
  z-index:40;
  transform-origin:center center;
}

.accessory.dragging{
  cursor:grabbing;
}

.accessory.locked{
  cursor:default;
}

.accessory.selected{
  outline:2px dashed #777;
  outline-offset:3px;
  border-radius:8px;
}

.furniture{
  position:absolute;
  width:90px;
  height:90px;
  object-fit:contain;
  user-select:none;
  -webkit-user-select:none;
  -webkit-touch-callout:none;
  touch-action:none;
  cursor:grab;
  z-index:20;
}

.furniture.dragging{
  cursor:grabbing;
}

.furniture.locked{
  cursor:default;
}

.furniture.selected{
  outline:2px dashed #777;
  outline-offset:4px;
  border-radius:10px;
}

.status{
  position:absolute;
  left:50%;
  bottom:8px;
  transform:translateX(-50%);
  font-size:12px;
  color:#777;
  pointer-events:none;
  white-space:nowrap;
  z-index:100;
}

.add-area{
  margin:12px 0 18px;
}

.photo-button,
.background-file-label{
  display:block;
  width:100%;
  padding:12px 16px;
  border:1px solid #ddd;
  border-radius:12px;
  background:#fff;
  color:#111;
  font-size:15px;
  text-align:center;
  cursor:pointer;
}

#photo,
#backgroundFile,
#accessoryFile,
#furnitureFile,
#giftFile{
  display:none;
}

.background-area{
  margin-bottom:18px;
}

.background-select{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:12px;
  background:#fff;
  color:#111;
  font-size:15px;
  outline:none;
}

.background-file-label{
  margin-top:10px;
}

.control-box,
.accessory-box,
.furniture-box,
.gift-box,
.inventory-box{
  margin-top:10px;
  padding:10px;
  border:1px solid #ddd;
  border-radius:12px;
  background:#fafafa;
}

.control-box{
  display:none;
}

.control-box.show{
  display:block;
}

.accessory-control,
.furniture-control,
.gift-control,
.inventory-control{
  display:none;
}

.accessory-control.show,
.furniture-control.show,
.gift-control.show,
.inventory-control.show{
  display:block;
}

.control-title,
.accessory-title,
.furniture-title,
.gift-title,
.inventory-title{
  font-size:13px;
  color:#666;
  margin-bottom:8px;
}

.size-control{
  margin-top:12px;
}

.size-label{
  font-size:13px;
  color:#666;
  margin-bottom:5px;
}

input[type=range]{
  width:100%;
  margin:0;
  accent-color:#777;
  touch-action:auto;
}

.accessory-grid,
.furniture-grid,
.gift-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
}

.accessory-choice,
.furniture-choice,
.gift-choice{
  border:1px solid #ddd;
  border-radius:10px;
  background:#fff;
  padding:8px 4px;
  font-size:24px;
  line-height:1.2;
  cursor:pointer;
  margin:0;
}

.accessory-choice span,
.furniture-choice span,
.gift-choice span{
  display:block;
  font-size:11px;
  margin-top:3px;
  color:#666;
}

.accessory-upload,
.furniture-upload,
.gift-upload{
  display:block;
  width:100%;
  margin-top:8px;
  padding:10px;
  border:1px solid #ddd;
  border-radius:10px;
  background:#fff;
  text-align:center;
  font-size:13px;
  cursor:pointer;
}

.rotation-control{
  margin-top:12px;
}

.help{
  margin-top:8px;
  text-align:center;
  font-size:12px;
  color:#888;
}

button{
  width:100%;
  border:1px solid #ddd;
  background:#fff;
  color:#111;
  border-radius:12px;
  padding:13px 16px;
  font-size:15px;
  margin-top:10px;
}

button:disabled{
  opacity:.5;
}


/* =========================
   쓰다듬기 창
========================= */

.pet-panel{
  display:none;
  margin-top:10px;
  padding:10px;
  border:1px solid #ddd;
  border-radius:12px;
  background:#fff;
}

.pet-panel.show{
  display:block;
}

.pet-title{
  font-size:13px;
  color:#666;
  margin-bottom:8px;
}

.pet-area{
  position:relative;
  width:100%;
  height:300px;
  border:1px solid #eee;
  border-radius:16px;
  background:#fafafa;
  overflow:hidden;
  touch-action:none;
  user-select:none;
}

.pet-actor{
  position:absolute;
  width:240px;
  height:240px;
  object-fit:contain;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  user-select:none;
  pointer-events:none;
}

.pet-accessory{
  position:absolute;
  object-fit:contain;
  transform-origin:center center;
  pointer-events:none;
}

.pet-hand{
  position:absolute;
  width:70px;
  height:70px;
  left:50%;
  top:8px;
  transform:translateX(-50%);
  font-size:48px;
  display:flex;
  align-items:center;
  justify-content:center;
  opacity:0;
  pointer-events:none;
  transition:opacity .12s, transform .12s;
}

.pet-area.petting .pet-hand{
  opacity:1;
  transform:translateX(-50%) rotate(-12deg);
}

.pet-area.petting .pet-actor{
  animation:petBounce .28s ease-in-out infinite alternate;
}

@keyframes petBounce{
  from{
    transform:translate(-50%,-50%) rotate(-2deg);
  }
  to{
    transform:translate(-50%,-50%) rotate(2deg);
  }
}

.pet-message{
  text-align:center;
  font-size:12px;
  color:#888;
  margin-top:8px;
}


/* =========================
   소지품
========================= */

.inventory-items{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
}

.inventory-item{
  min-height:70px;
  border:1px solid #ddd;
  border-radius:10px;
  background:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  font-size:28px;
}

.inventory-item.selected-gift{
  outline:2px dashed #777;
  outline-offset:2px;
}

.inventory-item span{
  font-size:10px;
  color:#666;
  margin-top:3px;
}

.inventory-empty{
  font-size:12px;
  color:#999;
  text-align:center;
  padding:10px 0;
}


/* =========================
   무대 위 선물
========================= */

.stage-gift{
  position:absolute;
  width:55px;
  height:55px;
  object-fit:contain;
  z-index:45;
  cursor:grab;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
  -webkit-touch-callout:none;
  animation:giftPop .25s ease-out;
  transform-origin:center center;
}

.stage-gift.dragging{
  cursor:grabbing;
}

.stage-gift.selected{
  outline:2px dashed #777;
  outline-offset:3px;
  border-radius:8px;
}

@keyframes giftPop{
  from{
    opacity:0;
    transform:scale(.5);
  }
  to{
    opacity:1;
    transform:scale(1);
  }
}
</style>
</head>

<body>

<header>
  <div class="date" id="date"></div>
</header>

<div class="container">

<input
  type="text"
  id="title"
  placeholder="오늘의 제목"
>

<textarea
  id="diary"
  placeholder="오늘의 일기를 써보세요."
></textarea>


<!-- =========================
     배경
========================= -->

<div class="background-area">

<select id="backgroundSelect" class="background-select">
  <option value="plain">기본 배경</option>
  <option value="sky">파란 하늘</option>
  <option value="night">밤하늘</option>
  <option value="grass">초원</option>
  <option value="pink">분홍색</option>
  <option value="yellow">노란색</option>

<label

>
＋ 배경 사진 추가
</label>

  type="file"
  accept="image/*"
>

</div>


<!-- =========================
     무대
========================= -->

<div class="stage" id="stage">

  <div class="status" id="status">
    캐릭터를 추가해보세요
  </div>

</div>


<!-- =========================
     캐릭터 추가
========================= -->

<div class="add-area">

<label
  class="photo-button"
  for="photo"
>
＋ 캐릭터 추가
</label>

<input
  id="photo"
  type="file"
  accept="image/*"
>

</div>


<!-- =========================
     캐릭터 선택 창
========================= -->

<div class="control-box" id="controlBox">

<div class="control-title">
선택한 캐릭터
</div>

<button id="pauseButton">

</button>

<button id="resumeButton">

</button>

<button id="bringActorFrontButton">
⬆️ 앞으로 보내기
</button>

<button id="sendActorBackButton">
⬇️ 뒤로 보내기
</button>

<button id="deleteActorButton">
🗑 이 캐릭터 삭제
</button>

<button id="petButton">
🫳 쓰다듬기
</button>


<div class="size-control">

<div class="size-label">
캐릭터 크기
</div>

<input
  type="range"
  id="sizeSlider"
  min="50"
  max="200"
  value="100"
>

</div>


<!-- =========================
     쓰다듬기
========================= -->

<div
  class="pet-panel"
  id="petPanel"
>

<div class="pet-title">
🫳 캐릭터 쓰다듬기
</div>

<div
  class="pet-area"
  id="petArea"
>

<img
  class="pet-actor"
  id="petActor"
>

<div
  class="pet-hand"
  id="petHand"
>
🫳
</div>

</div>

<div class="pet-message">
캐릭터를 손가락으로 살살 움직여 쓰다듬어보세요.
</div>

<button id="closePetButton">
닫기
</button>

</div>


<!-- =========================
     악세사리
========================= -->

<div class="accessory-box">

<div class="accessory-title">
악세사리
</div>

<div class="accessory-grid">

<button
  class="accessory-choice"
  data-emoji="🎩"
>
🎩
<span>모자</span>
</button>

<button
  class="accessory-choice"
  data-emoji="👑"
>
👑
<span>왕관</span>
</button>

<button
  class="accessory-choice"
  data-emoji="🎀"
>
🎀
<span>리본</span>
</button>

<button
  class="accessory-choice"
  data-emoji="☁️"
>
☁️
<span>구름</span>
</button>

<button
  class="accessory-choice"
  data-emoji="🤍"
>
🤍
<span>하트</span>
</button>

<button
  class="accessory-choice"
  data-emoji="✨"
>
✨
<span>별</span>
</button>

</div>

<label
  class="accessory-upload"
  for="accessoryFile"
>
＋ 악세사리 사진 추가
</label>

<input
  id="accessoryFile"
  type="file"
  accept="image/*"
>

<div
  class="accessory-control"
  id="accessoryControl"
>

<div class="size-label">
선택한 악세사리 크기
</div>

<input
  type="range"
  id="accessorySizeSlider"
  min="20"
  max="200"
  value="100"
>

<div class="rotation-control">

<div class="size-label">
선택한 악세사리 각도
</div>

<input
  type="range"
  id="accessoryRotationSlider"
  min="-180"
  max="180"
  value="0"
>

</div>

<button id="lockAccessoryButton">
🔒 악세사리 고정
</button>

<button id="deleteAccessoryButton">
🗑 악세사리 삭제
</button>

</div>

</div>


<!-- =========================
     선물
========================= -->

<div class="gift-box">

<div class="gift-title">
🎁 선물
</div>

<div class="gift-grid">

<button
  class="gift-choice"
  data-emoji="🎁"
>
🎁
<span>선물상자</span>
</button>

<button
  class="gift-choice"
  data-emoji="🍪"
>
🍪
<span>쿠키</span>
</button>

<button
  class="gift-choice"
  data-emoji="🌷"

🌷

  data-emoji="⭐"

<input
  id="giftFile"
  type="file"

선택한 선물 크기

  type="range"

가구

>
🪑

</button>

<button

🛋️

<button

  data-emoji="🪴"
>
🪴
<span>화분</span>
</button>

<button
  class="furniture-choice"
  data-emoji="🗄️"
>

<span>서랍장</span>

<button
  class="furniture-choice"

</div>

저장
</button>

<button id="clearAll">
전체 삭제
</button>

</div>


<script>

/* =========================
   요소
========================= */

const dateElement =
document.getElementById("date");

const titleInput =
document.getElementById("title");

const diaryInput =
document.getElementById("diary");

const stage =
document.getElementById("stage");

const status =
document.getElementById("status");

const photoInput =
document.getElementById("photo");

const backgroundSelect =
document.getElementById("backgroundSelect");

const backgroundFile =
document.getElementById("backgroundFile");

const controlBox =
document.getElementById("controlBox");

const pauseButton =
document.getElementById("pauseButton");

const resumeButton =
document.getElementById("resumeButton");

const bringActorFrontButton =
document.getElementById("bringActorFrontButton");

const sendActorBackButton =
document.getElementById("sendActorBackButton");

const deleteActorButton =
document.getElementById("deleteActorButton");

const sizeSlider =
document.getElementById("sizeSlider");

const accessoryFile =
document.getElementById("accessoryFile");

const accessoryControl =
document.getElementById("accessoryControl");

const accessorySizeSlider =
document.getElementById("accessorySizeSlider");

const accessoryRotationSlider =
document.getElementById("accessoryRotationSlider");

const lockAccessoryButton =
document.getElementById("lockAccessoryButton");

const deleteAccessoryButton =
document.getElementById("deleteAccessoryButton");

const furnitureFile =
document.getElementById("furnitureFile");

const furnitureControl =
document.getElementById("furnitureControl");

const furnitureSizeSlider =
document.getElementById("furnitureSizeSlider");

const lockFurnitureButton =
document.getElementById("lockFurnitureButton");

const deleteFurnitureButton =
document.getElementById("deleteFurnitureButton");

const saveButton =
document.getElementById("save");

const clearAllButton =
document.getElementById("clearAll");


/* 쓰다듬기 */

const petButton =
document.getElementById("petButton");

const petPanel =
document.getElementById("petPanel");

const petArea =
document.getElementById("petArea");

const petActor =
document.getElementById("petActor");

const petHand =
document.getElementById("petHand");

const closePetButton =
document.getElementById("closePetButton");


/* 선물 */

const giftFile =
document.getElementById("giftFile");

const giftControl =
document.getElementById("giftControl");

const giftSizeSlider =
document.getElementById("giftSizeSlider");

const giftRotationSlider =
document.getElementById("giftRotationSlider");

const deleteGiftButton =
document.getElementById("deleteGiftButton");

const inventoryControl =
document.getElementById("inventoryControl");

const inventoryItems =
document.getElementById("inventoryItems");

const inventoryEmpty =
document.getElementById("inventoryEmpty");


/* =========================
   데이터
========================= */

const actors = [];
const accessories = [];
const furnitures = [];

let selectedActor = null;
let selectedAccessory = null;
let selectedFurniture = null;
let selectedGift = null;

let pettingActor = null;


/* =========================
   날짜
========================= */

const today = new Date();

dateElement.textContent =
today.getFullYear() +
"년 " +
(today.getMonth()+1) +
"월 " +
today.getDate() +

let currentBackground = {
  type:"plain",
  src:null
};

function applyBackground(type){

  currentBackground = {
    type:type,
    src:null
  };

  stage.style.backgroundImage = "";

  if(type === "plain"){
    stage.style.background =
      "#fafafa";
  }

  else if(type === "sky"){
    stage.style.background =
      "linear-gradient(#bde8ff,#fff)";
  }

  else if(type === "night"){
    stage.style.background =
      "linear-gradient(#101528,#343b5c)";
  }

  else if(type === "grass"){
    stage.style.background =
      "linear-gradient(#dff5d8 0%,#c9ebc1 65%,#a9d79e 65%,#a9d79e 100%)";
  }

  else if(type === "pink"){
    stage.style.background =
      "#ffe8ef";
  }

  else if(type === "yellow"){
    stage.style.background =
      "#fff4b8";
  }
}

);

);

function updateStatus(){

  if(selectedGift){

    status.textContent =
      "선택한 선물 · 끌어서 위치를 바꾸거나 크기와 각도를 조절할 수 있어요";

    return;
  }

  if(selectedAccessory){

    status.textContent =
      selectedAccessory.locked
      ? "선택한 악세사리가 고정되어 있어요"
      : "선택한 악세사리 · 크기와 각도를 조절할 수 있어요";

    return;
  }

  if(selectedFurniture){

    status.textContent =
      selectedFurniture.locked
      ? "선택한 가구가 고정되어 있어요"
      : "선택한 가구 · 끌어서 이동할 수 있어요";

    return;
  }

  if(selectedActor){

    status.textContent =
      selectedActor.paused
      ? "선택한 캐릭터가 멈춰 있어요"
      : "선택한 캐릭터 · 끌어서 이동할 수 있어요";

    return;
  }

  status.textContent =
    actors.length === 0
    ? "캐릭터를 추가해보세요"
    : "캐릭터들이 자유롭게 움직이고 있어요";
}

   캐릭터 선택
========================= */

function selectActor(actor){

  if(selectedActor === actor){

    clearSelections();

    return;
  }

  clearSelections();

  selectedActor = actor;

  actor.element.classList.add(
    "selected"
  );

  controlBox.classList.add(
    "show"
  );

  sizeSlider.value =
    String(actor.size);

  inventoryControl.classList.add(
    "show"
  );

  updateInventory();

  updateStatus();
}


/* =========================
   악세사리 선택
========================= */

function selectAccessory(a){

  if(selectedActor){
    selectedActor.element
      .classList.remove("selected");
  }

  if(selectedFurniture){
    selectedFurniture.element
      .classList.remove("selected");
  }

  if(selectedGift){
    selectedGift.element?.classList.remove(
      "selected"
    );
  }

  if(
    selectedAccessory &&
    selectedAccessory !== a
  ){
    selectedAccessory.element
      .classList.remove("selected");
  }

  selectedActor = null;
  selectedFurniture = null;
  selectedGift = null;

  selectedAccessory = a;

  a.element.classList.add(
    "selected"
  );

  accessoryControl.classList.add(
    "show"
  );

  giftControl.classList.remove(
    "show"
  );

  accessorySizeSlider.value =
    String(a.size);

  accessoryRotationSlider.value =
    String(a.rotation);

  updateAccessoryLockButton();

  updateStatus();
}

/* =========================
   선물 선택
========================= */

function selectGift(gift){

  if(!gift)return;

  if(selectedActor){
    selectedActor.element
      .classList.remove("selected");
  }

  if(selectedAccessory){
    selectedAccessory.element
      .classList.remove("selected");
  }

  if(selectedFurniture){
    selectedFurniture.element
      .classList.remove("selected");
  }

  if(selectedGift &&
     selectedGift !== gift &&
     selectedGift.element){

    selectedGift.element
      .classList.remove("selected");
  }

  selectedActor =
    gift.owner || selectedActor;

  selectedAccessory = null;
  selectedFurniture = null;
  selectedGift = gift;

  if(gift.element){
    gift.element.classList.add(
      "selected"
    );
  }

  controlBox.classList.add(
    "show"
  );

  inventoryControl.classList.add(
    "show"
  );

  giftControl.classList.add(
    "show"
  );

  giftSizeSlider.value =
    String(gift.size);

  giftRotationSlider.value =
    String(gift.rotation);

  updateInventory();

  updateStatus();
}

/* =========================
   캐릭터 드래그
========================= */

function enableActorDrag(actor){

  const el =
    actor.element;

  let startPointerX = 0;
  let startPointerY = 0;

  let startX = 0;
  let startY = 0;

  let wasSelected = false;
  let moved = false;

  el.addEventListener(
    "pointerdown",
    e => {

      e.preventDefault();
      e.stopPropagation();

      wasSelected =
        selectedActor === actor;

      moved = false;

      if(!wasSelected){

        selectActor(actor);
      }

      if(!selectedActor)return;

      startPointerX =
        e.clientX;

      startPointerY =
        e.clientY;

      startX =
        actor.x;

      startY =
        actor.y;

      actor.dragging = false;

      try{
        el.setPointerCapture(
          e.pointerId
        );
      }catch(_){}
    }
  );

  el.addEventListener(
    "pointermove",
    e => {

      if(
        !selectedActor ||
        selectedActor !== actor
      )return;

      const dx =
        e.clientX -
        startPointerX;

      const dy =
        e.clientY -
        startPointerY;

      if(
        !moved &&
        Math.hypot(dx,dy)<5
      ){
        return;
      }

      moved = true;
      actor.dragging = true;

      e.preventDefault();

      const maxX =
        Math.max(
          0,
          stage.clientWidth -
          el.offsetWidth
        );

      const maxY =
        Math.max(
          0,
          stage.clientHeight -
          el.offsetHeight
        );

      actor.x =
        Math.max(
          0,
          Math.min(
            startX+dx,
            maxX
          )
        );

      actor.y =
        Math.max(
          0,
          Math.min(
            startY+dy,
            maxY
          )
        );

      actor.targetX =
        actor.x;

      actor.targetY =
        actor.y;

      el.style.left =
        actor.x+"px";

      el.style.top =
        actor.y+"px";

      updateAttachedAccessories(
        actor
      );

      updateHeldGift(actor);
    }
  );

  el.addEventListener(
    "pointerup",
    e => {

      actor.dragging = false;

      if(
        !moved &&
        wasSelected &&
        selectedActor === actor
      ){

        clearSelections();
      }

      el.classList.remove(
        "dragging"
      );

      try{
        el.releasePointerCapture(
          e.pointerId
        );
      }catch(_){}
    }
  );
}

/* =========================
   자동 움직임
========================= */

function chooseNewAction(a){

  if(
    a.paused ||
    a.dragging
  )return;

  const r =
    Math.random();

  if(
    r < a.sleepChance
  ){

    a.state =
      "sleeping";

    a.element.classList.add(
      "sleeping"
    );

    a.nextAction =
      Date.now() +
      2000 +
      Math.random()*3000;

    return;
  }

  a.state =
    r <
    a.sleepChance+a.runChance
    ? "running"
    : "walking";

  a.element.classList.remove(
    "sleeping"
  );

  const maxX =
    Math.max(
      0,
      stage.clientWidth -
      a.element.offsetWidth
    );

  const maxY =
    Math.max(
      0,
      stage.clientHeight -
      a.element.offsetHeight
    );

  a.targetX =
    Math.random()*maxX;

  a.targetY =
    Math.random()*maxY;

  a.nextAction =
    Date.now() +
    2000 +
    Math.random()*3000;
}


function animate(){

  const now =
    Date.now();

  for(
    const a of actors
  ){

    if(
      a.paused ||
      a.dragging
    )continue;

    if(
      now >= a.nextAction
    ){
      chooseNewAction(a);
    }

    if(
      a.state === "sleeping"
    )continue;

    const dx =
      a.targetX-a.x;

    const dy =
      a.targetY-a.y;

    const distance =
      Math.hypot(dx,dy);

    if(distance < 1)continue;

    const speed =
      a.state === "running"
      ? a.runSpeed
      : a.speed;

    const step =
      Math.min(
        speed,
        distance
      );

    a.x +=
      dx/distance*step;

    a.y +=
      dy/distance*step;

    a.element.style.left =
      a.x+"px";

    a.element.style.top =
      a.y+"px";

    updateAttachedAccessories(a);

    updateHeldGift(a);
  }

  requestAnimationFrame(
    animate
  );
}

function createAccessory(
  src,
  file=null,
  emoji=null
){

  if(!selectedActor){

    alert(
      "먼저 캐릭터를 선택해주세요."
    );

    return;
  }

  const owner =
    selectedActor;

  const img =
    document.createElement("img");

  img.className =
    "accessory";

  img.src =
    src;

  const size = 55;

  const x =
    owner.x +
    (owner.element.offsetWidth-size)/2;

  const y =
    owner.y-15;

  img.style.width =
    size+"px";

  img.style.height =
    size+"px";

  img.style.left =
    x+"px";

  img.style.top =
    y+"px";

  const a = {

    element:img,

    owner:owner,

    x:x,
    y:y,

    relativeX:
      x-owner.x,

    relativeY:
      y-owner.y,

    size:100,

    rotation:0,

    locked:false,

    dragging:false,

    originalImage:null,

    originalFile:file,

    emoji:emoji
  };

  if(file){

    const original =
      new Image();

    original.onload =
      () => {
        a.originalImage =
          original;
      };

    original.src =
      src;
  }

  accessories.push(a);

  stage.appendChild(img);

  applyAccessoryTransform(a);

  enableAccessoryDrag(a);

  selectAccessory(a);
}

  let startPointerY = 0;

  let startX = 0;
  let startY = 0;

        e.clientX;

      startPointerY =
        e.clientY;

      startX =
        a.x;

      startY =
        a.y;

      a.dragging = false;

      try{
        el.setPointerCapture(
          e.pointerId
        );
      }catch(_){}
    }
  );


  el.addEventListener(
    "pointermove",
    e => {

      if(
        !active ||
        a.locked
      )return;

      const dx =
        e.clientX-startPointerX;

      const dy =
        e.clientY-startPointerY;

      if(
        !moved &&
        Math.hypot(dx,dy)<5
      ){
        return;
      }

      moved = true;

      a.dragging = true;

      el.classList.add(
        "dragging"

          0,
          stage.clientHeight -
          el.offsetHeight
        );

      a.x =
        Math.max(
          0,
          Math.min(
            startX+dx,
            maxX
          )
        );

      a.y =
        Math.max(
          0,
          Math.min(
            startY+dy,
            maxY
          )
        );

      a.relativeX =
        a.x-a.owner.x;

      a.relativeY =
        a.y-a.owner.y;

      el.style.left =
        a.x+"px";

      el.style.top =
        a.y+"px";
    }
  );


  el.addEventListener(
    "pointerup",
    e => {

      if(!active)return;

      active = false;

      a.dragging = false;

      el.classList.remove(
        "dragging"
      );

      try{
        el.releasePointerCapture(
          e.pointerId
        );
      }catch(_){}
    }
  );

    "pointercancel",
    e => {

      active = false;

      a.dragging = false;

      el.classList.remove(
        "dragging"
      );

      try{
        el.releasePointerCapture(
          e.pointerId
        );

/* =========================
   가구 이동
========================= */

function enableFurnitureDrag(f){

  const el =
    f.element;

  let startPointerX = 0;
  let startPointerY = 0;

  let startX = 0;
  let startY = 0;

  el.addEventListener(
    "pointerdown",
    e => {

      e.preventDefault();
      e.stopPropagation();

      selectFurniture(f);

      if(!selectedFurniture)return;

      if(f.locked){

        f.dragging = false;

        return;
      }

      f.dragging = true;

      startPointerX =
        e.clientX;

      startPointerY =
        e.clientY;

      startX =
        f.x;

      startY =
        f.y;

      el.classList.add(
        "dragging"
      );

      try{
        el.setPointerCapture(
          e.pointerId
        );
      }catch(_){}
    }
  );


  el.addEventListener(
    "pointermove",
    e => {

      if(
        !f.dragging ||
        f.locked
      )return;

      e.preventDefault();

      const dx =
        e.clientX-startPointerX;

      const dy =
        e.clientY-startPointerY;

      const maxX =
        Math.max(
          0,
          stage.clientWidth-
          el.offsetWidth
        );

      const maxY =
        Math.max(
          0,
          stage.clientHeight-
          el.offsetHeight
        );

      f.x =
        Math.max(
          0,
          Math.min(
            startX+dx,
            maxX
          )
        );

      f.y =
        Math.max(
          0,
          Math.min(
            startY+dy,
            maxY
          )
        );

      el.style.left =
        f.x+"px";

      el.style.top =
        f.y+"px";
    }
  );


  el.addEventListener(
    "pointerup",
    e => {

      f.dragging = false;

      el.classList.remove(
        "dragging"
      );

      try{
        el.releasePointerCapture(
          e.pointerId
        );
      }catch(_){}
    }
  );
}

function updatePetAccessories(){

  petArea
    .querySelectorAll(
      ".pet-accessory"
    )
    .forEach(
      el => el.remove()
    );

  if(!pettingActor)return;

  const actor =
    pettingActor;

  const actorSize =
    actor.element.offsetWidth;

  const actorScale =
    240/Math.max(
      1,
      actorSize
    );

  for(
    const a of accessories
  ){

    if(a.owner !== actor)continue;

    const img =
      document.createElement("img");

    img.className =
      "pet-accessory";

    img.src =
      a.element.src;

    const size =
      a.element.offsetWidth *
      actorScale;

    const relX =
      a.x-actor.x;

    const relY =
      a.y-actor.y;

    const left =
      50 +
      (
        (relX+
        a.element.offsetWidth/2) /
        actorSize
        *240
      ) -
      size/2;

    const top =
      50 +
      (
        (relY+
        a.element.offsetHeight/2) /
        actorSize
        *240
      ) -
      size/2;

    img.style.width =
      size+"px";

    img.style.height =
      size+"px";

    img.style.left =
      "calc(50% + "+
      (
        left-120
      )+
      "px)";

    img.style.top =
      "calc(50% + "+
      (
        top-120
      )+
      "px)";

    img.style.transform =
      "translate(-50%,-50%) rotate("+
      a.rotation+
      "deg)";

    petArea.appendChild(img);
  }
}

    !gift ||
    !gift.element
  )return;

    "rotate("+
    gift.rotation+

}


/* =========================
   무대에 선물 표시
========================= */

function showGiftOnStage(
  actor,
  gift
){

  if(
    actor.heldGiftElement
  ){

    actor.heldGiftElement.remove();

    actor.heldGiftElement = null;
  }

  const img =
    document.createElement("img");

  img.className =
    "stage-gift";

  img.src =
    gift.src;

  gift.element =
    img;

  gift.visible =
    true;

  actor.heldGiftElement =
    img;

  stage.appendChild(img);

  applyGiftSize(gift);
  applyGiftTransform(gift);
  updateHeldGift(actor);

  enableGiftDrag(gift);


  if(gift.timer){
    clearTimeout(gift.timer);
  }

  const currentGift =
    gift;

  gift.timer =
    setTimeout(
      () => {

        if(
          actor.heldGift ===
          currentGift
        ){

          if(
            currentGift.element
          ){

            currentGift.element.remove();

          }

          currentGift.element =
            null;

          currentGift.visible =
            false;

          actor.heldGiftElement =
            null;

          if(selectedGift === currentGift){

            selectedGift = null;

            giftControl.classList.remove(
              "show"
            );
          }

          updateStatus();
        }

      },
      7000
    );
}

function applyGiftSize(gift){

  if(
    !gift ||
    !gift.element
  )return;

  const size =
    55*(gift.size/100);

  gift.element.style.width =
    size+"px";

  gift.element.style.height =

  gift.element.style.transform =
    "rotate("+

/* =========================
   선물 위치
========================= */

function updateHeldGift(actor){

  if(
    !actor ||
    !actor.heldGift ||
    !actor.heldGiftElement
  ){
    return;
  }

  const gift =
    actor.heldGift;

  const el =
    gift.element;

  const giftW =
    el.offsetWidth;

  const giftH =
    el.offsetHeight;

  /*
    캐릭터별로 저장된
    상대 위치를 사용.
  */

  let x =
    actor.x+
    gift.relativeX;

  let y =
    actor.y+
    gift.relativeY;

  /*
    무대 밖으로 완전히 나가지 않도록
    제한.
  */

  x =
    Math.max(
      0,
      Math.min(
        x,
        stage.clientWidth-giftW
      )
    );

  y =
    Math.max(
      0,
      Math.min(
        y,
        stage.clientHeight-giftH
      )
    );

  gift.x =
    x;

  gift.y =
    y;

  el.style.left =
    x+"px";

  el.style.top =
    y+"px";
}


/* =========================
   선물 드래그
========================= */

function enableGiftDrag(gift){

  const el =
    gift.element;

  if(!el)return;

  let active = false;
  let moved = false;

  let startPointerX = 0;
  let startPointerY = 0;

  let startX = 0;
  let startY = 0;

  el.addEventListener(
    "pointerdown",
    e => {

      e.preventDefault();
      e.stopPropagation();

      selectGift(gift);

      active = true;
      moved = false;

      startPointerX =
        e.clientX;

      startPointerY =
        e.clientY;

      startX =
        gift.x;

      startY =
        gift.y;

      gift.element.classList.add(
        "dragging"
      );

      try{
        el.setPointerCapture(
          e.pointerId
        );
      }catch(_){}
    }
  );


  el.addEventListener(
    "pointermove",
    e => {

      if(!active)return;

      const dx =
        e.clientX-startPointerX;

      const dy =
        e.clientY-startPointerY;

      if(
        !moved &&
        Math.hypot(dx,dy)<5
      ){
        return;
      }

      moved = true;

      e.preventDefault();
      e.stopPropagation();

      const giftW =
        el.offsetWidth;

      const giftH =
        el.offsetHeight;

      const maxX =
        Math.max(
          0,
          stage.clientWidth-giftW
        );

      const maxY =
        Math.max(
          0,
          stage.clientHeight-giftH
        );

      gift.x =
        Math.max(
          0,
          Math.min(
            startX+dx,
            maxX
          )
        );

      gift.y =
        Math.max(
          0,
          Math.min(
            startY+dy,
            maxY
          )
        );

      el.style.left =
        gift.x+"px";

      el.style.top =
        gift.y+"px";

      /*
        핵심:
        이 캐릭터를 기준으로 한
        선물 위치를 저장.
      */

      gift.relativeX =
        gift.x-gift.owner.x;

      gift.relativeY =
        gift.y-gift.owner.y;
    }
  );


  el.addEventListener(
    "pointerup",
    e => {

      active = false;

      gift.element.classList.remove(
        "dragging"
      );

      try{
        el.releasePointerCapture(
          e.pointerId
        );
      }catch(_){}
    }
  );


  el.addEventListener(
    "pointercancel",
    e => {

      active = false;

      gift.element.classList.remove(
        "dragging"
      );

      try{
        el.releasePointerCapture(
          e.pointerId
        );
      }catch(_){}
    }
  );
}

      gift.x-gift.owner.x;

    gift.relativeY =
      gift.y-gift.owner.y;

    gift.element.style.left =
      gift.x+"px";

    gift.element.style.top =
      gift.y+"px";

    applyGiftTransform(gift);
  }
);

/* =====================================================
   소지품
===================================================== */

function updateInventory(){

  inventoryItems.innerHTML = "";

  if(!selectedActor){

    inventoryControl.classList.remove(
      "show"
    );

    inventoryEmpty.style.display =
      "block";

    return;
  }

  inventoryControl.classList.add(
    "show"
  );

  const actor =
    selectedActor;

  if(
    !actor.inventory ||
    actor.inventory.length === 0
  ){

    inventoryEmpty.style.display =
      "block";

    return;
  }

  inventoryEmpty.style.display =
    "none";


  actor.inventory.forEach(
    (gift,index) => {

      const item =
        document.createElement("button");

      item.className =
        "inventory-item";

      if(
        selectedGift === gift
      ){

        item.classList.add(
          "selected-gift"
        );
      }


      if(gift.emoji){

        item.innerHTML =
          gift.emoji+
          "<span>선물</span>";

      }else{

        const img =
          document.createElement("img");

        img.src =
          gift.src;

        img.style.width =
          "42px";

        img.style.height =
          "42px";

        img.style.objectFit =
          "contain";

        item.appendChild(img);

        const label =
          document.createElement("span");

        label.textContent =
          "사진 선물";

        item.appendChild(label);
      }


      item.addEventListener(
        "click",
        e => {

          e.preventDefault();
          e.stopPropagation();

          holdInventoryGift(
            actor,
            gift
          );
        }
      );

      inventoryItems.appendChild(
        item
      );
    }
  );
}


/* =========================
   소지품 선물 다시 들기
========================= */

function holdInventoryGift(
  actor,
  gift
){

  /*
    다른 캐릭터가 들고 있던 선물은
    내려놓음.
  */

  if(
    actor.heldGiftElement
  ){

    actor.heldGiftElement.remove();

    actor.heldGiftElement =
      null;
  }

  if(
    actor.heldGift &&
    actor.heldGift.timer
  ){

    clearTimeout(
      actor.heldGift.timer
    );

    actor.heldGift.timer =
      null;
  }

  actor.heldGift =
    gift;

  /*
    소지품에 저장된
    마지막 위치/크기/각도를 그대로 사용.
  */

  showHeldGiftOnly(
    actor,
    gift
  );

  selectGift(gift);

  updateInventory();

  updateStatus();
}


function showHeldGiftOnly(
  actor,
  gift
){

  if(gift.element){

    gift.element.remove();

    gift.element = null;
  }

  const img =
    document.createElement("img");

  img.className =
    "stage-gift";

  img.src =
    gift.src;

  gift.element =
    img;

  gift.visible =
    true;

  actor.heldGiftElement =
    img;

  stage.appendChild(img);

  applyGiftSize(gift);

  applyGiftTransform(gift);

  updateHeldGift(actor);

  enableGiftDrag(gift);

  /*
    소지품에서 다시 들었을 때는
    계속 들고 있도록 함.
    다시 소지품을 눌러 내려놓을 수 있음.
  */

  if(gift.timer){

    clearTimeout(
      gift.timer
    );

    gift.timer =
      null;
  }
}


/* =====================================================
   원본 이미지
===================================================== */

function loadImage(src){

  return new Promise(
    (resolve,reject) => {

      const img =
        new Image();

      img.onload =
        () => resolve(img);

      img.onerror =
        reject;

      img.src =
        src;
    }
  );
}


async function getOriginalImage(item){

  if(item.originalImage){
    return item.originalImage;
  }

  return await loadImage(
    item.element
      ? item.element.src
      : item.src
  );
}


/* =====================================================
   글 줄바꿈
===================================================== */

function wrapText(
  ctx,
  text,
  maxWidth
){

  const lines = [];

  for(
    const paragraph of
    String(text).split("\n")
  ){

    if(paragraph === ""){

      lines.push("");

      continue;
    }

    let line = "";

    for(
      const char of paragraph
    ){

      const test =
        line+char;

      if(
        ctx.measureText(test)
          .width > maxWidth &&
        line
      ){

        lines.push(line);

        line = char;

      }else{

        line = test;
      }
    }

    lines.push(line);
  }

  return lines;
}


/* =====================================================
   저장
===================================================== */

saveButton.addEventListener(
  "click",
  async() => {

    saveButton.disabled = true;

    try{

      const S = 3;

      const W = 900;

      const stageW = 760;

      const stageRatio =
        stage.clientHeight /
        stage.clientWidth;

      const stageH =
        Math.round(
          stageW*stageRatio
        );

      const margin = 70;

      const temp =
        document.createElement(
          "canvas"
        );

      const tempCtx =
        temp.getContext("2d");

      tempCtx.font =
        "32px sans-serif";

      const lines =
        wrapText(
          tempCtx,
          diaryInput.value ||
          "오늘의 일기를 써보세요.",
          W-margin*2
        );

      const diaryH =
        Math.max(
          170,
          lines.length*52+90
        );

      const H =
        150+
        155+
        diaryH+
        stageH+
        120;

      const canvas =
        document.createElement(
          "canvas"
        );

      canvas.width =
        W*S;

      canvas.height =
        H*S;

      const ctx =
        canvas.getContext("2d");

      ctx.scale(S,S);

      ctx.imageSmoothingEnabled =
        true;

      ctx.imageSmoothingQuality =
        "high";

      ctx.fillStyle =
        "#fff";

      ctx.fillRect(
        0,
        0,
        W,
        H
      );

      ctx.textAlign =
        "center";

      ctx.textBaseline =
        "middle";

      ctx.fillStyle =
        "#111";

      ctx.font =
        "bold 52px sans-serif";

      ctx.fillText(
        "오늘의 일기",
        W/2,
        65
      );

      ctx.font =
        "25px sans-serif";

      ctx.fillStyle =
        "#777";

      ctx.fillText(
        dateElement.textContent,
        W/2,
        115
      );

      let y = 150;

      ctx.textAlign =
        "left";

      ctx.fillStyle =
        "#fafafa";

      ctx.strokeStyle =
        "#ddd";

      ctx.lineWidth = 2;

      ctx.beginPath();

      ctx.roundRect(
        margin,
        y,
        W-margin*2,
        130,
        20
      );

      ctx.fill();
      ctx.stroke();

      ctx.fillStyle =
        "#777";

      ctx.font =
        "20px sans-serif";

      ctx.fillText(
        "제목",
        margin+30,
        y+30
      );

      ctx.fillStyle =
        "#111";

      ctx.font =
        "bold 44px sans-serif";

      ctx.fillText(
        titleInput.value ||
        "오늘의 제목",
        margin+30,
        y+82
      );

      y += 155;

      ctx.fillStyle =
        "#fff";

      ctx.beginPath();

      ctx.roundRect(
        margin,
        y,
        W-margin*2,
        diaryH,
        20
      );

      ctx.fill();
      ctx.stroke();

      ctx.fillStyle =
        "#777";

      ctx.font =
        "20px sans-serif";

      ctx.fillText(
        "일기 내용",
        margin+30,
        y+32
      );

      ctx.fillStyle =
        "#111";

      ctx.font =
        "32px sans-serif";

      let textY =
        y+80;

      for(
        const line of lines
      ){

        ctx.fillText(
          line,
          margin+30,
          textY
        );

        textY += 52;
      }

      y += diaryH+25;

      const sx =
        (W-stageW)/2;

      const sy = y;

      ctx.save();

      ctx.beginPath();

      ctx.roundRect(
        sx,
        sy,
        stageW,
        stageH,
        24
      );

      ctx.clip();


      /* =========================
         배경
      ========================= */

      if(
        currentBackground.type ===
        "image" &&
        currentBackground.src
      ){

        const bg =
          await loadImage(
            currentBackground.src
          );

        const ratio =
          bg.naturalWidth/
          bg.naturalHeight;

        const targetRatio =
          stageW/stageH;

        let dw;
        let dh;

        if(
          ratio > targetRatio
        ){

          dh = stageH;
          dw = dh*ratio;

        }else{

          dw = stageW;
          dh = dw/ratio;
        }

        ctx.drawImage(
          bg,
          sx+(stageW-dw)/2,
          sy+(stageH-dh)/2,
          dw,
          dh
        );

      }else{

        if(
          currentBackground.type ===
          "sky"
        ){

          const g =
            ctx.createLinearGradient(
              0,
              sy,
              0,
              sy+stageH
            );

          g.addColorStop(
            0,
            "#bde8ff"
          );

          g.addColorStop(
            1,
            "#fff"
          );

          ctx.fillStyle = g;

        }

        else if(
          currentBackground.type ===
          "night"
        ){

          const g =
            ctx.createLinearGradient(
              0,
              sy,
              0,
              sy+stageH
            );

          g.addColorStop(
            0,
            "#101528"
          );

          g.addColorStop(
            1,
            "#343b5c"
          );

          ctx.fillStyle = g;

        }

        else if(
          currentBackground.type ===
          "grass"
        ){

          const g =
            ctx.createLinearGradient(
              0,
              sy,
              0,
              sy+stageH
            );

          g.addColorStop(
            0,
            "#dff5d8"
          );

          g.addColorStop(
            .65,
            "#c9ebc1"
          );

          g.addColorStop(
            .65,
            "#a9d79e"
          );

          g.addColorStop(
            1,
            "#a9d79e"
          );

          ctx.fillStyle = g;

        }

        else if(
          currentBackground.type ===
          "pink"
        ){

          ctx.fillStyle =
            "#ffe8ef";

        }

        else if(
          currentBackground.type ===
          "yellow"
        ){

          ctx.fillStyle =
            "#fff4b8";

        }

        else{

          ctx.fillStyle =
            "#fafafa";
        }

        ctx.fillRect(
          sx,
          sy,
          stageW,
          stageH
        );
      }


      const scaleX =
        stageW/
        stage.clientWidth;

      const scaleY =
        stageH/
        stage.clientHeight;


      /* =========================
         가구
      ========================= */

      for(
        const f of furnitures
      ){

        try{

          const img =
            await getOriginalImage(f);

          const w =
            f.element.offsetWidth;

          const h =
            f.element.offsetHeight;

          const iw =
            img.naturalWidth ||
            img.width;

          const ih =
            img.naturalHeight ||
            img.height;

          const fit =
            Math.min(
              w/iw,
              h/ih
            );

          const dw =
            iw*fit;

          const dh =
            ih*fit;

          ctx.drawImage(
            img,
            sx+
            f.x*scaleX+
            (w-dw)/2*scaleX,
            sy+
            f.y*scaleY+
            (h-dh)/2*scaleY,
            dw*scaleX,
            dh*scaleY
          );

        }catch(_){}
      }


      /* =========================
         캐릭터
      ========================= */

      for(
        const actor of actors
      ){

        try{

          const img =
            await getOriginalImage(
              actor
            );

          const w =
            actor.element.offsetWidth;

          const h =
            actor.element.offsetHeight;

          const iw =
            img.naturalWidth ||
            img.width;

          const ih =
            img.naturalHeight ||
            img.height;

          /*
            원본 비율 유지
          */

          const fit =
            Math.min(
              w/iw,
              h/ih
            );

          const dw =
            iw*fit;

          const dh =
            ih*fit;

          ctx.drawImage(
            img,
            sx+
            actor.x*scaleX+
            (w-dw)/2*scaleX,
            sy+
            actor.y*scaleY+
            (h-dh)/2*scaleY,
            dw*scaleX,
            dh*scaleY
          );

        }catch(_){}
      }


      /* =========================
         악세사리
      ========================= */

      for(
        const a of accessories
      ){

        try{

          const img =
            await getOriginalImage(a);

          const w =
            a.element.offsetWidth;

          const h =
            a.element.offsetHeight;

          const iw =
            img.naturalWidth ||
            img.width;

          const ih =
            img.naturalHeight ||
            img.height;

          const fit =
            Math.min(
              w/iw,
              h/ih
            );

          const dw =
            iw*fit;

          const dh =
            ih*fit;

          const px =
            sx+
            a.x*scaleX+
            (w-dw)/2*scaleX;

          const py =
            sy+
            a.y*scaleY+
            (h-dh)/2*scaleY;

          const cx =
            px+
            dw*scaleX/2;

          const cy =
            py+
            dh*scaleY/2;

          ctx.save();

          ctx.translate(
            cx,
            cy
          );

          ctx.rotate(
            a.rotation*
            Math.PI/180
          );

          ctx.drawImage(
            img,
            -dw*scaleX/2,
            -dh*scaleY/2,
            dw*scaleX,
            dh*scaleY
          );

          ctx.restore();

        }catch(_){}
      }


      /* =========================
         현재 들고 있는 선물
      ========================= */

      for(
        const actor of actors
      ){

        if(
          !actor.heldGift ||
          !actor.heldGiftElement
        )continue;

        try{

          const gift =
            actor.heldGift;

          const img =
            gift.originalImage ||
            await loadImage(
              gift.src
            );

          const gw =
            gift.element
            ? gift.element.offsetWidth
            : 55;

          const gh =
            gift.element
            ? gift.element.offsetHeight
            : 55;

          const iw =
            img.naturalWidth ||
            img.width;

          const ih =
            img.naturalHeight ||
            img.height;

          const fit =
            Math.min(
              gw/iw,
              gh/ih
            );

          const dw =
            iw*fit;

          const dh =
            ih*fit;

          const gx =
            gift.x;

          const gy =
            gift.y;

          const cx =
            sx+
            (gx+
            gw/2)*
            scaleX;

          const cy =
            sy+
            (gy+
            gh/2)*
            scaleY;

          ctx.save();

          ctx.translate(
            cx,
            cy
          );

          ctx.rotate(
            gift.rotation*
            Math.PI/180
          );

          ctx.drawImage(
            img,
            -dw*scaleX/2,
            -dh*scaleY/2,
            dw*scaleX,
            dh*scaleY
          );

          ctx.restore();

        }catch(_){}
      }


      ctx.restore();

      ctx.beginPath();

      ctx.roundRect(
        sx,
        sy,
        stageW,
        stageH,
        24
      );

      ctx.strokeStyle =
        "#ddd";

      ctx.lineWidth = 2;

      ctx.stroke();


      /* =========================
         PNG 저장
      ========================= */

      const blob =
        await new Promise(
          resolve =>
            canvas.toBlob(
              resolve,
              "image/png"
            )
        );

      const file =
        new File(
          [blob],
          "그림일기.png",
          {
            type:"image/png"
          }
        );


      if(
        navigator.share &&
        navigator.canShare &&
        navigator.canShare({
          files:[file]
        })
      ){

        try{

          await navigator.share({
            files:[file],
            title:"그림일기"
          });

          return;

        }catch(e){

          if(
            e.name ===
            "AbortError"
          ){
            return;
          }
        }
      }


      const url =
        URL.createObjectURL(
          blob
        );

      const link =
        document.createElement(
          "a"
        );

      link.href = url;

      link.download =
        "그림일기.png";

      document.body.appendChild(
        link
      );

      link.click();

      link.remove();

      setTimeout(
        () => {
          URL.revokeObjectURL(
            url
          );
        },
        1000
      );

    }catch(error){

      console.error(error);

      alert(
        "저장 중 문제가 생겼어요."
      );

    }finally{

      saveButton.disabled = false;
    }
  }
);

===================================================== */

clearAllButton.addEventListener(
  "click",
  () => {

    titleInput.value = "";
    diaryInput.value = "";

    localStorage.removeItem(
      "diary-title"
    );

    localStorage.removeItem(
      "diary-text"
    );

    for(
      const a of actors
    ){

      a.element.remove();

      if(a.heldGiftElement){
        a.heldGiftElement.remove();
      }

      for(
        const gift of a.inventory
      ){

        if(gift.timer){
          clearTimeout(
            gift.timer
          );
        }

        if(gift.element){
          gift.element.remove();
        }
      }
    }

    for(
      const a of accessories
    ){
      a.element.remove();
    }

    for(
      const f of furnitures
    ){
      f.element.remove();
    }

    actors.length = 0;
    accessories.length = 0;
    furnitures.length = 0;

    clearSelections();

    updateStatus();
  }
);


/* =====================================================
   시작
===================================================== */

updateStatus();

requestAnimationFrame(
  animate
);
