<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>그림일기</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  background: #fff;
  color: #111;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Apple SD Gothic Neo",
    "Noto Sans KR",
    sans-serif;
}

header {
  padding: 18px 16px 10px;
}

.date {
  font-size: 13px;
  color: #777;
}

.container {
  padding: 0 16px 35px;
}

input[type="text"],
textarea {
  width: 100%;
  border: 1px solid #ddd;
  border-radius: 12px;
  padding: 12px;
  font-size: 16px;
  outline: none;
  background: #fff;
}

textarea {
  min-height: 120px;
  resize: vertical;
}

button {
  width: 100%;
  border: 1px solid #ddd;
  background: #fff;
  color: #111;
  border-radius: 12px;
  padding: 13px 16px;
  font-size: 15px;
  margin-top: 10px;
}

/* 캐릭터 공간 */

.stage {
  position: relative;
  width: 100%;
  height: 380px;

  margin: 15px 0;

  border: 1px solid #ddd;
  border-radius: 18px;

  overflow: hidden;

  background: #fafafa;
}

.actor {
  position: absolute;

  width: 110px;
  height: 110px;

  object-fit: contain;

  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}

/* 사진 추가 */

.add-area {
  margin: 12px 0 18px;
}

.photo-button {
  display: block;

  width: 100%;

  padding: 12px 16px;

  border: 1px solid #ddd;
  border-radius: 12px;

  background: #fff;
  color: #111;

  font-size: 15px;
  text-align: center;

  cursor: pointer;
}

#photo {
  display: none;
}


/* 저장 버튼 */

.save-button {
  margin-top: 12px;
}


/* 갤러리 저장 버튼 */

.gallery-button {
  margin-top: 8px;
}
</style>
</head>


<body>

<header>
  <div class="date" id="date"></div>
</header>


<div class="container" id="diaryPage">

  <!-- 제목 -->

  <input
    type="text"
    id="title"
    placeholder="오늘의 제목"
  >


  <!-- 캐릭터가 나오는 공간 -->

  <div
    class="stage"
    id="stage"
  ></div>


  <!-- 사진 추가 -->

  <div class="add-area">

    <label
      class="photo-button"
      for="photo"
    >
      ＋ 사진 추가
    </label>

    <input
      id="photo"
      type="file"
      accept="image/*"
    >

  </div>


  <!-- 일기 -->

  <textarea
    id="diary"
    placeholder="오늘의 일기를 써보세요."
  ></textarea>


  <!-- 일반 저장 -->

  <button
    class="save-button"
    id="save"
  >
    저장
  </button>


  <!-- 갤러리 저장 -->

  <button
    class="gallery-button"
    id="gallerySave"
  >
    갤러리에 저장
  </button>

</div>


<script>

/* ==========================
   날짜
========================== */

const dateElement =
  document.getElementById("date");

const now =
  new Date();

dateElement.textContent =
  now.getFullYear() + "년 " +
  (now.getMonth() + 1) + "월 " +
  now.getDate() + "일";


/* ==========================
   일기 저장
========================== */

const titleInput =
  document.getElementById("title");

const diaryInput =
  document.getElementById("diary");

const saveButton =
  document.getElementById("save");


titleInput.value =
  localStorage.getItem("diary-title") || "";

diaryInput.value =
  localStorage.getItem("diary-text") || "";


saveButton.addEventListener(
  "click",
  function() {

    localStorage.setItem(
      "diary-title",
      titleInput.value
    );

    localStorage.setItem(
      "diary-text",
      diaryInput.value
    );

    alert("저장했어요!");

  }
);


/* ==========================
   사진 → 캐릭터
========================== */

const photoInput =
  document.getElementById("photo");

const stage =
  document.getElementById("stage");


photoInput.addEventListener(
  "change",
  function(event) {

    const file =
      event.target.files[0];

    if (!file) {
      return;
    }


    const reader =
      new FileReader();


    reader.onload =
      function(e) {

        const img =
          document.createElement("img");


        img.className =
          "actor";


        img.src =
          e.target.result;


        img.style.left =
          "30px";

        img.style.top =
          "30px";


        stage.appendChild(img);


        makeDraggable(img);

      };


    reader.readAsDataURL(file);


    /*
      같은 사진을 다시 선택할 수 있도록 초기화
    */

    photoInput.value = "";

  }
);


/* ==========================
   캐릭터 움직이기
========================== */

function makeDraggable(element) {

  let startX = 0;
  let startY = 0;

  let originalLeft = 0;
  let originalTop = 0;

  let dragging = false;


  element.addEventListener(
    "touchstart",
    function(e) {

      e.preventDefault();

      const touch =
        e.touches[0];

      startX =
        touch.clientX;

      startY =
        touch.clientY;

      originalLeft =
        parseFloat(element.style.left) || 0;

      originalTop =
        parseFloat(element.style.top) || 0;

      dragging = true;

    },
    { passive: false }
  );


  element.addEventListener(
    "touchmove",
    function(e) {

      if (!dragging) {
        return;
      }

      e.preventDefault();

      const touch =
        e.touches[0];

      const moveX =
        touch.clientX - startX;

      const moveY =
        touch.clientY - startY;


      let newLeft =
        originalLeft + moveX;

      let newTop =
        originalTop + moveY;


      const maxLeft =
        stage.clientWidth -
        element.offsetWidth;

      const maxTop =
        stage.clientHeight -
        element.offsetHeight;


      newLeft =
        Math.max(
          0,
          Math.min(newLeft, maxLeft)
        );

      newTop =
        Math.max(
          0,
          Math.min(newTop, maxTop)
        );


      element.style.left =
        newLeft + "px";

      element.style.top =
        newTop + "px";

    },
    { passive: false }
  );


  element.addEventListener(
    "touchend",
    function() {

      dragging = false;

    }
  );

}


/* ==========================
   갤러리에 저장
========================== */

const gallerySave =
  document.getElementById("gallerySave");


gallerySave.addEventListener(
  "click",
  async function() {

    /*
      일기 내용을 이미지로 만듦
    */

    const canvas =
      document.createElement("canvas");

    const ctx =
      canvas.getContext("2d");


    const width =
      900;

    const height =
      1100;


    canvas.width =
      width;

    canvas.height =
      height;


    /* 흰색 배경 */

    ctx.fillStyle =
      "#ffffff";

    ctx.fillRect(
      0,
      0,
      width,
      height
    );


    /* 글자 */

    ctx.fillStyle =
      "#111111";

    ctx.textBaseline =
      "top";


    ctx.font =
      "24px sans-serif";

    ctx.fillText(
      dateElement.textContent,
      60,
      55
    );


    ctx.font =
      "bold 42px sans-serif";

    const title =
      titleInput.value || "오늘의 일기";

    ctx.fillText(
      title,
      60,
      110
    );


    /*
      캐릭터 공간
    */

    const stageX = 60;
    const stageY = 190;
    const stageW = 780;
    const stageH = 400;


    ctx.strokeStyle =
      "#dddddd";

    ctx.lineWidth =
      2;

    ctx.strokeRect(
      stageX,
      stageY,
      stageW,
      stageH
    );


    /*
      현재 화면에 있는 캐릭터들을
      이미지로 그리기
    */

    const actors =
      stage.querySelectorAll(".actor");


    for (const actor of actors) {

      try {

        const image =
          await loadImage(actor.src);


        const left =
          parseFloat(actor.style.left) || 0;

        const top =
          parseFloat(actor.style.top) || 0;


        const scaleX =
          stageW / stage.clientWidth;

        const scaleY =
          stageH / stage.clientHeight;


        const x =
          stageX + left * scaleX;

        const y =
          stageY + top * scaleY;


        const w =
          actor.offsetWidth * scaleX;

        const h =
          actor.offsetHeight * scaleY;


        ctx.drawImage(
          image,
          x,
          y,
          w,
          h
        );

      } catch (error) {

        console.log(
          "캐릭터 이미지를 저장하지 못했습니다.",
          error
        );

      }

    }


    /*
      일기 내용
    */

    ctx.font =
      "26px sans-serif";

    ctx.fillStyle =
      "#111111";


    drawText(
      ctx,
      diaryInput.value || "",
      60,
      650,
      780,
      42
    );


    /*
      PNG 만들기
    */

    canvas.toBlob(
      async function(blob) {

        if (!blob) {

          alert(
            "이미지를 만들지 못했어요."
          );

          return;
        }


        const file =
          new File(
            [blob],
            "그림일기.png",
            {
              type: "image/png"
            }
          );


        /*
          아이폰에서 공유 메뉴를 열 수 있으면
          공유 메뉴를 사용
        */

        if (
          navigator.share &&
          navigator.canShare &&
          navigator.canShare({
            files: [file]
          })
        ) {

          try {

            await navigator.share({
              files: [file],
              title: "그림일기"
            });

            return;

          } catch (error) {

            /*
              사용자가 공유창을 닫은 경우
              아무것도 하지 않음
            */

            if (
              error &&
              error.name === "AbortError"
            ) {
              return;
            }

          }

        }


        /*
          공유 기능을 사용할 수 없는 경우
          이미지를 새 화면에서 열기
        */

        const url =
          URL.createObjectURL(blob);

        window.open(
          url,
          "_blank"
        );

      },
      "image/png"
    );

  }
);


/* ==========================
   긴 글 줄바꿈
========================== */

function drawText(
  ctx,
  text,
  x,
  y,
  maxWidth,
  lineHeight
) {

  const lines =
    String(text).split("\n");


  let currentY =
    y;


  for (
    let i = 0;
    i < lines.length;
    i++
  ) {

    const line =
      lines[i];


    let currentLine =
      "";


    for (
      let j = 0;
      j < line.length;
      j++
    ) {

      const testLine =
        currentLine + line[j];


      const metrics =
        ctx.measureText(testLine);


      if (
        metrics.width > maxWidth &&
        currentLine
      ) {

        ctx.fillText(
          currentLine,
          x,
          currentY
        );


        currentY +=
          lineHeight;


        currentLine =
          line[j];

      } else {

        currentLine =
          testLine;

      }

    }


    ctx.fillText(
      currentLine,
      x,
      currentY
    );


    currentY +=
      lineHeight;

  }

}


/* ==========================
   이미지 불러오기
========================== */

function loadImage(src) {

  return new Promise(
    function(resolve, reject) {

      const img =
        new Image();


      img.onload =
        function() {
          resolve(img);
        };


      img.onerror =
        function() {
          reject(
            new Error(
              "이미지를 불러올 수 없습니다."
            )
          );
        };


      img.src =
        src;

    }
  );

}

</script>

</body>
</html>
