<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>그림일기</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:#fff;
  color:#111;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
}

header{
  padding:18px 16px 10px;
}

.date{
  font-size:13px;
  color:#777;
}

.container{
  padding:0 16px 35px;
}

input[type="text"]{
  width:100%;
  border:1px solid #ddd;
  border-radius:12px;
  padding:12px;
  font-size:16px;
  outline:none;
  background:#fff;
}

textarea{
  width:100%;
  min-height:180px;
  margin-top:10px;
  border:1px solid #ddd;
  border-radius:12px;
  padding:14px;
  font-size:16px;
  line-height:1.6;
  outline:none;
  resize:vertical;
  background:#fff;
}

.stage{
  position:relative;
  width:100%;
  height:380px;
  margin:15px 0;
  border:1px solid #ddd;
  border-radius:18px;
  overflow:hidden;
  background:#fafafa;
  background-position:center;
  background-size:cover;
  background-repeat:no-repeat;
  touch-action:none;
  overscroll-behavior:none;
}

.actor{
  position:absolute;
  width:90px;
  height:90px;
  object-fit:contain;
  user-select:none;
  -webkit-user-select:none;
  -webkit-touch-callout:none;
  touch-action:none;
  cursor:grab;
  z-index:30;
}

.actor.dragging{
  cursor:grabbing;
}

.actor.selected{
  outline:2px dashed #777;
  outline-offset:4px;
  border-radius:12px;
}

.actor.sleeping{
  opacity:.65;
}

.accessory{
  position:absolute;
  width:55px;
  height:55px;
  object-fit:contain;
  user-select:none;
  -webkit-user-select:none;
  -webkit-touch-callout:none;
  touch-action:none;
  cursor:grab;
  z-index:40;

  transform-origin:center center;
  will-change:transform,width,height,left,top;
}

.accessory.dragging{
  cursor:grabbing;
}

.accessory.locked{
  cursor:default;
}

.accessory.selected{
  outline:2px dashed #777;
  outline-offset:3px;
  border-radius:8px;
}

.furniture{
  position:absolute;
  width:90px;
  height:90px;
  object-fit:contain;
  user-select:none;
  -webkit-user-select:none;
  -webkit-touch-callout:none;
  touch-action:none;
  cursor:grab;
  z-index:20;
}

.furniture.dragging{
  cursor:grabbing;
}

.furniture.locked{
  cursor:default;
}

.furniture.selected{
  outline:2px dashed #777;
  outline-offset:4px;
  border-radius:10px;
}

.status{
  position:absolute;
  left:50%;
  bottom:8px;
  transform:translateX(-50%);
  font-size:12px;
  color:#777;
  pointer-events:none;
  white-space:nowrap;
  z-index:100;
}

.add-area{
  margin:12px 0 18px;
}

.photo-button,
.background-file-label{
  display:block;
  width:100%;
  padding:12px 16px;
  border:1px solid #ddd;
  border-radius:12px;
  background:#fff;
  color:#111;
  font-size:15px;
  text-align:center;
  cursor:pointer;
}

#photo,
#backgroundFile,
#accessoryFile,
#furnitureFile{
  display:none;
}

.background-area{
  margin-bottom:18px;
}

.background-select{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:12px;
  background:#fff;
  color:#111;
  font-size:15px;
  outline:none;
}

.background-file-label{
  margin-top:10px;
}

.control-box,
.accessory-box,
.furniture-box{
  margin-top:10px;
  padding:10px;
  border:1px solid #ddd;
  border-radius:12px;
  background:#fafafa;
}

.control-box{
  display:none;
}

.control-box.show{
  display:block;
}

.accessory-control,
.furniture-control{
  display:none;
}

.accessory-control.show,
.furniture-control.show{
  display:block;
}

.control-title,
.accessory-title,
.furniture-title{
  font-size:13px;
  color:#666;
  margin-bottom:8px;
}

.size-control{
  margin-top:12px;
}

.size-label{
  font-size:13px;
  color:#666;
  margin-bottom:5px;
}

input[type=range]{
  width:100%;
  margin:0;
  accent-color:#777;
  touch-action:auto;
}

.accessory-grid,
.furniture-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
}

.accessory-choice,
.furniture-choice{
  border:1px solid #ddd;
  border-radius:10px;
  background:#fff;
  padding:8px 4px;
  font-size:24px;
  line-height:1.2;
  cursor:pointer;
  margin:0;
}

.accessory-choice span,
.furniture-choice span{
  display:block;
  font-size:11px;
  margin-top:3px;
  color:#666;
}

.accessory-upload,
.furniture-upload{
  display:block;
  width:100%;
  margin-top:8px;
  padding:10px;
  border:1px solid #ddd;
  border-radius:10px;
  background:#fff;
  text-align:center;
  font-size:13px;
  cursor:pointer;
}

.rotation-control{
  margin-top:12px;
}

.help{
  margin-top:8px;
  text-align:center;
  font-size:12px;
  color:#888;
}

button{
  width:100%;
  border:1px solid #ddd;
  background:#fff;
  color:#111;
  border-radius:12px;
  padding:13px 16px;
  font-size:15px;
  margin-top:10px;
}

button:disabled{
  opacity:.5;
}
</style>
</head>

<body>

<header>
  <div class="date" id="date"></div>
</header>

<div class="container">

<input type="text" id="title" placeholder="오늘의 제목">

<textarea id="diary" placeholder="오늘의 일기를 써보세요."></textarea>

<div class="background-area">

<select id="backgroundSelect" class="background-select">
  <option value="plain">기본 배경</option>
  <option value="sky">파란 하늘</option>
  <option value="night">밤하늘</option>
  <option value="grass">초원</option>
  <option value="pink">분홍색</option>
  <option value="yellow">노란색</option>
</select>

<label class="background-file-label" for="backgroundFile">
＋ 배경 사진 추가
</label>

<input id="backgroundFile" type="file" accept="image/*">

</div>

<div class="stage" id="stage">
  <div class="status" id="status">캐릭터를 추가해보세요</div>
</div>

<div class="add-area">
  <label class="photo-button" for="photo">＋ 캐릭터 추가</label>
  <input id="photo" type="file" accept="image/*">
</div>

<div class="control-box" id="controlBox">

<div class="control-title">선택한 캐릭터</div>

<button id="pauseButton">⏸ 이 캐릭터 멈추기</button>
<button id="resumeButton">▶ 다시 움직이기</button>
<button id="bringActorFrontButton">⬆️ 앞으로 보내기</button>
<button id="sendActorBackButton">⬇️ 뒤로 보내기</button>
<button id="deleteActorButton">🗑 이 캐릭터 삭제</button>

<div class="size-control">
<div class="size-label">캐릭터 크기</div>
<input type="range" id="sizeSlider" min="50" max="200" value="100">
</div>

<div class="accessory-box">

<div class="accessory-title">악세사리</div>

<div class="accessory-grid">

<button class="accessory-choice" data-emoji="🎩">
🎩<span>모자</span>
</button>

<button class="accessory-choice" data-emoji="👑">
👑<span>왕관</span>
</button>

<button class="accessory-choice" data-emoji="🎀">
🎀<span>리본</span>
</button>

<button class="accessory-choice" data-emoji="😎">
😎<span>선글라스</span>
</button>

<button class="accessory-choice" data-emoji="🐱">
🐱<span>고양이귀</span>
</button>

<button class="accessory-choice" data-emoji="✨">
✨<span>별</span>
</button>

</div>

<label class="accessory-upload" for="accessoryFile">
＋ 악세사리 사진 추가
</label>

<input id="accessoryFile" type="file" accept="image/*">

<div class="accessory-control" id="accessoryControl">

<div class="size-label">선택한 악세사리 크기</div>

<input
  type="range"
  id="accessorySizeSlider"
  min="20"
  max="200"
  value="100"
>

<div class="rotation-control">

<div class="size-label">선택한 악세사리 각도</div>

<input
  type="range"
  id="accessoryRotationSlider"
  min="-180"
  max="180"
  value="0"
>

</div>

<button id="lockAccessoryButton">
🔒 악세사리 고정
</button>

<button id="deleteAccessoryButton">
🗑 악세사리 삭제
</button>

</div>

</div>

</div>

<div class="furniture-box">

<div class="furniture-title">가구</div>

<div class="furniture-grid">

<button class="furniture-choice" data-emoji="🪑">
🪑<span>의자</span>
</button>

<button class="furniture-choice" data-emoji="🛋️">
🛋️<span>소파</span>
</button>

<button class="furniture-choice" data-emoji="🛏️">
🛏️<span>침대</span>
</button>

<button class="furniture-choice" data-emoji="🪴">
🪴<span>화분</span>
</button>

<button class="furniture-choice" data-emoji="🗄️">
🗄️<span>서랍장</span>
</button>

<button class="furniture-choice" data-emoji="🪟">
🪟<span>창문</span>
</button>

</div>

<label class="furniture-upload" for="furnitureFile">
＋ 가구 사진 추가
</label>

<input id="furnitureFile" type="file" accept="image/*">

<div class="furniture-control" id="furnitureControl">

<div class="size-label">선택한 가구 크기</div>

<input
  type="range"
  id="furnitureSizeSlider"
  min="30"
  max="250"
  value="100"
>

<button id="lockFurnitureButton">
🔒 가구 고정
</button>

<button id="deleteFurnitureButton">
🗑 가구 삭제
</button>

</div>

</div>

<div class="help">
캐릭터, 악세사리, 가구를 손가락으로 끌어서 원하는 곳에 놓을 수 있어요.
</div>

<button id="save">저장</button>

<button id="clearAll">전체 삭제</button>

</div>


<script>

/* =========================================
기본
========================================= */

const date=document.getElementById("date");
const title=document.getElementById("title");
const diary=document.getElementById("diary");

const stage=document.getElementById("stage");
const status=document.getElementById("status");

const photo=document.getElementById("photo");

const backgroundSelect=
document.getElementById("backgroundSelect");

const backgroundFile=
document.getElementById("backgroundFile");

const controlBox=
document.getElementById("controlBox");

const sizeSlider=
document.getElementById("sizeSlider");

const pauseButton=
document.getElementById("pauseButton");

const resumeButton=
document.getElementById("resumeButton");

const bringActorFrontButton=
document.getElementById("bringActorFrontButton");

const sendActorBackButton=
document.getElementById("sendActorBackButton");

const deleteActorButton=
document.getElementById("deleteActorButton");


const accessoryFile=
document.getElementById("accessoryFile");

const accessoryControl=
document.getElementById("accessoryControl");

const accessorySizeSlider=
document.getElementById("accessorySizeSlider");

const accessoryRotationSlider=
document.getElementById("accessoryRotationSlider");

const lockAccessoryButton=
document.getElementById("lockAccessoryButton");

const deleteAccessoryButton=
document.getElementById("deleteAccessoryButton");


const furnitureFile=
document.getElementById("furnitureFile");

const furnitureControl=
document.getElementById("furnitureControl");

const furnitureSizeSlider=
document.getElementById("furnitureSizeSlider");

const lockFurnitureButton=
document.getElementById("lockFurnitureButton");

const deleteFurnitureButton=
document.getElementById("deleteFurnitureButton");


const saveButton=
document.getElementById("save");

const clearAllButton=
document.getElementById("clearAll");


const actors=[];
const accessories=[];
const furnitures=[];

let selectedActor=null;
let selectedAccessory=null;
let selectedFurniture=null;


/* =========================================
날짜
========================================= */

const today=new Date();

date.textContent=
today.getFullYear()+"년 "+
(today.getMonth()+1)+"월 "+
today.getDate()+"일";


/* =========================================
일기 저장
========================================= */

title.value=
localStorage.getItem("diary-title")||"";

diary.value=
localStorage.getItem("diary-text")||"";

title.addEventListener(
"input",
()=>{
localStorage.setItem(
"diary-title",
title.value
);
}
);

diary.addEventListener(
"input",
()=>{
localStorage.setItem(
"diary-text",
diary.value
);
}
);


/* =========================================
배경
========================================= */

let currentBackground={
type:"plain",
src:null
};

function setBackground(type){

currentBackground={
type:type,
src:null
};

stage.style.backgroundImage="";

if(type==="plain"){

stage.style.background=
"#fafafa";

}

else if(type==="sky"){

stage.style.background=
"linear-gradient(#bde8ff,#fff)";

}

else if(type==="night"){

stage.style.background=
"linear-gradient(#101528,#343b5c)";

}

else if(type==="grass"){

stage.style.background=
"linear-gradient(#dff5d8 0%,#c9ebc1 65%,#a9d79e 65%,#a9d79e 100%)";

}

else if(type==="pink"){

stage.style.background=
"#ffe8ef";

}

else if(type==="yellow"){

stage.style.background=
"#fff4b8";

}

}

backgroundSelect.addEventListener(
"change",
e=>{
setBackground(e.target.value);
}
);

backgroundFile.addEventListener(
"change",
e=>{

const file=e.target.files[0];

if(!file)return;

const reader=new FileReader();

reader.onload=ev=>{

currentBackground={
type:"image",
src:ev.target.result
};

stage.style.backgroundImage=
`url("${ev.target.result}")`;

stage.style.backgroundSize="cover";
stage.style.backgroundPosition="center";
stage.style.backgroundRepeat="no-repeat";

};

reader.readAsDataURL(file);

backgroundFile.value="";

});

setBackground("plain");


/* =========================================
선택 초기화
========================================= */

function clearSelections(){

if(selectedActor){

selectedActor.element.classList.remove(
"selected"
);

}

if(selectedAccessory){

selectedAccessory.element.classList.remove(
"selected"
);

}

if(selectedFurniture){

selectedFurniture.element.classList.remove(
"selected"
);

}

selectedActor=null;
selectedAccessory=null;
selectedFurniture=null;

controlBox.classList.remove("show");
accessoryControl.classList.remove("show");
furnitureControl.classList.remove("show");

}


/* =========================================
상태
========================================= */

function updateStatus(){

if(selectedAccessory){

if(selectedAccessory.locked){

status.textContent=
"선택한 악세사리가 고정되어 있어요";

}else{

status.textContent=
"선택한 악세사리 · 끌어서 이동할 수 있어요";

}

return;

}

if(selectedFurniture){

status.textContent=
selectedFurniture.locked
?
"선택한 가구가 고정되어 있어요"
:
"선택한 가구 · 끌어서 이동할 수 있어요";

return;

}

if(selectedActor){

status.textContent=
selectedActor.paused
?
"선택한 캐릭터가 멈춰 있어요"
:
"선택한 캐릭터 · 끌어서 이동할 수 있어요";

return;

}

status.textContent=
actors.length===0 &&
furnitures.length===0
?
"캐릭터를 추가해보세요"
:
"캐릭터들이 자유롭게 움직이고 있어요";

}


/* =========================================
선택한 캐릭터
========================================= */

function selectActor(actor){

if(selectedActor===actor){

clearSelections();
updateStatus();

return;

}

clearSelections();

selectedActor=actor;

actor.element.classList.add(
"selected"
);

controlBox.classList.add("show");

sizeSlider.value=
String(actor.size);

updateStatus();

}


/* =========================================
악세사리 선택
========================================= */

function selectAccessory(a){

clearSelections();

selectedAccessory=a;

a.element.classList.add(
"selected"
);

accessoryControl.classList.add(
"show"
);

accessorySizeSlider.value=
String(a.size);

accessoryRotationSlider.value=
String(a.rotation);

updateAccessoryLockButton();

updateStatus();

}


/* =========================================
가구 선택
========================================= */

function selectFurniture(f){

clearSelections();

selectedFurniture=f;

f.element.classList.add(
"selected"
);

furnitureControl.classList.add(
"show"
);

furnitureSizeSlider.value=
String(f.size);

updateFurnitureLockButton();

updateStatus();

}


/* =========================================
SVG
========================================= */

function emojiSVG(emoji){

return "data:image/svg+xml;charset=utf-8,"+
encodeURIComponent(
`<svg xmlns="http://www.w3.org/2000/svg"
width="200"
height="200">
<text
x="100"
y="125"
font-size="120"
text-anchor="middle">${emoji}</text>
</svg>`
);

}


/* =========================================
캐릭터 성격
========================================= */

function personality(){

const list=[
{
speed:.6,
runSpeed:1.5,
sleepChance:.3,
runChance:.15
},
{
speed:.9,
runSpeed:2.2,
sleepChance:.1,
runChance:.45
},
{
speed:.5,
runSpeed:1.2,
sleepChance:.55,
runChance:.05
},
{
speed:1,
runSpeed:2.5,
sleepChance:.15,
runChance:.4
}
];

return list[
Math.floor(
Math.random()*list.length
)
];

}


/* =========================================
캐릭터 추가
========================================= */

photo.addEventListener(
"change",
e=>{

const file=e.target.files[0];

if(!file)return;

const reader=new FileReader();

reader.onload=ev=>{

const img=
document.createElement("img");

img.className="actor";

img.src=ev.target.result;

const p=personality();

const actor={

element:img,

x:30,
y:30,

targetX:30,
targetY:30,

size:100,

speed:p.speed,
runSpeed:p.runSpeed,

sleepChance:p.sleepChance,
runChance:p.runChance,

paused:false,
dragging:false,

state:"walking",

layer:"front",

nextAction:
Date.now()+1000,

originalImage:null

};


const original=new Image();

original.onload=()=>{
actor.originalImage=original;
};

original.src=ev.target.result;


actor.x=
20+
Math.random()*
Math.max(
1,
stage.clientWidth-130
);

actor.y=
20+
Math.random()*
Math.max(
1,
stage.clientHeight-130
);

actor.targetX=actor.x;
actor.targetY=actor.y;

img.style.left=
actor.x+"px";

img.style.top=
actor.y+"px";

actors.push(actor);

stage.appendChild(img);

enableActorDrag(actor);

selectActor(actor);

updateStatus();

};

reader.readAsDataURL(file);

photo.value="";

});


/* =========================================
캐릭터 드래그
========================================= */

function enableActorDrag(actor){

const el=actor.element;

let startPointerX=0;
let startPointerY=0;

let startX=0;
let startY=0;

el.addEventListener(
"pointerdown",
e=>{

e.preventDefault();
e.stopPropagation();

if(selectedActor===actor){

clearSelections();
updateStatus();

return;

}

selectActor(actor);

actor.dragging=true;

startPointerX=e.clientX;
startPointerY=e.clientY;

startX=actor.x;
startY=actor.y;

el.classList.add("dragging");

try{
el.setPointerCapture(e.pointerId);
}catch(_){}

});


el.addEventListener(
"pointermove",
e=>{

if(!actor.dragging)return;

e.preventDefault();
e.stopPropagation();

const dx=
e.clientX-startPointerX;

const dy=
e.clientY-startPointerY;

const maxX=
Math.max(
0,
stage.clientWidth-el.offsetWidth
);

const maxY=
Math.max(
0,
stage.clientHeight-el.offsetHeight
);

actor.x=
Math.max(
0,
Math.min(
startX+dx,
maxX
)
);

actor.y=
Math.max(
0,
Math.min(
startY+dy,
maxY
)
);

actor.targetX=actor.x;
actor.targetY=actor.y;

el.style.left=
actor.x+"px";

el.style.top=
actor.y+"px";

updateAttachedAccessories(actor);

});


el.addEventListener(
"pointerup",
e=>{

actor.dragging=false;

el.classList.remove("dragging");

try{
el.releasePointerCapture(e.pointerId);
}catch(_){}

});

}


/* =========================================
캐릭터 크기
========================================= */

sizeSlider.addEventListener(
"input",
()=>{

if(!selectedActor)return;

const a=selectedActor;

const oldSize=
a.element.offsetWidth;

const centerX=
a.x+oldSize/2;

const centerY=
a.y+oldSize/2;

a.size=
Number(sizeSlider.value);

const newSize=
90*a.size/100;

a.element.style.width=
newSize+"px";

a.element.style.height=
newSize+"px";

a.x=
Math.max(
0,
Math.min(
centerX-newSize/2,
stage.clientWidth-newSize
)
);

a.y=
Math.max(
0,
Math.min(
centerY-newSize/2,
stage.clientHeight-newSize
)
);

a.element.style.left=
a.x+"px";

/* =========================================
자동 이동
========================================= */

function chooseAction(a){

if(a.paused||a.dragging)return;

const r=Math.random();

if(r<a.sleepChance){

a.state="sleeping";

a.element.classList.add(
"sleeping"
);

a.nextAction=
Date.now()+
2000+
Math.random()*3000;

return;

}

a.state=
r<a.sleepChance+a.runChance
?
"running"
:
"walking";

a.element.classList.remove(
"sleeping"
);

const maxX=
Math.max(
0,
stage.clientWidth-a.element.offsetWidth
);

const maxY=
Math.max(
0,
stage.clientHeight-a.element.offsetHeight
);

a.targetX=
Math.random()*maxX;

a.targetY=
Math.random()*maxY;

a.nextAction=
Date.now()+
2000+
Math.random()*3000;

}


function animate(){

const time=Date.now();

for(const a of actors){

if(a.paused||a.dragging)
continue;

if(time>=a.nextAction)
chooseAction(a);

if(a.state==="sleeping")
continue;

const dx=
a.targetX-a.x;

const dy=
a.targetY-a.y;

const distance=
Math.hypot(dx,dy);

if(distance<1)
continue;

const speed=
a.state==="running"
?
a.runSpeed
:
a.speed;

const step=
Math.min(
speed,
distance
);

a.x+=
dx/distance*step;

a.y+=
dy/distance*step;

a.element.style.left=
a.x+"px";

a.element.style.top=
a.y+"px";

updateAttachedAccessories(a);

}

requestAnimationFrame(
animate
);

}

function enableAccessoryDrag(a){

const el=a.element;

let active=false;
let moved=false;

let startPointerX=0;
let startPointerY=0;

let startX=0;
let startY=0;

let wasSelected=false;


el.addEventListener(
"pointerdown",
e=>{

e.preventDefault();
e.stopPropagation();

active=true;

moved=false;

wasSelected=
selectedAccessory===a;


/*
이미 선택된 악세사리는
그 상태를 유지하면서 드래그 준비.
*/
if(!wasSelected){

selectAccessory(a);

}


/*
고정된 경우 이동하지 않음.
*/
if(a.locked){

a.dragging=false;

return;

}

startPointerX=e.clientX;
startPointerY=e.clientY;

startX=a.x;
startY=a.y;

a.dragging=false;

try{
el.setPointerCapture(e.pointerId);
}catch(_){}

});


el.addEventListener(
"pointermove",
e=>{

if(!active)return;

if(a.locked)return;

const dx=
e.clientX-startPointerX;

const dy=
e.clientY-startPointerY;

if(
!moved &&
Math.hypot(dx,dy)<5
){

return;

}

moved=true;

a.dragging=true;

el.classList.add("dragging");

e.preventDefault();
e.stopPropagation();

const maxX=
Math.max(
0,
stage.clientWidth-el.offsetWidth
);

const maxY=
Math.max(
0,
stage.clientHeight-el.offsetHeight
);

a.x=
Math.max(
0,
Math.min(
startX+dx,
maxX
)
);

a.y=
Math.max(
0,
Math.min(
startY+dy,
maxY
)
);

a.relativeX=
a.x-a.owner.x;

a.relativeY=
a.y-a.owner.y;

el.style.left=
a.x+"px";

el.style.top=
a.y+"px";

});


el.addEventListener(
"pointerup",
e=>{

if(!active)return;

active=false;

a.dragging=false;

el.classList.remove(
"dragging"
);


/*
움직이지 않고
이미 선택된 것을 다시 누르면
선택 해제.
*/
if(
!moved &&
wasSelected &&
selectedAccessory===a
){

clearSelections();

updateStatus();

}

try{
el.releasePointerCapture(e.pointerId);
}catch(_){}

});


el.addEventListener(
"pointercancel",
e=>{

active=false;

a.dragging=false;

el.classList.remove(
"dragging"
);

try{
el.releasePointerCapture(e.pointerId);
}catch(_){}

});

}

/* =========================================
텍스트 줄바꿈
========================================= */

function wrapText(
ctx,
text,
maxWidth
){

const lines=[];

const paragraphs=
String(text).split("\n");

for(const paragraph of paragraphs){

if(paragraph===""){

lines.push("");

continue;

}

let line="";

for(const char of paragraph){

const test=line+char;

if(
ctx.measureText(test).width>
maxWidth &&
line
){

lines.push(line);

line=char;

}else{

line=test;

}

}

lines.push(line);

}

return lines;

}

}

ctx.drawImage(
bg,
sx+(stageW-dw)/2,
sy+(stageH-dh)/2,
dw,
dh
);

}else{

if(currentBackground.type==="sky"){

const g=
ctx.createLinearGradient(
0,
sy,
0,
sy+stageH
);

g.addColorStop(0,"#bde8ff");
g.addColorStop(1,"#fff");

ctx.fillStyle=g;

}else if(currentBackground.type==="night"){

const g=
ctx.createLinearGradient(
0,
sy,
0,
sy+stageH
);

g.addColorStop(0,"#101528");
g.addColorStop(1,"#343b5c");

ctx.fillStyle=g;

}else if(currentBackground.type==="grass"){

const g=
ctx.createLinearGradient(
0,
sy,
0,
sy+stageH
);

g.addColorStop(0,"#dff5d8");
g.addColorStop(.65,"#c9ebc1");
g.addColorStop(.65,"#a9d79e");
g.addColorStop(1,"#a9d79e");

ctx.fillStyle=g;

}else if(currentBackground.type==="pink"){

ctx.fillStyle="#ffe8ef";

}else if(currentBackground.type==="yellow"){

ctx.fillStyle="#fff4b8";

}else{

ctx.fillStyle="#fafafa";

}

ctx.fillRect(
sx,
sy,
stageW,
stageH
);

}


const scaleX=
stageW/stage.clientWidth;

const scaleY=
stageH/stage.clientHeight;


/* 가구 */

for(const f of furnitures){

try{

const img=
await getOriginalImage(f);

const w=
f.element.offsetWidth;

const h=
f.element.offsetHeight;

const iw=
img.naturalWidth||img.width;

const ih=
img.naturalHeight||img.height;

const fit=
Math.min(
w/iw,
h/ih
);

const dw=iw*fit;
const dh=ih*fit;

ctx.drawImage(
img,
sx+
f.x*scaleX+
(w-dw)/2*scaleX,
sy+
f.y*scaleY+
(h-dh)/2*scaleY,
dw*scaleX,
dh*scaleY
);

}catch(_){}

}


/* 캐릭터 */

for(const actor of actors){

try{

const img=
await getOriginalImage(actor);

const w=
actor.element.offsetWidth;

const h=
actor.element.offsetHeight;

const iw=
img.naturalWidth||img.width;

const ih=
img.naturalHeight||img.height;

const fit=
Math.min(
w/iw,
h/ih
);

const dw=iw*fit;
const dh=ih*fit;

ctx.drawImage(
img,
sx+
actor.x*scaleX+
(w-dw)/2*scaleX,
sy+
actor.y*scaleY+
(h-dh)/2*scaleY,
dw*scaleX,
dh*scaleY
);

}catch(_){}

}


/* 악세사리 */

for(const a of accessories){

try{

const img=
await getOriginalImage(a);

const w=
a.element.offsetWidth;

const h=
a.element.offsetHeight;

const iw=
img.naturalWidth||img.width;

const ih=
img.naturalHeight||img.height;

const fit=
Math.min(
w/iw,
h/ih
);

const dw=iw*fit;
const dh=ih*fit;

const px=
sx+
a.x*scaleX+
(w-dw)/2*scaleX;

const py=
sy+
a.y*scaleY+
(h-dh)/2*scaleY;

const centerX=
px+
dw*scaleX/2;

const centerY=
py+
dh*scaleY/2;

ctx.save();

ctx.translate(
centerX,
centerY
);

ctx.rotate(
a.rotation*Math.PI/180
);

ctx.drawImage(
img,
-dw*scaleX/2,
-dh*scaleY/2,
dw*scaleX,
dh*scaleY
);

ctx.restore();

}

catch(_){}

}

ctx.restore();


/* 테두리 */

ctx.save();

ctx.beginPath();

ctx.roundRect(
sx,
sy,
stageW,
stageH,
24
);

ctx.strokeStyle="#ddd";

ctx.lineWidth=2;

ctx.stroke();

ctx.restore();


/* 파일 생성 */

const blob=
await new Promise(
resolve=>
canvas.toBlob(
resolve,
"image/png"
)
);

const file=
new File(
[blob],
"그림일기.png",
{
type:"image/png"
}
);


/* 공유 */

if(
navigator.share &&
navigator.canShare &&
navigator.canShare({
files:[file]
})
){

try{

await navigator.share({
files:[file],
title:"그림일기"
});

return;

}catch(e){

if(e.name==="AbortError")
return;

}

}


/* 다운로드 */

const url=
URL.createObjectURL(blob);

const link=
document.createElement("a");

link.href=url;

link.download=
"그림일기.png";

document.body.appendChild(link);

link.click();

link.remove();

setTimeout(
()=>{
URL.revokeObjectURL(url);
},
1000
);

}catch(error){

console.error(error);

alert(
"저장 중 문제가 생겼어요."
);

}finally{

saveButton.disabled=false;

}

});


/* =========================================
전체 삭제
========================================= */

clearAllButton.addEventListener(
"click",
()=>{

title.value="";
diary.value="";

localStorage.removeItem(
"diary-title"
);

localStorage.removeItem(
"diary-text"
);

for(const a of actors)
a.element.remove();

for(const a of accessories)
a.element.remove();

for(const f of furnitures)
f.element.remove();

actors.length=0;
accessories.length=0;
furnitures.length=0;

clearSelections();

updateStatus();

});


/* =========================================
시작
========================================= */

updateStatus();

requestAnimationFrame(
animate
);

</script>

</body>
</html>
